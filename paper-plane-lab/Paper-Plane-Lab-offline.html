<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paper Plane Lab</title>
<style>
:root{
  --bg:#e9edf2; --panel:#fbfcfd; --ink:#14202e; --muted:#566475; --line:#d2d9e1; --chip:#eef2f6;
  --accent:#c2700c; --accent-soft:#f6e3c4; --sky:#1b7ea6; --sky-soft:#d5ecf5; --good:#2e7d4f; --good-soft:#dcf0e3; --bad:#b3301e; --bad-soft:#f8e0dc; --warn:#9a6a00; --warn-soft:#fbf0cc;
  --lv:#1f8f5f;
  --font-ui:"Avenir Next","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-num:ui-monospace,"SF Mono","Menlo","Consolas",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1019; --panel:#111a27; --ink:#e4eaf2; --muted:#9aa9bc; --line:#223044; --chip:#172335;
  --accent:#f2a93b; --accent-soft:#3a2a12; --sky:#5ec3e6; --sky-soft:#12303d; --good:#5fc58a; --good-soft:#12301f; --bad:#ff8c78; --bad-soft:#3a1a15; --warn:#f2c14b; --warn-soft:#38300f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1019; --panel:#111a27; --ink:#e4eaf2; --muted:#9aa9bc; --line:#223044; --chip:#172335;
  --accent:#f2a93b; --accent-soft:#3a2a12; --sky:#5ec3e6; --sky-soft:#12303d; --good:#5fc58a; --good-soft:#12301f; --bad:#ff8c78; --bad-soft:#3a1a15; --warn:#f2c14b; --warn-soft:#38300f; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:17px;line-height:1.55}
.app{max-width:1280px;margin:0 auto;padding:12px 16px 48px;display:flex;flex-direction:column;gap:12px}
button,input,select,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,canvas:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;background:#14202e;color:#fff;border-radius:12px;padding:10px 16px}
.brand h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.02em}
.brand h1 span{color:#f2a93b}
.brand p{margin:0;font-size:12.5px;color:#aebccd}
.lvbadge{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:5px 14px;font-weight:800;font-size:13px;background:var(--lv);color:#fff;letter-spacing:.04em;text-transform:uppercase}
.lvbadge small{font-weight:600;text-transform:none;letter-spacing:0;opacity:.95}
.tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:8px 16px;cursor:pointer;font-size:16px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.big{padding:11px 22px;font-size:16px}
.btn.good{background:var(--good);border-color:var(--good);color:#fff;font-weight:700}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 11px;font-size:14.5px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
header.top .btn{background:#22324a;border-color:#33476a;color:#fff}
header.top .btn:hover{border-color:#8da4c4}
.stepbar{display:flex;flex-wrap:wrap;gap:6px}
.stepbar button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;font-size:15.5px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.stepbar button .n{width:20px;height:20px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:11.5px;font-weight:800}
.stepbar button[aria-current="step"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.stepbar button[aria-current="step"] .n{background:var(--panel);color:var(--ink)}
.stepbar button.done .n{background:var(--good);color:#fff}
.stepbar button.part .n{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
.stepbar button:disabled{opacity:.4;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card h2{margin:0 0 6px;font-size:27px}
.card h3{margin:0 0 6px;font-size:19px}
.card>p.lead{margin:0 0 12px;color:var(--muted);max-width:80ch;font-size:18px}
.lbl{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.note{font-size:15px;color:var(--muted);margin:0}
.q{border-top:1px solid var(--line);padding:14px 0 6px;margin-top:12px}
.q:first-of-type{border-top:0;margin-top:0}
.q h3{display:flex;gap:10px;align-items:baseline;font-size:20px}
.q .tag{font-size:11px;font-weight:800;background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.q .status{margin-left:auto;font-size:14px;font-weight:700}
.status.ok{color:var(--good)} .status.no{color:var(--muted)}
.tip{background:var(--sky-soft);border:1px solid var(--sky);border-radius:8px;padding:10px 14px;font-size:16px;margin:8px 0}
.nudge{background:var(--warn-soft);border:1px solid var(--warn);border-radius:8px;padding:10px 14px;font-size:16px;margin:8px 0}
.fb{border-radius:8px;padding:8px 12px;font-size:16px;margin:6px 0}
.fb.ok{background:var(--good-soft);border:1px solid var(--good)}
.fb.no{background:var(--bad-soft);border:1px solid var(--bad)}
.fb.mid{background:var(--warn-soft);border:1px solid var(--warn)}
.opts{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--chip);border-radius:9px;padding:9px 12px;cursor:pointer}
.opt:hover{border-color:var(--muted)}
.opt .mark{flex:none;width:20px;height:20px;border:2px solid var(--muted);border-radius:50%;margin-top:1px;display:grid;place-items:center;font-size:12px;font-weight:900}
.opt.multi .mark{border-radius:5px}
.opt.sel{border-color:var(--sky);background:var(--sky-soft)}
.opt.sel .mark{background:var(--sky);border-color:var(--sky);color:#fff}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .mark{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .mark{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
textarea,input[type=text],input[type=number],select{border:1.5px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px;width:100%}
textarea{min-height:76px;resize:vertical}
input.inl{display:inline-block;width:auto;min-width:11ch;padding:3px 8px;margin:2px 4px;border-radius:6px}
input.inl.w2{min-width:24ch}input.inl.w3{min-width:38ch}
select.inl{display:inline-block;width:auto;padding:3px 6px;margin:2px 4px;border-radius:6px}
.frame{line-height:2.3;font-size:17.5px}
.frame.bl{line-height:2.4}
.cloze select{border-color:var(--sky)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rows{display:grid;gap:8px}
.rowi{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start}
.rowi.two{grid-template-columns:28px 1fr 1fr}
.rowi .no{font-weight:800;color:var(--muted);padding-top:8px}
.nav{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.nav .msg{font-size:13px;color:var(--muted);flex:1;min-width:200px}
/* start screen */
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:12px 0}
.lvcard{border:2px solid var(--line);border-radius:12px;padding:14px;background:var(--panel);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;position:relative}
.lvcard:hover{border-color:var(--muted)}
.lvcard.sel{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
.lvcard h3{margin:0;font-size:19px;color:var(--c);display:flex;gap:8px;align-items:center}
.lvcard ul{margin:2px 0;padding-left:18px;font-size:15.5px}
.lvcard .cap{margin-top:auto;border-radius:8px;background:color-mix(in srgb,var(--c) 14%,var(--panel));padding:8px 10px;font-size:15px;font-weight:700}
.stars{letter-spacing:2px;color:var(--c)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:10px 0}
.ivbtn{border:1.5px solid var(--line);background:var(--chip);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left}
.ivbtn b{display:block;font-size:17px}.ivbtn span{font-size:15px;color:var(--muted)}
.ivbtn.sel{border-color:var(--sky);background:var(--sky-soft)}
.typecards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
.typecard{border:2px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel);cursor:pointer;text-align:left}
.typecard.sel{border-color:var(--sky);background:var(--sky-soft)}
.typecard h3{margin:0 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:16px}
.chip.sel{background:var(--sky);border-color:var(--sky);color:#fff;font-weight:700}
.chip.done{border-color:var(--good)}
/* lab */
.labgrid{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(300px,1fr);gap:12px}
.labcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.panel h4{margin:0 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
canvas.cv{width:100%;display:block;border-radius:8px;touch-action:none;background:#dfe9f2}
.simwrap{position:relative}
.simmsg{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(20,32,46,.86);color:#fff;border-radius:999px;padding:6px 18px;font-weight:700;font-size:15px;pointer-events:none;white-space:nowrap}
.stopw{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.swd{font-family:var(--font-num);font-size:34px;font-weight:700;background:#0f1722;color:#7dffb0;border-radius:8px;padding:2px 14px;min-width:6.3ch;text-align:center;letter-spacing:.04em}
.tapebox{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.reading{font-family:var(--font-num);font-size:22px;font-weight:700;color:var(--accent)}
table.tb{border-collapse:collapse;width:100%;font-size:15.5px}
table.tb th,table.tb td{border:1px solid var(--line);padding:5px 8px;text-align:center}
table.tb th{background:var(--chip);font-size:14.5px}
table.tb td.l,table.tb th.l{text-align:left}
table.tb input{text-align:center;padding:4px 6px;min-width:6ch}
table.tb tr.cur td{background:var(--sky-soft)}
.ctl-list{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:15px;margin:0}
.ctl-list dt{color:var(--muted)}.ctl-list dd{margin:0;font-weight:600}
.ctl-list .iv{color:var(--accent)}
.lock{opacity:.6}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag-chip{border:1.5px solid var(--line);background:var(--chip);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer}
.tag-chip.sel{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.planesvg{width:100%;max-height:190px}
/* graph */
.graphwrap{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:12px}
.tray{display:flex;flex-direction:column;gap:6px}
.dchip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--sky);background:var(--sky-soft);border-radius:8px;padding:8px 12px;cursor:grab;touch-action:none;user-select:none;font-size:16px}
.dchip.placed{opacity:.45;border-style:dashed;cursor:pointer}
.dchip.cat{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.ghost{position:fixed;pointer-events:none;z-index:50;opacity:.9;transform:translate(-50%,-50%)}
.axrow{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:6px 8px;align-items:center;font-size:15px}
.axrow input{padding:4px 7px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,16,25,.6);display:none;align-items:flex-start;justify-content:center;padding:30px 14px;z-index:40;overflow:auto}
.modal.open{display:flex}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:880px;width:100%;padding:20px 24px;position:relative}
.modal h2{margin-top:0}
.modal .x{position:absolute;right:14px;top:12px}
.modal table{border-collapse:collapse;width:100%;font-size:13.5px;margin:8px 0}
.modal td,.modal th{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.modal th{background:var(--chip)}
.reveal{border:2px solid var(--accent);border-radius:12px;padding:12px 14px;background:var(--accent-soft);margin:12px 0}
.reveal h3{margin:0 0 4px}
.reveal table{background:var(--panel)}
.checklist label{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin:5px 0;background:var(--chip);cursor:pointer}
.checklist label.off{opacity:.55;cursor:not-allowed}
.checklist input{margin-top:4px;width:18px;height:18px}
.checklist .auto{margin-left:auto;font-size:12.5px;font-weight:700;white-space:nowrap}
.cert{border:6px double var(--lv);border-radius:10px;padding:26px;text-align:center;background:var(--panel)}
.cert h2{font-size:34px;margin:0;color:var(--lv)}
.cert .nm{font-size:40px;font-weight:800;margin:10px 0;border-bottom:2px solid var(--line);display:inline-block;padding:0 28px}
@media (max-width:900px){.labgrid,.graphwrap{grid-template-columns:1fr}.grid2,.grid3,.typecards{grid-template-columns:1fr}}
@media print{header.top .tools,.nav,.stepbar{display:none}}
.graphwrap>div:last-child{position:sticky;top:10px;align-self:start}
@media (max-width:900px){.graphwrap>div:last-child{position:static}}
:root{--shw:min(440px,42vw)}
.app{transition:margin-right .25s ease}
body.sheet-open .app{margin-right:calc(var(--shw) + 6px)}
.sheetbtn{transition:right .25s ease}
body.sheet-open .sheetbtn{right:var(--shw)}
.sheetbtn{position:fixed;right:0;top:45%;z-index:30;writing-mode:vertical-rl;transform:rotate(180deg);border:0;border-radius:0 10px 10px 0;background:var(--lv);color:#fff;font-weight:800;padding:14px 8px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:14px}
.sheet{position:fixed;top:0;right:0;height:100%;width:var(--shw);background:var(--panel);border-left:3px solid var(--lv);box-shadow:-4px 0 14px rgba(0,0,0,.12);z-index:35;transform:translateX(105%);transition:transform .25s ease;display:flex;flex-direction:column}
.sheet.open{transform:none}
.sheethead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--chip)}
#sheetbody{overflow:auto;padding:12px 16px 40px;font-size:14px}
#sheetbody h5{margin:14px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
#sheetbody .ans{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:7px 10px;white-space:pre-wrap}
#sheetbody .empty{color:var(--muted);font-style:italic}
#sheetbody img{width:100%;border:1px solid var(--line);border-radius:8px}
#sheetbody table.tb{font-size:12.5px}
@media (max-width:900px){:root{--shw:min(440px,92vw)}body.sheet-open .app{margin-right:auto}.sheetbtn{top:auto;bottom:90px}}

.intro{font-size:20px;line-height:1.55}
.intro h2{font-size:30px;margin:0 0 4px;display:flex;align-items:center;gap:12px}
.intro .stepno{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--lv);color:#fff;font-size:22px;font-weight:800;flex:none}
.intro ul{padding-left:26px;margin:10px 0}.intro li{margin:8px 0}
.intro .learn{background:var(--sky-soft);border:1px solid var(--sky);border-radius:12px;padding:12px 18px;margin:14px 0}
.intro .learn b.h{display:block;font-size:15px;text-transform:uppercase;letter-spacing:.07em;color:var(--sky);margin-bottom:4px}
.intro .ok{font-size:20px;padding:14px 28px;margin-top:10px}
.aboutbtn{float:right}
.tourshade{position:fixed;inset:0;z-index:60;background:rgba(10,16,25,.6)}
.tourhole{position:fixed;z-index:61;border-radius:12px;box-shadow:0 0 0 9999px rgba(10,16,25,.6),0 0 0 4px #f2a93b;pointer-events:none;transition:all .2s}
.tourcard{position:fixed;z-index:62;background:var(--panel);border:2px solid #f2a93b;border-radius:14px;padding:16px 20px;font-size:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.tourcard h3{margin:4px 0 6px;font-size:22px}.tourcard p{margin:0;line-height:1.5}
.fairline{position:relative;height:34px;border-radius:999px;background:linear-gradient(90deg,#d6402f,#f2a93b 50%,#2e7d4f);cursor:crosshair;border:2px solid var(--ink)}
.fairx{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:34px;font-weight:900;color:#fff;text-shadow:0 0 4px #000,0 0 2px #000;pointer-events:none}
.sortgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.sortcard{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--chip)}
.sortcard.set{border-color:var(--sky);background:var(--panel)}
.sortcard .chip{font-size:14px;padding:4px 10px}
/* calculator */
.calc{max-width:300px}
.calcd{font-family:var(--font-num);font-size:24px;text-align:right;background:#14202e;color:#e4f7e9;border-radius:8px;padding:8px 12px;margin-bottom:8px;min-height:44px;overflow:auto;white-space:nowrap}
.calck{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calck .btn{justify-content:center;padding:8px 0;font-size:18px;font-weight:700}
.calck .btn.op{background:var(--sky-soft,#e1f0fb)}
/* missing parts, highlighted after "Go and finish it" */
.missing{outline:3px solid var(--bad);outline-offset:4px;border-radius:10px;background:var(--bad-soft);animation:misspulse 1.2s ease-in-out 3}
@keyframes misspulse{50%{outline-color:transparent}}
/* "?" help button inside sentence frames */
.helpq{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;border:2px solid var(--accent);background:var(--panel);color:var(--accent);font-weight:900;font-size:15px;cursor:pointer;vertical-align:middle;padding:0;line-height:1}
.helpq:hover{background:var(--accent);color:#fff}
.dchip .grip{font-size:18px;opacity:.6;letter-spacing:-2px}
.dchip.wiggle{animation:wig 1.6s ease-in-out infinite}
@keyframes wig{0%,70%,100%{transform:translateX(0)}78%{transform:translateX(5px)}86%{transform:translateX(-4px)}93%{transform:translateX(2px)}}
.howdrag ol{margin:4px 0 0;padding-left:22px}
@media (prefers-reduced-motion:reduce){.dchip.wiggle,.missing{animation:none}}
.t1grid{display:grid;grid-template-columns:1fr 280px;gap:14px;align-items:start}
.calcpanel{margin:0}
@media (max-width:1000px){.t1grid{grid-template-columns:1fr}}
.emptyfield{border:2px solid var(--bad)!important;background:#fff6f4}

/* thrower speech bubble */
.bubble{position:absolute;left:11%;top:12px;max-width:min(420px,60%);background:#fff;border:2px solid #14202e;border-radius:14px;padding:8px 12px;font-size:16px;box-shadow:0 3px 10px rgba(0,0,0,.18);z-index:2;color:#14202e}
.bubble:after{content:'';position:absolute;left:18px;bottom:-12px;border:12px solid transparent;border-top-color:#14202e;border-bottom:0}
.bubble .who{font-weight:800}
.linkbtn{background:none;border:0;padding:0;color:#1b7ea6;text-decoration:underline;font:inherit;font-weight:700;cursor:pointer}
.bubble.op{left:1.5%}
.simwrap:has(.bubble) .simmsg{left:auto;right:14px;transform:none}

/* stopwatch needs attention */
.swhot{border:3px solid var(--accent);box-shadow:0 0 0 4px var(--accent-soft);animation:swpulse 1s ease-in-out infinite}
@keyframes swpulse{50%{box-shadow:0 0 0 9px var(--accent-soft)}}
.swhot .swd{color:#ffd27a}
/* keep or redo the flight */
.decide{margin-top:10px;border:2px dashed var(--line);border-radius:12px;padding:10px 14px;background:var(--chip)}
.decide.ready{border:3px solid var(--good);background:var(--good-soft)}
@media (prefers-reduced-motion:reduce){.swhot{animation:none}}
/* ===== done / to-do states ===== */

<script>
/* ===== MODEL: flight physics, IV config, hidden flaws ===== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(r){let u=0,v=0;while(u===0)u=r();while(v===0)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}

const CD0BASE=0.07,RHO=1.2,G=9.81,LAUNCH_H=1.6,NMAX=1.25;
const DESIGNS={
  'Dart':        {b:8, L:30,k:.5, CL:.45,dm:.38,wob:1.0},
  'Classic':     {b:10,L:28,k:.5, CL:.55,dm:1.0,wob:1.0},
  'Wide glider': {b:16,L:20,k:.7, CL:.75,dm:2.3,wob:1.0},
  'Stunt plane': {b:14,L:16,k:.6, CL:.40,dm:3.0,wob:1.7},
  'Nakamura lock':{b:9,L:26,k:.55,CL:.50,dm:.50,wob:.8},
  'Hammerhead':  {b:12,L:22,k:.6, CL:.60,dm:1.4,wob:1.1},
  'Delta wing':  {b:14,L:24,k:.5, CL:.50,dm:1.1,wob:1.2}};

  'Printer paper':{m:1.0,cl:1.0, dm:1.0, wob:1.0,col:'#f7f7f2',name:'Printer paper (80 gsm)'},
  'Newspaper':    {m:.62,cl:.92,dm:1.45,wob:1.4,col:'#cfcfc9',name:'Newspaper'},
  'Thin card':    {m:2.2,cl:1.0,dm:.85, wob:1.0,col:'#d9b98a',name:'Thin card'},
  'Baking paper': {m:.5, cl:.85,dm:1.9, wob:1.6,col:'#efe6cf',name:'Baking paper'},
  'Tissue paper': {m:.3, cl:.75,dm:2.4, wob:2.0,col:'#fbe3ee',name:'Tissue paper'},
  'Magazine paper':{m:1.3,cl:1.0,dm:.9,  wob:1.0,col:'#e3eaf6',name:'Magazine paper'}};
const TIPS={
  'Folded up':  {cl:.96,dm:1.35,wob:.7},
  'Flat':       {cl:1.0,dm:1.0, wob:1.0},
  'Folded down':{cl:1.04,dm:1.1,wob:1.9},
  'One up, one down':{cl:.9,dm:1.3,wob:2.4}};
const CLIPPOS={'No clip':0,'Nose':1,'Middle':.35,'Tail':-.7};

/* every plane setting; the student changes ONE (the independent variable) */
const DEFAULTS={span:10,clips:1,angle:15,speed:6.5,design:'Classic',paper:'Printer paper',tips:'Flat',clippos:'Nose'};
const IVS={
 span:{type:'num',label:'Wingspan',lower:'wingspan',unit:'cm',vals:[6,8,10,12,14,16],setting:'span'},
 clips:{type:'num',label:'Number of paper clips on the nose',lower:'number of paper clips on the nose',unit:'clips',vals:[0,1,2,3,4,5],setting:'clips'},

 speed:{type:'num',label:'Throw speed',lower:'throw speed',unit:'m/s',vals:[3,4,5,6,7,8,9],setting:'speed'},

};
const SETTING_LABEL={span:'Wingspan',clips:'Number of paper clips',angle:'Launch angle',speed:'Throw speed',design:'Plane design',paper:'Type of paper',tips:'Wing tips',clippos:'Position of the paper clip'};
function settingText(k,v){return k==='span'?v+' cm':k==='angle'?v+'°':k==='speed'?v+' m/s':k==='clips'?v+(v==1?' clip':' clips'):String(v)}

/* settings for one plane: control values everywhere except the IV */
function makeSettings(ivKey,ivVal,base){const s=Object.assign({},DEFAULTS,base||{});if(ivKey)s[IVS[ivKey].setting]=ivVal;
  if(ivKey==='clippos'){s.clips=ivVal==='No clip'?0:Math.max(1,s.clips||1)}
  if(ivKey==='span')s.design='Classic';
  return s}

/* physical parameters from settings, plus hidden build error */
function planeParams(s,fold){
  const d=DESIGNS[s.design],p=PAPERS[s.paper],t=TIPS[s.tips];
  const b=s.design==='Classic'?s.span:d.b;
  const L=d.L,S=d.k*b*L/10000; /* m^2 */
  /* paper mass: more paper = heavier (wingspan is changed by trimming, so mass changes too) */
  const sheet=(3.7+0.13*b)*p.m; /* g */
  const clipN=s.clippos==='No clip'?0:s.clips; const clipG=clipN*0.5; /* each clip ~0.5 g */
  const mass=(sheet+clipG)/1000;
  const cg=(s.clippos==='No clip'?0:s.clips*CLIPPOS[s.clippos]);
  const q=Math.exp(-Math.pow((cg-0.9)/1.4,2)); /* pitch balance: 1 = well balanced */
  const wob=d.wob*p.wob*t.wob*(0.8+0.6*(1-q));
  const CL=d.CL*p.cl*t.cl*(0.3+0.7*q)*(1+(fold?fold.cl:0));
  const CD0=CD0BASE*d.dm*p.dm*t.dm*(1+(fold?fold.cd:0));
  const AR=b*b/10000/S; const k=1/(Math.PI*.7*AR);
  return {b,L,S,mass,CL,CD0,k,q,wob,cg,clipG,sheet,AR};
}

/* Fly one plane. Lift balances weight until the wing stalls (CL cannot go above its maximum).
   Returns the whole path so the screen can animate it. */
function flyPlane(P,launch){
  let x=0,y=LAUNCH_H,th=launch.angle*Math.PI/180;
  let vx=launch.v*Math.cos(th),vy=launch.v*Math.sin(th);
  const W=P.mass*G,dt=0.004,path=[],w=launch.wind;
  let t=0,maxH=y;
  while(t<14){
    if(path.length===0||Math.round(t/dt)%5===0)path.push([t,x,y,Math.atan2(vy,vx)]);
    const ax=vx-w,ay=vy,V=Math.max(.3,Math.hypot(ax,ay)),ex=ax/V,ey=ay/V;
    const q=.5*RHO*V*V*P.S;
    let clMax=P.CL; if(launch.dive&&t<launch.diveT)clMax*=launch.diveF;
    /* lift grows with speed (q) up to a gentle pull-up limit; below the stall speed the plane sinks */
    const Lcap=NMAX*W*Math.max(.35,ex);
    let L=Math.min(q*clMax,Lcap); const cl=L/q;
    const D=q*(P.CD0+P.k*cl*cl);
    const fx=(-D*ex+L*(-ey))/P.mass, fy=(-D*ey+L*ex)/P.mass-G;
    vx+=fx*dt;vy+=fy*dt; const nx=x+vx*dt,ny=y+vy*dt;
    if(ny<=0){const f=y/(y-ny);x=x+(nx-x)*f;t+=dt*f;y=0;path.push([t,x,0,Math.atan2(vy,vx)]);
      const slide=Math.max(0,vx)*(launch.grass?0.012:0.05); return {path,dist:(x+slide),time:t,landX:x+slide,maxH}}
    x=nx;y=ny;t+=dt;if(y>maxH)maxH=y;
  }
  return {path,dist:x,time:t,landX:x,maxH};
}

/* hidden air movement (m/s, + = pushes towards the far end).
   Inside: a slow, gentle draft from a vent. Outside: stronger wind with gusts that change every flight. */
function draftAt(seed,n,env){
  const ph=(seed%97)/97*6.283, ph2=(seed%53)/53*6.283;
  if(env==='outside'){
    const r=mulberry32(seed*17+n*389+3);
    const w=.3+.8*Math.sin(2*Math.PI*n/9+ph)+gauss(r)*.95;
    return Math.max(-1.8,Math.min(2.2,w));
  }
  const w=.30*Math.sin(2*Math.PI*n/11+ph)+.10*Math.sin(2*Math.PI*n/4.3+ph2)+.05;
  return Math.max(-.5,Math.min(.5,w));
}
/* hidden build error for each plane (imperfect folds) */
function foldError(seed,idx,wob){const r=mulberry32(seed*7+idx*131+5);return{cl:gauss(r)*.05*wob,cd:gauss(r)*.08*wob}}
/* hidden launch noise for one launch */
function launchNoise(seed,n,s,P,launcher){
  const r=mulberry32(seed*13+n*977+11),k=launcher?.3:1;
  const vErr=gauss(r)*.035*Math.sqrt(P.wob)*k, aErr=gauss(r)*1.2*Math.sqrt(P.wob)*k;
  const out=r()<(.06+.03*(P.wob-1))*(launcher?.5:1);
  const delay=1.1+r()*1.5; /* random wait before release so timing needs real reactions */
  return {vErr,aErr,out,delay,diveF:.12,diveT:.75};
}
function doLaunch(seed,n,s,P,env,launcher){
  const nz=launchNoise(seed,n,s,P,launcher),wind=draftAt(seed,n,env);
  const launch={v:s.speed*(1+nz.vErr),angle:s.angle+nz.aErr,wind,dive:nz.out,diveF:nz.diveF,diveT:nz.diveT,grass:env==='outside'};
  const fl=flyPlane(P,launch);
  return {fl,nz,wind,launch};
}

 developing:{n:'Developing',col:'#1f8f5f',idx:0,stars:1,

const STEPS=[['observe','Observe'],['question','Question'],['hypothesis','Hypothesis'],['plan','Plan'],['lab','Test flights'],['results','Results'],['conclusion','Analysis'],['evaluate','Evaluation'],['finish','Finish'],['extend','★ Extensions']];

/* ---- state ---- */
const KEY='paperPlaneLab_v1';
function blank(){return{v:1,name:'',cls:'',level:null,started:false,seed:0,step:'start',iv:null,dv:null,levels:[],a:{},tries:{},flights:[],planes:{},fc:0,labLevel:null,graph:null,ck:{},exported:false,created:Date.now(),revealed:false,design:Object.assign({},DEFAULTS),exp:Object.assign({},DEFAULTS,{env:'inside',launch:'hand'}),expN:0,expLog:[],env:null,launch:null,partner:{name:'',mode:'',avgs:{},code:null},peer:{},archive:[],attempt:1,seen:{}}}
let S=blank();

 clips:{main:/how many|number of (paper )?clips|amount of clips/i,desc:'How many paper clips are on the nose (0 to 5).',manip:'put a different number of paper clips on the nose for each test',

  reasons:['a faster throw gives the plane more energy','a faster throw means more air resistance','a gentle throw lets the plane glide smoothly'],
  kw:/speed|fast|slow|throw|force|hard|velocity|push|gentle/},
 design:{main:/design|shape of the plane|type of plane/i,desc:'Seven designs, from the Dart to the Delta wing.',manip:'fly a different plane design for each test',
  reasons:['a narrow, pointed plane cuts through the air with less air resistance','wide wings give more lift, so the plane floats for longer','a short, wide plane is not steady and tumbles'],
  kw:/design|shape|dart|glider|stunt|classic|plane type|type of plane|narrow|wide/},

  reasons:['heavier paper carries more momentum, so it keeps going','lighter paper floats for longer','thin, floppy paper bends and makes more air resistance'],
  kw:/paper|card|newspaper|material|baking|printer|heav|light/},
 tips:{main:/tip/i,desc:'Folded up, flat, folded down, or one of each.',manip:'fold the wing tips up, flat or down for each test',
  reasons:['wing tips folded up keep the plane steady','flat wings give the most lift','wing tips folded down make the plane wobble'],
  kw:/tip|fold|wing|flat|up|down/},

};
function cx(){const iv=IVS[S.iv],dv=DVX[S.dv],x=IVX[S.iv];return{iv,dv,x,key:S.iv,isNum:iv.type==='num',ivName:iv.label,ivLower:iv.lower}}
function lvlLabel(k,v){const iv=IVS[k];if(iv.type==='cat')return String(v);if(iv.unit==='°')return v+'°';if(iv.unit==='clips')return v+(Number(v)===1?' clip':' clips');return v+' '+iv.unit}
const rowLabel=v=>IVS[S.iv].type==='num'?String(v):String(v);

const evenPick=(arr,n)=>{if(arr.length<=n)return arr.slice();const o=[];for(let i=0;i<n;i++)o.push(arr[Math.round(i*(arr.length-1)/(n-1))]);return o};
const minLevels=()=>3;

/* ---- flight data ---- */
const live=()=>S.flights.filter(f=>!f.gone);
const fvals=lk=>live().filter(f=>f.lv===lk);
const fval=f=>S.dv==='dist'?f.read:f.timed;
function levelStats(){return S.levels.map(lk=>{const vs=fvals(lk).map(fval).filter(v=>v!=null);const m=vs.length?vs.reduce((a,b)=>a+b,0)/vs.length:null;return{lk,vs,m,n:fvals(lk).length}})}
const dvDp=()=>S.dv==='dist'?1:2;
function trialsDone(){if(!S.iv||!S.levels.length)return false;return levelStats().every(s=>s.n>=3)}
const flightsExpected=()=>S.levels.length*3;

/* what the data shows (used for Developing checks and for the marker's summary) */
function trendOf(){
  const st=levelStats().filter(s=>s.m!=null);if(st.length<2)return{kind:'none'};
  const isNum=IVS[S.iv].type==='num',ys=st.map(s=>s.m),n=ys.length;
  const mx=Math.max(...ys),mn=Math.min(...ys),range=mx-mn,mean=ys.reduce((a,b)=>a+b,0)/n;
  const iMax=ys.indexOf(mx),iMin=ys.indexOf(mn);
  const best=st[iMax],worst=st[iMin];
  if(!isNum){return{kind:range<0.06*mean?'flat':'cat',best,worst,range,st}}
  if(range<0.06*mean)return{kind:'flat',best,worst,range,st};
  {const xs=st.map(s=>Number(s.lk)),mx_=xs.reduce((a,b)=>a+b,0)/n,my_=mean;let sxy=0,sxx=0,syy=0;xs.forEach((x,i)=>{sxy+=(x-mx_)*(ys[i]-my_);sxx+=(x-mx_)**2;syy+=(ys[i]-my_)**2});const r=sxy/Math.sqrt(sxx*syy||1);
   if(r>0.8)return{kind:'up',best,worst,range,st,r};if(r<-0.8)return{kind:'down',best,worst,range,st,r}}
  let up=0,down=0;for(let i=0;i<n-1;i++){const d=ys[i+1]-ys[i];if(d>0.04*range)up++;else if(d<-0.04*range)down++}
  const edge=Math.max(ys[0],ys[n-1]);
  if(iMax>0&&iMax<n-1&&mx-edge>0.3*range)return{kind:'peak',best,worst,range,st};
  const edgeMin=Math.min(ys[0],ys[n-1]);
  if(iMin>0&&iMin<n-1&&edgeMin-mn>0.3*range)return{kind:'dip',best,worst,range,st};
  if(up>0&&up>=down*2&&ys[n-1]>ys[0])return{kind:'up',best,worst,range,st};
  if(down>0&&down>=up*2&&ys[n-1]<ys[0])return{kind:'down',best,worst,range,st};

}
function trendSentence(t){
  const c=cx(),d=c.dv.lower,v=c.ivLower;
  switch(t.kind){
   case'up':return`As the ${v} increased, the ${d} increased.`;
   case'down':return`As the ${v} increased, the ${d} decreased.`;
   case'flat':return`Changing the ${v} made very little difference to the ${d}.`;
   case'peak':return`The ${d} was greatest in the middle (at ${lvlLabel(S.iv,t.best.lk)}) and was smaller at both ends.`;
   case'dip':return`The ${d} was smallest in the middle (at ${lvlLabel(S.iv,t.worst.lk)}) and was greater at both ends.`;
   case'cat':return`${t.best.lk} had the greatest ${d} and ${t.worst.lk} had the smallest.`;

    else{let i=Math.min(path.length-2,Math.floor(tt/0.02));const a=path[i],b=path[i+1],u=(tt-a[0])/Math.max(1e-6,(b[0]-a[0]));
      LAB.px=a[1]+(b[1]-a[1])*u;LAB.py=a[2]+(b[2]-a[2])*u;LAB.pa=a[3]+(b[3]-a[3])*u;

  if(LAB.state==='idle'&&cs){ /* aim arrow: direction = launch angle, length = throw speed */
    const a=cs.angle*Math.PI/180,L=30+cs.speed*16,X0=sx(0)+10,Y0=FLOOR-LAUNCH_H*SC;
    c.strokeStyle='rgba(194,112,12,.85)';c.lineWidth=4;c.setLineDash([8,6]);c.beginPath();c.moveTo(X0,Y0);c.lineTo(X0+Math.cos(a)*L,Y0-Math.sin(a)*L);c.stroke();c.setLineDash([]);
    c.fillStyle='rgba(194,112,12,.9)';c.beginPath();const hx=X0+Math.cos(a)*L,hy=Y0-Math.sin(a)*L;c.moveTo(hx,hy);c.lineTo(hx-Math.cos(a-.4)*14,hy+Math.sin(a-.4)*14);c.lineTo(hx-Math.cos(a+.4)*14,hy+Math.sin(a+.4)*14);c.fill();
    c.font='bold 15px system-ui,sans-serif';c.textAlign='left';c.fillText(`${cs.angle}° · ${cs.speed} m/s`,hx+8,hy-6)}

  else{planeSprite(c,sx(LAB.px),FLOOR-LAB.py*SC-2,LAB.pa,col)}
  /* landing marker */
  if(LAB.state==='landed'||(LAB.state==='idle'&&LAB.res)){
    const X=sx(LAB.res.fl.landX);c.fillStyle='#d6402f';c.beginPath();c.moveTo(X,FLOOR+1);c.lineTo(X-7,FLOOR-11);c.lineTo(X+7,FLOOR-11);c.closePath();c.fill()}

  const m=$('#simmsg');if(m){let t='';
    if(LAB.state==='idle')t=isExplore()?(LAB.res?'Change something and throw again!':'Set your throw and press Launch'):S.labLevel==null?'':'Press Launch';

    else if(LAB.state==='flying')t=timingNeeded()?(LAB.sw.start==null?'Press Start!':'Press Stop when it lands!'):'';
    else if(LAB.state==='landed')t=isExplore()?'':swRunning()?'Landed. Stop the stopwatch!':S.dv==='time'?(LAB.sw.stop==null?'Landed. Stop the stopwatch!':'Landed.'):'Landed. Now read the tape.';
    m.textContent=t;m.style.display=t?'':'none'}
}
function drawTape(){
  const cv=$('#tape');if(!cv||LAB.state!=='landed'||!LAB.res)return;const c=cv.getContext('2d');
  const W=cv.width,H=cv.height,pxcm=W/100,x0=LAB.tapeWin;
  c.fillStyle='#e9f0f6';c.fillRect(0,0,W,H);
  c.fillStyle=S.env==='outside'?'#6db35e':'#cdb084';c.fillRect(0,74,W,H-74);
  c.fillStyle='#f4e08a';c.fillRect(0,74,W,46);c.strokeStyle='#8a7a2a';c.lineWidth=1.5;c.strokeRect(0,74,W,46);
  c.fillStyle='#4a3f10';c.font='bold 18px system-ui,sans-serif';c.textAlign='center';
  /* same marks as the big tape: long every 100 cm, medium every 50 cm, short every 10 cm.
     Every 10 cm mark has a number, so there are always several numbers to work out the gaps from. */
  for(let cm=x0;cm<=x0+100;cm+=10){const X=(cm-x0)*pxcm,big=cm%100===0,mid=cm%50===0;c.beginPath();c.moveTo(X,74);c.lineTo(X,74+(big?34:mid?24:14));c.stroke();
    if(X>48&&X<W-30){c.font=(big?'bold 19px ':mid?'bold 17px ':'15px ')+'system-ui,sans-serif';c.fillText(String(cm),X,116)}}
  c.font='bold 18px system-ui,sans-serif';
  c.textAlign='left';c.fillText('cm',6,116);
  const nx=(LAB.res.fl.landX*100-x0)*pxcm;
  c.save();c.translate(nx,72);c.fillStyle='#f7f7f2';c.strokeStyle='#4a5565';c.lineWidth=2;
  c.beginPath();c.moveTo(0,0);c.lineTo(-170,-26);c.lineTo(-160,0);c.closePath();c.fill();c.stroke();
  c.setLineDash([4,4]);c.strokeStyle='#d6402f';c.beginPath();c.moveTo(0,0);c.lineTo(0,120);c.stroke();c.setLineDash([]);c.restore();
}

/* ---------- plane picture (top view) ---------- */
/* fold (optional) = the hidden fold error of a hand-folded plane; it is drawn as small, visible lop-sidedness */
function planeSVG(s,P,fold,opt={}){
  const col=PAPERS[s.paper].col,half=Math.min(92,P.b*5.6),noseY=12,tailY=noseY+Math.min(200,P.L*6.3),tipY=tailY-16,notchY=tailY-44;
  const dark=s.tips==='Folded up'?'#9db3c9':s.tips==='Folded down'?'#d9b7b0':col;
  let aw=0,ct=0,ty=0;if(fold){const cl=Math.max(-16,Math.min(16,fold.cl*320));aw=Math.abs(cl)<5?(cl<0?-5:5):cl;ct=Math.max(-9,Math.min(9,fold.cd*140));ct=Math.abs(ct)<3?(ct<0?-3:3):ct;ty=Math.round(aw*.6)}
  const hl=half-aw,hr=half+aw,nx=110,bx=110+ct;
  let svg=`<svg class="planesvg" viewBox="0 0 220 ${opt.mini?215:230}" role="img" aria-label="Top view of your plane">`;
  svg+=`<path d="M${nx} ${noseY} L${110+hr} ${tipY+ty} L${bx} ${notchY} L${110-hl} ${tipY-ty} Z" fill="${col}" stroke="#4a5565" stroke-width="2"/>`;
  svg+=`<path d="M${nx} ${noseY} L${bx} ${notchY}" stroke="#4a5565" stroke-width="1.5" fill="none"/>`;
  if(fold)svg+=`<path d="M110 ${noseY-4} L110 ${notchY+14}" stroke="#c2700c" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/>`;
  if(s.paper==='Newspaper')for(let i=0;i<6;i++)svg+=`<path d="M${110-half*.5} ${noseY+50+i*10} L${110+half*.5} ${noseY+50+i*10}" stroke="#8a8a85" stroke-width="1.2" opacity=".6"/>`;
  if(s.tips!=='Flat'){const t=12;svg+=`<path d="M${110+half} ${tipY} L${110+half-t} ${tipY-t*1.4} L${110+half-t*1.6} ${tipY+2} Z" fill="${dark}" stroke="#4a5565" stroke-width="1.5"/><path d="M${110-half} ${tipY} L${110-half+t} ${tipY-t*1.4} L${110-half+t*1.6} ${tipY+2} Z" fill="${dark}" stroke="#4a5565" stroke-width="1.5"/>`}
  const n=s.clippos==='No clip'?0:s.clips;const cy=s.clippos==='Nose'?noseY+34:s.clippos==='Middle'?(noseY+notchY)/2:notchY-6;
  for(let i=0;i<Math.min(n,5);i++)svg+=`<rect x="102" y="${cy-i*7}" width="16" height="6" rx="2" fill="#b9c2cc" stroke="#6b7684"/>`;
  if(!opt.mini)svg+=`<text x="110" y="226" text-anchor="middle" font-size="11" fill="#5a6878">wingspan ${P.b} cm</text>`;svg+=`</svg>`;
  return svg;
}

/* ---------- the thrower notices things (only what really happened) ---------- */
function groupMasses(){return S.levels.map(lv=>planeParams(labSettings(lv),null).mass*1000)}
function massVaries(){const m=groupMasses();return m.length>1&&(Math.max(...m)-Math.min(...m))/Math.min(...m)>0.08}
const MASS_NOTE=()=>massVaries()?' <b>Mass</b> is red because the planes do not all have the same mass, so two things changed at once.':'';
function flightSig(h,lv){
  const o={},first=live()[0];
  if(Math.abs(h.wind)>(S.env==='outside'?0.9:0.3))o.wind=true;
  const vExp=h.vSet*(h.power||1);if(Math.abs(h.vAct-vExp)/vExp>0.05)o.speed=true;
  if((h.power||1)<0.96)o.band=true;
  if(Math.abs(h.aAct-h.aSet)>2)o.angle=true;
  if(h.dive)o.dive=true;
  if(Math.abs(h.foldCL)>6)o.fold=true;
  if(massVaries())o.mass=true;
  if(first&&(first.hid.aSet!==h.aSet||first.hid.vSet!==h.vSet))o.ctl=true;
  if(S.dv==='time'&&h.sw!=null&&h.trueTime!=null&&Math.abs(h.sw-h.trueTime)>0.25)o.timer=true;
  return o;
}
function throwerComment(h,lv){
  const vExp=h.vSet*(h.power||1),g=flightSig(h,lv),firstOfPlane=fvals(lv).length===0,launcher=S.launch==='launcher',out=S.env==='outside';
  const prev=live().length?live()[live().length-1]:null;
  if(g.ctl)return{t:'Wait… did I change the launch angle or throw speed?',k:'ctl'};
  if(g.dive)return{t:'Hmm, it suddenly dived. I’m not sure why.',k:'dive'};
  if(launcher&&h.power<0.975&&!live().some(f=>f.comment&&f.comment.k==='band'))return{t:'The rubber band feels a bit looser now…',k:'band'};
  if(launcher&&h.power<0.945&&live().filter(f=>f.comment&&f.comment.k==='band').length===1)return{t:'The rubber band is much looser than it was at the start.',k:'band'};
  if(firstOfPlane&&g.fold)return{t:'This plane is folded a little differently from a perfect copy.',k:'fold'};
  if(firstOfPlane&&prev&&prev.lv!==lv&&Math.abs(h.mass-prev.hid.mass)/prev.hid.mass>0.05)return{t:`This plane feels ${h.mass>prev.hid.mass?'heavier':'lighter'} than the last one.`,k:'mass'};
  if(g.speed||g.angle){if(launcher)return{t:'The launcher fired that one a little differently.',k:'throw'};
    if(g.speed&&(!g.angle||Math.abs(h.vAct-vExp)/vExp>Math.abs(h.aAct-h.aSet)/40))return{t:h.vAct>h.vSet?'Oops, I threw that one harder than I meant to.':'That throw was a bit weak.',k:'throw'};
    return{t:h.aAct>h.aSet?'My arm went a bit high on that throw.':'My arm dipped a bit on that throw.',k:'throw'}}
  if(g.wind)return{t:h.wind>0?(out?'Whoa, a gust carried that one further!':'The air from the vent pushed that one further.'):(out?'The wind held that one back.':'The air from the vent held that one back.'),k:'wind'};
  return null;
}

    let ok=0;placed.forEach(p=>{if(isNum){const pt=g.pts[String(p.lk)];if(Math.abs(pt.x-p.x)<=(m.xmax-m.xmin)*.035&&Math.abs(pt.y-p.y)<=(m.ymax-m.ymin)*.035)ok++}

  if(isNum&&g.fit){Object.assign(r,fitEval(g.fit,have.map(p=>[p.x,p.y])))}
  if(isNum){r.fit=!!g.fit;if(g.fit){const xs=have.map(p=>p.x),ys=have.map(p=>p.y),n=xs.length,mx=xs.reduce((a,b)=>a+b,0)/n,my=ys.reduce((a,b)=>a+b,0)/n;

function dragEnd(ev){
  const d=GR.drag;GR.drag=null;dragEndNow();if(!d)return;
  const cv=$('#gcv');if(!cv){return}

    else if(d.from!=null){const old=g.slots.indexOf(d.key);if(old>=0)g.slots[old]=null}

/* ---- line or curve of best fit ---- */
function fitFn(f){
  if(f.curve&&Math.abs(f.x1-f.xm)>1e-9&&Math.abs(f.x2-f.xm)>1e-9&&Math.abs(f.x1-f.x2)>1e-9){const{x1,y1,xm,ym,x2,y2}=f;
    return x=>y1*(x-xm)*(x-x2)/((x1-xm)*(x1-x2))+ym*(x-x1)*(x-x2)/((xm-x1)*(xm-x2))+y2*(x-x1)*(x-xm)/((x2-x1)*(x2-xm))}
  const k=(f.y2-f.y1)/((f.x2-f.x1)||1e-9);return x=>f.y1+k*(x-f.x1);
}
function lsq(pts,deg){ /* least-squares polynomial (degree 1 or 2); returns rms */
  const n=pts.length,d=deg+1;if(n<=deg)return 0;const M=[...Array(d)].map(()=>Array(d+1).fill(0));
  pts.forEach(([x,y])=>{const p=[1,x,x*x];for(let i=0;i<d;i++){for(let j=0;j<d;j++)M[i][j]+=p[i]*p[j];M[i][d]+=p[i]*y}});
  for(let i=0;i<d;i++){let mx=i;for(let r=i+1;r<d;r++)if(Math.abs(M[r][i])>Math.abs(M[mx][i]))mx=r;[M[i],M[mx]]=[M[mx],M[i]];if(Math.abs(M[i][i])<1e-12)return null;for(let r=0;r<d;r++)if(r!==i){const t=M[r][i]/M[i][i];for(let c=i;c<=d;c++)M[r][c]-=t*M[i][c]}}
  const co=M.map((r,i)=>r[d]/r[i]);return Math.sqrt(pts.reduce((a,[x,y])=>a+(y-(co[0]+co[1]*x+(d>2?co[2]*x*x:0)))**2,0)/n);
}
function fitEval(f,pts){
  if(pts.length<2)return{fitOK:false,bendy:false,fitShort:false};
  const fy=fitFn(f),ys=pts.map(p=>p[1]),xs=pts.map(p=>p[0]),yr=Math.max(Math.max(...ys)-Math.min(...ys),Math.abs(ys.reduce((a,b)=>a+b,0)/ys.length)*.1,1e-6);
  const rms=Math.sqrt(pts.reduce((a,[x,y])=>a+(y-fy(x))**2,0)/pts.length);
  const lin=lsq(pts,1)||0,quad=pts.length>=3?(lsq(pts,2)??lin):lin,best=f.curve?quad:lin;
  const a=Math.min(f.x1,f.x2),b=Math.max(f.x1,f.x2),xr=Math.max(...xs)-Math.min(...xs)||1,cover=(Math.min(b,Math.max(...xs))-Math.max(a,Math.min(...xs)))/xr;
  const fitShort=cover<0.7;
  return{fitOK:!fitShort&&rms<=Math.max(best*1.6,best+0.08*yr),bendy:pts.length>=4&&lin>0.06*yr&&quad<0.5*lin,fitShort,fitRms:rms};
}

const gapsOf=parts=>parts.filter(p=>typeof p!=='string'&&p.k!=null);
function frameDone(id,parts){return gapsOf(parts).every(p=>words(A(id+'.'+p.k))>=1)}
function frameText(id,parts){parts=parts.filter(p=>typeof p==='string'||p.k!=null);if(!gapsOf(parts).length)return parts.join('').replace(/\n/g,' ');if(!gapsOf(parts).some(p=>A(id+'.'+p.k).trim()))return'';return parts.map(p=>typeof p==='string'?p:(A(id+'.'+p.k).trim()||'___')).join('').replace(/\n/g,' ').replace(/\s+/g,' ').trim()}

     chkBtn('hyp',()=>[{ok:mentionsIV(A('hyp.b')),msg:c.isNum?'The IF part names your independent variable.':'The IF part names one of your experimental groups.',fix:c.isNum?`After "If I … the", write the variable you change: ${c.ivLower}.`:`After "If I throw a plane with", write one of your experimental groups, for example ${S.levels[0]!=null?lvlLabel(S.iv,S.levels[0]):c.iv.cats[0]}.`},

       {ok:words(A('hyp.d'))>=1,msg:'You said what will happen.',fix:c.isNum?'Say what will happen, for example "get bigger" or "get smaller".':'Say if it will be the greatest or the smallest.'},

    done=frameDone('hyp',FR.hypD());
  }else if(isPro()){

     chkBtn('hyp',()=>[{ok:hasIV(A('hyp.a')),msg:'The IF part names your independent variable.'},{ok:hasDV(A('hyp.b')),msg:'The THEN part names your dependent variable.'},{ok:words(A('hyp.c'))>=5,msg:'The BECAUSE part gives a reason (at least 5 words).'}]);

function trFb(lk,i){return'';const v=A('tr.'+String(lk)+'.'+i);if(!String(v).trim())return'';return trOK(lk,i)?'<b style="color:var(--good)">✓</b>':'<b style="color:var(--bad)" title="Check this measurement">✗</b>'}

/* ---------- COMPARE (peer review) ---------- */
function myCode(){
  const o={v:1,n:S.name,iv:S.iv,dv:S.dv,env:S.env,la:S.launch,d:designKeys().reduce((a,k)=>(a[k]=S.design[k],a),{}),lv:S.levels,m:levelStats().map(s=>s.m==null?null:Math.round(s.m*100)/100)};
  return'PPL-'+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
}
function readCode(t){try{const s=String(t).trim().replace(/^PPL-/,'').replace(/\s+/g,'');return JSON.parse(decodeURIComponent(escape(atob(s))))}catch(e){return null}}
function codeDiffs(o){
  const d=[];if(o.iv!==S.iv)d.push(`they changed ${IVS[o.iv]?IVS[o.iv].lower:'something else'}`);if(o.dv!==S.dv)d.push(`they measured ${DVX[o.dv]?DVX[o.dv].lower:'something else'}`);
  if(o.env!==S.env)d.push(`they flew ${o.env==='outside'?'outside':'inside'}`);if(o.la!==S.launch)d.push(`they launched ${o.la==='launcher'?'with a launcher':'by hand'}`);
  Object.keys(o.d||{}).forEach(k=>{if(String(o.d[k])!==String(S.design[k])&&designKeys().includes(k))d.push(`their ${SETTING_LABEL[k].toLowerCase()} was ${settingText(k,o.d[k])}`)});
  return d;
}
function loadCode(){
  const o=readCode(S.partner.codeText||'');
  if(!o||!o.lv){S.partner.err='That code did not work. Check you copied all of it.';return}
  S.partner.err='';S.partner.code=o;if(!S.partner.name)S.partner.name=o.n||'';S.partner.avgs={};
  o.lv.forEach((lk,i)=>{if(S.levels.some(x=>String(x)===String(lk))&&o.m[i]!=null)S.partner.avgs[String(lk)]=o.m[i]});
}
function makeVirtual(){
  const seed2=(S.seed*7+13)%1000003,avgs={},trials={};let n=0;
  S.levels.forEach((lk,i)=>{const s=labSettings(lk),P0=planeParams(s,null),P=planeParams(s,foldError(seed2,i+1,P0.wob));const vs=[];
    for(let k=0;k<3;k++){n++;const r=doLaunch(seed2,n,s,P,S.env,S.launch==='launcher');const rr=mulberry32(seed2+n*31);
      vs.push(S.dv==='dist'?Math.round(r.fl.dist*10)*10:Math.round((r.fl.time+0.05+gauss(rr)*0.12)*100)/100)}
    trials[String(lk)]=vs;avgs[String(lk)]=Math.round(vs.reduce((a,b)=>a+b,0)/3*100)/100});
  S.partner={...S.partner,mode:'virtual',name:'Sam (virtual partner)',avgs,trials,code:null};
}
function cmpRows(){
  return levelStats().map(s=>{const p=gnum(S.partner.avgs[String(s.lk)]);const me=s.m;const has=!isNaN(p)&&me!=null;
    const diff=has?p-me:null,pct=has?Math.abs(diff)/((Math.abs(p)+Math.abs(me))/2||1)*100:null;return{lk:s.lk,me,p:has?p:null,diff,pct,close:has&&pct<=10}});
}
function drawCompare(c,W,H){
  const rows=cmpRows().filter(r=>r.me!=null),isNum=IVS[S.iv].type==='num';
  c.fillStyle='#fff';c.fillRect(0,0,W,H);if(!rows.length)return;
  const L=110,R=W-20,T=40,Bt=H-60,vals=rows.flatMap(r=>[r.me,r.p].filter(v=>v!=null)),mx=Math.max(...vals)*1.12||1,st=niceStep(mx,5),top=Math.ceil(mx/st)*st;
  const py=v=>Bt-v/top*(Bt-T);
  c.font='16px system-ui,sans-serif';c.textAlign='right';c.fillStyle='#14202e';
  for(let v=0;v<=top+1e-9;v+=st){c.strokeStyle='#e3e8ee';c.beginPath();c.moveTo(L,py(v));c.lineTo(R,py(v));c.stroke();c.fillText(fmt(v,2),L-8,py(v)+5)}
  c.strokeStyle='#14202e';c.lineWidth=2;c.beginPath();c.moveTo(L,T);c.lineTo(L,Bt);c.lineTo(R,Bt);c.stroke();c.lineWidth=1;
  c.textAlign='left';c.font='bold 15px system-ui,sans-serif';c.fillText(DVX[S.dv].name+' ('+dvUnitTxt()+')',8,24);
  const n=rows.length,sw=(R-L)/n;
  rows.forEach((r,i)=>{const x=L+sw*(i+.5),bw=sw*.3;
    c.fillStyle='#1b7ea6';c.fillRect(x-bw-2,py(r.me),bw,Bt-py(r.me));
    if(r.p!=null){c.fillStyle='#c2700c';c.fillRect(x+2,py(r.p),bw,Bt-py(r.p))}
    c.fillStyle='#14202e';c.textAlign='center';c.font='15px system-ui,sans-serif';c.fillText(lvlLabel(S.iv,r.lk),x,Bt+22)});

BUILD.compare=function(){
  const B=newB();B.raw(`<div class="card"><h2>★ Extension: peer review with a partner</h2><p class="lead">Scientists do not trust one set of results on its own. They check that another scientist doing the <b>same experiment</b> gets <b>similar results</b>. If they do, the experiment is <b>reliable</b>.</p>
   <div class="panel" style="margin-bottom:10px"><h4>What you will do</h4><ol style="margin:4px 0;padding-left:20px"><li>Get your partner’s averages (they ran exactly the same test as you).</li><li>The lab puts your averages side by side and works out the <b>% difference</b> for each one.</li><li>Decide whether your experiment is reliable, and explain why your results might be different.</li><li>Swap computers and check each other’s report.</li></ol>
   <p class="note" style="margin-top:6px"><b>Example:</b> you got 600 cm and your partner got 620 cm. The difference is 20 cm, which is about 3%. That is close, so that result is reliable. If you got 600 cm and they got 800 cm (29%), the result is not reliable, and you would look for what was different.</p></div>`);
  if(!live().length){B.raw(`<div class="fb no">You haven’t recorded any flights yet. Go to <b>Test flights</b> and record your flights first.</div><div class="nav"><button class="btn" data-go="lab">← Test flights</button></div></div>`);return B}
  const P=S.partner,mode=P.mode;
  let h=`<div class="grid2"><div><span class="lbl">My results code (give this to your partner)</span><textarea readonly rows="3" style="font-family:var(--font-num);font-size:12px" id="mycode">${esc(myCode())}</textarea><button class="btn sm" data-act="pcopy">Copy my code</button> <span class="note" id="copymsg"></span></div>
    <div><span class="lbl">My partner’s name</span><input type="text" data-bind="p.name" value="${esc(P.name)}" ${mode==='virtual'?'disabled':''}></div></div>
    <p style="margin:10px 0 4px"><b>How will you get your partner’s results?</b></p><div class="cards">
     <button class="ivbtn ${mode==='typed'?'sel':''}" data-act="pmode" data-k="typed"><b>Type them in</b><span>Your partner reads you their averages.</span></button>
     <button class="ivbtn ${mode==='code'?'sel':''}" data-act="pmode" data-k="code"><b>Paste their results code</b><span>Your partner sends you their code.</span></button>
     <button class="ivbtn ${mode==='virtual'?'sel':''}" data-act="pmode" data-k="virtual"><b>No partner today</b><span>Compare with Sam, a virtual partner who ran the same test.</span></button></div>`;
  if(mode==='typed'){
    h+=`<table class="tb" style="max-width:560px"><thead><tr><th class="l">What I changed</th><th>My partner’s average (${esc(dvUnitTxt())})</th></tr></thead><tbody>${S.levels.map(lk=>`<tr><td class="l">${esc(lvlLabel(S.iv,lk))}</td><td><input type="text" inputmode="decimal" data-bind="p.avg.${esc(String(lk))}" value="${esc(P.avgs[String(lk)]==null?'':P.avgs[String(lk)])}"></td></tr>`).join('')}</tbody></table>
     <p style="margin:10px 0 4px"><b>Did your partner use exactly the same plane design and set-up as you?</b></p><div class="chips">${['Yes','No','Not sure'].map(x=>`<button class="chip ${P.same===x?'sel':''}" data-act="psame" data-k="${x}">${x}</button>`).join('')}</div>`;
  }else if(mode==='code'){
    h+=`<span class="lbl">Paste your partner’s code</span><textarea data-bind="p.code" rows="3" style="font-family:var(--font-num);font-size:12px">${esc(P.codeText||'')}</textarea><button class="btn sm" data-act="pload">Load their results</button>${P.err?`<div class="fb no">${esc(P.err)}</div>`:''}`;
    if(P.code){const d=codeDiffs(P.code);h+=d.length?`<div class="fb mid"><b>Not quite the same experiment:</b> ${esc(d.join('; '))}. Keep this in mind when you compare.</div>`:'<div class="fb ok">Your partner ran exactly the same experiment as you.</div>'}
  }else if(mode==='virtual'){h+=`<div class="fb ok">Sam ran the same test as you, with the same plane design and set-up, on a different day.</div>`}
  const rows=cmpRows(),have=rows.filter(r=>r.p!=null);
  B.q('partner','Your partner’s results',h,have.length>=2);
  if(have.length){
    let t=`<table class="tb"><thead><tr><th class="l">What I changed</th><th>My average</th><th>${esc(P.name||'Partner')}’s average</th><th>Difference</th><th>% difference</th></tr></thead><tbody>`+
      rows.map(r=>`<tr><td class="l">${esc(lvlLabel(S.iv,r.lk))}</td><td>${r.me==null?'–':esc(fmt(r.me,dvDp()))}</td><td>${r.p==null?'–':esc(fmt(r.p,dvDp()))}</td><td>${r.diff==null?'–':esc(fmt(Math.abs(r.diff),dvDp()))}</td><td>${r.pct==null?'–':esc(fmt(r.pct,0))+'%'}</td></tr>`).join('')+`</tbody></table>
      <p class="note">% difference = the difference ÷ the average of the two results × 100. ${helped()?'10% or less means the two results are close.':''}</p>
      <canvas id="cmpcv" class="cv" width="1000" height="380" style="background:#fff;margin-top:8px" aria-label="My results and my partner's results side by side"></canvas>`;
    B.q('cmp','Compare the results',t,true);
    let w;
    if(isDev()){w=tip(['developing'],'Look at the % difference column to find the biggest difference. Then think about what was different between your test and your partner’s test.')+frame('rel',RELF())+
      chkBtn('rel',()=>[{ok:usesData(relText())>=2,msg:'You used numbers from the table.',fix:'Copy the two averages for your biggest difference from the table.'},{ok:/reliab/i.test(A('rel.f')),msg:'You said how reliable the experiment is.',fix:'Write "reliable" or "not very reliable" in the gap.'},{ok:words(A('rel.e'))>=4&&words(A('rel.g'))>=4,msg:'You gave reasons.',fix:'Give a reason in each "because" gap.'}]);}
    else{w=tip(['proficient'],'Sentence starters: <i>My results were similar to / different from… · The biggest difference was at… · This might be because… · I think our experiment is reliable / not very reliable because…</i>')+
      nudge(['mastering'],'Check your notebook for what “reliable” means.')+`<p style="margin:4px 0"><b>How reliable is your experiment? Compare your results with your partner’s. Use data.</b></p>`+ta('rel','',5)+
      chkBtn('rel',()=>[{ok:usesData(A('rel'))>=2,msg:'You used numbers from the table.'},{ok:/reliab/i.test(A('rel')),msg:'You said how reliable the experiment is.'},{ok:/because|might|could|due to/i.test(A('rel')),msg:'You gave a reason for the differences.'}])}
    B.q('rel','Is the experiment reliable?',w,isDev()?frameDone('rel',RELF()):words(A('rel'))>=1);
  }
  /* peer check */
  const pe=S.peer;
  const ph=`<div class="tip" style="margin-top:0"><b>Swap computers.</b> Your partner fills this in about <b>your</b> report, then you swap back.${mode==='virtual'?' (No partner today? Ask someone near you.)':''}</div>
    <span class="lbl">Checked by</span><input type="text" data-bind="peer.name" value="${esc(pe.name||'')}" style="max-width:320px">
    <div class="checklist" style="margin-top:8px">${PEER.map(([k,t])=>`<label><input type="checkbox" data-peerck="${k}" ${pe['ck.'+k]?'checked':''}><span>${t}</span></label>`).join('')}</div>
    <div class="grid2" style="margin-top:8px"><div><span class="lbl">One thing done well</span>${`<textarea data-bind="peer.well" rows="2">${esc(pe.well||'')}</textarea>`}</div><div><span class="lbl">One thing to improve</span><textarea data-bind="peer.better" rows="2">${esc(pe.better||'')}</textarea></div></div>`;
  B.q('peer','Peer check (your partner fills this in)',ph,words(pe.name)>=1&&words(pe.well)>=1&&words(pe.better)>=1);
  B.raw(`<div class="fb mid" style="margin-top:12px">When you have finished, go back to <b>Finish</b> and save your report PDF again. The peer review will be added to it.</div><div class="nav"><button class="btn" data-go="extend">← Extensions</button><span class="msg"></span><button class="btn primary" data-go="finish">Go to Finish →</button></div></div>`);
  return B;
};

const QF={
 q1:()=>IVS[S.iv].type==='num'?['My graph shows a ',{help:'trend'},{k:'a',w:'',ph:'positive / negative / no'},' trend.\nAs the ',{k:'b',ph:'independent variable'},' increased from ',{k:'c',w:'',ph:'first value'},' to ',{k:'d',w:'',ph:'last value'},',\nthe average ',{k:'f',ph:'dependent variable'},' changed from ',{k:'g',w:'',ph:'number + unit'},' to ',{k:'h',w:'',ph:'number + unit'},'.']
   :[{help:'trend'},'The ',{k:'a',ph:'which group'},' had the greatest average (',{k:'b',w:'',ph:'number + unit'},').\nThe ',{k:'c',ph:'which group'},' had the smallest average (',{k:'d',w:'',ph:'number + unit'},').\nThe difference between them was ',{k:'e',w:'',ph:'bigger − smaller'},'.\nThis shows that ',{k:'f',w:'w3'},'.'],
 q2:()=>['My hypothesis was ',{k:'a',ph:'supported / not supported / partly supported'},'.\nI predicted that ',{k:'b',w:'w3'},'.\nMy data shows that ',{k:'c',w:'w3'},'.'],
 q4:()=>['To fix my first method error, I would ',{k:'a',w:'w3'},'.\nThis would make my test fairer or my results more reliable because ',{k:'b',w:'w3'},'.\nTo fix my second method error, I would ',{k:'c',w:'w3'},'.\nThis would help because ',{k:'d',w:'w3'},'.']
};
const QTXT={q1:'What did you discover? Use your data.',q2:'Was your hypothesis supported by your results? Explain with your data.',q3:'Which method errors affected your results? Explain how each one changed your results. (Explain at least 2!)',q4:'How would you fix these method errors?'};
const QSTEM={q1:()=>IVS[S.iv].type==='num'?'My graph shows a positive / negative / no trend… · As the … increased from … to …, the … changed from … to …':'The … had the greatest average (…) · The … had the smallest (…) · The difference between them was…',q2:()=>'My hypothesis was supported / not supported / partly supported… · I predicted that… · My data shows that…',q3:()=>'One method error was… · This affected my results because…',q4:()=>'To fix my first method error, I would… · This would make my test fairer / my results more reliable because…'};
/* Q3 at Developing and Proficient: pick method errors from the sorted cards, then explain each one */
function q3Picks(){const p=A('q3.pick',[]);return Array.isArray(p)?p:[]}
function q3Chosen(){const cards=sortCards();return q3Picks().map(id=>cards.find(c=>c.id===id)).filter(Boolean)}
function q3HelpedText(){return q3Chosen().map((cd,i)=>`Method error ${i+1}: ${cd.t} This affected my results because ${A('q3.w'+cd.id).trim()||'___'}.`).join('\n')}
function q3HelpedDone(){const ch=q3Chosen();return ch.length>=1&&ch.every(cd=>words(A('q3.w'+cd.id))>=1)}
function qText(n){if(n==='q3'&&helped())return q3HelpedText();return isDev()?frameText(n,QF[n]()):A(n)}
function flawsIn(t){return Object.keys(FLAWS).filter(k=>FLAWS[k].kw.test(t||''))}
function revealHTML(){
  const L=S.flights.filter(f=>f.hid),rec=live();
  const tm=rec.filter(f=>f.timed!=null&&f.hid.trueTime!=null);
  const dev=isDev();
  let h=`<div class="reveal"><h3>🔍 Behind the scenes</h3><p class="note">The lab secretly recorded what really happened in each flight. Use it to evaluate your method.</p>`;
  const RD='background:#fbd9d3;color:#8f1d10;font-weight:700';const rc=(on,v)=>`<td style="${on?RD:''}">${v}</td>`;
  h+=`<div style="overflow:auto"><table class="tb"><thead><tr><th>Flight</th><th>${esc(IVS[S.iv].type==='num'?'Value':'Type')}</th><th>Your reading (cm)</th><th>Real distance (cm)</th><th>Your time (s)</th><th>Real time (s)</th><th>Angle (set → real)</th><th>Throw speed, m/s (set → real)</th><th>${S.env==='outside'?'Wind':'Air movement'} (m/s)</th><th>Fold (extra lift)</th><th>Mass (g)</th>${S.launch==='launcher'?'<th>Launch power</th>':''}<th>Odd flight?</th><th class="l">My note</th></tr></thead><tbody>`+
    L.map(f=>{const h0=f.hid,g=flightSig(h0,f.lv),rd=f.read!=null&&Math.abs(f.read-h0.trueDist)>5,tm=S.dv==='time'&&f.timed!=null&&Math.abs(f.timed-h0.trueTime)>0.25;
      return`<tr style="${f.gone?'opacity:.55':''}"><td>${f.n}${f.gone?' (not used)':''}</td><td>${esc(lvlLabel(S.iv,f.lv))}</td>${rc(rd,f.read!=null?f.read:'–')}<td>${h0.trueDist}</td>${rc(tm,f.timed!=null?Number(f.timed).toFixed(2):'–')}<td>${h0.trueTime.toFixed(2)}</td>${rc(g.angle||g.ctl,`${h0.aSet}° → ${h0.aAct}°`)}${rc(g.speed||g.ctl,`${h0.vSet} → ${h0.vAct}`)}${rc(g.wind,(h0.wind>0?'+':'')+h0.wind.toFixed(2))}${rc(g.fold,h0.foldCL!=null?(h0.foldCL>0?'+':'')+fmt(h0.foldCL,1)+'%':'')}${rc(g.mass,h0.mass!=null?fmt(h0.mass,1):'')}${S.launch==='launcher'?rc(g.band,Math.round((h0.power||1)*100)+'%'):''}${rc(g.dive,h0.dive?'nosedive':'')}<td class="l">${esc(f.note||'')}</td></tr>`}).join('')+`</tbody></table></div>
    <p class="note"><b style="color:#b3301e">Red</b> = this had a big effect on the flight (or your reading was more than 5 cm out). Air movement: + pushed the plane towards the far end, – pushed against it. Fold: + means the plane got a little more lift than a perfect copy.${MASS_NOTE()}</p>`;

  if(dev){
    const ex=flawsHere().map(k=>`<li><b>${FLAWS[k].name}.</b> ${FLAWS[k].why}</li>`).join('');
    h+=`<p style="margin:8px 0 2px"><b>What this means</b></p><ul style="margin:0;padding-left:20px">${ex}</ul>`;
    if(tm.length){const e=tm.map(f=>Math.abs(f.timed-f.hid.trueTime));h+=`<p class="note">Your stopwatch was off by ${fmt(Math.min(...e),2)} s to ${fmt(Math.max(...e),2)} s.</p>`}
  }
  return h+`</div>`;
}
function addQ(B,n,i){
  const c=cx();let body=`<p style="margin:4px 0"><b>${i+1}. ${QTXT[n]}</b></p>`,done;
  if(isDev()){
    if(n==='q3'){q3Helped(B,i);return}
    const extra={q1:c.isNum?'Look at your graph. Is the trend positive, negative or is there no trend? Then copy numbers from Table 1.':'Look at your bar graph. Which group was highest and which was lowest? Work out the difference: bigger − smaller.',q2:'Look back at your hypothesis: '+(hypText()?'“'+esc(hypText())+'”':'(you have not written it yet)')+'.',q4:'Use the improvements you sorted above. Write one fix for each method error you explained in Question 3, and say how it makes the test <b>fairer</b> or the results more <b>reliable</b>.'}[n];
    body+=tip(['developing'],extra)+frame(n,QF[n]())+chkBtn(n,()=>{
      const t=qText(n);
      if(n==='q1')return c.isNum?[{ok:/positive|negative|no trend/i.test(A('q1.a')),msg:'You named the trend.',fix:'Write positive, negative or no in the first gap.'},{ok:usesData(t)>=2,msg:'You used numbers from your results.',fix:'Copy the first and last averages from Table 1, with units.'}]
        :[{ok:usesData(t)>=2,msg:'You used numbers from your results.',fix:'Copy the highest and lowest averages from Table 1, with units.'},{ok:words(A('q1.e'))>=1&&/\d/.test(A('q1.e')),msg:'You worked out the difference.',fix:'Work out the difference: the bigger average − the smaller average.'}];
      if(n==='q2')return[{ok:/support/i.test(A('q2.a')),msg:'You said if your hypothesis was supported.',fix:'Write supported, not supported or partly supported.'},{ok:usesData(t)>=1,msg:'You used data.',fix:'Add a number from your results in the last gap.'}];
      return[{ok:words(A('q4.a'))>=3&&words(A('q4.c'))>=3,msg:'You gave two improvements.',fix:'Write two improvements.'},{ok:/fair|reliab|same|similar/i.test(A('q4.b')+' '+A('q4.d')),msg:'You explained how they make the test fairer or more reliable.',fix:'Use the words fair or reliable in your “because” sentences.'}]});
    done=frameDone(n,QF[n]());
  }else{
    if(n==='q3'&&isPro()){q3Helped(B,i);return}
    const mh={q1:c.isNum?'Think about: is the trend positive, negative or is there no trend? Use numbers from your data.':'Think about: which group was highest and lowest, and the difference between them. Use numbers from your data.',q2:'Check your notebook for how to explain a conclusion using data.',q3:'Think about: problems with how the test was set up (method errors), not slips you made. How did each one change your results?',q4:'Think about: how would each change make your test fairer or your results more reliable?'}[n];
    body+=tip(['proficient'],(n==='q1'?helpBtn('trend')+' ':'')+'Sentence starters: <i>'+QSTEM[n]()+'</i>')+nudge(['mastering'],(n==='q1'?helpBtn('trend')+' ':'')+mh)+ta(n,'',n==='q3'||n==='q4'?6:4)+
     chkBtn(n,()=>{const t=A(n);if(n==='q1')return c.isNum?[{ok:/positive|negative|no trend/i.test(t),msg:'You named the trend.'},{ok:usesData(t)>=2,msg:'You used at least two numbers from your results.'}]:[{ok:/difference|more than|less than|further|longer|higher|lower/i.test(t),msg:'You compared the groups.'},{ok:usesData(t)>=2,msg:'You used at least two numbers from your results.'}];
       if(n==='q2')return[{ok:/support/i.test(t),msg:'You said if your hypothesis was supported.'},{ok:usesData(t)>=1,msg:'You used data.'}];
       return[{ok:words(t)>=15,msg:'You described how to improve the method.'},{ok:/fair|reliab/i.test(t),msg:'You explained how it makes the test fairer or more reliable.'}]});
    done=words(A(n))>=1;
  }
  B.q(n,`Question ${i+1}`,body,done);
}
BUILD.conclusion=function(){
  const B=newB();B.raw(`<div class="card"><h2>7. Analysis</h2><p class="lead">Analyse your data: describe what it shows, using numbers, and decide if your hypothesis was supported.</p>
   <div class="tip">📄 Look at <b>My report</b> on the right to see your data: Table 1 (with your averages) and your graph. Click the <b>My report</b> tab to close or open it.</div>`);

  ['q1','q2'].forEach((n,i)=>addQ(B,n,i));
  B.raw(`<div class="nav"><button class="btn" data-go="results">← Results</button><span class="msg"></span><button class="btn primary" data-go="evaluate">Next: Evaluation →</button></div></div>`);
  return B;
};

   ['l','I tested every value three times and recorded it in my table.','lab',()=>trialsDone()],
   ['r','My results tables are finished, with averages.','results',()=>{const b=BUILD.results().f;return b.t1&&b.t2}],
   ['g','My graph has a title, axis labels and all my data.','results',()=>graphEval().done],
   ['e','I answered my analysis questions.','conclusion',()=>allDone('conclusion')],

   ['s1','I checked my spelling and my units.',null,()=>true],

  const c=[];const add=(id,t,cat,when=true)=>{if(when)c.push({id,t,cat})};

  add('h5','Oops! I forgot to write down one flight, so I had to redo it.','human',!timed||!dist);
  add('m1',hand?'Throwing by hand gives a slightly different speed and angle every time.':'Even the launcher fired each plane a little differently.','method');
  add('m2',S.env==='outside'?'The wind kept changing and pushed some planes.':'Moving air from the vent pushed some planes.','method');
  add('m3','Folding by hand means each plane is a little different.','method');
  add('m8','Even a careful person needs about a fifth of a second to react when starting and stopping a stopwatch.','method',timed);
  add('m4','The tape measure only had marks every 10 cm.','method',dist);
  add('m5',S.iv==='design'?'Different designs used different amounts of paper, so their mass was different too.':'Changing the wingspan also changed the mass of the plane.','method',S.iv==='span'||S.iv==='design');
  add('m6','One plane nosedived for no clear reason.','method',L.some(f=>f.hid&&f.hid.dive));
  add('m7','I only did 3 trials for each group.','method');
  add('m9','The rubber band got looser after many launches, so later planes were launched more weakly.','method',!hand&&L.some(f=>f.hid&&f.hid.power<0.96));
  add('i1','Use a rubber band launcher so every launch is the same.','improve',hand);
  add('i2',S.env==='outside'?'Test inside, where there is no wind.':'Close doors and windows and switch off the air conditioning.','improve');
  add('i3','Do more trials for each group and use the average.','improve');
  add('i4','Fold every plane using the same template.','improve');
  add('i5','Use a tape measure with marks every 1 cm.','improve',dist);

}

  learn:['A hypothesis uses the <b>IF, THEN, BECAUSE</b> format.','<b>IF</b> = what you change (or which group you test). <b>THEN</b> = what will happen to what you measure. <b>BECAUSE</b> = a science reason.']},
 plan:{n:'4',t:'Plan',do:['Choose your experimental groups: the values or types you will test.','Choose where you fly and how you launch.','Design your plane.','Write your control variables, materials and method.'],
  learn:['<b>Control variables</b> are the things you keep the same in every flight. That makes it a <b>fair test</b>.','You will test each value <b>3 times</b> so one odd flight does not fool you.']},
 lab:{n:'5',t:'Test flights',do:['Give your results table a title and headings <b>before</b> you fly.','Set your launch angle and throw speed, then <b>keep them the same</b>.','Launch, then read the tape (or the stopwatch).','Type each measurement into your table. Do 3 trials for each value.','Work out the averages.',()=>helped()?'<b>The thrower will make qualitative observations</b> about some flights, like “the air pushed that one further”. Click <b>📝 Add to my notes</b> to save them. Your notes will help you in your evaluation.':'<b>The thrower will notice when a flight is different.</b> Click what they say to look behind the scenes, then write your own note about that flight. Your notes will help you in your evaluation.'],
  learn:['The tape has a mark every <b>10 cm</b>. Read to the mark, then <b>estimate the last digit</b>. If the nose is just before 440 cm, you might write 437 cm.','Average = add the trials, then divide by how many there are.']},
 results:{n:'6',t:'Results',do:['Describe what each plane did, in words (Table 2).','Make your graph: choose the type, write a title and axis labels, choose your axis numbers, then plot your averages.'],
  learn:['Qualitative observations use <b>words, not numbers</b>.','The x-axis (along the bottom) shows what you changed. The y-axis (up the side) shows what you measured.','Graph title: <b>independent variable vs dependent variable</b>.']},
 conclusion:{n:'7',t:'Analysis',do:['Look at your data in <b>My report</b> (on the right).','Describe what your data shows, using <b>numbers</b> from your table.','Say if your hypothesis was supported.'],lesson:()=>analysisLesson()},
 evaluate:{n:'8',t:'Evaluation',do:['Mark an ✕ to show how <b>fair</b> your test was.','Sort the errors, then explain the <b>method errors</b>: problems with how your test was set up.','Decide how to make your test fairer and your results more <b>reliable</b>.'],lesson:()=>evaluationLesson()},
 finish:{n:'9',t:'Finish',do:['Save your report as a PDF.','Hand it in on Toddle.','Tick off your checklist to unlock your certificate.']},
 extend:{n:'★',t:'Extensions',do:['<b>Peer review:</b> compare your results with a partner who ran the same test.','<b>New investigation:</b> test a different variable at a higher challenge level.']},
 compare:{n:'★',t:'Peer review',do:['Get your partner’s averages.','Compare them with yours using the % difference.','Decide if your experiment is reliable.','Swap computers and check each other’s report.'],
  learn:['Results are <b>reliable</b> if you get similar results when the test is repeated.','A % difference of 10% or less means two results are close.']}
};

  if(k==='finish')return S.iv&&certReady()?'done':'';
  if(k==='extend')return'';

}

  const l=LV[S.level];document.documentElement.style.setProperty('--lv',l.col);

function act(a,el,ev){
  const id=el.dataset.id,k=el.dataset.k;
  switch(a){
   case'pick-level':START.level=k;render();break;
   case'start':doStart();break;
   case'resume':{const o=loadSaved();if(o){S=Object.assign(blank(),o);render();window.scrollTo(0,0)}break}
   case'ivtype':S.a.ivtype=k;save();rerender();break;
   case'iv':setIV(k);break;
   case'dv':setDV(k);break;
   case'levelpick':{const iv=IVS[S.iv],v=iv.type==='num'?Number(el.dataset.v):el.dataset.v;const i=S.levels.indexOf(v);if(i>=0)S.levels.splice(i,1);else S.levels.push(v);
     const order=iv.type==='num'?iv.vals:iv.cats;S.levels.sort((a,b)=>order.indexOf(a)-order.indexOf(b));S.labLevel=null;save();rerender();break}
   case'env':if(!testsStarted()){S.env=k;save();rerender()}break;
   case'launch':if(!testsStarted()){S.launch=k;save();rerender()}break;
   case'mat:add':{const m=matList().slice();if(!m.includes(k))m.push(k);S.a.matsel=m;save();rerender();break}
   case'mat:rm':{S.a.matsel=matList().filter(x=>x!==k);save();rerender();break}
   case'mb:add':{const m=mbList().slice();m.push(k);S.a.mb=m;save();rerender();break}
   case'mb:up':case'mb:dn':{const m=mbList().slice(),i=Number(el.dataset.i),j=a==='mb:up'?i-1:i+1;[m[i],m[j]]=[m[j],m[i]];S.a.mb=m;save();rerender();break}
   case'mb:rm':{const m=mbList().slice();m.splice(Number(el.dataset.i),1);S.a.mb=m;save();rerender();break}
   case'chk':S.a['chk.'+id]=1;save();rerender();break;
   case'reveal':S.revealed=true;save();rerender();break;
   case'pmode':if(k==='virtual')makeVirtual();else{S.partner.mode=k;if(S.partner.name==='Sam (virtual partner)'){S.partner.name='';S.partner.avgs={}}}save();rerender();break;
   case'psame':S.partner.same=k;save();rerender();break;
   case'pload':loadCode();save();rerender();break;
   case'pcopy':{const t=$('#mycode');t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(()=>{$('#copymsg').textContent='Copied.'}).catch(()=>{});$('#copymsg').textContent=ok?'Copied.':'Select the code and copy it.';break}
   case'g:suggest':gSuggest();graphRefresh();break;
   case'g:fit':{const g=gInit();if(g.fit&&g.fit.curve){g.fit={x1:g.fit.x1,y1:g.fit.y1,x2:g.fit.x2,y2:g.fit.y2};save();graphRefresh();break}if(gValid(g)){const m=gMap(g),pv=plotVals().filter(p=>p.y!=null),my=pv.length?pv.reduce((a,p)=>a+p.y,0)/pv.length:(m.ymin+m.ymax)/2;g.fit={x1:m.xmin+(m.xmax-m.xmin)*.1,y1:my,x2:m.xmax-(m.xmax-m.xmin)*.1,y2:my}}else gWarn('Choose your axis numbers first.');save();graphRefresh();break}
   case'g:nofit':gInit().fit=null;save();graphRefresh();break;
   case'g:curve':{const g=gInit();if(gValid(g)){const m=gMap(g),pv=plotVals().filter(p=>p.y!=null),my=pv.length?pv.reduce((a,p)=>a+p.y,0)/pv.length:(m.ymin+m.ymax)/2,old=g.fit;
     g.fit=old?{x1:old.x1,y1:old.y1,x2:old.x2,y2:old.y2,curve:true,xm:(old.x1+old.x2)/2,ym:(old.y1+old.y2)/2}:{x1:m.xmin+(m.xmax-m.xmin)*.1,y1:my,x2:m.xmax-(m.xmax-m.xmin)*.1,y2:my,curve:true,xm:(m.xmin+m.xmax)/2,ym:my}}else gWarn('Choose your axis numbers first.');save();graphRefresh();break}
   case'g:type':gInit().type=k;save();graphRefresh();break;

   case'sortpick':S.a['sort.'+id]=k;if(k!=='method')S.a['q3.pick']=q3Picks().filter(x=>x!==id);save();rerender();break;

   case'help':openModal(`<div class="intro"><h2>${IVS[S.iv]&&IVS[S.iv].type==='num'?'Positive, negative or no trend?':'Comparing groups'}</h2>${analysisLesson()}<div style="text-align:right"><button class="btn primary" data-act="closemodal">Got it</button></div></div>`);break;

  }
}

function bindValue(el){
  const key=el.dataset.bind,v=el.value;
  if(key.startsWith('start.')){START[key.slice(6)]=v;const b=$('[data-act="start"]'),m=$('.nav .msg');if(b)b.disabled=!(START.name.trim()&&START.cls.trim()&&START.level);if(m)m.textContent=!START.name.trim()?'Type your name to begin.':!START.cls.trim()?'Type your class to begin.':!START.level?'Choose a challenge level.':'Ready? Your level will be locked.';return}
  if(key.startsWith('g.')){gInit()[key.slice(2)]=v;save();gDraw();softStatus();return}
  if(key==='p.name'){S.partner.name=v;save();return}
  if(key==='p.code'){S.partner.codeText=v;save();return}
  if(key.startsWith('p.avg.')){S.partner.avgs[key.slice(6)]=v;save();return}
  if(key.startsWith('peer.')){S.peer[key.slice(5)]=v;save();softStatus();return}
  setA(key,v);sheetRefreshSoon();if(String(v).trim())el.classList.remove('emptyfield');
  if(key.startsWith('tr.')){const m=key.match(/^tr\.(.*)\.(\d)$/);if(m){const real=S.levels.find(x=>String(x)===m[1]);const f=fvals(real)[Number(m[2])],nv=parseFloat(v);if(f&&isFinite(nv)){if(S.dv==='dist')f.read=nv;else f.timed=nv;save()}}}
  softStatus();
}
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.bind&&el.tagName!=='SELECT')bindValue(el);
  if(el.dataset&&el.dataset.launchset){const k=el.dataset.launchset,v=Number(el.value);(isExplore()?S.exp:S.design)[k]=v;const l=$('#ls-'+k);if(l)l.textContent=v+(k==='angle'?'°':' m/s');save()}});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.bind&&el.tagName==='SELECT'){bindValue(el);if(S.step!=='results')rerender();else graphRefresh();return}
  if(el.dataset.bind&&S.step==='compare'&&el.dataset.bind.startsWith('p.avg.')){rerender();return}
  if(el.dataset.exp){const k=el.dataset.exp,num=['span','clips'].includes(k);S.exp[k]=num?Number(el.value):el.value;save();labPanels();return}
  if(el.dataset.launchset){labPanels();save();return}
  if(el.dataset.design){const k=el.dataset.design,num=['span','clips','angle','speed'].includes(k);S.design[k]=num?Number(el.value):el.value;S.planes={};save();rerender();return}
  if(el.dataset.ck){S.ck[el.dataset.ck]=el.checked;save();rerender();return}
  if(el.dataset.peerck){S.peer['ck.'+el.dataset.peerck]=el.checked;save();return}
  if(el.id==='loadfile'&&el.files[0]){openFile(el.files[0]);el.value=''}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#modal').classList.contains('open')){closeModal();return}
  if((S.step==='lab'||S.step==='observe')&&(e.code==='Space'||e.key===' ')){const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT|BUTTON/.test(a.tagName))return;e.preventDefault();swToggle()}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

window.addEventListener('resize',()=>{if($('.tourcard'))tourShow()});
/* ---- boot ---- */
(function boot(){const o=loadSaved();if(o&&o.started&&LV[o.level]){START.name=o.name;START.cls=o.cls}render();if(S.started&&S.step==='conclusion')setSheet(true)})();

</script></body></html>
