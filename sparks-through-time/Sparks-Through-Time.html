<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sparks Through Time</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout concept: a time machine. A sticky "destination dial" header, a vertical timeline of stops on the home screen,
   and each stop opens into a lab bench with Learn / Explore / Challenge tabs. Cool blueprint paper, indigo ink, copper wire, spark yellow. */
:root{
  --bg:#eceff5; --panel:#ffffff; --panel-2:#f4f6fb; --ink:#1a2140; --muted:#56607e; --line:#d2d7e5;
  --accent:#3a4bd1; --accent-ink:#ffffff; --accent-soft:#e3e6fb;
  --spark:#f2b200; --spark-ink:#3b2a00; --copper:#b4622a; --flow:#1d6be0;
  --ok:#1b7f46; --ok-bg:#e1f4e8; --bad:#b83434; --bad-bg:#fae6e6; --hint-bg:#fff4d6; --hint:#7a5600;
  --board:#f8f9fc; --dot:#c3c9da; --glass:#eef3ff; --metal:#8f98ad; --cellbody:#2a2f3d; --wood:#c89a5c;
  --hue-l:40%; --hue-bg:94%;
  --font-display: Rockwell, "Rockwell Nova", "Roboto Slab", "Zilla Slab", "DejaVu Serif", Georgia, serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1222; --panel:#161b31; --panel-2:#1b2140; --ink:#e7eaf6; --muted:#9ba4c4; --line:#2b3254;
  --accent:#8e9cff; --accent-ink:#0e1222; --accent-soft:#232a52;
  --spark:#ffcf3a; --spark-ink:#2a1e00; --copper:#e48b4c; --flow:#5aa8ff;
  --ok:#53c98a; --ok-bg:#12301f; --bad:#ff8080; --bad-bg:#3a1919; --hint-bg:#352a0c; --hint:#ffd879;
  --board:#11162a; --dot:#323a5c; --glass:#2a3150; --metal:#6c7590; --cellbody:#05070d; --wood:#8a6634;
  --hue-l:74%; --hue-bg:18%; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0e1222; --panel:#161b31; --panel-2:#1b2140; --ink:#e7eaf6; --muted:#9ba4c4; --line:#2b3254;
  --accent:#8e9cff; --accent-ink:#0e1222; --accent-soft:#232a52;
  --spark:#ffcf3a; --spark-ink:#2a1e00; --copper:#e48b4c; --flow:#5aa8ff;
  --ok:#53c98a; --ok-bg:#12301f; --bad:#ff8080; --bad-bg:#3a1919; --hint-bg:#352a0c; --hint:#ffd879;
  --board:#11162a; --dot:#323a5c; --glass:#2a3150; --metal:#6c7590; --cellbody:#05070d; --wood:#8a6634;
  --hue-l:74%; --hue-bg:18%; color-scheme:dark; }

*{box-sizing:border-box}
html,body{background:var(--bg); color:var(--ink)}
body{font-family:var(--font-body); font-size:16px; line-height:1.55; margin:0; background-repeat:repeat}
@media (max-width:620px){ .celebrate{grid-template-columns:minmax(0,1fr)} }
button{font:inherit; color:inherit}
h1,h2,h3{font-family:var(--font-display); line-height:1.15; text-wrap:balance; margin:0}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:6px}

/* ---------- header / time dial ---------- */
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--panel); border-bottom:1px solid var(--line);}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--panel)}
.topbar-in{max-width:1100px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding-block:10px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:10px; background:none; border:0; cursor:pointer; padding:0; text-align:left}
.brand b{font-family:var(--font-display); font-size:1.2rem; letter-spacing:.01em}
.brand small{display:block; color:var(--muted); font-size:.78rem; line-height:1.2}
.dial{display:flex; align-items:center; gap:10px}
.dial-label{font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); text-align:right; line-height:1.25}
.dial-label span{display:block; color:var(--ink); letter-spacing:.02em; text-transform:none; font-size:.82rem}
.dial-face{font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:1.35rem; font-weight:700; letter-spacing:.06em;
  background:var(--ink); color:var(--spark); padding:4px 12px; border-radius:8px; min-width:7.2em; text-align:center; box-shadow:inset 0 0 0 2px var(--copper)}

.wrap{max-width:1100px; margin:0 auto; padding-block:24px 64px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}

/* ---------- Pip ---------- */
.pip-row{display:flex; gap:12px; align-items:flex-start}
.pip-row svg{flex:none}
.bubble{position:relative; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 16px; min-width:0; max-width:72ch}
.bubble::before{content:""; position:absolute; left:-7px; top:18px; width:12px; height:12px; background:var(--panel); border-left:1px solid var(--line); border-bottom:1px solid var(--line); transform:rotate(45deg)}
.bubble p+p{margin-top:.6em}

/* ---------- home ---------- */
.hero{display:grid; gap:18px; margin-bottom:28px}
.hero h1{font-size:clamp(2rem, 6vw, 3.3rem); letter-spacing:-.01em}
.hero h1 em{font-style:normal; color:var(--copper)}
.hero .lede{color:var(--muted); max-width:60ch; font-size:1.05rem}
.passport{display:grid; gap:12px; padding:14px 18px; background:var(--panel); border:2px dashed var(--copper); border-radius:var(--r); max-width:100%}
.passport-head{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.stamp-sheet{display:flex; flex-wrap:wrap; gap:10px 14px}
.stamp-pair{display:grid; justify-items:center; gap:2px; background:none; border:0; padding:4px; cursor:pointer; border-radius:10px}
.stamp-pair:hover{background:var(--panel-2)}
.stamp-pair-imgs{display:flex; gap:0}
.stamp-pair small{font-size:.72rem; color:var(--muted); font-weight:700}
.best-pill{font-family:var(--font-mono); font-size:.75rem; font-weight:700; border:2px dashed var(--line); border-radius:99px; padding:4px 10px; color:var(--muted)}
.stamp-in{animation:stampin .6s cubic-bezier(.2,1.5,.4,1) both}
@keyframes stampin{0%{transform:scale(2.4) rotate(-30deg); opacity:0}55%{opacity:1}100%{transform:scale(1) rotate(0)}}
.stamp-overlay{position:fixed; inset:0; z-index:60; display:grid; place-items:center; background:rgba(10,14,30,.5); padding:16px}
.stamp-modal{background:var(--panel); color:var(--ink); border-radius:18px; padding:26px 24px; display:grid; justify-items:center; gap:10px; max-width:360px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.3)}
.celebrate-stamp{display:grid; place-items:center}
.pip .pip-bolt{animation:crackle 1.7s steps(1) infinite}
.pip .pip-bolt:nth-of-type(2n){animation-delay:-.6s} .pip .pip-bolt:nth-of-type(3n){animation-delay:-1.1s}
@keyframes crackle{0%{opacity:1}25%{opacity:.15}45%{opacity:1}70%{opacity:.5}}
.pip .pip-halo{animation:halo 2.4s ease-in-out infinite; transform-origin:30px 33px}
@keyframes halo{50%{transform:scale(1.12); opacity:.32}}
.hero-top{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:16px; align-items:center}
.hero-text{display:grid; gap:10px; min-width:0}
.hero-art svg{display:block; width:260px; max-width:100%; height:auto}
@media (max-width:620px){ .hero-top{grid-template-columns:minmax(0,1fr)} .hero-art svg{width:220px} }
.opt.chosen{border-color:var(--accent); background:var(--accent-soft)}
.ask.predict{border:2px dashed var(--accent)}
.mission-wrap{display:grid; gap:14px}
.mission-list{display:grid; gap:10px; grid-template-columns:repeat(auto-fit, minmax(min(100%, 240px), 1fr))}
.mission.now{border-color:var(--accent)}
.mission .tick{color:var(--ok)}
.mission-play{display:grid; gap:12px}
.info-card{background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:12px 14px}
.chip-row{display:flex; flex-wrap:wrap; gap:6px}
.chip{font-size:.82rem; padding:3px 10px; border-radius:99px; background:var(--panel-2); border:1px solid var(--line); font-weight:600}
.chip.ok{background:var(--ok-bg); color:var(--ok); border-color:transparent}
.chip.no{background:var(--bad-bg); color:var(--bad); border-color:transparent}
.toolrow{display:flex; flex-wrap:wrap; gap:6px}
.mm-board{max-width:560px}
.ex-svg{flex:none; width:170px; height:170px; background:var(--board); border:1px solid var(--line); border-radius:10px}
.passport .count{font-family:var(--font-mono); font-weight:700; font-size:1.1rem}
.passport .bar{width:160px; max-width:40vw; height:8px; border-radius:99px; background:var(--panel-2); overflow:hidden; border:1px solid var(--line)}
.passport .bar i{display:block; height:100%; background:var(--spark)}

.timeline{position:relative; display:grid; gap:14px; padding-left:34px}
.timeline::before{content:""; position:absolute; left:11px; top:6px; bottom:6px; width:4px; border-radius:4px; background:linear-gradient(var(--copper), var(--spark))}
.stop-card{position:relative; display:grid; grid-template-columns:minmax(0,9.5rem) minmax(0,1fr) auto; gap:4px 18px; align-items:center; text-align:left; cursor:pointer;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:14px 18px; transition:transform .15s, border-color .15s}
.stop-card:hover{transform:translateX(4px); border-color:hsl(var(--hue) 60% var(--hue-l))}
.stop-card::before{content:""; position:absolute; left:-30px; top:50%; width:16px; height:16px; margin-top:-8px; border-radius:50%; background:var(--panel); border:4px solid hsl(var(--hue) 60% var(--hue-l))}
.stop-card .yr{font-family:var(--font-display); font-size:1.7rem; color:hsl(var(--hue) 60% var(--hue-l)); line-height:1}
.stop-card .yr small{display:block; font-family:var(--font-body); font-size:.76rem; color:var(--muted); margin-top:4px; line-height:1.2}
.stop-card h3{font-size:1.15rem}
.stop-card .meta{color:var(--muted); font-size:.9rem; min-width:0}
.stamps{display:flex; gap:6px}
.stamp{width:30px; height:30px; border-radius:50%; border:2px dashed var(--line); display:grid; place-items:center; font-size:.62rem; font-weight:700; color:var(--muted); font-family:var(--font-mono)}
.stamp.on{border:2px solid hsl(var(--hue) 60% var(--hue-l)); background:hsl(var(--hue) 70% var(--hue-bg)); color:hsl(var(--hue) 60% var(--hue-l)); transform:rotate(-8deg)}
.stop-card.test{--hue:262}
@media (max-width:620px){
  .stop-card{grid-template-columns:minmax(0,1fr) auto}
  .stop-card .yr{grid-column:1/-1; font-size:1.4rem}
  .stop-card .yr small{display:inline; margin-left:8px}
}
.home-foot{margin-top:36px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; color:var(--muted); font-size:.88rem}

/* ---------- buttons & controls ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--line); background:var(--panel); padding:9px 16px; border-radius:10px; cursor:pointer; font-weight:600; min-height:42px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.small{min-height:34px; padding:5px 12px; font-size:.9rem}
.btn.ghost{background:transparent}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.end{justify-content:flex-end}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--panel)}
.seg button{border:0; background:transparent; padding:7px 12px; cursor:pointer; font-size:.88rem; font-weight:600; min-height:36px}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.seg button+button{border-left:1px solid var(--line)}
.ctrl{display:grid; gap:4px; min-width:0}
.ctrl label{font-size:.88rem; font-weight:600; display:flex; justify-content:space-between; gap:10px}
.ctrl label output{font-family:var(--font-mono); color:var(--accent)}
input[type=range]{width:100%; accent-color:var(--accent)}
select{font:inherit; padding:7px 10px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--ink)}

/* ---------- stop page ---------- */
.back{margin-bottom:14px}
.stop-hero{display:grid; gap:14px; margin-bottom:18px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; background-image:linear-gradient(135deg, hsl(var(--hue) 70% var(--hue-bg)) 0%, var(--panel) 60%)}
.eyebrow{font-size:.75rem; letter-spacing:.14em; text-transform:uppercase; color:hsl(var(--hue) 60% var(--hue-l)); font-weight:700}
.stop-hero h2{font-size:clamp(1.7rem, 4.6vw, 2.6rem)}
.stop-hero .who{color:var(--muted)}
.tabs{display:flex; gap:6px; border-bottom:2px solid var(--line); margin:22px 0 18px; overflow-x:auto}
.tab{border:0; background:none; padding:10px 16px; font-weight:700; cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-2px; color:var(--muted); display:flex; gap:8px; align-items:center; white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:hsl(var(--hue) 60% var(--hue-l))}
.tab .tag{font-size:.7rem; font-weight:600; padding:2px 7px; border-radius:99px; background:var(--panel-2); border:1px solid var(--line)}
.tab .tag.done{background:var(--ok-bg); color:var(--ok); border-color:transparent}
.panel{display:grid; gap:16px}
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:18px; min-width:0}
.locked{display:grid; gap:12px; justify-items:start}

.learn-top{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
.steps-dots{display:flex; gap:6px}
.steps-dots span{width:12px; height:12px; border-radius:50%; background:var(--panel-2); border:2px solid var(--line)}
.steps-dots span.done{background:var(--ok); border-color:var(--ok)}
.steps-dots span.now{border-color:hsl(var(--hue) 60% var(--hue-l)); box-shadow:0 0 0 3px hsl(var(--hue) 70% var(--hue-bg))}
.step-title{font-size:1.35rem}
.stage{display:grid; gap:14px; min-width:0}
.feedback{border-radius:10px; padding:0; font-size:.98rem}
.feedback:empty{display:none}
.feedback.ok{background:var(--ok-bg); color:var(--ink); padding:12px 14px; border-left:5px solid var(--ok)}
.feedback.bad{background:var(--bad-bg); padding:12px 14px; border-left:5px solid var(--bad)}
.feedback.hint{background:var(--hint-bg); padding:12px 14px; border-left:5px solid var(--spark)}
.celebrate{display:grid; grid-template-columns:auto minmax(0,1fr); align-items:center; gap:18px; background:var(--ok-bg); border-radius:var(--r); padding:18px}
.celebrate h3{font-size:1.3rem}

/* ---------- quiz ---------- */
.quiz-head{display:flex; justify-content:space-between; color:var(--muted); font-size:.9rem; font-weight:600}
.quiz-card{display:grid; gap:14px; background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:18px; min-width:0}
.quiz-q{font-size:1.08rem; font-weight:600}
.quiz-opts{display:grid; gap:8px; grid-template-columns:repeat(auto-fit, minmax(min(100%, 230px), 1fr))}
.opt{text-align:left; border:2px solid var(--line); background:var(--panel-2); border-radius:10px; padding:10px 14px; cursor:pointer; min-height:46px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok); background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad); background:var(--bad-bg)}
.opt:disabled{cursor:default}
.ask{display:grid; gap:10px; background:var(--panel-2); border-radius:var(--r); padding:14px; border:1px solid var(--line)}
.score-big{font-family:var(--font-display); font-size:2.6rem; color:hsl(var(--hue) 60% var(--hue-l))}

/* ---------- circuit board ---------- */
.board{display:grid; gap:10px; min-width:0}
.toolbar{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.tool{display:flex; flex-direction:column; align-items:center; gap:2px; border:2px solid var(--line); background:var(--panel); border-radius:10px; padding:5px 8px 4px; cursor:pointer; font-size:.74rem; font-weight:700; min-width:62px}
.tool svg{width:34px; height:22px}
.tool[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.tool-tip{font-size:.88rem; color:var(--muted)}
.board-frame{background:var(--board); border:1px solid var(--line); border-radius:var(--r); overflow-x:auto}
.board-svg{display:block; width:100%; height:auto; max-height:520px; touch-action:manipulation}
.board-svg.editable{max-height:none}
.board.mini .board-svg{max-height:200px}
.board-opts{display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between}
.board-status:empty{display:none}
.board-status{font-size:.92rem; background:var(--bad-bg); border-left:5px solid var(--bad); padding:8px 12px; border-radius:8px}
.board-status.info{background:var(--hint-bg); border-left-color:var(--spark)}
.gdot{fill:var(--dot)}
.hint{stroke:var(--dot); stroke-width:2; stroke-dasharray:3 7; fill:none}
.hint.slot{stroke:var(--spark); stroke-width:4; stroke-dasharray:6 6; animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.wire{stroke:var(--ink); stroke-width:3; stroke-linecap:round; fill:none}
.wire.pic{stroke:var(--copper); stroke-width:5}
.flow{stroke:var(--flow); stroke-width:6; stroke-linecap:round; stroke-dasharray:.1 18; fill:none}
.hit{stroke:transparent; stroke-width:30; cursor:pointer; fill:none}
.hit:hover{stroke:var(--accent); stroke-opacity:.14}
.sym{stroke:var(--ink); stroke-width:2.5; fill:var(--board)}
.sym-line{stroke:var(--ink); stroke-width:2.5; fill:none; stroke-linecap:round}
.sym-thick{stroke:var(--ink); stroke-width:6; fill:none}
.bgfill{fill:var(--board)}
.lbl{fill:var(--ink); font-family:var(--font-body); font-size:13px; font-weight:700; text-anchor:middle; dominant-baseline:central}
.reading{fill:var(--accent); font-family:var(--font-mono); font-size:13px; font-weight:700; text-anchor:middle; dominant-baseline:central}
.reading-bg{fill:var(--panel); stroke:var(--line)}
.cell-body{fill:var(--cellbody)}
.cell-cap{fill:var(--copper)}
.cell-txt{fill:#fff; font-family:var(--font-body); font-size:11px; font-weight:800; text-anchor:middle; dominant-baseline:central}
.metal{fill:var(--metal)}
.glass{fill:var(--glass); stroke:var(--metal); stroke-width:2}
.filament{stroke:var(--metal); stroke-width:1.6; fill:none}
.filament.lit{stroke:var(--spark)}
.switch-base{fill:var(--wood)}
.lever{stroke:var(--copper); stroke-width:5; stroke-linecap:round}
.meter-box{fill:var(--cellbody)}
.meter-screen{fill:#0d2a1a}
.meter-read{fill:#7dffb0; font-family:var(--font-mono); font-size:10px; font-weight:700; text-anchor:middle; dominant-baseline:central}
.meter-letter{fill:#fff; font-family:var(--font-body); font-size:9px; font-weight:800; text-anchor:middle; dominant-baseline:central}
.part.broken{opacity:.45}
.legend{font-size:.82rem; color:var(--muted)}

/* ---------- generic sim visuals ---------- */
.sim-grid{display:grid; gap:16px; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); align-items:start}
@media (max-width:760px){ .sim-grid{grid-template-columns:minmax(0,1fr)} }
.sim-svg{width:100%; height:auto; display:block; background:var(--board); border:1px solid var(--line); border-radius:var(--r)}
.controls{display:grid; gap:14px; align-content:start}
.readout{display:grid; grid-template-columns:repeat(auto-fit, minmax(120px,1fr)); gap:8px}
.readout div{background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:8px 12px}
.readout b{display:block; font-family:var(--font-mono); font-size:1.25rem; font-variant-numeric:tabular-nums}
.readout span{font-size:.78rem; color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table.data{border-collapse:collapse; width:100%; font-size:.92rem; font-variant-numeric:tabular-nums}
table.data th, table.data td{border:1px solid var(--line); padding:6px 10px; text-align:center}
table.data th{background:var(--panel-2)}
.svg-ink{fill:var(--ink)} .svg-muted{fill:var(--muted)} .svg-line{stroke:var(--line)} .svg-stroke{stroke:var(--ink)}
.t-small{font-family:var(--font-body); font-size:12px} .t-mono{font-family:var(--font-mono)}
.cards-sort{display:grid; gap:10px; grid-template-columns:repeat(auto-fit, minmax(min(100%, 200px), 1fr))}
.sort-card{background:var(--panel-2); border:2px solid var(--line); border-radius:10px; padding:10px 12px; display:grid; gap:8px}
.sort-card.right{border-color:var(--ok); background:var(--ok-bg)}
.sort-card.wrong{border-color:var(--bad)}
.order-list{display:grid; gap:8px; grid-template-columns:repeat(auto-fit, minmax(min(100%, 180px), 1fr))}
.order-btn{border:2px solid var(--line); background:var(--panel-2); border-radius:10px; padding:10px; cursor:pointer; text-align:left; display:grid; gap:2px}
.order-btn .n{font-family:var(--font-mono); font-weight:700; color:var(--accent)}
.order-btn.picked{border-color:var(--ok); background:var(--ok-bg)}
.order-btn.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.mission{display:grid; gap:6px; padding:12px 14px; border:2px solid var(--line); border-radius:10px; background:var(--panel-2)}
.mission.done{border-color:var(--ok); background:var(--ok-bg)}
.mission h4{margin:0; font-size:1rem}
.src-row{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line)}
.src-row:last-child{border-bottom:0}
.src-row small{color:var(--muted); display:block; font-size:.8rem}
.stepper{display:flex; align-items:center; gap:6px}
.stepper button{width:34px; height:34px; border-radius:8px; border:1px solid var(--line); background:var(--panel); cursor:pointer; font-weight:800}
.stepper output{font-family:var(--font-mono); min-width:1.6em; text-align:center; font-weight:700}
.swatch{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:middle}
.parts-grid{display:grid; gap:10px; grid-template-columns:repeat(auto-fit, minmax(min(100%, 190px), 1fr))}
.part-card{background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:10px; display:grid; gap:6px}
.part-card .pair{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.part-card .pair .board-frame{border-radius:8px}
.part-card p{font-size:.88rem}
.spin{transform-origin:160px 160px; animation:spin 20s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }

/* free-form circuit builder */
.board-svg.editable{cursor:default}
.comp-hit{stroke:transparent; stroke-width:24; fill:transparent; cursor:grab; stroke-linecap:round}
.comp-hit.body{stroke:none}
.vert-hit{fill:transparent; cursor:grab}
.loose-end{fill:var(--board); stroke:var(--copper); stroke-width:3}
.junction{fill:var(--ink)}
.sel-halo{stroke:var(--accent); stroke-opacity:.28; stroke-width:30; stroke-linecap:round}
.sel-ring{fill:none; stroke:var(--accent); stroke-width:3}
.snap-ring{fill:none; stroke:var(--spark); stroke-width:4}
.parts-bin{display:flex; flex-wrap:wrap; gap:6px; align-items:center; background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:8px 10px}
.parts-bin .tool{touch-action:none; cursor:grab}
.bin-label{font-size:.85rem; font-weight:700; color:var(--muted); margin-right:4px}
.action-bar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; min-height:40px}
.btn.danger{color:var(--bad); border-color:var(--bad)}

/* time machine */
.tm-slot{display:inline-flex}
.time-machine{overflow:visible}
.tm-gear{transform-box:fill-box; transform-origin:center; animation:spin 9s linear infinite}
.tm-swirl{transform-box:fill-box; transform-origin:center; animation:spin 5s linear infinite reverse}
.tm-spark{transform-box:fill-box; transform-origin:center; animation:halo 1.4s ease-in-out infinite}
.tm-light{animation:crackle 1.3s steps(1) infinite}
.warp .tm-gear{animation-duration:.45s} .warp .tm-swirl{animation-duration:.35s}
.warp .tm-body{animation:shake .18s linear infinite}
.warp .tm-spark{animation-duration:.2s}
.hero-head{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap}
.hero-machine > svg{display:block; width:200px; max-width:40vw; height:auto}
@media (max-width:620px){ .tm-slot{display:none} }

</style>
</head>
<body>
<header class="topbar"><div class="topbar-in">
<button id="brand" class="brand" type="button" aria-label="Back to the time machine"><span><b>Sparks Through Time</b><small>A time-travelling electricity lab</small></span></button>
<div class="dial"><span id="tm-slot" class="tm-slot"></span><div class="dial-label">Destination<span id="dial-place">Your classroom</span></div><div class="dial-face" id="dial-face" aria-live="polite">TODAY</div></div>
</div></header>
<main class="wrap" id="app"></main>
<script>
'use strict';
/* ================= helpers ================= */
const SVGNS = 'http://www.w3.org/2000/svg';
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v==null || v===false) continue;
    if (k==='class') el.className = v;
    else if (k==='html') el.innerHTML = v;
    else if (k==='style' && typeof v==='object'){ for (const [sk,sv2] of Object.entries(v)){ if (sk.startsWith('--')) el.style.setProperty(sk, sv2); else el.style[sk] = sv2; } }
    else if (k.startsWith('on') && typeof v==='function') el.addEventListener(k.slice(2), v);
    else if (v===true) el.setAttribute(k,'');
    else el.setAttribute(k, v);
  }
  for (const k of kids.flat(Infinity)){ if (k==null || k===false) continue; el.append(k.nodeType ? k : document.createTextNode(String(k))); }
  return el;
}
function sv(tag, attrs, ...kids){
  const el = document.createElementNS(SVGNS, tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v==null || v===false) continue;
    if (k.startsWith('on') && typeof v==='function') el.addEventListener(k.slice(2), v); else el.setAttribute(k, v);
  }
  for (const k of kids.flat(Infinity)){ if (k==null || k===false) continue; el.append(k.nodeType ? k : document.createTextNode(String(k))); }
  return el;
}
const reduceMotion = (()=>{ try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){ return false; } })();
let _uid = 0; const uid = p => (p||'id') + '-' + (++_uid);
const clamp = (x,a,b)=>Math.max(a, Math.min(b, x));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
const fmt = (x,d=2)=> (Math.round(x*Math.pow(10,d))/Math.pow(10,d)).toFixed(d);
function scrollToEl(el){ try { window.scrollTo({top: Math.max(0, el.getBoundingClientRect().top + window.scrollY - 90), behavior: reduceMotion?'auto':'smooth'}); } catch(e){} }

/* ================= storage ================= */
const Store = {
  key:'sparks-through-time-v1', data:{},
  load(){ try { this.data = JSON.parse(localStorage.getItem(this.key)) || {}; } catch(e){ this.data = {}; } },
  save(){ try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch(e){} }
};
Store.load();
function prog(id){ Store.data.p = Store.data.p || {}; Store.data.p[id] = Store.data.p[id] || {learn:false, challenge:false}; return Store.data.p[id]; }
function prefs(){ Store.data.prefs = Store.data.prefs || {view:'picture', flow:'conv'}; if (Store.data.prefs.flow==='electron') Store.data.prefs.flow = 'conv'; return Store.data.prefs; }

/* ================= Pip the spark ================= */
function pipSVG(size){
  size = size || 54;
  const bolt = (ang, len) => sv('polyline',{points:`0,-17 -3,${-17-len*0.4} 2,${-17-len*0.55} -1,${-17-len}`, transform:`translate(30 33) rotate(${ang})`, fill:'none', stroke:'var(--spark)', 'stroke-width':2.6, 'stroke-linecap':'round', 'stroke-linejoin':'round', class:'pip-bolt'});
  const gid = uid('pipg');
  return sv('svg',{viewBox:'0 0 60 60', width:size, height:size, 'aria-hidden':'true', class:'pip'},
    sv('defs',{}, sv('radialGradient',{id:gid, cx:'40%', cy:'35%', r:'70%'}, sv('stop',{offset:'0%', 'stop-color':'#fffbe6'}), sv('stop',{offset:'45%', 'stop-color':'#ffd23f'}), sv('stop',{offset:'100%', 'stop-color':'#f09a1a'}))),
    sv('circle',{cx:30, cy:33, r:22, fill:'var(--spark)', opacity:.2, class:'pip-halo'}),
    bolt(-35,11), bolt(30,9), bolt(85,12), bolt(150,8), bolt(205,11), bolt(270,9),
    sv('path',{d:'M31 6 C33 13 38 15 42 20 C47 26 46 39 40 44 C34 49 25 49 20 44 C14 39 13 28 19 21 C21 25 23 26 25 26 C24 18 27 11 31 6 Z', fill:`url(#${gid})`, stroke:'#d9800f', 'stroke-width':1.6, 'stroke-linejoin':'round'}),
    sv('ellipse',{cx:25.5, cy:33, rx:2.5, ry:3.3, fill:'#1a2140'}), sv('ellipse',{cx:35, cy:33, rx:2.5, ry:3.3, fill:'#1a2140'}),
    sv('circle',{cx:26.3, cy:31.8, r:.9, fill:'#fff'}), sv('circle',{cx:35.8, cy:31.8, r:.9, fill:'#fff'}),
    sv('ellipse',{cx:21.5, cy:38.5, rx:2.4, ry:1.4, fill:'#ff8a5c', opacity:.55}), sv('ellipse',{cx:39, cy:38.5, rx:2.4, ry:1.4, fill:'#ff8a5c', opacity:.55}),
    sv('path',{d:'M26 39.5 Q30.3 43.5 34.5 39.5', stroke:'#1a2140', 'stroke-width':2, fill:'none', 'stroke-linecap':'round'})
  );
}
function pipSay(html, size){ return h('div',{class:'pip-row'}, pipSVG(size||54), h('div',{class:'bubble', html})); }

/* ================= stamps ================= */
function stampSVG(stop, kind, on, size){
  size = size || 64;
  const col = on ? `hsl(${stop.hue} 62% var(--hue-l))` : 'var(--line)';
  const s = sv('svg',{viewBox:'0 0 80 80', width:size, height:size, class:'stamp-img' + (on?' on':''), role:'img', 'aria-label':`${stop.title}: ${kind==='L'?'Learn':'Challenge'} stamp, ${on?'collected':'not collected yet'}`});
  const g = sv('g',{transform: on ? `rotate(${kind==='L'?-12:10} 40 40)` : ''});
  g.append(sv('circle',{cx:40, cy:40, r:36, fill: on ? `hsl(${stop.hue} 75% var(--hue-bg))` : 'none', stroke:col, 'stroke-width':3.2}), sv('circle',{cx:40, cy:40, r:29.5, fill:'none', stroke:col, 'stroke-width':1.4, 'stroke-dasharray': on ? '' : '3 3'}));
  if (on){
    const y = stop.yearLabel; const fs = y.length>5 ? 12 : y.length>4 ? 15 : 18;
    g.append(sv('text',{x:40, y:25, 'text-anchor':'middle', 'font-size':7, 'font-weight':800, 'letter-spacing':1.5, fill:col, 'font-family':'var(--font-body)'}, 'SPARKS'),
      sv('text',{x:40, y:45, 'text-anchor':'middle', 'font-size':fs, 'font-weight':800, fill:col, 'font-family':'var(--font-display)'}, y),
      sv('text',{x:40, y:60, 'text-anchor':'middle', 'font-size':kind==='L'?8:6.4, 'font-weight':800, 'letter-spacing':1.2, fill:col, 'font-family':'var(--font-body)'}, kind==='L' ? 'LEARN' : 'CHALLENGE'));
    g.append(sv('path',{d:'M14 40 l-5 -2 l2 4 z M66 40 l5 -2 l-2 4 z', fill:col}));
  } else {
    g.append(sv('text',{x:40, y:47, 'text-anchor':'middle', 'font-size':20, 'font-weight':700, fill:'var(--muted)', 'font-family':'var(--font-display)', opacity:.6}, kind));
  }
  s.append(g); return s;
}
function showStampModal(stop, kind, then){
  const close = ()=>{ ov.remove(); if (then) then(); };
  const btn = h('button',{class:'btn primary', type:'button', onclick:close}, 'Brilliant!');
  const big = stampSVG(stop, kind, true, 140); big.classList.add('stamp-in');
  const ov = h('div',{class:'stamp-overlay', role:'dialog', 'aria-modal':'true', 'aria-label':'Stamp collected', onclick:e=>{ if (e.target===ov) close(); }},
    h('div',{class:'stamp-modal'}, big, h('h3',{}, kind==='L' ? 'Learn stamp collected!' : 'Challenge stamp collected!'),
      h('p',{}, `That’s ${totalStamps()} of ${STOPS.length*2} stamps in your Time Passport.`), btn));
  document.body.append(ov); btn.focus();
}

/* ================= small UI pieces ================= */
function seg(options, value, onPick, label){
  const el = h('div',{class:'seg', role:'group', 'aria-label':label||''});
  options.forEach(([v,txt])=>{
    const b = h('button',{type:'button', 'aria-pressed': String(v===value), onclick:()=>{ [...el.children].forEach(x=>x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); onPick(v); }}, txt);
    el.append(b);
  });
  return el;
}
function slider({label, min, max, step, value, unit, onInput, id}){
  id = id || uid('rng');
  const out = h('output',{for:id}, value + (unit||''));
  const inp = h('input',{type:'range', id, min, max, step:step||1, value});
  inp.addEventListener('input', ()=>{ out.textContent = inp.value + (unit||''); onInput(+inp.value); });
  const el = h('div',{class:'ctrl'}, h('label',{for:id}, h('span',{}, label), out), inp);
  el.input = inp; el.out = out;
  el.set = v => { inp.value = v; out.textContent = v + (unit||''); };
  return el;
}
function stepper({label, sub, value, min, max, onChange}){
  const out = h('output',{}, value);
  const minus = h('button',{type:'button', 'aria-label':'One fewer '+label, onclick:()=>set(value-1)}, '−');
  const plus = h('button',{type:'button', 'aria-label':'One more '+label, onclick:()=>set(value+1)}, '+');
  function set(v){ v = clamp(v, min, max); if (v===value) return; value = v; out.textContent = v; onChange(v); }
  const el = h('div',{class:'src-row'}, h('div',{}, h('b',{}, label), sub ? h('small',{html:sub}) : null), h('div',{class:'stepper'}, minus, out, plus));
  el.set = v => { value = v; out.textContent = v; };
  return el;
}

/* ================= quiz engine ================= */
const PRAISE = ['Spot on!', 'Brilliant, that’s right!', 'Yes! Great thinking.', 'Exactly right!', 'You nailed it!', 'Superb!'];
const NUDGE  = ['Not quite, but here’s the key idea.', 'Close! Let’s look at why.', 'Good try. Here’s what really happens.'];

function prepQ(q){ const idx = q.options.map((_,k)=>k); return Object.assign({}, q, {order: q.keepOrder ? idx : shuffle(idx)}); }
function questionVisual(card, q){
  let board = null;
  if (q.diagram){ const d = h('div',{class:'quiz-diagram'}); card.append(d); board = Circuit.board(d, Object.assign({cols:4, rows:2, view:'symbols'}, q.diagram, {readonly:true, mini:true, hideResults:true})); }
  if (q.visual){ const d = h('div',{class:'quiz-visual'}); card.append(d); q.visual(d); }
  return board;
}

function runQuiz(el, questions, opts){
  opts = opts || {};
  el.innerHTML = '';
  const qs = questions.map(prepQ); let i = 0, score = 0; const results = [];
  function show(){
    el.innerHTML = '';
    if (i >= qs.length) return finish();
    const q = qs[i];
    const head = h('div',{class:'quiz-head'}, h('span',{}, `Question ${i+1} of ${qs.length}`), h('span',{}, `Score: ${score}`));
    const card = h('div',{class:'quiz-card'});
    card.append(h('p',{class:'quiz-q', html:q.q}));
    const board = questionVisual(card, q);
    const optsEl = h('div',{class:'quiz-opts'});
    const fb = h('div',{class:'feedback', role:'status'});
    const next = h('button',{class:'btn primary', type:'button', hidden:true, onclick:()=>{ i++; show(); scrollToEl(el); }}, i===qs.length-1 ? 'See my score' : 'Next question');
    let answered = false;
    q.order.forEach(k=>{
      const b = h('button',{class:'opt', type:'button', 'data-k':k, html:q.options[k], onclick:()=>{
        if (answered) return; answered = true;
        const right = k===q.answer; if (right) score++;
        results.push({q, right});
        [...optsEl.children].forEach(x=>{ x.disabled = true; if (+x.dataset.k===q.answer) x.classList.add('right'); });
        if (!right) b.classList.add('wrong');
        fb.className = 'feedback ' + (right ? 'ok' : 'bad');
        fb.innerHTML = `<strong>${right ? pick(PRAISE) : pick(NUDGE)}</strong> ${q.explain||''}`;
        if (board && q.diagram.reveal !== false) board.reveal();
        next.hidden = false; next.focus({preventScroll:true});
      }});
      optsEl.append(b);
    });
    card.append(optsEl, fb, h('div',{class:'row end'}, next));
    el.append(head, card);
  }
  function finish(){
    const pass = score/qs.length >= (opts.passMark==null ? 0.6 : opts.passMark);
    const msg = pass ? (opts.passMsg || 'Fantastic work! You really know your stuff.') : (opts.failMsg || 'Good effort! Have another go and see if you can beat your score.');
    el.append(h('div',{class:'quiz-card'},
      h('span',{class:'eyebrow'}, opts.title || 'Your score'),
      h('div',{class:'score-big'}, `${score} / ${qs.length}`),
      h('p',{}, msg),
      opts.extra ? opts.extra(results, score, qs.length) : null,
      h('div',{class:'row'}, h('button',{class:'btn', type:'button', onclick:()=>{ runQuiz(el, opts.reshuffle ? opts.reshuffle() : questions, opts); }}, 'Try again'))));
    if (opts.onFinish) opts.onFinish(score, qs.length, pass);
  }
  show();
}

/* inline questions inside a Learn step: must get each right (retries allowed) */
function askInline(el, questions, onDone){
  const box = h('div',{class:'ask'}); el.append(box);
  let i = 0;
  function show(){
    box.innerHTML = '';
    if (i >= questions.length){ if (onDone) onDone(); return; }
    const q = prepQ(questions[i]);
    box.append(h('span',{class:'eyebrow'}, q.tag || 'Think about it'), h('p',{class:'quiz-q', html:q.q}));
    questionVisual(box, q);
    const optsEl = h('div',{class:'quiz-opts'}); const fb = h('div',{class:'feedback', role:'status'});
    q.order.forEach(k=>{
      const b = h('button',{class:'opt', type:'button', html:q.options[k], onclick:()=>{
        if (k===q.answer){
          b.classList.add('right'); [...optsEl.children].forEach(x=>x.disabled=true);
          fb.className='feedback ok'; fb.innerHTML = `<strong>${pick(PRAISE)}</strong> ${q.explain||''}`;
          if (i < questions.length-1){ box.append(h('div',{class:'row end'}, h('button',{class:'btn primary small', type:'button', onclick:()=>{ i++; show(); }}, 'Next question'))); }
          else { if (onDone) onDone(q.explain); }
        } else {
          b.classList.add('wrong'); b.disabled = true;
          fb.className='feedback bad'; fb.innerHTML = q.hint || 'Not quite. Have another think and try again!';
        }
      }});
      optsEl.append(b);
    });
    box.append(optsEl, fb);
  }
  show();
  return box;
}

/* prediction: any answer is accepted, then the test unlocks */
function predict(el, q, onPick){
  const box = h('div',{class:'ask predict'});
  box.append(h('span',{class:'eyebrow'}, 'Predict first'), h('p',{class:'quiz-q', html:q.q}));
  const optsEl = h('div',{class:'quiz-opts'});
  const note = h('p',{class:'legend'}, 'There’s no wrong answer yet. Pick what you think will happen, then test it!');
  q.options.forEach((txt,k)=>{
    const b = h('button',{class:'opt', type:'button', html:txt, onclick:()=>{
      [...optsEl.children].forEach(x=>x.disabled=true); b.classList.add('chosen');
      note.innerHTML = '<b>Prediction locked in!</b> Now test it and see if you were right.';
      onPick(k, txt);
    }});
    optsEl.append(b);
  });
  box.append(optsEl, note); el.append(box);
  return box;
}
/* build an interaction only after a prediction has been made */
function predictThen(stage, q, build){
  const area = h('div',{class:'stage', hidden:true});
  predict(stage, q, (k, txt)=>{ area.hidden = false; build(area, {k, txt}); });
  stage.append(area);
}

/* ================= missions (hands-on challenges) ================= */
function missionBoard(el, stop, missions, award){
  const saved = Store.data.missions = Store.data.missions || {};
  const key = m => stop.id + ':' + m.id;
  const list = h('div',{class:'mission-list'});
  const play = h('div',{class:'card mission-play', hidden:true});
  const allDone = ()=>missions.every(x=>saved[key(x)]);
  function drawList(current){
    list.innerHTML = '';
    missions.forEach((m,i)=>{
      const done = !!saved[key(m)];
      list.append(h('div',{class:'mission'+(done?' done':'')+(current===m?' now':'')},
        h('h4',{}, `Mission ${i+1}: ${m.title}`, done ? h('span',{class:'tick'}, ' ✓ Complete') : null),
        h('p',{html:m.text}),
        h('div',{}, h('button',{class:'btn small'+(done?'':' primary'), type:'button', onclick:()=>start(m)}, done ? 'Play again' : (current===m ? 'Restart' : 'Start this mission')))));
    });
  }
  function start(m){
    play.hidden = false; play.innerHTML = '';
    const fb = h('div',{class:'feedback', role:'status', 'aria-live':'polite'});
    const area = h('div',{class:'stage'});
    play.append(h('h3',{}, m.title), h('p',{html:m.text}), area, fb);
    let finished = false;
    m.build(area, {
      done(msg){ if (finished) return; finished = true; saved[key(m)] = true; Store.save(); fb.className='feedback ok'; fb.innerHTML = msg || '<strong>Mission complete!</strong>'; drawList(m); if (allDone()) award(); },
      hint(msg){ if (finished) return; fb.className='feedback hint'; fb.innerHTML = msg; },
      clear(){ if (finished) return; fb.className='feedback'; fb.innerHTML=''; }
    });
    drawList(m); scrollToEl(play);
  }
  el.append(h('div',{class:'mission-wrap'}, list, play));
  drawList();
}
function practiceQuiz(el, stop){
  const box = h('div',{class:'card', style:{display:'grid', gap:'12px'}});
  const q = h('div',{style:{display:'grid', gap:'12px'}});
  box.append(h('h3',{}, 'Practice questions'), h('p',{class:'legend'}, 'These questions don’t affect your stamp, but they’re brilliant practice for your test.'), q);
  q.append(h('button',{class:'btn', type:'button', onclick:()=>runQuiz(q, shuffle(stop.bank), {title:'Practice score', reshuffle:()=>shuffle(stop.bank), passMsg:'Great work! You’re ready for the test on this topic.', failMsg:'Keep going! Read the explanations, then try again.'})}, `Start ${stop.bank.length} practice questions`));
  el.append(box);
}
function makeChallenge(intro, missionsFn){
  return function(el, award){
    const stop = this;
    el.append(pipSay(intro));
    missionBoard(el, stop, missionsFn(stop), award);
    practiceQuiz(el, stop);
  };
}

/* ================= time dial ================= */
let dialYear = 2026;
function yearText(y){ if (y>=2026) return 'TODAY'; if (y<0) return Math.abs(Math.round(y)) + ' BCE'; return String(Math.round(y)); }
function setDial(year, place){
  const face = document.getElementById('dial-face'); const pl = document.getElementById('dial-place');
  if (!face) return Promise.resolve();
  pl.textContent = place || 'Your classroom';
  const tm = document.getElementById('tm-slot'); if (tm && dialYear!==year){ tm.classList.add('warp'); setTimeout(()=>tm.classList.remove('warp'), reduceMotion ? 0 : 900); }
  const from = dialYear, to = year; dialYear = year;
  if (reduceMotion || from===to){ face.textContent = yearText(to); return Promise.resolve(); }
  return new Promise(res=>{
    const t0 = performance.now(), dur = 750;
    function step(t){ const k = clamp((t-t0)/dur, 0, 1); const e = k<.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2; face.textContent = yearText(from + (to-from)*e); if (k<1) requestAnimationFrame(step); else res(); }
    requestAnimationFrame(step);
  });
}

/* ================= registry & router ================= */
const STOPS = [];
function registerStop(def){ STOPS.push(def); }
const app = () => document.getElementById('app');

function stampsFor(id){ const p = prog(id); return (p.learn?1:0) + (p.challenge?1:0); }
function totalStamps(){ return STOPS.reduce((a,s)=>a+stampsFor(s.id),0); }
function setEra(id){ const pat = id && typeof ERA_PATTERNS!=='undefined' ? ERA_PATTERNS[id] : null; document.body.style.backgroundImage = pat ? `url("data:image/svg+xml,${encodeURIComponent(pat)}")` : ''; }

async function travel(stop){
  await setDial(stop.year, stop.place);
  renderStop(stop, 'learn');
}

function renderStop(stop, tab){
  const root = app(); root.innerHTML = ''; window.scrollTo(0,0);
  setDial(stop.year, stop.place); setEra(stop.id);
  const p = prog(stop.id);
  const wrapEl = h('div',{style:{'--hue':stop.hue}});
  const art = typeof eraArt==='function' ? eraArt(stop.id) : null;
  wrapEl.append(
    h('button',{class:'btn small back', type:'button', onclick:renderHome}, '← Back to the time machine'),
    h('section',{class:'stop-hero'},
      h('div',{class:'hero-top'},
        h('div',{class:'hero-text'},
          h('span',{class:'eyebrow'}, `Stop ${STOPS.indexOf(stop)+1} · ${stop.yearLabel} · ${stop.place}`),
          h('h2',{}, stop.title),
          h('p',{class:'who'}, stop.who + ' · ' + stop.topic)),
        art ? h('div',{class:'hero-art'}, art) : null),
      pipSay(stop.intro, 58)
    )
  );
  const tabs = h('div',{class:'tabs', role:'tablist'});
  const panel = h('div',{class:'panel', role:'tabpanel'});
  const defs = [['learn','Learn', p.learn ? 'Done' : `${stop.learn.length} steps`, p.learn], ['explore','Explore', p.learn ? 'Free play' : 'Locked', false], ['challenge','Challenge', p.challenge ? 'Done' : (p.learn ? 'Ready' : 'Locked'), p.challenge]];
  defs.forEach(([id, name, tag, done])=>{
    tabs.append(h('button',{class:'tab', role:'tab', type:'button', 'aria-selected':String(id===tab), onclick:()=>renderStop(stop, id)}, name, h('span',{class:'tag'+(done?' done':'')}, tag)));
  });
  wrapEl.append(tabs, panel);
  root.append(wrapEl);

  if (tab==='learn'){ runLearn(panel, stop); }
  else if (!p.learn){
    panel.append(h('div',{class:'card locked'},
      pipSay(`<p>This part of the lab unlocks once you’ve finished the Learn steps. They’ll give you everything you need for the ${tab==='explore'?'free play':'challenge missions'}!</p>`),
      h('button',{class:'btn primary', type:'button', onclick:()=>renderStop(stop,'learn')}, 'Go to the Learn steps')));
  }
  else if (tab==='explore'){ stop.explore(panel); }
  else {
    stop.challenge(panel, ()=>{ if (!p.challenge){ p.challenge = true; Store.save(); const t = tabs.children[2].querySelector('.tag'); t.textContent='Done'; t.classList.add('done'); showStampModal(stop, 'C'); } });
  }
}

function runLearn(el, stop){
  const steps = stop.learn; const p = prog(stop.id); let i = 0; const done = new Set();
  function show(){
    el.innerHTML = '';
    const idx = i, st = steps[idx];
    const dots = h('div',{class:'steps-dots', 'aria-hidden':'true'}, steps.map((_,k)=>h('span',{class:(done.has(k)?'done':'')+(k===idx?' now':'')})));
    const top = h('div',{class:'learn-top'}, h('span',{class:'eyebrow'}, `Learn · Step ${idx+1} of ${steps.length}`), dots);
    const stage = h('div',{class:'stage'});
    const fb = h('div',{class:'feedback', role:'status', 'aria-live':'polite'});
    const isLast = idx===steps.length-1;
    const back = h('button',{class:'btn', type:'button', disabled: idx===0, onclick:()=>{ i--; show(); }}, 'Back');
    const next = h('button',{class:'btn primary', type:'button', disabled: !(done.has(idx) || p.learn), onclick:()=>{ if (isLast) finish(); else { i++; show(); scrollToEl(el); } }}, isLast ? 'Finish and collect my stamp' : 'Next step →');
    const api = {
      complete(msg){ if (i!==idx) return; done.add(idx); next.disabled = false; dots.children[idx].classList.add('done'); if (msg){ fb.className='feedback ok'; fb.innerHTML = msg; } },
      hint(msg){ if (i!==idx) return; fb.className='feedback hint'; fb.innerHTML = msg; },
      clear(){ if (i!==idx) return; fb.className='feedback'; fb.innerHTML=''; },
      isDone(){ return done.has(idx); }
    };
    el.append(h('div',{class:'card', style:{display:'grid', gap:'14px'}}, top, h('h3',{class:'step-title'}, st.title), pipSay(st.say), stage, fb, h('div',{class:'row between'}, back, next)));
    st.build(stage, api);
    if (st.auto) api.complete();
  }
  function finish(){
    const first = !p.learn; p.learn = true; Store.save();
    el.innerHTML = '';
    const big = stampSVG(stop, 'L', true, 150); big.classList.add('stamp-in');
    el.append(h('div',{class:'celebrate'},
      h('div',{class:'celebrate-stamp'}, big),
      h('div',{style:{display:'grid', gap:'10px', justifyItems:'start'}},
        h('h3',{}, first ? 'Learn stamp collected!' : 'All steps reviewed!'),
        h('p',{}, `Amazing work. That’s ${totalStamps()} of ${STOPS.length*2} stamps in your Time Passport. You’ve unlocked the Explore lab and the Challenge missions for ${stop.yearLabel}.`),
        h('div',{class:'row'}, h('button',{class:'btn primary', type:'button', onclick:()=>renderStop(stop,'challenge')}, 'Take on the Challenge'), h('button',{class:'btn', type:'button', onclick:()=>renderStop(stop,'explore')}, 'Open the Explore lab')))));
    const tags = document.querySelectorAll('.tabs .tab .tag');
    if (tags[0]){ tags[0].textContent='Done'; tags[0].classList.add('done'); }
    if (tags[1]) tags[1].textContent='Free play';
    if (tags[2] && !p.challenge) tags[2].textContent='Ready';
  }
  show();
}

/* ================= Time Test ================= */
function renderTest(){
  setDial(2026, 'The Time Test'); setEra(null);
  const root = app(); root.innerHTML = ''; window.scrollTo(0,0);
  const wrapEl = h('div',{style:{'--hue':262}});
  const build = () => STOPS.flatMap(s => shuffle(s.bank).slice(0,2).map(q => Object.assign({}, q, {_stop:s})));
  wrapEl.append(
    h('button',{class:'btn small back', type:'button', onclick:renderHome}, '← Back to the time machine'),
    h('section',{class:'stop-hero'}, h('span',{class:'eyebrow'}, 'Final stop · Every era'), h('h2',{}, 'The Time Test'),
      pipSay(`<p>Welcome to the Time Test! You’ll get two questions from every stop on our journey, ${STOPS.length*2} in total. It’s brilliant practice for your test. At the end I’ll show you which stops are worth another visit.</p>`)));
  const q = h('div',{style:{display:'grid', gap:'12px'}});
  wrapEl.append(q); root.append(wrapEl);
  runQuiz(q, build(), {title:'Time Test score', reshuffle:build, passMsg:'Outstanding! You’re a true electricity time traveller.', failMsg:'Nice work getting through it! Revisit the stops below, then try again.',
    onFinish:(s,n)=>{ const pct = Math.round(100*s/n); if (Store.data.testBest==null || pct>Store.data.testBest){ Store.data.testBest = pct; Store.save(); } },
    extra:(results)=>{
      const missed = {}; results.forEach(r=>{ if (!r.right) missed[r.q._stop.id] = r.q._stop; });
      const list = Object.values(missed);
      if (!list.length) return h('p',{}, 'You didn’t miss a single question. Incredible!');
      return h('div',{style:{display:'grid', gap:'8px'}}, h('b',{}, 'Stops worth another visit:'), h('div',{class:'row'}, list.map(s=>h('button',{class:'btn small', type:'button', onclick:()=>travel(s)}, `${s.yearLabel}: ${s.title}`))));
    }});
}

/* ================= boot ================= */
function boot(){
  STOPS.sort((a,b)=>a.order-b.order);
  document.getElementById('brand').addEventListener('click', renderHome);
  renderHome();
}

/* ================= Circuit engine: free-form drag-and-drop builder + nodal analysis ================= */
const Circuit = (()=>{
  const SP = 90, M = 34, LEN = 90;
  const RW = 0.001, RB = 4, RC = 0.2, RV = 1e7, E = 1.5, GMIN = 1e-9;
  const PREF = Math.pow(E/(RB+RC),2)*RB;
  const SNAP = 20;

  const MATERIALS = {
    copper:{name:'Copper wire', R:0.01, col:'#c4793a', kind:'conductor'}, aluminium:{name:'Aluminium foil', R:0.02, col:'#c9ced6', kind:'conductor'},
    iron:{name:'Iron nail', R:0.1, col:'#7d8494', kind:'conductor'}, graphite:{name:'Pencil lead (graphite)', R:15, col:'#3b3f4c', kind:'conductor'},
    saltwater:{name:'Salty water', R:40, col:'#7fb8d8', kind:'conductor'}, silicon:{name:'Silicon (semiconductor)', R:3000, Rlit:8, col:'#6f7fa0', kind:'semi'},
    plastic:{name:'Plastic', R:1e9, col:'#e9a23b', kind:'insulator'}, wood:{name:'Wood', R:1e9, col:'#b98a52', kind:'insulator'},
    glass:{name:'Glass', R:1e9, col:'#cfe7f2', kind:'insulator'}, rubber:{name:'Rubber', R:1e9, col:'#2c2f3a', kind:'insulator'}, paper:{name:'Paper', R:1e9, col:'#f2efe6', kind:'insulator'}
  };
  const OHMS = [2,5,10,20,50];
  const VF = 1.0, RLED = 15;
  function matR(e){ const m = MATERIALS[e.mat||'copper']; return (m.Rlit && e.lit) ? m.Rlit : m.R; }
  function cond(e){
    switch(e.type){
      case 'wire': case 'ammeter': return 1/RW;
      case 'switch': return e.closed ? 1/RW : 0;
      case 'bulb': return e.broken ? 0 : 1/RB;
      case 'cell': return 1/RC;
      case 'voltmeter': return 1/RV;
      case 'resistor': return 1/(e.ohms||10);
      case 'sample': return 1/matR(e);
      case 'led': return 1e-9;
    } return 0;
  }
  function gauss(A, b){
    const n = b.length; const Mx = A.map((row,i)=>{ const r = Array.from(row); r.push(b[i]); return r; });
    for (let c=0;c<n;c++){
      let p=c; for (let r=c+1;r<n;r++) if (Math.abs(Mx[r][c])>Math.abs(Mx[p][c])) p=r;
      if (p!==c){ const t=Mx[c]; Mx[c]=Mx[p]; Mx[p]=t; }
      const piv = Mx[c][c]; if (Math.abs(piv)<1e-18) continue;
      for (let r=c+1;r<n;r++){ const f = Mx[r][c]/piv; if (!f) continue; for (let k=c;k<=n;k++) Mx[r][k] -= f*Mx[c][k]; }
    }
    const x = new Array(n).fill(0);
    for (let r=n-1;r>=0;r--){ let s = Mx[r][n]; for (let k=r+1;k<n;k++) s -= Mx[r][k]*x[k]; x[r] = Math.abs(Mx[r][r])<1e-18 ? 0 : s/Mx[r][r]; }
    return x;
  }
  /* comps: {id: {type, a, b, closed, broken}}; a = negative terminal of a cell, b = positive */
  function solve(comps){
    const idx = new Map(); let n = 0;
    for (const k in comps){ const c = comps[k]; [c.a, c.b].forEach(v=>{ if (!idx.has(v)) idx.set(v, n++); }); }
    const out = {}; let short = false;
    if (!n) return {out, short};
    const ledOn = {}; let V = null;
    for (let iter=0; iter<8; iter++){
      const G = Array.from({length:n}, ()=>new Float64Array(n)); const I = new Float64Array(n);
      for (let i=0;i<n;i++) G[i][i] = GMIN;
      for (const k in comps){
        const c = comps[k]; const a = idx.get(c.a), b = idx.get(c.b); if (a===b) continue;
        let g = cond(c);
        if (c.type==='led' && ledOn[k]){ g = 1/RLED; I[a] += VF*g; I[b] -= VF*g; }
        if (!g) continue;
        G[a][a]+=g; G[b][b]+=g; G[a][b]-=g; G[b][a]-=g;
        if (c.type==='cell'){ I[b] += E*g; I[a] -= E*g; }
      }
      V = gauss(G, I);
      let changed = false;
      for (const k in comps){ const c = comps[k]; if (c.type!=='led') continue; const a = idx.get(c.a), b = idx.get(c.b); if (a===b) continue;
        const vab = V[a]-V[b]; const on = ledOn[k] ? (vab - VF) > -1e-9 : vab > VF; if (!!on !== !!ledOn[k]){ ledOn[k] = on; changed = true; } }
      if (!changed) break;
    }
    for (const k in comps){
      const c = comps[k]; const a = idx.get(c.a), b = idx.get(c.b);
      let Iab = 0;
      if (a!==b){ if (c.type==='led') Iab = ledOn[k] ? (V[a]-V[b]-VF)/RLED : 0; else { Iab = cond(c)*(V[a]-V[b]); if (c.type==='cell') Iab += E*cond(c); } }
      const o = {I:Iab, dV: a===b ? 0 : V[a]-V[b]};
      if (c.type==='bulb') o.b = c.broken ? 0 : (Iab*Iab*RB)/PREF;
      if (c.type==='led') o.b = Iab > 0.002 ? Math.min(3, Iab/0.04) : 0;
      if (c.type==='cell' && Math.abs(Iab) > 3.5) short = true;
      out[k] = o;
    }
    return {out, short};
  }
  function test(comps, _c, _r, mod){
    const e = JSON.parse(JSON.stringify(comps)); if (mod) mod(e);
    const r = solve(e); let lit = 0, n = 0;
    for (const k in e) if (e[k].type==='bulb'){ n++; if (r.out[k].b > 0.04) lit++; }
    return {lit, n, short:r.short, res:r, edges:e};
  }

  /* ---------- animation loop shared by all boards ---------- */
  const live = new Set(); let raf = 0, last = 0;
  function tick(t){
    const dt = last ? Math.min(0.05, (t-last)/1000) : 0; last = t;
    for (const bd of live){
      if (!bd.svg.isConnected){ live.delete(bd); continue; }
      for (const f of bd.flows){ f.off -= f.v*dt; if (Math.abs(f.off) > 1e6) f.off = 0; f.el.setAttribute('stroke-dashoffset', f.off.toFixed(1)); }
    }
    if (live.size) raf = requestAnimationFrame(tick); else { raf = 0; last = 0; }
  }
  function loop(bd){ live.add(bd); if (!raf){ last = 0; raf = requestAnimationFrame(tick); } }

  const rot = (x,y,a)=>{ const r = a*Math.PI/180, c = Math.cos(r), s = Math.sin(r); return [x*c - y*s, x*s + y*c]; };
  const GAP = { sym:{cell:4, bulb:12, switch:12, ammeter:13, voltmeter:13, resistor:16, led:12, sample:20}, pic:{cell:22, bulb:7, switch:14, ammeter:16, voltmeter:16, resistor:18, led:9, sample:24} };
  const NAMES = {wire:'Wire', cell:'Cell', bulb:'Bulb', switch:'Switch', ammeter:'Ammeter', voltmeter:'Voltmeter', resistor:'Resistor', led:'LED', sample:'Material tester'};
  const PARTS = ['wire','cell','bulb','switch','ammeter','voltmeter','resistor','led','sample'];

  function toolIcon(t){
    const s = sv('svg',{viewBox:'0 0 34 22', 'aria-hidden':'true'});
    const L = (x1,y1,x2,y2,w)=>sv('line',{x1,y1,x2,y2, stroke:'currentColor', 'stroke-width':w||2, 'stroke-linecap':'round'});
    if (t==='wire') s.append(L(3,15,31,7,3), sv('circle',{cx:3,cy:15,r:2.5,fill:'currentColor'}), sv('circle',{cx:31,cy:7,r:2.5,fill:'currentColor'}));
    if (t==='cell') s.append(L(3,11,14,11), L(14,3,14,19,2), L(20,7,20,15,4), L(20,11,31,11));
    if (t==='bulb') s.append(L(3,11,9,11), sv('circle',{cx:17,cy:11,r:8,fill:'none',stroke:'currentColor','stroke-width':2}), L(11.5,5.5,22.5,16.5), L(22.5,5.5,11.5,16.5), L(25,11,31,11));
    if (t==='switch') s.append(L(3,15,9,15), sv('circle',{cx:10,cy:15,r:2,fill:'currentColor'}), L(10,15,23,6), sv('circle',{cx:24,cy:15,r:2,fill:'currentColor'}), L(24,15,31,15));
    if (t==='resistor') s.append(L(3,11,9,11), sv('rect',{x:9,y:6,width:16,height:10,fill:'none',stroke:'currentColor','stroke-width':2}), L(25,11,31,11));
    if (t==='led') s.append(L(3,11,10,11), sv('path',{d:'M10 5 L20 11 L10 17 Z', fill:'currentColor'}), L(20,5,20,17), L(20,11,31,11), L(22,4,27,0,1.5), L(25,6,30,2,1.5));
    if (t==='sample') s.append(L(3,11,8,11), sv('path',{d:'M8 7 l4 4 l-4 4 M26 7 l-4 4 l4 4', fill:'none', stroke:'currentColor','stroke-width':2}), sv('rect',{x:12,y:8,width:10,height:6,fill:'currentColor',opacity:.5}), L(26,11,31,11));
    if (t==='ammeter' || t==='voltmeter') s.append(L(3,11,9,11), sv('circle',{cx:17,cy:11,r:8,fill:'none',stroke:'currentColor','stroke-width':2}), sv('text',{x:17,y:15,'text-anchor':'middle','font-size':11,'font-weight':800,fill:'currentColor','font-family':'system-ui, sans-serif'}, t==='ammeter'?'A':'V'), L(25,11,31,11));
    return s;
  }

  function board(el, o){
    o = o || {};
    const C = o.cols ?? 6, R = o.rows ?? 4;
    const baseW = C*SP + 2*M, baseH = R*SP + 2*M;
    const hasPreset = o.edges && Object.keys(o.edges).length;
    const editable = !o.readonly;
    const W = editable ? Math.max(baseW, 760) : baseW;
    const H = editable ? Math.max(baseH + (hasPreset ? 120 : 0), 440) : baseH;
    const offX = editable ? Math.round((W - C*SP)/2) : M, offY = editable ? M + 16 : M;
    const st = { view: o.view || prefs().view, flow: (o.flow || prefs().flow)==='off' ? 'off' : 'conv', hide: !!o.hideResults, sel:null };
    let verts = {}, comps = {}, nid = 0;
    const newV = (x,y)=>{ const id = 'v' + (++nid); verts[id] = {x, y}; return id; };
    const newC = c=>{ const id = 'c' + (++nid); comps[id] = c; return id; };
    function load(grid){
      verts = {}; comps = {};
      const node = (r,c)=>{ const id = `g${r}_${c}`; if (!verts[id]) verts[id] = {x: offX + c*SP, y: offY + r*SP}; return id; };
      for (const k of Object.keys(grid||{})){
        const e = grid[k]; const p = k.split(','); const r = +p[1], c = +p[2];
        let a = node(r,c), b = p[0]==='h' ? node(r,c+1) : node(r+1,c);
        if ((e.type==='cell' || e.type==='led') && e.flip){ const t = a; a = b; b = t; }
        const comp = Object.assign({}, e, {a, b}); delete comp.flip;
        comps['k' + k.replace(/,/g,'_')] = comp;
      }
    }
    load(o.edges);
    const slotSegs = (o.slots||[]).map(k=>{ const p = k.split(','); const r = +p[1], c = +p[2]; return [offX + c*SP, offY + r*SP, offX + (p[0]==='h'?c+1:c)*SP, offY + (p[0]==='h'?r:r+1)*SP]; });

    const bd = { flows:[], svg:null };
    const glowId = uid('glow');
    const wrap = h('div',{class:'board' + (o.mini ? ' mini' : '')});
    const statusEl = h('div',{class:'board-status', role:'status'});
    const actionBar = h('div',{class:'action-bar', role:'toolbar', 'aria-label':'Selected part'});
    const parts = editable ? (o.tools||PARTS).filter(t=>PARTS.includes(t)) : [];

    const svg = sv('svg',{viewBox:`0 0 ${W} ${H}`, class:'board-svg' + (editable ? ' editable' : ''), role:'img', 'aria-label': o.label || 'Circuit board'});
    bd.svg = svg;
    svg.append(sv('defs',{}, sv('radialGradient',{id:glowId}, sv('stop',{offset:'0%', 'stop-color':'var(--spark)', 'stop-opacity':.95}), sv('stop',{offset:'55%', 'stop-color':'var(--spark)', 'stop-opacity':.45}), sv('stop',{offset:'100%', 'stop-color':'var(--spark)', 'stop-opacity':0}))));
    const gBg = sv('g'), gHint = sv('g'), gSel = sv('g'), gWire = sv('g'), gFlow = sv('g'), gBody = sv('g'), gVert = sv('g');
    svg.append(gBg, gHint, gSel, gWire, gFlow, gBody, gVert);
    if (editable){ gBg.append(sv('rect',{x:0, y:0, width:W, height:H, fill:'transparent', 'data-bg':1})); for (let x=20;x<W;x+=30) for (let y=20;y<H;y+=30) gBg.append(sv('circle',{cx:x, cy:y, r:1.4, class:'gdot'})); }

    if (parts.length){
      const bin = h('div',{class:'parts-bin', role:'toolbar', 'aria-label':'Parts bin'}, h('span',{class:'bin-label'}, 'Drag a part onto the board:'));
      parts.forEach(t=>{ const b = h('button',{class:'tool', type:'button', 'aria-label':`Add a ${NAMES[t].toLowerCase()}`}, toolIcon(t), NAMES[t]); b.addEventListener('pointerdown', ev=>spawnStart(ev, t)); b.addEventListener('keydown', ev=>{ if (ev.key==='Enter' || ev.key===' '){ ev.preventDefault(); spawnAt(t, null); } }); bin.append(b); });
      wrap.append(bin, h('p',{class:'tool-tip'}, 'Drag the round ends of a wire onto other parts to connect them. Tap a part to select it, and tap a switch to open or close it.'));
    }
    const frame = h('div',{class:'board-frame'}, svg);
    wrap.append(frame);
    if (editable) wrap.append(actionBar);
    if (editable && !o.noOptions){
      const opts = h('div',{class:'board-opts'},
        seg([['picture','Picture'],['symbols','Symbols']], st.view, v=>{ st.view=v; prefs().view=v; Store.save(); render(); }, 'Drawing style'),
        seg([['conv','Show flow'],['off','Hide flow']], st.flow, v=>{ st.flow=v; prefs().flow=v; Store.save(); render(); }, 'Flow of current'));
      if (o.clearable){
        const clr = h('button',{class:'btn small', type:'button'}, 'Clear the board'); let armed=false, tm;
        clr.addEventListener('click', ()=>{ if(!armed){ armed=true; clr.textContent='Tap again to clear'; tm=setTimeout(()=>{armed=false; clr.textContent='Clear the board';},3000); return; } clearTimeout(tm); armed=false; clr.textContent='Clear the board'; verts = {}; comps = {}; st.sel = null; render(true); });
        opts.append(clr);

    }
    wrap.append(statusEl);
    el.append(wrap);

    function msg(t, info){ statusEl.className = 'board-status' + (info?' info':''); statusEl.textContent = t; }

    /* ---------- geometry helpers ---------- */
    const refs = v => Object.keys(comps).filter(k=>comps[k].a===v || comps[k].b===v);
    const pinned = v => refs(v).some(k=>comps[k].locked);
    function cleanVerts(){ const used = new Set(); for (const k in comps){ used.add(comps[k].a); used.add(comps[k].b); } for (const v in verts) if (!used.has(v)) delete verts[v]; }
    function toPt(ev){ const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; const r = pt.matrixTransform(svg.getScreenCTM().inverse()); return {x:r.x, y:r.y}; }
    function closure(vset, cset){
      const vs = new Set(vset), cs = new Set(cset||[]); let changed = true;
      while (changed){ changed = false; for (const k in comps){ const c = comps[k]; if (c.type==='wire' || c.locked || cs.has(k)) continue; if (vs.has(c.a) || vs.has(c.b)){ cs.add(k); vs.add(c.a); vs.add(c.b); changed = true; } } }
      return {vs, cs};
    }
    function detachPinned(cs){ // moving comps let go of any vertex held by a locked part
      for (const k of cs){ const c = comps[k]; ['a','b'].forEach(end=>{ if (pinned(c[end])){ const p = verts[c[end]]; c[end] = newV(p.x, p.y); } }); }
    }

    /* ---------- dragging ---------- */
    let drag = null; // {mode, ...}
    function beginComp(k, pt){
      const c = comps[k]; if (c.locked) return false;
      const {cs} = closure([c.a, c.b], [k]); cs.add(k);
      detachPinned(cs);
      const vs = new Set(); cs.forEach(id=>{ vs.add(comps[id].a); vs.add(comps[id].b); });
      drag = {mode:'move', vs, cs, last:pt}; return true;
    }
    function beginVert(v, pt){
      let atts = refs(v); const unl = atts.filter(k=>!comps[k].locked);
      if (!unl.length) return false;
      if (pinned(v)){ const k = unl[unl.length-1]; const c = comps[k]; const nv = newV(verts[v].x, verts[v].y); if (c.a===v) c.a = nv; else c.b = nv; v = nv; atts = [k]; }
      const fixed = atts.filter(k=>comps[k].type!=='wire');
      if (fixed.length===0){ drag = {mode:'move', vs:new Set([v]), cs:new Set(atts), last:pt}; return true; }
      if (fixed.length===1){ const c = comps[fixed[0]]; const pivot = c.a===v ? c.b : c.a; drag = {mode:'pivot', v, pivot, k:fixed[0], vs:new Set([v]), cs:new Set(atts)}; return true; }
      const {vs, cs} = closure([v], fixed); detachPinned(cs); const vs2 = new Set(); cs.forEach(id=>{ vs2.add(comps[id].a); vs2.add(comps[id].b); }); vs2.add(v);
      drag = {mode:'move', vs:vs2, cs, last:pt}; return true;
    }
    function dragTo(pt){
      if (drag.mode==='move'){
        let dx = pt.x - drag.last.x, dy = pt.y - drag.last.y;
        drag.vs.forEach(v=>{ const p = verts[v]; dx = clamp(dx, 8 - p.x, W - 8 - p.x); dy = clamp(dy, 8 - p.y, H - 8 - p.y); });
        drag.vs.forEach(v=>{ verts[v].x += dx; verts[v].y += dy; });
        drag.last = {x: drag.last.x + dx, y: drag.last.y + dy};
      } else {
        const pv = verts[drag.pivot]; let ux = pt.x - pv.x, uy = pt.y - pv.y; const d = Math.hypot(ux, uy) || 1;
        verts[drag.v].x = clamp(pv.x + ux/d*LEN, 8, W-8); verts[drag.v].y = clamp(pv.y + uy/d*LEN, 8, H-8);
      }
      drag.snap = findSnap(); render();
    }
    function findSnap(){
      let best = null;
      drag.vs.forEach(v=>{ const p = verts[v]; const mine = refs(v);
        for (const t in verts){ if (drag.vs.has(t)) continue; if (mine.some(k=>comps[k].a===t || comps[k].b===t)) continue;
          const q = verts[t]; const d = Math.hypot(p.x-q.x, p.y-q.y); if (d < SNAP && (!best || d < best.d)) best = {v, t, d}; } });
      return best;
    }
    function merge(v, t){ for (const k in comps){ if (comps[k].a===v) comps[k].a = t; if (comps[k].b===v) comps[k].b = t; } delete verts[v]; }
    function endDrag(){
      const s = drag.snap;
      if (s){
        const dx = verts[s.t].x - verts[s.v].x, dy = verts[s.t].y - verts[s.v].y;
        if (drag.mode==='move') drag.vs.forEach(v=>{ verts[v].x += dx; verts[v].y += dy; });
        merge(s.v, s.t); drag.vs.delete(s.v);
        drag.vs.forEach(v=>{ for (const t in verts){ if (t===v || drag.vs.has(t) || !verts[v]) continue; if (Math.hypot(verts[v].x-verts[t].x, verts[v].y-verts[t].y) < 6 && !refs(v).some(k=>comps[k].a===t||comps[k].b===t)){ merge(v, t); break; } } });
      }
      drag = null; cleanVerts(); render(true);
    }

    /* pointer handling on the board */
    let press = null;
    if (editable){
      svg.style.touchAction = 'none';
      svg.addEventListener('pointerdown', ev=>{
        const tg = ev.target.closest('[data-comp],[data-vert]'); const pt = toPt(ev);
        press = {pt, id:ev.pointerId, comp: tg && tg.dataset.comp, vert: tg && tg.dataset.vert, started:false};

        if (!tg){ st.sel = null; render(); }
        ev.preventDefault();
      });
      svg.addEventListener('pointermove', ev=>{
        if (!press) return; const pt = toPt(ev);

          if (Math.hypot(pt.x-press.pt.x, pt.y-press.pt.y) < 5) return;
          press.started = true; msg('');
          const ok = press.vert ? beginVert(press.vert, press.pt) : press.comp ? beginComp(press.comp, press.pt) : false;

    /* spawning new parts from the bin */
    function makePart(t, x, y){

    }
    function freeSpot(){ let i = 0; const used = (x,y)=>Object.values(verts).some(p=>Math.abs(p.x-x)<70 && Math.abs(p.y-y)<30);
      while (i<40){ const x = 90 + (i%6)*120, y = H - 40 - Math.floor(i/6)*50; if (!used(x,y)) return {x, y}; i++; } return {x:W/2, y:H/2}; }

    function spawnStart(ev, t){
      ev.preventDefault();
      const startX = ev.clientX, startY = ev.clientY; let k = null, moved = false;
      const move = e=>{ if (Math.hypot(e.clientX-startX, e.clientY-startY) >= 6) moved = true;
        if (!k){ if (Math.hypot(e.clientX-startX, e.clientY-startY) < 6) return; const p = toPt(e); if (p.x<0 || p.y<0 || p.x>W || p.y>H) return; k = makePart(t, p.x, p.y); const c = comps[k]; beginComp(k, {x:(verts[c.a].x+verts[c.b].x)/2, y:verts[c.a].y}); }
        const p = toPt(e); dragTo({x:clamp(p.x,0,W), y:clamp(p.y,0,H)});
      };
      const fin = ()=>{ window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', fin); window.removeEventListener('pointercancel', fin);
        if (!k){ if (!moved) spawnAt(t); return; } endDrag(); st.sel = {kind:'comp', id:k}; render(); };
      window.addEventListener('pointermove', move); window.addEventListener('pointerup', fin); window.addEventListener('pointercancel', fin);
    }

    /* ---------- action bar for the selected part ---------- */
    function drawActions(){
      actionBar.innerHTML = '';
      const sel = st.sel; if (!sel) { actionBar.append(h('span',{class:'legend'}, 'Tap a part to select it.')); return; }
      const B = (label, fn, cls)=>h('button',{class:'btn small' + (cls?' '+cls:''), type:'button', onclick:fn}, label);

        if (c.type==='bulb' && !o.noUnscrew) actionBar.append(B(c.broken ? 'Screw the bulb in' : 'Unscrew the bulb', ()=>{ c.broken = !c.broken; render(true); }));
        if ((c.type==='cell' || c.type==='led') && !c.fixedDir && (!c.locked || c.type==='led')) actionBar.append(B('Turn it around', ()=>{ const t = c.a; c.a = c.b; c.b = t; render(true); }));
        if (c.type==='resistor' && !c.fixedOhms) actionBar.append(B(`Resistance: ${c.ohms||10} \u03a9 (change)`, ()=>{ const i = OHMS.indexOf(c.ohms||10); c.ohms = OHMS[(i+1)%OHMS.length]; render(true); }));
        if (c.type==='sample'){ const selM = h('select',{'aria-label':'Material', onchange:()=>{ c.mat = selM.value; c.lit = false; render(true); }}, Object.entries(MATERIALS).map(([k,m])=>h('option',{value:k, selected:(c.mat||'copper')===k}, m.name))); actionBar.append(selM);

        if (!c.locked) actionBar.append(B('Remove', ()=>{ delete comps[sel.id]; st.sel = null; cleanVerts(); render(true); }, 'danger'));
      } else {

        if (n>1 && refs(v).some(k=>!comps[k].locked)) actionBar.append(B('Disconnect', ()=>{
          const p = verts[v];
          refs(v).forEach((k,i)=>{ const c = comps[k]; if (c.locked) return; const other = verts[c.a===v ? c.b : c.a]; const d = Math.hypot(other.x-p.x, other.y-p.y) || 1; const nv = newV(p.x + (other.x-p.x)/d*16, p.y + (other.y-p.y)/d*16); if (c.a===v) c.a = nv; else c.b = nv; });
          st.sel = null; cleanVerts(); render(true); }));

      }
    }

    /* ---------- drawing ---------- */
    function drawPart(gb, gl, glow, e, r, pic, a){
      const hide = st.hide;
      const L = (x1,y1,x2,y2,cls)=>sv('line',{x1,y1,x2,y2,class:cls||'sym-line'});
      const T = (x,y,txt,cls)=>{ const [X,Y] = rot(x,y,a); return sv('text',{x:X, y:Y, class:cls||'lbl'}, txt); };
      if (e.type==='cell'){

        } else {

        else gb.append(sv('rect',{x:-16,y:-6,width:32,height:12,class:'sym'}));

        if (pic){ gb.append(sv('rect',{x:-8,y:-2,width:16,height:5,fill:'var(--metal)'}), sv('path',{d:'M-8 -2 V-14 A8 8 0 0 1 8 -14 V-2 Z', fill: lit ? '#ff6a5a' : '#c44a44', stroke:'#8a2b25', 'stroke-width':1.2, opacity:.95})); gl.append(T(-14, 12, '+', 'lbl')); }
        else { gb.append(sv('circle',{cx:0,cy:0,r:12,class:'sym'}), sv('path',{d:'M-6 -7 L5 0 L-6 7 Z', fill:'var(--ink)'}), L(5,-7,5,7), L(4,-12,9,-17), L(8,-10,13,-15)); gl.append(T(-17, -12, '+')); }
      } else if (e.type==='sample'){
        const m = MATERIALS[e.mat||'copper'];

    }

    let lastStats = null;
    function render(user){
      [gHint,gSel,gWire,gFlow,gBody,gVert].forEach(g=>{ while (g.firstChild) g.firstChild.remove(); });
      const res = solve(comps); bd.flows = [];
      const pic = st.view==='picture';
      slotSegs.forEach(([x1,y1,x2,y2])=>gHint.append(sv('line',{x1,y1,x2,y2, class:'hint slot'})));
      for (const k in comps){
        const c = comps[k], pa = verts[c.a], pb = verts[c.b]; if (!pa || !pb) continue;
        const dx = pb.x-pa.x, dy = pb.y-pa.y, len = Math.hypot(dx,dy) || 1, ux = dx/len, uy = dy/len;
        const a = Math.atan2(dy, dx)*180/Math.PI, mx = (pa.x+pb.x)/2, my = (pa.y+pb.y)/2;
        const T = `translate(${mx} ${my}) rotate(${a})`;
        const selected = st.sel && st.sel.kind==='comp' && st.sel.id===k;
        if (selected) gSel.append(sv('line',{x1:pa.x, y1:pa.y, x2:pb.x, y2:pb.y, class:'sel-halo'}));
        const wc = 'wire' + (pic?' pic':'');
        if (c.type==='wire'){
          gWire.append(sv('line',{x1:pa.x, y1:pa.y, x2:pb.x, y2:pb.y, class:wc}));
          if (editable) gWire.append(sv('line',{x1:pa.x, y1:pa.y, x2:pb.x, y2:pb.y, class:'comp-hit', 'data-comp':k}));
        } else {
          const gap = Math.min(GAP[pic?'pic':'sym'][c.type], len/2);
          gWire.append(sv('line',{x1:pa.x, y1:pa.y, x2:mx-ux*gap, y2:my-uy*gap, class:wc}), sv('line',{x1:mx+ux*gap, y1:my+uy*gap, x2:pb.x, y2:pb.y, class:wc}));
        }
        const r = res.out[k];
        if (!st.hide && st.flow!=='off' && r && Math.abs(r.I) > 0.02 && c.type!=='voltmeter'){
          const ln = sv('line',{x1:pa.x, y1:pa.y, x2:pb.x, y2:pb.y, class:'flow'}); gFlow.append(ln);
          const off = Math.random()*18; ln.setAttribute('stroke-dashoffset', off.toFixed(1));
          bd.flows.push({el:ln, off, v: reduceMotion ? 0 : Math.min(240, 30 + Math.abs(r.I)*150)*Math.sign(r.I)});
        }
        if (c.type!=='wire'){
          const glow = sv('g',{transform:`translate(${mx} ${my})`});
          const gb = sv('g',{transform:T, class:'part ' + c.type + (c.broken?' broken':'')});
          const gl = sv('g',{transform:`translate(${mx} ${my})`, class: c.broken?'part broken':''});
          gBody.append(glow, gb, gl);
          drawPart(gb, gl, glow, c, r, pic, a);
          if (editable) gBody.append(sv('rect',{x:-30, y:-24, width:60, height:48, transform:T, class:'comp-hit body', 'data-comp':k}));
        }
      }
      // vertices
      const counts = {}; for (const k in comps){ const c = comps[k]; counts[c.a] = (counts[c.a]||0)+1; counts[c.b] = (counts[c.b]||0)+1; }
      for (const v in verts){
        const p = verts[v], n = counts[v]||0, isPinned = pinned(v);
        const selV = st.sel && st.sel.kind==='vert' && st.sel.id===v;
        if (drag && drag.snap && drag.snap.t===v) gVert.append(sv('circle',{cx:p.x, cy:p.y, r:16, class:'snap-ring'}));
        if (n>2) gVert.append(sv('circle',{cx:p.x, cy:p.y, r:5.5, class:'junction'}));
        else if (n===2) gVert.append(sv('circle',{cx:p.x, cy:p.y, r:3.5, class:'junction'}));
        else if (editable) gVert.append(sv('circle',{cx:p.x, cy:p.y, r:7, class:'loose-end'}));
        if (selV) gVert.append(sv('circle',{cx:p.x, cy:p.y, r:12, class:'sel-ring'}));
        if (editable && !(isPinned && refs(v).every(k=>comps[k].locked))) gVert.append(sv('circle',{cx:p.x, cy:p.y, r:14, class:'vert-hit', 'data-vert':v}));
      }
      if (bd.flows.length) loop(bd);
      if (editable) drawActions();
      const stats = {bulbs:[], cells:[], ammeters:[], voltmeters:[], switches:[], leds:[], resistors:[], samples:[], short: res.short, edges: comps};
      for (const k in comps){
        const c = comps[k], r = res.out[k];
        if (c.type==='bulb') stats.bulbs.push({k, b: r.b, broken: !!c.broken});
        if (c.type==='cell') stats.cells.push({k, I: r.I});
        if (c.type==='ammeter') stats.ammeters.push({k, reading: Math.abs(r.I)});
        if (c.type==='voltmeter') stats.voltmeters.push({k, reading: Math.abs(r.dV)});
        if (c.type==='led') stats.leds.push({k, b:r.b, I:r.I});
        if (c.type==='resistor') stats.resistors.push({k, ohms:c.ohms||10, I:Math.abs(r.I), V:Math.abs(r.dV)});
        if (c.type==='sample') stats.samples.push({k, mat:c.mat||'copper', lit:!!c.lit, I:Math.abs(r.I)});
        if (c.type==='switch') stats.switches.push({k, closed: !!c.closed});
      }
      stats.maxB = stats.bulbs.reduce((m,b)=>Math.max(m,b.b),0);
      stats.lit = stats.bulbs.filter(b=>b.b>0.04).length;
      if (!st.hide && res.short && editable){ msg('Short circuit! The electricity has found a shortcut back to the cell without passing through any bulbs. In real life the wires and cell would get dangerously hot.'); bd.shortShown = true; }
      else if (bd.shortShown){ msg(''); bd.shortShown = false; }
      lastStats = stats;
      if (o.onChange && !drag) o.onChange(stats, !!user);
    }
    render(false);
    const api = {
      _dbg: ()=>({verts, comps}),
      mutate(fn){ fn(comps); render(true); },
      el: wrap,
      get stats(){ return lastStats; },
      get edges(){ return comps; },
      set(grid){ load(grid); st.sel = null; render(true); },
      reveal(){ st.hide = false; render(false); },
      say: msg
    };
    window.__lastBoard = api;
    return api;
  }

  /* ---------- preset layout helpers (grid keys: 'h,row,col' or 'v,row,col') ---------- */
  function loopKeys(c1, r1){ const ks=[]; for(let c=0;c<c1;c++) ks.push(`h,0,${c}`); for(let r=0;r<r1;r++) ks.push(`v,${r},${c1}`); for(let c=c1-1;c>=0;c--) ks.push(`h,${r1},${c}`); for(let r=r1-1;r>=0;r--) ks.push(`v,${r},0`); return ks; }
  function loopWith(parts, gaps, opt){
    opt = opt || {}; const c1 = opt.c1 || 4, r1 = opt.r1 || 2; gaps = gaps || [];
    const ed = {};
    loopKeys(c1, r1).forEach(k=>{ if (!gaps.includes(k)) ed[k] = {type:'wire'}; });
    for (const [k,t] of Object.entries(parts||{})) ed[k] = typeof t==='string' ? {type:t} : Object.assign({}, t);
    if (opt.lock){ for (const k in ed) if (ed[k].locked===undefined) ed[k].locked = true; }
    return ed;
  }
  function parallel(parts, opt){
    opt = opt || {};
    const ed = {};
    ['h,0,0','h,0,1','h,0,2','h,0,3','h,1,0','h,1,1','h,1,2','h,1,3','h,2,0','h,2,1','h,2,2','h,2,3','v,0,0','v,1,0','v,0,4','v,1,4'].forEach(k=>ed[k]={type:'wire'});
    Object.assign(ed, {'h,0,2':{type:'bulb'}, 'h,1,2':{type:'bulb'}, 'h,2,2':{type:'cell'}});
    for (const [k,t] of Object.entries(parts||{})) ed[k] = typeof t==='string' ? {type:t} : Object.assign({}, t);
    if (opt.lock){ for (const k in ed) if (ed[k].locked===undefined) ed[k].locked = true; }
    return ed;
  }
  return { board, solve, test, loopWith, parallel, PREF, MATERIALS };
})();

/* ================= Stop 0: Before we travel (observations) ================= */
function sortCards(stage, items, labels, onAll, explainFn){
  let right = 0; const grid = h('div',{class:'cards-sort'});
  shuffle(items).forEach(([name, val])=>{
    const card = h('div',{class:'sort-card'}, h('b',{}, name));
    const fb = h('span',{class:'legend'});
    const row = h('div',{class:'row'});
    labels.forEach(([label, v])=>row.append(h('button',{class:'btn small', type:'button', onclick:()=>{
      if (card.classList.contains('right')) return;
      if (v===val){ card.classList.add('right'); card.classList.remove('wrong'); fb.textContent = explainFn ? explainFn(name, val) : 'Correct!'; right++; if (right===items.length && onAll) onAll(); }
      else { card.classList.add('wrong'); fb.textContent = 'Have another think!'; }
    }}, label)));
    card.append(row, fb); grid.append(card);
  });
  stage.append(grid);
}
