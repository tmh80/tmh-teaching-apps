<body>
<header class="topbar"><div class="topbar-in">
<button id="brand" class="brand" type="button" aria-label="Back to the time machine"><span><b>Sparks Through Time</b><small>A time-travelling electricity lab</small></span></button>
<div id="who-chip" class="who-chip" aria-live="polite"></div>
<div class="dial"><span id="tm-slot" class="tm-slot"></span><div class="dial-label">Destination<span id="dial-place">Your classroom</span></div><div class="dial-face" id="dial-face" aria-live="polite">TODAY</div></div>
</div></header>
<main class="wrap" id="app"></main>
<script>
'use strict';
/* ================= helpers ================= */
const SVGNS = 'http://www.w3.org/2000/svg';
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v==null || v===false) continue;
    if (k==='class') el.className = v;
    else if (k==='html') el.innerHTML = v;
    else if (k==='style' && typeof v==='object'){ for (const [sk,sv2] of Object.entries(v)){ if (sk.startsWith('--')) el.style.setProperty(sk, sv2); else el.style[sk] = sv2; } }
    else if (k.startsWith('on') && typeof v==='function') el.addEventListener(k.slice(2), v);
    else if (v===true) el.setAttribute(k,'');
    else el.setAttribute(k, v);
  }
  for (const k of kids.flat(Infinity)){ if (k==null || k===false) continue; el.append(k.nodeType ? k : document.createTextNode(String(k))); }
  return el;
}
function sv(tag, attrs, ...kids){
  const el = document.createElementNS(SVGNS, tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v==null || v===false) continue;
    if (k.startsWith('on') && typeof v==='function') el.addEventListener(k.slice(2), v); else el.setAttribute(k, v);
  }
  for (const k of kids.flat(Infinity)){ if (k==null || k===false) continue; el.append(k.nodeType ? k : document.createTextNode(String(k))); }
  return el;
}
const reduceMotion = (()=>{ try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){ return false; } })();
let _uid = 0; const uid = p => (p||'id') + '-' + (++_uid);
const clamp = (x,a,b)=>Math.max(a, Math.min(b, x));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
const fmt = (x,d=2)=> (Math.round(x*Math.pow(10,d))/Math.pow(10,d)).toFixed(d);
function scrollToEl(el){ try { window.scrollTo({top: Math.max(0, el.getBoundingClientRect().top + window.scrollY - 90), behavior: reduceMotion?'auto':'smooth'}); } catch(e){} }

/* ================= storage ================= */
const Store = {
  key:'sparks-through-time-v1', data:{},
  load(){ try { this.data = JSON.parse(localStorage.getItem(this.key)) || {}; } catch(e){ this.data = {}; } },
  save(){ try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch(e){} }
};
Store.load();
function prog(id){ Store.data.p = Store.data.p || {}; Store.data.p[id] = Store.data.p[id] || {learn:false, challenge:false}; return Store.data.p[id]; }
function prefs(){ Store.data.prefs = Store.data.prefs || {view:'picture', flow:'conv'}; if (Store.data.prefs.flow==='electron') Store.data.prefs.flow = 'conv'; return Store.data.prefs; }

/* ================= Pip the spark ================= */
function pipSVG(size){
  size = size || 54;
  const bolt = (ang, len) => sv('polyline',{points:`0,-17 -3,${-17-len*0.4} 2,${-17-len*0.55} -1,${-17-len}`, transform:`translate(30 33) rotate(${ang})`, fill:'none', stroke:'var(--spark)', 'stroke-width':2.6, 'stroke-linecap':'round', 'stroke-linejoin':'round', class:'pip-bolt'});
  const gid = uid('pipg');
  return sv('svg',{viewBox:'0 0 60 60', width:size, height:size, 'aria-hidden':'true', class:'pip'},
    sv('defs',{}, sv('radialGradient',{id:gid, cx:'40%', cy:'35%', r:'70%'}, sv('stop',{offset:'0%', 'stop-color':'#fffbe6'}), sv('stop',{offset:'45%', 'stop-color':'#ffd23f'}), sv('stop',{offset:'100%', 'stop-color':'#f09a1a'}))),
    sv('circle',{cx:30, cy:33, r:22, fill:'var(--spark)', opacity:.2, class:'pip-halo'}),
    bolt(-35,11), bolt(30,9), bolt(85,12), bolt(150,8), bolt(205,11), bolt(270,9),
    sv('path',{d:'M31 6 C33 13 38 15 42 20 C47 26 46 39 40 44 C34 49 25 49 20 44 C14 39 13 28 19 21 C21 25 23 26 25 26 C24 18 27 11 31 6 Z', fill:`url(#${gid})`, stroke:'#d9800f', 'stroke-width':1.6, 'stroke-linejoin':'round'}),
    sv('ellipse',{cx:25.5, cy:33, rx:2.5, ry:3.3, fill:'#1a2140'}), sv('ellipse',{cx:35, cy:33, rx:2.5, ry:3.3, fill:'#1a2140'}),
    sv('circle',{cx:26.3, cy:31.8, r:.9, fill:'#fff'}), sv('circle',{cx:35.8, cy:31.8, r:.9, fill:'#fff'}),
    sv('ellipse',{cx:21.5, cy:38.5, rx:2.4, ry:1.4, fill:'#ff8a5c', opacity:.55}), sv('ellipse',{cx:39, cy:38.5, rx:2.4, ry:1.4, fill:'#ff8a5c', opacity:.55}),
    sv('path',{d:'M26 39.5 Q30.3 43.5 34.5 39.5', stroke:'#1a2140', 'stroke-width':2, fill:'none', 'stroke-linecap':'round'})
  );
}
function pipSay(html, size){ return h('div',{class:'pip-row'}, pipSVG(size||54), h('div',{class:'bubble', html})); }

/* tap targets in pictures: a pulsing "?" beacon next to each part (with a short pointer line) */
function beacon(svg, x, y, tx, ty, onTap, label){
  const g = sv('g',{class:'beacon', tabindex:0, role:'button', 'aria-label': label || 'Tap to find out'});
  if (tx!=null) g.append(sv('line',{x1:x, y1:y, x2:tx, y2:ty, class:'beacon-line'}));
  const ring = sv('circle',{cx:x, cy:y, r:15, class:'beacon-ring'}), dot = sv('circle',{cx:x, cy:y, r:11, class:'beacon-dot'}), t = sv('text',{x, y:y+1, class:'beacon-txt'}, '?');
  g.append(ring, dot, t);
  const act = ev=>{ if (ev){ ev.stopPropagation(); ev.preventDefault && ev.type==='keydown' && ev.preventDefault(); } onTap(); };
  g.addEventListener('click', act); g.addEventListener('keydown', ev=>{ if (ev.key==='Enter' || ev.key===' ') act(ev); });
  svg.append(g);
  return { el:g, found(){ g.classList.add('found'); t.textContent = '✓'; }, hide(v){ g.style.display = v===false ? '' : 'none'; } };
}

/* ================= stamps ================= */
function stampSVG(stop, kind, on, size){
  size = size || 64;
  const col = on ? `hsl(${stop.hue} 62% var(--hue-l))` : 'var(--line)';
  const s = sv('svg',{viewBox:'0 0 80 80', width:size, height:size, class:'stamp-img' + (on?' on':''), role:'img', 'aria-label':`${stop.title}: ${kind==='L'?'Learn':'Challenge'} stamp, ${on?'collected':'not collected yet'}`});
  const g = sv('g',{transform: on ? `rotate(${kind==='L'?-12:10} 40 40)` : ''});
  g.append(sv('circle',{cx:40, cy:40, r:36, fill: on ? `hsl(${stop.hue} 75% var(--hue-bg))` : 'none', stroke:col, 'stroke-width':3.2}), sv('circle',{cx:40, cy:40, r:29.5, fill:'none', stroke:col, 'stroke-width':1.4, 'stroke-dasharray': on ? '' : '3 3'}));
  if (on){
    const y = stop.yearLabel; const fs = y.length>5 ? 12 : y.length>4 ? 15 : 18;
    g.append(sv('text',{x:40, y:25, 'text-anchor':'middle', 'font-size':7, 'font-weight':800, 'letter-spacing':1.5, fill:col, 'font-family':'var(--font-body)'}, 'SPARKS'),
      sv('text',{x:40, y:45, 'text-anchor':'middle', 'font-size':fs, 'font-weight':800, fill:col, 'font-family':'var(--font-display)'}, y),
      sv('text',{x:40, y:60, 'text-anchor':'middle', 'font-size':kind==='L'?8:6.4, 'font-weight':800, 'letter-spacing':1.2, fill:col, 'font-family':'var(--font-body)'}, kind==='L' ? 'LEARN' : 'CHALLENGE'));
    g.append(sv('path',{d:'M14 40 l-5 -2 l2 4 z M66 40 l5 -2 l-2 4 z', fill:col}));
  } else {
    g.append(sv('text',{x:40, y:47, 'text-anchor':'middle', 'font-size':20, 'font-weight':700, fill:'var(--muted)', 'font-family':'var(--font-display)', opacity:.6}, kind));
  }
  s.append(g); return s;
}
function showStampModal(stop, kind, then){
  const close = ()=>{ ov.remove(); if (then) then(); };
  const btn = h('button',{class:'btn primary', type:'button', onclick:close}, 'Brilliant!');
  const big = stampSVG(stop, kind, true, 140); big.classList.add('stamp-in');
  const ov = h('div',{class:'stamp-overlay', role:'dialog', 'aria-modal':'true', 'aria-label':'Stamp collected', onclick:e=>{ if (e.target===ov) close(); }},
    h('div',{class:'stamp-modal'}, big, h('h3',{}, kind==='L' ? 'Learn stamp collected!' : 'Challenge stamp collected!'),
      h('p',{}, `That’s ${totalStamps()} of ${STOPS.length*2} stamps in your Time Passport.`), btn));
  document.body.append(ov); btn.focus();
}

/* ================= small UI pieces ================= */
function seg(options, value, onPick, label){
  const el = h('div',{class:'seg', role:'group', 'aria-label':label||''});
  options.forEach(([v,txt])=>{
    const b = h('button',{type:'button', 'aria-pressed': String(v===value), onclick:()=>{ [...el.children].forEach(x=>x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); onPick(v); }}, txt);
    el.append(b);
  });
  return el;
}
function slider({label, min, max, step, value, unit, onInput, id}){
  id = id || uid('rng');
  const out = h('output',{for:id}, value + (unit||''));
  const inp = h('input',{type:'range', id, min, max, step:step||1, value});
  const num = h('input',{type:'number', class:'ctrl-num', min, max, step:step||1, value, 'aria-label':`${label}: type a value`});
  inp.addEventListener('input', ()=>{ out.textContent = inp.value + (unit||''); num.value = inp.value; onInput(+inp.value); });
  const typed = ()=>{ let v = parseFloat(num.value); if (isNaN(v)){ num.value = inp.value; return; } const st = +(step||1); v = Math.min(+max, Math.max(+min, Math.round((v - +min)/st)*st + +min)); v = +v.toFixed(6); inp.value = v; num.value = inp.value; out.textContent = inp.value + (unit||''); onInput(+inp.value); };
  num.addEventListener('keydown', e=>{ if (e.key==='Enter'){ e.preventDefault(); typed(); } }); num.addEventListener('blur', typed);
  const el = h('div',{class:'ctrl'}, h('label',{for:id}, h('span',{}, label), out), h('div',{class:'ctrl-row'}, inp, num, unit ? h('span',{class:'ctrl-unit'}, unit.trim()) : null));
  el.input = inp; el.out = out;
  el.set = v => { inp.value = v; num.value = inp.value; out.textContent = v + (unit||''); };
  return el;
}
function stepper({label, sub, value, min, max, onChange}){
  const out = h('output',{}, value);
  const minus = h('button',{type:'button', 'aria-label':'One fewer '+label, onclick:()=>set(value-1)}, '−');
  const plus = h('button',{type:'button', 'aria-label':'One more '+label, onclick:()=>set(value+1)}, '+');
  function set(v){ v = clamp(v, min, max); if (v===value) return; value = v; out.textContent = v; onChange(v); }
  const el = h('div',{class:'src-row'}, h('div',{}, h('b',{}, label), sub ? h('small',{html:sub}) : null), h('div',{class:'stepper'}, minus, out, plus));
  el.set = v => { value = v; out.textContent = v; };
  return el;
}

/* ================= quiz engine ================= */
const PRAISE = ['Spot on!', 'Brilliant, that’s right!', 'Yes! Great thinking.', 'Exactly right!', 'You nailed it!', 'Superb!'];
const NUDGE  = ['Not quite, but here’s the key idea.', 'Close! Let’s look at why.', 'Good try. Here’s what really happens.'];

function prepQ(q){ const idx = q.options.map((_,k)=>k); return Object.assign({}, q, {order: q.keepOrder ? idx : shuffle(idx)}); }
function questionVisual(card, q){
  let board = null;
  if (q.diagram){ const d = h('div',{class:'quiz-diagram'}); card.append(d); board = Circuit.board(d, Object.assign({cols:4, rows:2, view:'symbols'}, q.diagram, {readonly:true, mini:true, hideResults:true})); }
  if (q.visual){ const d = h('div',{class:'quiz-visual'}); card.append(d); q.visual(d); }
  return board;
}

function runQuiz(el, questions, opts){
  opts = opts || {};
  el.innerHTML = '';
  const qs = questions.map(prepQ); let i = 0, score = 0; const results = [];
  function show(){
    el.innerHTML = '';
    if (i >= qs.length) return finish();
    const q = qs[i];
    const head = h('div',{class:'quiz-head'}, h('span',{}, `Question ${i+1} of ${qs.length}`), h('span',{}, `Score: ${score}`));
    const card = h('div',{class:'quiz-card'});
    card.append(h('p',{class:'quiz-q', html:q.q}));
    const board = questionVisual(card, q);
    const optsEl = h('div',{class:'quiz-opts'});
    const fb = h('div',{class:'feedback', role:'status'});
    const next = h('button',{class:'btn primary', type:'button', hidden:true, onclick:()=>{ i++; show(); scrollToEl(el); }}, i===qs.length-1 ? 'See my score' : 'Next question');
    let answered = false;
    q.order.forEach(k=>{
      const b = h('button',{class:'opt', type:'button', 'data-k':k, html:q.options[k], onclick:()=>{
        if (answered) return; answered = true;
        const right = k===q.answer; if (right) score++;
        results.push({q, right});
        [...optsEl.children].forEach(x=>{ x.disabled = true; if (+x.dataset.k===q.answer) x.classList.add('right'); });
        if (!right) b.classList.add('wrong');
        fb.className = 'feedback ' + (right ? 'ok' : 'bad');
        fb.innerHTML = `<strong>${right ? pick(PRAISE) : pick(NUDGE)}</strong> ${q.explain||''}`;
        if (board && q.diagram.reveal !== false) board.reveal();
        next.hidden = false; next.focus({preventScroll:true});
      }});
      optsEl.append(b);
    });
    card.append(optsEl, fb, h('div',{class:'row end'}, next));
    el.append(head, card);
  }
  function finish(){
    const pass = score/qs.length >= (opts.passMark==null ? 0.6 : opts.passMark);
    const msg = pass ? (opts.passMsg || 'Fantastic work! You really know your stuff.') : (opts.failMsg || 'Good effort! Have another go and see if you can beat your score.');
    el.append(h('div',{class:'quiz-card'},
      h('span',{class:'eyebrow'}, opts.title || 'Your score'),
      h('div',{class:'score-big'}, `${score} / ${qs.length}`),
      h('p',{}, msg),
      opts.extra ? opts.extra(results, score, qs.length) : null,
      h('div',{class:'row'}, h('button',{class:'btn', type:'button', onclick:()=>{ runQuiz(el, opts.reshuffle ? opts.reshuffle() : questions, opts); }}, 'Try again'))));
    if (opts.onFinish) opts.onFinish(score, qs.length, pass);
  }
  show();
}

/* ---------- Learn memory: steps remember answers so a finished step shows what you did ---------- */
let LCTX = null; // set by runLearn for the step on screen; null everywhere else (Explore, Challenge, Review)
function lrStore(stopId){ Store.data.lr = Store.data.lr || {}; return Store.data.lr[stopId] = Store.data.lr[stopId] || {mem:{}, done:{}}; }
function lrSlot(key){
  if (!LCTX) return {saved:undefined, put(){}};
  const ctx = LCTX; const k = key || ('s' + (ctx.n++));
  return {saved: ctx.mem[k], put(v){ ctx.mem[k] = v; Store.save(); }};
}
/* inline questions inside a Learn step: must get each right (retries allowed) */
function askInline(el, questions, onDone, key){
  const box = h('div',{class:'ask'}); el.append(box);
  const slot = lrSlot(key); let i = 0;
  const past = h('div',{class:'ask-past'});
  const answered = n=>{ for (let k=0;k<n && k<questions.length;k++){ const q = questions[k]; past.append(h('div',{class:'ask-done'}, h('p',{class:'quiz-q', html:q.q}), h('div',{class:'opt right', html:'\u2713 ' + q.options[q.answer]}), q.explain ? h('p',{class:'legend', html:q.explain}) : null)); } };
  if (slot.saved){ i = Math.min(slot.saved, questions.length); answered(i); }
  function show(){
    box.innerHTML = ''; box.append(past);
    if (i >= questions.length){ if (onDone) onDone(questions[questions.length-1].explain); return; }
    const q = prepQ(questions[i]);
    box.append(h('span',{class:'eyebrow'}, q.tag || 'Think about it'), h('p',{class:'quiz-q', html:q.q}));
    questionVisual(box, q);
    const optsEl = h('div',{class:'quiz-opts'}); const fb = h('div',{class:'feedback', role:'status'});
    q.order.forEach(k=>{
      const b = h('button',{class:'opt', type:'button', html:q.options[k], 'data-k':k, onclick:()=>{
        // one go: right or wrong, the question locks and the right answer is shown
        const right = k===q.answer;
        b.classList.add(right ? 'right' : 'wrong'); [...optsEl.children].forEach(x=>{ x.disabled = true; if (!right && +x.dataset.k===q.answer) x.classList.add('should'); }); slot.put(i+1);
        fb.className = 'feedback ' + (right ? 'ok' : 'bad'); fb.innerHTML = right ? `<strong>${pick(PRAISE)}</strong> ${q.explain||''}` : `<strong>Whoops!</strong> The answer is <b>${q.options[q.answer]}</b>. ${q.explain||''}`;
        if (i < questions.length-1){ box.append(h('div',{class:'row end'}, h('button',{class:'btn primary small', type:'button', onclick:()=>{ past.innerHTML = ''; answered(i+1); i++; show(); }}, 'Next question'))); }
        else { if (onDone) onDone(q.explain); }
      }});
      optsEl.append(b);
    });
    box.append(optsEl, fb, h('p',{class:'legend rv-onego'}, 'One go! Read every answer before you choose.'));
  }
  show();
  return box;
}

/* reading table: students read the meter themselves and type the value in (never auto-filled) */
function readingTable(el, opt){
  // opt: {cols:[...], rows:[{key, cells:[...]}], unit:'A', tol:0.02, onChange(okCount)}
  const slot = lrSlot(opt.key); const typed = Object.assign({}, slot.saved || {}); const expect = {}; const tol = opt.tol || 0.02;
  const wrap = h('div',{class:'tbl-wrap rt'}); el.append(wrap);
  const inputs = {};
  const okCount = ()=> opt.rows.filter(r=>typed[r.key]!=null).length;
  function check(key){
    const inp = inputs[key]; const v = parseFloat(String(inp.el.value).replace(',','.'));
    if (expect[key]==null){ inp.msg.textContent = 'Set up the circuit for this row first.'; inp.msg.className = 'rt-msg bad'; return; }
    if (isNaN(v)){ inp.msg.textContent = 'Type the number on the ammeter.'; inp.msg.className = 'rt-msg bad'; return; }
    if (Math.abs(v - expect[key]) <= tol){ typed[key] = v; slot.put(typed); draw(); if (opt.onChange) opt.onChange(okCount()); }
    else { inp.msg.textContent = 'Look again at the meter. Copy the number exactly.'; inp.msg.className = 'rt-msg bad'; }
  }
  function draw(){
    const keepVals = {}; Object.keys(inputs).forEach(k=>{ if (inputs[k].el.value) keepVals[k] = inputs[k].el.value; });
    const focusKey = Object.keys(inputs).find(k=>inputs[k].el===document.activeElement);
    Object.keys(inputs).forEach(k=>delete inputs[k]);
    wrap.innerHTML = '';
    const tb = h('tbody');
    opt.rows.forEach(r=>{
      let cell;
      if (typed[r.key]!=null) cell = h('td',{class:'rt-ok'}, `✓ ${fmt(typed[r.key])} ${opt.unit||''}`);
      else {
        const inpEl = h('input',{type:'text', inputmode:'decimal', class:'rt-in', placeholder: expect[r.key]!=null ? 'type it' : 'not set up yet', 'aria-label':`${opt.cols[opt.cols.length-1]} for ${r.cells.join(' ')}`, disabled: expect[r.key]==null});
        const msg = h('div',{class:'rt-msg'}, expect[r.key]!=null ? 'Read the meter, then type the number.' : '');
        const btn = h('button',{class:'btn small', type:'button', disabled: expect[r.key]==null, onclick:()=>check(r.key)}, 'Check');
        inpEl.addEventListener('keydown', e=>{ if (e.key==='Enter'){ e.preventDefault(); check(r.key); } });
        inputs[r.key] = {el:inpEl, msg};
        cell = h('td',{class: expect[r.key]!=null ? 'rt-now' : ''}, h('div',{class:'rt-row'}, inpEl, h('span',{}, opt.unit||''), btn), msg);
      }
      tb.append(h('tr',{}, r.cells.map(c=>h('td',{}, c)), cell));
    });
    wrap.append(h('table',{class:'data'}, h('thead',{}, h('tr',{}, opt.cols.map(c=>h('th',{}, c)))), tb));
    Object.keys(keepVals).forEach(k=>{ if (inputs[k] && !inputs[k].el.disabled) inputs[k].el.value = keepVals[k]; });
    if (focusKey && inputs[focusKey]) inputs[focusKey].el.focus();
  }
  draw();
  return {
    live(key, v){ const was = expect[key]; expect[key] = v; if (typed[key]==null && (was==null || Math.abs(was - v) > 1e-6)) draw(); },
    get count(){ return okCount(); },
    el: wrap
  };
}

/* prediction: any answer is accepted, then the test unlocks */
function predict(el, q, onPick, key){
  const box = h('div',{class:'ask predict'}); const slot = lrSlot(key);
  box.append(h('span',{class:'eyebrow'}, 'Predict first'), h('p',{class:'quiz-q', html:q.q}));
  const optsEl = h('div',{class:'quiz-opts'});
  const note = h('p',{class:'legend'}, 'There’s no wrong answer yet. Pick what you think will happen, then test it!');
  q.options.forEach((txt,k)=>{
    const b = h('button',{class:'opt', type:'button', html:txt, onclick:()=>{
      [...optsEl.children].forEach(x=>x.disabled=true); b.classList.add('chosen');
      note.innerHTML = '<b>Prediction locked in!</b> Now test it and see if you were right.';
      slot.put(k); onPick(k, txt);
    }});
    optsEl.append(b);
  });
  box.append(optsEl, note); el.append(box);
  if (slot.saved!=null && optsEl.children[slot.saved]){ const b = optsEl.children[slot.saved]; [...optsEl.children].forEach(x=>x.disabled=true); b.classList.add('chosen'); note.innerHTML = '<b>Your prediction</b> (saved from last time).'; onPick(slot.saved, q.options[slot.saved]); }
  return box;
}
/* build an interaction only after a prediction has been made */
function predictThen(stage, q, build){
  const area = h('div',{class:'stage', hidden:true});
  predict(stage, q, (k, txt)=>{ area.hidden = false; build(area, {k, txt}); });
  stage.append(area);
}

function missionBoard(el, stop, missions, award){
  const saved = Store.data.missions = Store.data.missions || {};
  const key = m => stop.id + ':' + m.id;
  const list = h('div',{class:'mission-list'});
  const play = h('div',{class:'card mission-play', hidden:true});
  const allDone = ()=>missions.every(x=>saved[key(x)]);
  function drawList(current){
    list.innerHTML = '';
    missions.forEach((m,i)=>{
      const done = !!saved[key(m)];
      list.append(h('div',{class:'mission'+(done?' done':'')+(current===m?' now':'')},
        h('h4',{}, `Mission ${i+1}: ${m.title}`, done ? h('span',{class:'tick'}, ' ✓ Complete') : null),
        h('p',{html:m.text}),
        h('div',{}, h('button',{class:'btn small'+(done?'':' primary'), type:'button', onclick:()=>start(m)}, done ? 'Play again' : (current===m ? 'Restart' : 'Start this mission')))));
    });
  }
  function start(m){
    play.hidden = false; play.innerHTML = '';
    const fb = h('div',{class:'feedback', role:'status', 'aria-live':'polite'});
    const area = h('div',{class:'stage'});
    play.append(h('h3',{}, m.title), h('p',{html:m.text}), area, fb);
    let finished = false;
    m.build(area, {
      done(msg){ if (finished) return; finished = true;
        const fin = ()=>{ saved[key(m)] = true; Store.save(); fb.className='feedback ok'; fb.innerHTML = msg || '<strong>Mission complete!</strong>'; drawList(m); if (allDone()) award(); };
        const qs = typeof MISSION_QS!=='undefined' && MISSION_QS[key(m)];
        if (!qs || saved[key(m)]) return fin();
        // end-of-mission questions: explain how and why it worked before the mission counts
        fb.className = 'feedback hint'; fb.innerHTML = '<strong>You did it!</strong> Now answer these questions about <b>how</b> and <b>why</b> it worked to finish the mission.';
        const qa = h('div',{class:'mission-qs'}); fb.after(qa);
        askInline(qa, qs, ()=>{ const end = h('div',{class:'feedback ok'}); qa.after(end); fb.className = 'feedback'; fb.innerHTML = ''; saved[key(m)] = true; Store.save(); end.innerHTML = msg || '<strong>Mission complete!</strong>'; drawList(m); if (allDone()) award(); });
        setTimeout(()=>scrollToEl(qa), 250); },
      hint(msg){ if (finished) return; fb.className='feedback hint'; fb.innerHTML = msg; },
      clear(){ if (finished) return; fb.className='feedback'; fb.innerHTML=''; }
    });
    drawList(m); scrollToEl(play);
  }
  el.append(h('div',{class:'mission-wrap'}, list, play));
  drawList();
}

/* ================= time dial ================= */
let dialYear = 2026;
function yearText(y){ if (y>=2026) return 'TODAY'; if (y<0) return Math.abs(Math.round(y)) + ' BCE'; return String(Math.round(y)); }
function setDial(year, place){
  const face = document.getElementById('dial-face'); const pl = document.getElementById('dial-place');
  if (!face) return Promise.resolve();
  pl.textContent = place || 'Your classroom';
  const tm = document.getElementById('tm-slot'); if (tm && dialYear!==year){ tm.classList.add('warp'); setTimeout(()=>tm.classList.remove('warp'), reduceMotion ? 0 : 900); }
  const from = dialYear, to = year; dialYear = year;
  if (reduceMotion || from===to){ face.textContent = yearText(to); return Promise.resolve(); }
  return new Promise(res=>{
    const t0 = performance.now(), dur = 750;
    function step(t){ const k = clamp((t-t0)/dur, 0, 1); const e = k<.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2; face.textContent = yearText(from + (to-from)*e); if (k<1) requestAnimationFrame(step); else res(); }
    requestAnimationFrame(step);
  });
}

function runLearn(el, stop){
  const steps = stop.learn; const p = prog(stop.id); const LR = lrStore(stop.id); let i = 0;
  const done = new Set(Object.keys(LR.done).map(Number).filter(k=>k<steps.length));
  if (p.learn && done.size < steps.length) steps.forEach((_,k)=>done.add(k));
  function show(){
    el.innerHTML = '';
    const idx = i, st = steps[idx];
    const wasDone = done.has(idx);
    LCTX = {mem: LR.mem[idx] = LR.mem[idx] || {}, n:0};
    const dots = h('div',{class:'steps-dots', 'aria-hidden':'true'}, steps.map((_,k)=>h('span',{class:(done.has(k)?'done':'')+(k===idx?' now':'')})));
    const pill = h('span',{class:'pill ' + (wasDone ? 'ok' : 'todo')}, wasDone ? '✓ Step complete' : 'To do');
    const again = h('button',{class:'btn small ghost', type:'button', onclick:()=>{ LR.mem[idx] = {}; delete LR.done[idx]; done.delete(idx); Store.save(); show(); }}, '↻ Try this step again');
    const top = h('div',{class:'learn-top'}, h('span',{class:'eyebrow'}, `Learn · Step ${idx+1} of ${steps.length}`), dots, pill, wasDone ? again : null);
    const stage = h('div',{class:'stage'});
    const fb = h('div',{class:'feedback', role:'status', 'aria-live':'polite'});
    const isLast = idx===steps.length-1;
    const back = h('button',{class:'btn', type:'button', disabled: idx===0, onclick:()=>{ i--; show(); }}, 'Back');
    const next = h('button',{class:'btn primary', type:'button', disabled: !(done.has(idx) || p.learn || teacherMode()), onclick:()=>{ if (isLast) finish(); else { i++; show(); scrollToEl(el); } }}, isLast ? (p.learn ? 'Finish' : 'Finish and collect my stamp') : 'Next step →');
    const card = h('div',{class:'card learn-card' + (wasDone ? ' step-done' : ''), style:{display:'grid', gap:'14px'}});
    const markDone = msg=>{ card.classList.add('step-done'); pill.className = 'pill ok'; pill.textContent = '✓ Step complete'; fb.className = 'feedback ok step-fb'; fb.innerHTML = `<strong>✓ Step complete!</strong> ${msg || ''} <span class="legend">Press <b>${isLast ? next.textContent : 'Next step'}</b> to carry on.</span>`; next.classList.add('pulse'); };
    let keyBox = null, pendingMsg = '';
    const keyHost = h('div');
    const finishStep = msg=>{ done.add(idx); LR.done[idx] = msg || true; Store.save(); next.disabled = false; dots.children[idx].classList.add('done'); if (!top.contains(again)) top.append(again); markDone(msg); };
    const api = {
      complete(msg){ if (i!==idx) return;
        const KI = st.key || (typeof KEY_IDEAS!=='undefined' && KEY_IDEAS[st.title]); const mem = LR.mem[idx] = LR.mem[idx] || {};
        if (KI && !mem.__key){ if (keyBox) return; pendingMsg = msg;
          fb.className = 'feedback ok step-fb'; fb.innerHTML = `${msg ? `<strong>Nice work!</strong> ${msg} ` : ''}<span class="legend"><b>One last thing:</b> answer the key idea below to finish this step.</span>`;
          keyBox = keyIdeaCheck(keyHost, KI, false, ()=>{ mem.__key = true; Store.save(); keyBox = null; finishStep(pendingMsg); }); setTimeout(()=>scrollToEl(keyHost), 250); return; }
        finishStep(msg); },
      hint(msg){ if (i!==idx || card.classList.contains('step-done')) return; fb.className='feedback hint'; fb.innerHTML = msg; },
      clear(){ if (i!==idx || card.classList.contains('step-done')) return; fb.className='feedback'; fb.innerHTML=''; },
      isDone(){ return done.has(idx); }
    };
    const restartAll = p.learn ? h('div',{class:'row end'}, h('button',{class:'btn small ghost', type:'button', onclick:()=>{ LR.mem = {}; LR.done = {}; Store.save(); done.clear(); i = 0; show(); }}, '↻ Clear my answers and start all the steps again')) : null;
    card.append(top, h('h3',{class:'step-title'}, st.title), (()=>{ const r = pipSay(st.say, 64); r.classList.add('step-say'); return r; })(), stage, fb, keyHost, h('div',{class:'row between'}, back, next));
    el.append(card); if (restartAll) el.append(restartAll);
    if (wasDone){ const m = LR.done[idx]; markDone(typeof m==='string' ? m : ''); const KI = st.key || (typeof KEY_IDEAS!=='undefined' && KEY_IDEAS[st.title]); if (KI && LR.mem[idx] && LR.mem[idx].__key) keyIdeaCheck(keyHost, KI, true, ()=>{}); }
    st.build(stage, api);
    if (st.auto) api.complete();
  }
  function finish(){
    const first = !p.learn; p.learn = true; Store.save(); LCTX = null;
    el.innerHTML = '';
    const big = stampSVG(stop, 'L', true, 150); big.classList.add('stamp-in');

/* ================= Circuit engine: free-form drag-and-drop builder + nodal analysis ================= */
const Circuit = (()=>{
  const SP = 90, M = 34, LEN = 90;
  const RW = 0.001, RB = 4, RC = 0.2, RV = 1e7, E = 1.5, GMIN = 1e-9;
  const PREF = Math.pow(E/(RB+RC),2)*RB;
  const SNAP = 20;
  const PS = 1.6; // parts are drawn 30% larger than before; wires stay thin
  const LM_PER_W = 10; // small filament bulbs give roughly 10 lumens per watt

  const MATERIALS = {
    copper:{name:'Copper wire', R:0.01, col:'#c4793a', kind:'conductor'}, aluminium:{name:'Aluminium foil', R:0.02, col:'#c9ced6', kind:'conductor'},
    iron:{name:'Iron nail', R:0.1, col:'#7d8494', kind:'conductor'}, graphite:{name:'Pencil lead (graphite)', R:15, col:'#3b3f4c', kind:'conductor'},
    saltwater:{name:'Salty water', R:40, col:'#7fb8d8', kind:'conductor'}, silicon:{name:'Silicon (semiconductor)', R:3000, Rlit:8, col:'#6f7fa0', kind:'semi'},
    plastic:{name:'Plastic', R:1e9, col:'#e9a23b', kind:'insulator'}, wood:{name:'Wood', R:1e9, col:'#b98a52', kind:'insulator'},
    glass:{name:'Glass', R:1e9, col:'#cfe7f2', kind:'insulator'}, rubber:{name:'Rubber', R:1e9, col:'#2c2f3a', kind:'insulator'}, paper:{name:'Paper', R:1e9, col:'#f2efe6', kind:'insulator'}
  };
  const OHMS = [2,5,10,20,50];
  const VF = 1.0, RLED = 15;
  const RM = 3, RBZ = 15, RBELL = 5, RG = 0.5; // motor, buzzer, bell, generator inside
  const GENS = {
    steam:{name:'Steam generator', what:'heat', levels:['Fire off','Low heat','Medium heat','High heat']},
    hamster:{name:'Hamster generator', what:'speed', levels:['Resting','Walking','Jogging','Sprinting']},
    wind:{name:'Wind turbine', what:'wind', levels:['Calm','Breezy','Windy','Stormy']} };
  const GVP = [0, 1.2, 2.2, 3.2], GF = [0, 0.35, 0.6, 0.9]; // peak volts and turns per second at each level (slowed right down so you can see the AC)
  const isGen = t=> !!GENS[t] || t==='generator';
  /* mechanical pieces (not part of the circuit): they must be placed in the right spots to spin a generator */
  const MECH = {m_fire:'Fire', m_boiler:'Water boiler', m_turbine:'Turbine', m_pipe:'Steam pipe', m_wind:'Wind', m_blades:'Wind blades', m_wheel:'Hamster wheel', m_hamster:'Hamster'};
  const isMech = t=> !!MECH[t];
  function matR(e){ const m = MATERIALS[e.mat||'copper']; return (m.Rlit && e.lit) ? m.Rlit : m.R; }
  function cond(e){
    switch(e.type){
      case 'wire': case 'ammeter': return 1/RW;
      case 'switch': return e.closed ? 1/RW : 0;
      case 'bulb': return e.broken ? 0 : 1/RB;
      case 'cell': return 1/RC;
      case 'voltmeter': return 1/RV;
      case 'resistor': return 1/(e.ohms||10);
      case 'sample': return 1/matR(e);
      case 'led': return 1e-9;
      case 'motor': return 1/RM;
      case 'buzzer': return 1/RBZ;
      case 'bell': return 1/RBELL;
      case 'push': return e.closed ? 1/RW : 0;
      case 'steam': case 'hamster': case 'wind': case 'generator': return 1/RG;
    } return 0;
  }
  function gauss(A, b){
    const n = b.length; const Mx = A.map((row,i)=>{ const r = Array.from(row); r.push(b[i]); return r; });
    for (let c=0;c<n;c++){
      let p=c; for (let r=c+1;r<n;r++) if (Math.abs(Mx[r][c])>Math.abs(Mx[p][c])) p=r;
      if (p!==c){ const t=Mx[c]; Mx[c]=Mx[p]; Mx[p]=t; }
      const piv = Mx[c][c]; if (Math.abs(piv)<1e-18) continue;
      for (let r=c+1;r<n;r++){ const f = Mx[r][c]/piv; if (!f) continue; for (let k=c;k<=n;k++) Mx[r][k] -= f*Mx[c][k]; }
    }
    const x = new Array(n).fill(0);
    for (let r=n-1;r>=0;r--){ let s = Mx[r][n]; for (let k=r+1;k<n;k++) s -= Mx[r][k]*x[k]; x[r] = Math.abs(Mx[r][r])<1e-18 ? 0 : s/Mx[r][r]; }
    return x;
  }
  /* comps: {id: {type, a, b, closed, broken}}; a = negative terminal of a cell, b = positive */
  function solve(comps){

    let lastStats = null;
    function render(user, tickOnly){

        const dx = pb.x-pa.x, dy = pb.y-pa.y, len = Math.hypot(dx,dy) || 1, ux = dx/len, uy = dy/len;
        const a = Math.atan2(dy, dx)*180/Math.PI, mx = (pa.x+pb.x)/2, my = (pa.y+pb.y)/2;

      }

      for (const v in verts){
        const p = verts[v], n = counts[v]||0, isPinned = pinned(v);
        const selV = st.sel && st.sel.kind==='vert' && st.sel.id===v;
        if (drag && drag.snap && drag.snap.t===v) gVert.append(sv('circle',{cx:p.x, cy:p.y, r:16, class:'snap-ring'}));
        if (n>2) gVert.append(sv('circle',{cx:p.x, cy:p.y, r:5.5, class:'junction'}));

      get mech(){ return mech; },
      addMech(t, x, y){ const id = makeMech(t, x, y); render(true); return id; },
      moveMech(id, x, y){ const m = mech.find(q=>q.id===id); if (m){ m.x = x; m.y = y; render(true); } },

    if (opt.lock){ for (const k in ed) if (ed[k].locked===undefined) ed[k].locked = true; }

  }

    ['h,0,0','h,0,1','h,0,2','h,0,3','h,1,0','h,1,1','h,1,2','h,1,3','h,2,0','h,2,1','h,2,2','h,2,3','v,0,0','v,1,0','v,0,4','v,1,4'].forEach(k=>ed[k]={type:'wire'});

/* ================= the time machine ================= */
function timeMachineSVG(size, withPip){
  const s = sv('svg',{viewBox:'0 0 120 92', width:size, height:Math.round(size*92/120), class:'time-machine', 'aria-hidden':'true'});
  const gear = (cx, cy, r, teeth, col)=>{ let d = ''; for (let i=0;i<teeth*2;i++){ const a = Math.PI*i/teeth, rr = i%2 ? r*0.78 : r; d += (i?'L':'M') + (cx+rr*Math.cos(a)).toFixed(1) + ' ' + (cy+rr*Math.sin(a)).toFixed(1) + ' '; } return sv('g',{class:'tm-gear'}, sv('path',{d:d+'Z', fill:col, stroke:'#6b4e12', 'stroke-width':1}), sv('circle',{cx, cy, r:r*0.3, fill:'#6b4e12'})); };
  s.append(sv('path',{d:'M60 26 V12 l-4 -3 l8 -3 l-4 -3', fill:'none', stroke:'#8a6a20', 'stroke-width':2.2, 'stroke-linejoin':'round'}), sv('circle',{cx:60, cy:4, r:4, fill:'var(--spark)', class:'tm-spark'}));
  s.append(gear(22, 42, 11, 8, '#d9b25a'), gear(100, 58, 8, 7, '#d9b25a'));
  const body = sv('g',{class:'tm-body'});
  body.append(sv('rect',{x:24, y:26, width:74, height:46, rx:12, fill:'#c9a24a', stroke:'#8a6a20', 'stroke-width':2.5}), sv('rect',{x:30, y:31, width:62, height:4, rx:2, fill:'#fff', opacity:.25}));
  body.append(sv('circle',{cx:61, cy:50, r:15, fill:'#1a2140', stroke:'#8a6a20', 'stroke-width':3}));
  body.append(sv('path',{d:'M61 50 m-9 0 a9 9 0 1 1 9 9 a6 6 0 1 1 -6 -6 a3 3 0 1 1 3 3', fill:'none', stroke:'#7d9bff', 'stroke-width':1.6, opacity:.8, class:'tm-swirl'}));
  if (withPip){ const p = pipSVG(26); p.setAttribute('x', 48); p.setAttribute('y', 37); body.append(p); }
  [[33,'#ff6a5a',0],[40,'#53c98a',.4],[85,'var(--spark)',.8]].forEach(([x,c,dl])=>body.append(sv('circle',{cx:x, cy:64, r:2.8, fill:c, class:'tm-light', style:`animation-delay:-${dl}s`})));
  body.append(sv('line',{x1:96, y1:36, x2:110, y2:22, stroke:'#8a6a20', 'stroke-width':3, 'stroke-linecap':'round'}), sv('circle',{cx:110, cy:22, r:4, fill:'#d9484a'}));
  s.append(body);
  s.append(sv('rect',{x:14, y:72, width:94, height:7, rx:3.5, fill:'var(--copper)'}));
  [30, 92].forEach(cx=>{ const w = sv('g',{class:'tm-gear'}); w.append(sv('circle',{cx, cy:84, r:7, fill:'#2a2f3d'}), sv('path',{d:`M${cx-5} 84 H${cx+5} M${cx} 79 V89`, stroke:'#c9a24a', 'stroke-width':1.6})); s.append(w); });
  return s;
}

/* ================= Stop 0: Before we travel (observations) ================= */
function sortCards(stage, items, labels, onAll, explainFn){
  let right = 0; const grid = h('div',{class:'cards-sort'}); const slot = lrSlot();
  if (slot.saved){
    items.forEach(([name, val])=>{ const lab = (labels.find(l=>l[1]===val)||[''])[0]; grid.append(h('div',{class:'sort-card right'}, h('b',{}, name), h('span',{class:'chip ok'}, '\u2713 ' + lab), h('span',{class:'legend'}, explainFn ? explainFn(name, val) : ''))); });
    stage.append(grid); if (onAll) onAll(); return;
  }
  shuffle(items).forEach(([name, val])=>{
    const card = h('div',{class:'sort-card'}, h('b',{}, name));
    const fb = h('span',{class:'legend'});
    const row = h('div',{class:'row'});
    labels.forEach(([label, v])=>row.append(h('button',{class:'btn small', type:'button', onclick:()=>{
      if (card.classList.contains('right')) return;
      if (v===val){ card.classList.add('right'); card.classList.remove('wrong'); fb.textContent = explainFn ? explainFn(name, val) : 'Correct!'; right++; if (right===items.length){ slot.put(true); if (onAll) onAll(); } }
      else { card.classList.add('wrong'); fb.textContent = 'Have another think!'; }
    }}, label)));
    card.append(row, fb); grid.append(card);
  });
  stage.append(grid);
}

/* ---------- Balloon lab: students rub balloons on a jumper themselves, then test them ---------- */
const BAL_TESTS = {
  paper:{label:'Balloon and paper bits', goal:'Rub the balloon on the jumper, then bring it close to the paper bits.',
    q:{q:'What happened when you brought the rubbed balloon close to the paper bits?', options:['Some of the paper bits jumped up and stuck to the balloon','The paper bits were pushed away across the table','Nothing happened at all','The paper bits stuck to the jumper instead'], answer:0, explain:'The rubbed balloon <b>pulled</b> the light paper bits towards it. Did you try it before rubbing too? An unrubbed balloon does nothing.'}},
  jumper:{label:'Balloon and the jumper', goal:'Rub the balloon on the jumper, then let go of it close to the jumper.',
    q:{q:'What did the rubbed balloon do when you let go of it near the jumper?', options:['It swung towards the jumper','It swung away from the jumper','It hung straight down and didn’t move','It floated up to the ceiling'], answer:0, explain:'The balloon and the jumper it was rubbed on <b>pulled together</b>.'}},
  two:{label:'Two balloons', goal:'Rub <b>both</b> balloons on the jumper, then bring one close to the other.',
    q:{q:'What happened when you brought the two rubbed balloons close together?', options:['They pushed each other apart','They pulled together and touched','Nothing happened','They both swung towards the jumper and stayed there'], answer:0, explain:'Two balloons rubbed on the same jumper <b>pushed each other apart</b>. They wouldn’t touch!'}}
};
function balloonLab(el, mode, onDone){
  const W = 440, H = 250, L = 140, R = 30;
  const svg = sv('svg',{viewBox:`0 0 ${W} ${H}`, class:'sim-svg bal-lab', role:'img', 'aria-label':'Balloon lab: drag a balloon'});
  svg.style.touchAction = 'none';
  const gBack = sv('g'), gMove = sv('g'); svg.append(gBack, gMove);
  const jumper = {x:18, y:70, w:130, h:150, plus:0};
  const msg = h('p',{class:'legend bal-msg', role:'status'}, BAL_TESTS[mode].goal.replace(/<[^>]+>/g,''));
  // jumper drawing
  gBack.append(sv('path',{d:`M${jumper.x+30} ${jumper.y} h70 l30 22 v20 l-18 6 v${jumper.h-48} h-94 v${-(jumper.h-48)} l-18 -6 v-20 z`, fill:'#5d7fc7'}),
    sv('path',{d:`M${jumper.x+50} ${jumper.y} q15 14 30 0`, fill:'none', stroke:'#3f5fa6', 'stroke-width':3}),
    sv('text',{x:jumper.x+65, y:H-8, class:'t-small svg-muted', 'text-anchor':'middle'}, 'Woolly jumper'));
  const gJplus = sv('g'); gBack.append(gJplus);
  const pivots = mode==='two' ? [290, 375] : mode==='paper' ? [300] : [205];
  gBack.append(sv('rect',{x:pivots[0]-40, y:4, width:(pivots[pivots.length-1]-pivots[0])+80, height:6, rx:3, fill:'var(--metal)'}));
  const bals = pivots.map((px,i)=>({px, x:px, y:10+L, q:0, held:false, a:0, g:null, gS:null, str:null, id:i}));
  let bits = [];
  if (mode==='paper'){
    gBack.append(sv('rect',{x:220, y:226, width:210, height:8, rx:2, fill:'#b98a52'}), sv('text',{x:325, y:247, class:'t-small svg-muted', 'text-anchor':'middle'}, 'Tiny bits of paper'));
    for (let i=0;i<12;i++){ const bx = 240 + i*15 + (i%2)*4, by = 220 - (i%3); const r = sv('rect',{x:-4, y:-3, width:8, height:6, fill:'#fff', stroke:'#56607e', 'stroke-width':1}); gMove.append(r); bits.push({el:r, x:bx, y:by, hx:bx, hy:by, stuck:null, ox:0, oy:0, w: 0.55 + ((i*37)%10)/20}); }
  }
  bals.forEach(b=>{
    b.str = sv('line',{stroke:'var(--muted)', 'stroke-width':1.5}); b.g = sv('g',{class:'bal', style:'cursor:grab'});
    b.g.append(sv('ellipse',{cx:0, cy:0, rx:R-4, ry:R+2, fill: b.id ? '#e8a33b' : '#e3536a'}), sv('ellipse',{cx:-9, cy:-12, rx:6, ry:9, fill:'#fff', opacity:.35}), sv('path',{d:`M0 ${R+2} l-5 7 h10 z`, fill: b.id ? '#c7861f' : '#c73d4f'}));
    b.gS = sv('g'); b.g.append(b.gS); gMove.append(b.str, b.g);
  });
  bits.forEach(t=>gMove.append(t.el));
  const meter = h('div',{class:'chip-row bal-meter'});
  function drawCharges(){
    bals.forEach(b=>{ while (b.gS.firstChild) b.gS.firstChild.remove(); const n = Math.round(b.q*6); for (let k=0;k<n;k++){ const ang = k*1.9, rr = 9 + (k%3)*5; b.gS.append(sv('text',{x:rr*Math.cos(ang), y:rr*Math.sin(ang)+4, 'text-anchor':'middle', 'font-size':15, 'font-weight':800, fill:'#fff'}, '−')); } });
    while (gJplus.firstChild) gJplus.firstChild.remove(); const n = Math.min(14, Math.round(jumper.plus*6));
    for (let k=0;k<n;k++){ gJplus.append(sv('text',{x:jumper.x+40 + (k%4)*20, y:jumper.y+50 + Math.floor(k/4)*26, 'text-anchor':'middle', 'font-size':18, 'font-weight':800, fill:'#ffe08a'}, '+')); }
    meter.innerHTML = ''; bals.forEach((b,i)=>meter.append(h('span',{class:'chip' + (b.q>=0.6 ? ' ok' : '')}, `${bals.length>1 ? (i ? 'Yellow' : 'Red') + ' balloon' : 'Balloon'} rubbed: ${'▮'.repeat(Math.round(b.q*5))}${'▯'.repeat(5-Math.round(b.q*5))}`)));
  }
  const inJumper = b=> b.x - R < jumper.x + jumper.w && b.x + R > jumper.x + 10 && b.y > jumper.y - 10 && b.y < jumper.y + jumper.h + 10;
  const toPt = ev=>{ const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; const r = pt.matrixTransform(svg.getScreenCTM().inverse()); return {x:r.x, y:r.y}; };
  let drag = null, finished = false, toldSame = false, done = false, settleT = 0;
  function say(t){ if (done) return; msg.innerHTML = t; }
  svg.addEventListener('pointerdown', ev=>{ const p = toPt(ev); const b = bals.find(b=>Math.hypot(p.x-b.x, p.y-b.y) < R+8); if (!b) return; ev.preventDefault(); svg.setPointerCapture(ev.pointerId); drag = {b, last:p}; b.held = true; b.g.style.cursor = 'grabbing'; });
  svg.addEventListener('pointermove', ev=>{ if (!drag) return; const p = toPt(ev); const b = drag.b; const nx = clamp(p.x, R, W-R), ny = clamp(p.y, 30, H-R-6); const d = Math.hypot(nx-b.x, ny-b.y);
    if (inJumper(b) && d>0){ const before = b.q; b.q = Math.min(1, b.q + d/650); jumper.plus = Math.min(2.4, jumper.plus + (b.q-before)); if (b.q>=1 && before<1) say(mode==='two' && bals.some(o=>o.q<0.6) ? 'That balloon is fully rubbed. Now rub the other balloon on the jumper too.' : 'Fully rubbed! Now pull it away and see what happens.'); else if (before===0) say('Keep rubbing: drag it back and forth across the jumper.'); drawCharges(); }
    const other = bals.find(o=>o!==b); if (other && d>0 && Math.hypot(nx-other.x, ny-other.y) < 2*R+4 && !toldSame){ toldSame = true; say('Rubbing two balloons together doesn’t do much: they’re made of the same material, so neither one gives charge to the other. Rub them on the <b>jumper</b> instead.'); }
    b.x = nx; b.y = ny; drag.last = p; });
  const up = ()=>{ if (!drag) return; drag.b.held = false; drag.b.g.style.cursor = 'grab'; drag = null; };
  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  function step(){
    if (!svg.isConnected){ return; }
    // free balloons hang from their pivots, tilted by electric forces
    bals.forEach(b=>{ if (b.held) return; let F = 0;
      const hx = b.px + L*Math.sin(b.a), hy = 10 + L*Math.cos(b.a);
      if (b.q>0.05){ const jx = jumper.x + jumper.w, dj = Math.max(20, hx - jx); F -= 9e5*b.q*Math.min(1, jumper.plus)/(dj*dj*dj); }
      bals.forEach(o=>{ if (o===b) return; const dx = hx - o.x, dd = Math.max(2*R, Math.abs(dx)); const k = (b.q>0.05 && o.q>0.05) ? 1 : (b.q>0.05 || o.q>0.05) ? -0.25*Math.max(b.q,o.q) : 0; F += Math.sign(dx||1) * 2600*k*Math.max(b.q,0.3)*Math.max(o.q,0.3)/(dd*dd) * 40; });
      const target = clamp(Math.atan(F/30), -0.95, 0.95);
      b.a += (target - b.a)*0.12; let x = b.px + L*Math.sin(b.a), y = 10 + L*Math.cos(b.a);
      if (x - R < jumper.x + jumper.w - 6 && y > jumper.y){ x = jumper.x + jumper.w - 6 + R; b.a = Math.asin(clamp((x-b.px)/L,-1,1)); }
      b.x += (x - b.x)*0.25; b.y += (y - b.y)*0.25; });
    // paper bits jump to a charged balloon
    bits.forEach(t=>{ if (t.stuck){ t.x = t.stuck.x + t.ox; t.y = t.stuck.y + t.oy; return; }
      const b = bals[0]; const d = Math.hypot(b.x - t.x, (b.y + R) - t.y);
      if (b.q>0.3 && d < (30 + 60*b.q) * t.w){ t.stuck = b; const ang = Math.PI/2 + (Math.random()-0.5)*1.6; t.ox = (R-6)*Math.cos(ang); t.oy = (R)*Math.sin(ang) - 2; } });
    bals.forEach(b=>{ b.g.setAttribute('transform', `translate(${b.x.toFixed(1)} ${b.y.toFixed(1)})`); b.str.setAttribute('x1', b.px); b.str.setAttribute('y1', 10); b.str.setAttribute('x2', b.x.toFixed(1)); b.str.setAttribute('y2', (b.y - R).toFixed(1)); });
    bits.forEach(t=>t.el.setAttribute('transform', `translate(${t.x.toFixed(1)} ${t.y.toFixed(1)}) rotate(${t.stuck ? (t.ox*3)%40 : 0})`));
    // success checks
    if (!done){
      let ok = false;
      if (mode==='paper') ok = bits.filter(t=>t.stuck).length >= 3;
      if (mode==='jumper'){ const b = bals[0]; ok = !b.held && b.q>=0.5 && b.x < b.px - 18; }
      if (mode==='two'){ ok = bals.every(b=>b.q>=0.5) && Math.abs(bals[1].x - bals[0].x) > (pivots[1]-pivots[0]) + 40 && (bals.some(b=>b.held) || bals.every(b=>Math.abs(b.a) > 0.12)); }
      settleT = ok ? settleT + 1 : 0;
      if (settleT > 25){ done = true; msg.innerHTML = ('<b>✓ Test complete!</b> Look carefully at what happened, then answer the question below.'); if (onDone) onDone(); }
      else if (mode==='paper' && bals[0].q===0 && !bals[0].held && bits.length && !finished){ /* idle */ }
    }
    requestAnimationFrame(step);
  }
  drawCharges(); requestAnimationFrame(step);
  const reset = h('button',{class:'btn small', type:'button', onclick:()=>{ el.innerHTML = ''; balloonLab(el, mode, done ? null : onDone); }}, '↻ Reset this test');
  el.append(svg, meter, msg, h('div',{class:'row'}, reset));
}
function balloonBench(el, opts){
  opts = opts || {};
  const order = ['paper','jumper','two']; const slot = opts.learn ? lrSlot('balloons') : {saved:undefined, put(){}};
  const doneSet = new Set(slot.saved || []);
  const tabs = h('div',{class:'row bal-tabs'}); const area = h('div',{class:'stage'}); const after = h('div');

}

const ELEMENTS = ['Hydrogen','Helium','Lithium','Beryllium','Boron','Carbon','Nitrogen','Oxygen','Fluorine','Neon','Sodium','Magnesium','Aluminium','Silicon','Phosphorus','Sulfur','Chlorine','Argon'];
const SYMBOLS  = ['H','He','Li','Be','B','C','N','O','F','Ne','Na','Mg','Al','Si','P','S','Cl','Ar'];
const NEUTRONS = [0,2,4,5,6,6,7,8,10,10,12,12,14,14,16,16,18,22];

function atomBuilder(el, opts){
  opts = opts || {};
  const st = {p: opts.p||0, n: opts.n||0, e: opts.e||0};
  const svg = sv('svg',{viewBox:'0 0 320 320', class:'sim-svg', role:'img', 'aria-label':'Atom model'});
  const gS = sv('g'), gN = sv('g'); svg.append(gS, gN);
  const info = h('div',{class:'readout'});
  const steppers = [
    stepper({label:'Protons', sub:'positive (+), in the nucleus', value:st.p, min:0, max:18, onChange:v=>{st.p=v; draw();}}),
    stepper({label:'Neutrons', sub:'no charge, in the nucleus', value:st.n, min:0, max:22, onChange:v=>{st.n=v; draw();}}),
    stepper({label:'Electrons', sub:'negative (−), in the shells', value:st.e, min:0, max:18, onChange:v=>{st.e=v; draw();}})
  ];
  el.append(h('div',{class:'sim-grid'}, svg, h('div',{class:'controls'}, h('div',{class:'card', style:{padding:'6px 14px'}}, steppers), info)));
  function draw(){
    while (gS.firstChild) gS.firstChild.remove(); while (gN.firstChild) gN.firstChild.remove();
    const shells = [2,8,8], radii = [62,98,134];
    let left = st.e;
    shells.forEach((cap,i)=>{
      gS.append(sv('circle',{cx:160, cy:160, r:radii[i], fill:'none', stroke:'var(--line)', 'stroke-width':2, 'stroke-dasharray': i===0?'':'4 5'}));
      const cnt = Math.min(cap, left); left -= cnt;
      const g = sv('g',{class: reduceMotion ? '' : 'spin', style:`animation-duration:${18+i*8}s`});
      for (let k=0;k<cnt;k++){ const a = 2*Math.PI*k/cnt - Math.PI/2; const x = 160+radii[i]*Math.cos(a), y = 160+radii[i]*Math.sin(a);
        g.append(sv('circle',{cx:x, cy:y, r:9, fill:'var(--flow)'}), sv('text',{x, y:y+1, class:'cell-txt', 'font-size':14}, '−')); }
      gS.append(g);
    });
    const parts = []; let a=st.p, b=st.n; while (a||b){ if (a){parts.push('p'); a--;} if (b){parts.push('n'); b--;} }
    parts.forEach((t,k)=>{ const r = 7.2*Math.sqrt(k), ang = k*2.39996; const x = 160 + r*Math.cos(ang), y = 160 + r*Math.sin(ang);
      gN.append(sv('circle',{cx:x, cy:y, r:8, fill: t==='p' ? '#d9484a' : '#8f98ad', stroke:'var(--board)', 'stroke-width':1.5}));
      if (t==='p') gN.append(sv('text',{x, y:y+.5, class:'cell-txt', 'font-size':11}, '+')); });
    if (!parts.length) gN.append(sv('text',{x:160, y:160, class:'lbl', fill:'var(--muted)'}, 'Add some protons!'));
    const name = st.p>0 ? `${ELEMENTS[st.p-1]} (${SYMBOLS[st.p-1]})` : 'No element yet';
    const q = st.p - st.e; const chg = q===0 ? '0, neutral' : (q>0 ? `+${q}, an ion` : `${q}, an ion`);
    info.innerHTML = '';
    info.append(h('div',{}, h('span',{}, 'Element'), h('b',{style:{fontSize:'1rem'}}, name)), h('div',{}, h('span',{}, 'Overall charge'), h('b',{style:{fontSize:'1rem'}}, chg)), h('div',{}, h('span',{}, 'Mass number (p + n)'), h('b',{}, st.p+st.n)));
    if (opts.onChange) opts.onChange(Object.assign({}, st));
  }
  draw();
  return { svgEl: svg, set(p,n,e){ st.p=p; st.n=n; st.e=e; steppers[0].set(p); steppers[1].set(n); steppers[2].set(e); draw(); }, get state(){ return Object.assign({}, st); } };
}

function beamTube(el, onChange){
  let mode = 'off';
  const svg = sv('svg',{viewBox:'0 0 440 190', class:'sim-svg', role:'img', 'aria-label':'Thomson’s glass tube with a beam'});
  svg.append(sv('rect',{x:20, y:40, width:400, height:110, rx:50, fill:'var(--glass)', stroke:'var(--metal)', 'stroke-width':2}));
  svg.append(sv('rect',{x:30, y:80, width:14, height:30, fill:'var(--metal)'}), sv('text',{x:37, y:170, class:'t-small svg-muted', 'text-anchor':'middle'}, 'beam starts here'));
  svg.append(sv('rect',{x:400, y:52, width:8, height:86, fill:'#7dffb0', opacity:.5}), sv('text',{x:404, y:30, class:'t-small svg-muted', 'text-anchor':'middle'}, 'glowing screen'));
  const top = sv('g'), bot = sv('g'), beam = sv('path',{fill:'none', stroke:'#2fd27a', 'stroke-width':4, 'stroke-linecap':'round'}), dot = sv('circle',{r:7, fill:'#7dffb0'});
  svg.append(top, bot, beam, dot);
  const plate = (g, y, sign)=>{ while (g.firstChild) g.firstChild.remove(); const col = sign==='+' ? '#d9484a' : sign==='−' ? '#4a73d9' : 'var(--metal)'; g.append(sv('rect',{x:170, y, width:120, height:10, rx:2, fill:col})); if (sign) g.append(sv('text',{x:300, y:y+8, class:'lbl', 'text-anchor':'start', style:`fill:${col}`, 'font-size':16}, sign)); };
  function draw(){
    const d = mode==='off' ? 0 : mode==='topPos' ? -1 : 1;
    plate(top, 62, d===0 ? '' : d<0 ? '+' : '−'); plate(bot, 118, d===0 ? '' : d<0 ? '−' : '+');
    const endY = 95 + d*38;
    beam.setAttribute('d', `M44 95 L170 95 Q260 95 404 ${endY}`); dot.setAttribute('cx', 404); dot.setAttribute('cy', endY);
    if (onChange) onChange(mode);
  }
  el.append(svg, h('div',{class:'ctrl'}, h('label',{}, 'Metal plates'), seg([['off','Plates off'],['topPos','Top +, bottom −'],['topNeg','Top −, bottom +']], 'off', v=>{ mode=v; draw(); }, 'Metal plates')));
  draw();
}

const dist = (a,b)=>Math.hypot(a.x-b.x, a.y-b.y);

const count = (ps,t)=>ps.filter(p=>p.t===t).length;
const MODELS = {

    exemplar(s){ s.append(drawPiece({t:'ball', x:100, y:100})); }, note:'Dalton imagined each atom as a solid, uncuttable ball.'},
  thomson:{title:'Thomson’s model (1897)', text:'Build Thomson’s plum pudding model.', check(ps){ const pud = ps.find(p=>p.t==='pudding'); const inside = pud ? ps.filter(p=>p.t==='electron' && dist(p,pud) < 86).length : 0; return [

function modelMaker(area, key, m){

  function rubBy(d){ if (!over()) return; acc += d; while (acc > 70){ acc -= 70; if (t < pair.max){ t++; } } }
  gObj.addEventListener('pointerdown', ev=>{ dragging = true; lastP = toSvg(ev); try{ gObj.setPointerCapture(ev.pointerId); }catch(e){} gObj.style.cursor='grabbing'; ev.preventDefault(); });
  gObj.addEventListener('pointermove', ev=>{ if (!dragging) return; const p = toSvg(ev); const dx = p.x-lastP.x, dy = p.y-lastP.y; pos.x = clamp(pos.x+dx, 50, 430); pos.y = clamp(pos.y+dy, 40, 230); rubBy(Math.hypot(dx,dy)); lastP = p; draw(); });
  const attractNote = h('p',{class:'feedback hint', hidden:true});
  const end = ()=>{ if (!dragging) return; dragging = false; gObj.style.cursor='grab';
    if (t>0 && !over()){
      const from = {x:pos.x, y:pos.y}, to = {x:clamp(pos.x, CL.x+50, CL.x+CL.w-50), y:CL.y-38}; const t0 = performance.now();
      (function pull(now){ const k = clamp((now-t0)/650, 0, 1), e = k*k; pos.x = from.x+(to.x-from.x)*e; pos.y = from.y+(to.y-from.y)*e; draw(); if (k<1 && svg.isConnected) requestAnimationFrame(pull); })(t0);
      attractNote.hidden = false; attractNote.innerHTML = `<b>Whoa!</b> The ${pair.obj.toLowerCase()} was pulled back towards the ${pair.cloth.toLowerCase()}. They now have opposite charges, and opposite charges attract!`;
      if (opts.onAttract) opts.onAttract();
    } };
  gObj.addEventListener('pointerup', end); gObj.addEventListener('pointercancel', end);
  svg.style.touchAction = 'none';
  const rubBtn = h('button',{class:'btn', type:'button', onclick:()=>{ pos = {x:190, y:170}; if (t<pair.max) t++; draw(); }}, 'Rub for me');
  const letGo = h('button',{class:'btn', type:'button', onclick:()=>{ pos = {x:400, y:70}; draw(); dragging = true; end(); }}, 'Pull it away and let go');
  const resetBtn = h('button',{class:'btn', type:'button', onclick:()=>{ t=0; acc=0; pos={x:390,y:80}; attractNote.hidden = true; draw(); }}, 'Start again');
  const top = h('div',{class:'row'});
  if (opts.choosePair){ top.append(seg(RUB_PAIRS.map(p=>[p.id, p.name]), pair.id, v=>{ pair = RUB_PAIRS.find(p=>p.id===v); t=0; acc=0; pos={x:390,y:80}; noteEl.textContent = pair.note; draw(); }, 'Materials')); }
  const noteEl = h('p',{class:'legend'}, opts.choosePair ? pair.note : 'Drag the balloon back and forth across the jumper. No mouse? Use the “Rub for me” button.');
  el.append(top, svg, noteEl, h('div',{class:'row'}, rubBtn, letGo, resetBtn), attractNote, ro);
  draw();
}

function chargeLab(el, opts){
  opts = opts || {};
  const mystery = opts.mystery!=null; const q = [0, mystery ? opts.mystery : 0]; let ang = [0,0], target = [0,0], raf = 0;
  const svg = sv('svg',{viewBox:'0 0 420 250', class:'sim-svg', role:'img', 'aria-label':'Two hanging charged balls'});
  svg.append(sv('rect',{x:60, y:14, width:300, height:10, rx:4, fill:'var(--metal)'}));
  const pivots = [[170,24],[250,24]]; const LEN = 170;
  const balls = pivots.map(()=>{ const g = sv('g'); svg.append(g); return g; });
  const result = h('div',{class:'feedback', role:'status'});
  function drawBall(i){
    const g = balls[i]; while (g.firstChild) g.firstChild.remove();
    const [px,py] = pivots[i]; const a = ang[i];
    const x = px + LEN*Math.sin(a), y = py + LEN*Math.cos(a);
    if (mystery && i===1){ g.append(sv('line',{x1:px, y1:py, x2:x, y2:y, stroke:'var(--muted)', 'stroke-width':1.5}), sv('circle',{cx:x, cy:y, r:26, fill:'var(--panel-2)', stroke:'var(--ink)', 'stroke-width':2, 'stroke-dasharray':'4 3'}), sv('text',{x, y:y+1, class:'lbl', 'font-size':22}, '?')); return; }
    g.append(sv('line',{x1:px, y1:py, x2:x, y2:y, stroke:'var(--muted)', 'stroke-width':1.5}), sv('circle',{cx:x, cy:y, r:26, fill: q[i]<0 ? '#cfe0ff' : q[i]>0 ? '#ffd6d6' : 'var(--panel)', stroke:'var(--ink)', 'stroke-width':2}));
    const sym = q[i]<0 ? '−' : q[i]>0 ? '+' : '';
    const col = q[i]<0 ? '#1d4fb0' : '#b02a2a';
    if (q[i]===0){ g.append(sv('text',{x:x-8, y:y-6, class:'lbl', style:'fill:#b02a2a', 'font-size':13}, '+'), sv('text',{x:x+8, y:y-6, class:'lbl', style:'fill:#1d4fb0', 'font-size':15}, '−'), sv('text',{x:x-8, y:y+9, class:'lbl', style:'fill:#1d4fb0', 'font-size':15}, '−'), sv('text',{x:x+8, y:y+9, class:'lbl', style:'fill:#b02a2a', 'font-size':13}, '+')); }
    else { [[-9,-7],[9,-7],[-9,9],[9,9]].forEach(([dx,dy])=>g.append(sv('text',{x:x+dx, y:y+dy, class:'lbl', style:`fill:${col}`, 'font-size':16}, sym))); }
  }
  function draw(){ drawBall(0); drawBall(1); }
  function animate(){
    let moving = false;
    for (let i=0;i<2;i++){ const d = target[i]-ang[i]; if (Math.abs(d) > .002){ ang[i] += d*(reduceMotion?1:.12); moving = true; } else ang[i] = target[i]; }
    draw(); if (moving && svg.isConnected) raf = requestAnimationFrame(animate); else raf = 0;
  }
  function release(){
    const p = q[0]*q[1]; let kind, tgt;
    if (q[0]===0 && q[1]===0){ kind='none'; tgt=0; }
    else if (p>0){ kind='repel'; tgt=-0.3; }
    else if (p<0){ kind='attract'; tgt=0.08; }
    else { kind='weak'; tgt=0.035; }
    target = [tgt, -tgt]; if (!raf) raf = requestAnimationFrame(animate);
    const msgs = {
      repel:'<strong>They push apart!</strong> Like charges <b>repel</b> each other.',
      attract:'<strong>They pull together!</strong> Opposite charges <b>attract</b> each other.',
      weak:'<strong>A small pull!</strong> A charged object can attract a neutral one. The charges inside the neutral ball shift a little, so its near side becomes slightly charged. This is how a rubbed balloon sticks to a wall.',
      none:'<strong>Nothing happens.</strong> Two neutral objects don’t push or pull each other.'};
    const mmsgs = {repel:'<strong>They pushed apart!</strong>', attract:'<strong>They pulled together strongly!</strong>', weak:'<strong>A small pull together.</strong>', none:'<strong>Nothing happened.</strong>'};
    result.className='feedback ok'; result.innerHTML = mystery ? mmsgs[kind] : msgs[kind];
    if (opts.onRelease) opts.onRelease(kind, q.slice());
  }
  const controls = (mystery ? [0] : [0,1]).map(i=>h('div',{class:'ctrl'}, h('label',{}, h('span',{}, `Ball ${i===0?'A':'B'} charge`)), seg([[-1,'Negative −'],[0,'Neutral'],[1,'Positive +']], 0, v=>{ q[i]=v; target=[0,0]; ang=[0,0]; result.className='feedback'; result.innerHTML=''; draw(); }, `Ball ${i?'B':'A'} charge`)));
  el.append(h('div',{class:'sim-grid'}, svg, h('div',{class:'controls'}, controls, mystery ? h('p',{}, h('b',{}, 'Ball B is a mystery ball.'), ' Its charge is hidden.') : null, h('button',{class:'btn primary', type:'button', onclick:release}, 'Let go!'), result)));
  draw();
}

    if (k<n-1) g.append(sv('path',{d: right ? `M${x0+16} ${y} H${x0+6} V${cy(k+1)} H${x0+11}` : `M${x0+94} ${y} H${x0+104} V${cy(k+1)} H${x0+99}`, class:'strap'}));
  }
  const last = n-1, lastRight = last%2===0;

  g.append(sv('path',{d:minusD, class:'wire-cu'}));

  return {plus:[x0+110, cy(0)], minusEnd:[x0+140, railY], minusD};
}

    ro.append(h('div',{}, h('span',{}, s.on ? 'This magnet can lift' : 'When it’s on, it can lift'), h('b',{}, `${clipsFor(Object.assign({}, s, {on:true}))*KG} kg`)), h('div',{}, h('span',{}, 'Coils'), h('b',{}, s.coils)), h('div',{}, h('span',{}, 'Cells'), h('b',{}, s.cells)), h('div',{}, h('span',{}, 'Core'), h('b',{}, CORES[s.core].name)));
  }
  let everOn = false, dragging = false;
  svg.addEventListener('pointermove', ev=>{ if (!dragging) return; moveTo(svgPt(svg, ev).x); });
  const stop = ()=>{ dragging = false; }; svg.addEventListener('pointerup', stop); svg.addEventListener('pointercancel', stop);
  function moveTo(x){ tx = clamp(x, 270, W-40); drawStatic(); tryLift(); }
  function emit(){ if (opts.onChange) opts.onChange({state:s, strength, loads, zone, x:tx}); }
  function tryLift(){
    if (!s.on) return;
    const reach = loads.filter(L=>L.st==='rest' && Math.abs(L.x - tx) < (L.kind==='bale' ? 36 : 56)).sort((a,b)=>Math.abs(a.x-tx)-Math.abs(b.x-tx));
    let changed = false;
    reach.forEach(L=>{
      if (!L.mag){ if (!L.told){ L.told = true; say(`The <b>aluminium</b> cans didn’t move at all. Aluminium isn’t a magnetic metal, so even a strong electromagnet can’t pick it up.`); } return; }
      if (strength <= 0){ say(`Nothing moved. This electromagnet is too weak to lift anything${s.core!=='iron' && CORES[s.core].f<.5 ? `. ${/^[aeiou]/i.test(CORES[s.core].name) ? 'An' : 'A'} ${CORES[s.core].name.toLowerCase()} isn’t magnetic, so it hardly helps` : ''}. What could you change?`); return; }
      if (heldW() + L.w <= strength){ L.st = 'fly'; L.hitRim = false; changed = true; }
      else { L.shake = 30; say(heldW() ? `It can’t lift that one as well. It’s already holding ${heldW()*KG} kg.` : `The ${L.kind==='car' ? 'car' : L.kind==='beam' ? 'beam' : 'bale'} wobbled, but it’s too heavy! It weighs <b>${L.w*KG} kg</b> and this magnet can only lift <b>${strength*KG} kg</b>.`); }
    });
    if (changed){ say('Lifted! Now move the crane and switch off to drop it.'); if (opts.onLift) opts.onLift(loads.filter(L=>L.st==='held' || L.st==='fly')); emit(); }
  }
  function dropAll(){ loads.forEach(L=>{ if (L.st==='held' || L.st==='fly'){ L.st = 'fall'; L.vy = 0; } }); }
  function update(){ strength = clipsFor(s, false); if (!s.on) dropAll(); else { while (heldW() > strength){ const L = loads.filter(x=>x.st==='held' || x.st==='fly').pop(); L.st = 'fall'; L.vy = 0; say('Too weak to hold it all now! Something fell.'); } } drawStatic(); tryLift(); emit(); }
  function setOn(v){ s.on = v; if (v){ everOn = true; loads.forEach(L=>{ L.told = false; }); say('It’s on! Move the crane over something made of steel.'); } toggle.textContent = s.on ? 'Switch off' : 'Switch on'; if (!v) say(loads.some(L=>L.st==='held' || L.st==='fly') ? 'Switched off! The electromagnet lets go, and the load falls straight down from where the crane is.' : 'Switched off.'); update(); }
  function heldSlot(L){ const hs = loads.filter(x=>x.st==='held' || x.st==='fly'); const i = hs.indexOf(L), n = hs.length; const top = PLATE + (L.kind==='bale' ? 36 : L.kind==='car' ? 52 : 22); return {x: tx + (i - (n-1)/2)*52, y: top}; }
  let t0 = 0;
  (function loop(){
    if (!svg.isConnected && t0>5) return; t0++;
    loads.forEach(L=>{
      if (L.st==='fly' || L.st==='held'){ const p = heldSlot(L); L.x += (p.x-L.x)*.25; L.y += (p.y-L.y)*.25; if (L.st==='fly' && Math.hypot(p.x-L.x, p.y-L.y) < 1) L.st = 'held'; }
      else if (L.st==='fall'){ L.vy += .8; L.y += L.vy;
        // hard skip walls: a bale that hits the rim tips off to whichever side its middle is on
        if (zone && zone.kind==='skip' && L.kind==='bale' && L.y > GROUND - (zone.wallH||100)){ [zone.x1-3.5, zone.x2+3.5].forEach(wx=>{ if (Math.abs(L.x - wx) < 28.5){ const dir = L.x < wx ? -1 : 1; L.x += dir*4; L.y -= L.vy*.7; L.vy *= .5; L.rot = dir*14; L.hitRim = true; } }); }
        const fl = surfaceAt(L); if (L.y >= fl){ L.y = fl; L.st = 'rest'; L.vy = 0; L.rot = 0; if (L.kind==='car' && zone && zone.kind==='crusher' && inZone(L)){ L.crushed = true; drawLoad(L); } if (opts.onLand) opts.onLand(L, inZone(L), {state:s, loads, inZone}); emit(); } }
      if (L.shake){ L.shake--; }
      placeLoad(L);
    });
    if (s.on) gS.querySelectorAll('.flow-cu').forEach(p=>p.setAttribute('stroke-dashoffset', String((p.classList.contains('rev') ? 1 : -1) * (t0*.6 % 20))));
    requestAnimationFrame(loop);
  })();
  const ctr = h('div',{class:'controls'});
  const toggle = h('button',{class:'btn primary', type:'button', onclick:()=>setOn(!s.on)}, 'Switch on');
  ctr.append(toggle, h('div',{class:'row'}, h('button',{class:'btn small', type:'button', onclick:()=>moveTo(tx-30)}, '◀ Move crane'), h('button',{class:'btn small', type:'button', onclick:()=>moveTo(tx+30)}, 'Move crane ▶')));
  const want = opts.controls || ['coils','cells'];
  if (want.includes('coils')) ctr.append(slider({label:'Coils of wire', min:10, max:50, step:10, value:s.coils, onInput:v=>{ s.coils=v; update(); }}));
  if (want.includes('cells')) ctr.append(slider({label:'Number of cells', min:1, max:4, value:s.cells, onInput:v=>{ s.cells=v; update(); }}));
  if (want.includes('core')){ const sel = h('select',{id:uid('core'), onchange:()=>{ s.core = sel.value; update(); }}, Object.entries(CORES).filter(([k])=>!opts.cores || opts.cores.includes(k)).map(([k,c])=>h('option',{value:k, selected:k===s.core}, c.name))); ctr.append(h('div',{class:'ctrl'}, h('label',{for:sel.id}, 'Core material'), sel)); }
  ctr.append(ro, msgEl, h('button',{class:'btn small ghost', type:'button', onclick:()=>{ loads.forEach((L,i)=>{ Object.assign(L, opts.loads[i], {st:'rest', vy:0, y:opts.loads[i].floor || GROUND, crushed:false, told:false}); drawLoad(L); }); say('Everything is back where it started.'); emit(); }}, '↻ Reset the yard'));
  loads.forEach(L=>{ drawLoad(L); placeLoad(L); });
  drawTarget(); drawStatic();
  say('Tap the <b>switch</b> in the control cabin to turn the electromagnet on. Drag the crane to move it.');
  el.append(h('div',{class:'sim-grid crane-grid'}, svg, ctr));
  return {state:s, loads};
}

/* ================= Stop 3: Volta and circuits ================= */
const LW = Circuit.loopWith;
const BASIC = {'h,0,2':'bulb','h,2,2':'cell'};
const BYPASS = {'v,0,2':{type:'wire', locked:false}, 'h,1,2':{type:'wire', locked:false}, 'v,0,3':{type:'wire', locked:false}};

function partsGallery(el){
  const parts = [
    ['cell','Cell','Gives the push (voltage) that makes electricity flow. Two or more cells joined together make a <b>battery</b>. The long line on the symbol is the + end.'],
    ['wire','Wire','Metal wires are <b>conductors</b>: they let electricity flow through them easily.'],
    ['bulb','Bulb','Glows when electricity flows through its thin filament.'],
    ['switch','Switch','Opens or closes a gap in the circuit, turning it off or on.'],
    ['ammeter','Ammeter','Measures the <b>current</b> flowing through it, in amps (A).']];
  const grid = h('div',{class:'parts-grid'});
  parts.forEach(([t,name,desc])=>{
    const a = h('div',{}), b = h('div',{});
    const edge = {'h,0,0': t==='switch' ? {type:t, closed:true} : t==='ammeter' ? {type:t, label:' '} : {type:t}};
    grid.append(h('div',{class:'part-card'}, h('b',{}, name), h('div',{class:'pair'}, a, b), h('p',{html:desc})));
    Circuit.board(a, {cols:1, rows:0, edges:edge, readonly:true, mini:true, hideResults:true, view:'picture', label:name+' picture'});
    Circuit.board(b, {cols:1, rows:0, edges:edge, readonly:true, mini:true, hideResults:true, view:'symbols', label:name+' symbol'});
  });
  el.append(grid, h('p',{class:'legend'}, 'Left: what the part looks like. Right: its circuit symbol. Scientists everywhere use the same symbols, so anyone can read a circuit diagram.'));
}
/* a "try it with real parts" card for Explore labs */
function tryParts(el, cfg){
  const card = h('div',{class:'card', style:{display:'grid', gap:'12px'}}, h('h3',{}, cfg.title || 'Try it with real parts'), h('div',{class:'try-list', html:'<b>Try this:</b><ol>' + cfg.tries.map(t=>'<li>' + t + '</li>').join('') + '</ol>'}));
  el.append(card);
  Circuit.board(card, {cols:6, rows:4, edges:cfg.edges, tools:cfg.tools, clearable:true});
}
function puzzle(stage, api, cfg){
  return Circuit.board(stage, {cols:4, rows:2, edges:cfg.edges, tools:cfg.tools, slots:cfg.slots, noUnscrew:cfg.noUnscrew, onChange:(s,user)=>{ if (!api.isDone() || cfg.always) cfg.check(s, api, user); }});
}

function magnetCoil(stage, onBoth){

  const meterG = sv('g'); svg.append(meterG);
  meterG.append(sv('path',{d:'M350 64 A50 50 0 0 1 430 64', fill:'none', stroke:'var(--ink)', 'stroke-width':2}), sv('text',{x:390, y:80, class:'t-small svg-muted', 'text-anchor':'middle'}, '0'));
  const needle = sv('line',{x1:390, y1:76, x2:390, y2:30, stroke:'#d9484a', 'stroke-width':3, 'stroke-linecap':'round'}); meterG.append(needle);
  const mag = sv('g'); mag.append(sv('rect',{x:0, y:-14, width:50, height:28, fill:'#d9484a'}), sv('rect',{x:50, y:-14, width:50, height:28, fill:'#4a73d9'}), sv('text',{x:25, y:0, class:'cell-txt', 'font-size':14}, 'S'), sv('text',{x:75, y:0, class:'cell-txt', 'font-size':14}, 'N'));

  const setMag = ()=>{ mag.setAttribute('transform', `translate(${30 + pos*1.9} 110)`); };
  function push(v){ const now = performance.now(); const dt = Math.max(8, now-lastT); const vel = (v-lastPos)/dt; lastPos = v; lastT = now; pos = v; setMag(); ang = clamp(vel*260, -65, 65); if (ang>25) seenP = true; if (ang<-25) seenN = true; if (seenP && seenN && onBoth){ const f = onBoth; onBoth = null; f(); } }
  (function decay(){ if (!svg.isConnected) return; if (performance.now()-lastT > 60) ang *= 0.88; needle.setAttribute('transform', `rotate(${ang} 390 76)`); requestAnimationFrame(decay); })();

  stage.append(svg, sl, h('div',{class:'row'}, h('button',{class:'btn', type:'button', onclick:()=>glide(100)}, 'Push the magnet in'), h('button',{class:'btn', type:'button', onclick:()=>glide(0)}, 'Pull the magnet out')));
  setMag();
}

    [[190,30,70],[190,160,200]].forEach(([x,y1,y2])=>{ for (let i=0;i<n;i++){ const y = y1 + i*((y2-y1)/(n-1)); coilG.append(sv('ellipse',{cx:230, cy:y, rx:40, ry:4, fill:'none', stroke:'var(--copper)', 'stroke-width':2.5})); } }); }
  function drawBlades(){ while (blades.firstChild) blades.firstChild.remove();
    if (s.source==='crank'){ blades.append(sv('line',{x1:0,y1:0,x2:0,y2:-40, stroke:'var(--ink)', 'stroke-width':6, 'stroke-linecap':'round'}), sv('circle',{cx:0, cy:-40, r:8, fill:'var(--copper)'})); }
    else for (let i=0;i<(s.source==='wind'?3:6);i++) blades.append(sv('path',{d:'M0 0 Q 12 -30 0 -62 Q -10 -30 0 0', fill: s.source==='water' ? '#4a90c9' : s.source==='steam' ? 'var(--metal)' : 'var(--panel)', stroke:'var(--ink)', 'stroke-width':1.5, transform:`rotate(${i*360/(s.source==='wind'?3:6)})`}));
    blades.append(sv('circle',{cx:0, cy:0, r:7, fill:'var(--ink)'})); }
  const scope = sv('svg',{viewBox:'0 0 460 130', class:'sim-svg', role:'img', 'aria-label':'Oscilloscope trace'});
  scope.append(sv('rect',{x:0, y:0, width:460, height:130, fill:'#0c1f16'}));
  for (let x=0;x<=460;x+=46) scope.append(sv('line',{x1:x, y1:0, x2:x, y2:130, stroke:'#1e4a33'}));
  for (let y=5;y<=130;y+=30) scope.append(sv('line',{x1:0, y1:y, x2:460, y2:y, stroke:'#1e4a33'}));
  scope.append(sv('line',{x1:0, y1:65, x2:460, y2:65, stroke:'#3d8a62', 'stroke-width':1.5}), sv('text',{x:8, y:16, fill:'#7dffb0', 'font-size':11, 'font-family':'var(--font-mono)'}, '+ (one way)'), sv('text',{x:8, y:124, fill:'#7dffb0', 'font-size':11, 'font-family':'var(--font-mono)'}, '− (other way)'));
  const trace = sv('polyline',{fill:'none', stroke:'#7dffb0', 'stroke-width':2.5}); scope.append(trace);
  const samples = new Array(230).fill(0);

    if (!svg.isConnected) return;
    const dt = lt ? Math.min(.05,(t-lt)/1000) : 0; lt = t;
    const w = s.speed/100*2*Math.PI*1.2; theta += w*dt;
    const deg = theta*180/Math.PI;

    const v = peak()*Math.sin(theta);

  const ctr = h('div',{class:'controls'});

  if (want.includes('source')) ctr.append(h('div',{class:'ctrl'}, h('label',{}, 'What spins the generator?'), seg(Object.entries(SOURCES).map(([k,v])=>[k,v.name]), s.source, v=>{ s.source=v; spd.querySelector('label span').textContent = SOURCES[v].speed; drawBlades(); upd(); }, 'Energy source')));
  if (want.includes('speed')){ spd = slider({label:SOURCES[s.source].speed, min:0, max:100, value:s.speed, unit:'%', onInput:v=>{ s.speed=v; upd(); }}); ctr.append(spd); }

  ctr.append(ro);
  el.append(h('div',{class:'sim-grid'}, h('div',{style:{display:'grid', gap:'8px'}}, svg, scope, h('p',{class:'legend'}, 'The green screen is an oscilloscope. It draws the voltage over time.')), ctr));
  drawCoils(); drawBlades(); upd(); requestAnimationFrame(frame);
  return s;
}

function sideBySide(stage, a, b){
  const A = h('div',{class:'sbs-col'}, h('h4',{class:'sbs-title'}, a.title)), B = h('div',{class:'sbs-col'}, h('h4',{class:'sbs-title'}, b.title));
  stage.append(h('div',{class:'sbs'}, A, B));
  const ba = Circuit.board(A, Object.assign({cols:4, rows:2, readonly:true}, a, {mini:false, compare:true}));
  const bb = Circuit.board(B, Object.assign({cols:4, rows:2}, b, {mini:false, compare:true}));
  return [ba, bb];
}

function scopeView(el, opts){
  opts = opts || {};
  let mode = opts.mode || 'dc';
  const svg = sv('svg',{viewBox:'0 0 360 130', class:'sim-svg', role:'img', 'aria-label':'Oscilloscope'});
  svg.append(sv('rect',{x:0,y:0,width:360,height:130,fill:'#0c1f16'}));
  for (let x=0;x<=360;x+=40) svg.append(sv('line',{x1:x,y1:0,x2:x,y2:130,stroke:'#1e4a33'}));
  svg.append(sv('line',{x1:0,y1:65,x2:360,y2:65,stroke:'#3d8a62','stroke-width':1.5}));
  const tr = sv('polyline',{fill:'none', stroke:'#7dffb0', 'stroke-width':2.5}); svg.append(tr);
  const wire = sv('svg',{viewBox:'0 0 360 40', class:'sim-svg', role:'img', 'aria-label':'Electrons in a wire'});
  wire.append(sv('rect',{x:0, y:12, width:360, height:16, rx:8, fill:'var(--copper)', opacity:.35}));
  const dots = []; for (let i=0;i<14;i++){ const c = sv('circle',{cx:i*26+8, cy:20, r:5, fill:'var(--flow)'}); wire.append(c); dots.push({c, x:i*26+8}); }
  let t0 = performance.now();
  function frame(t){
    if (!svg.isConnected) return;
    const tt = (t - t0)/1000;
    const pts = [];
    for (let x=0;x<=360;x+=4){ const y = mode==='dc' ? 65-35 : 65 - 45*Math.sin(2*Math.PI*(x/120) - tt*(reduceMotion?0:2.5)); pts.push(`${x},${y.toFixed(1)}`); }
    tr.setAttribute('points', pts.join(' '));
    dots.forEach((d,i)=>{ let x; if (mode==='dc'){ x = ((d.x + tt*(reduceMotion?0:30)) % 364); } else { x = d.x + 9*Math.sin(tt*(reduceMotion?0:5)); } d.c.setAttribute('cx', x.toFixed(1)); });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  const label = h('b',{}, opts.title || '');
  el.append(h('div',{style:{display:'grid', gap:'6px'}}, label, svg, wire, opts.caption ? h('p',{class:'legend'}, opts.caption) : null));
  return { set(m, title){ mode = m; if (title) label.textContent = title; } };
}

function transmission(el, opts){

    if (s.mode==='ac') lineG.append(sv('rect',{x:92, y:110, width:22, height:30, rx:3, fill:'var(--accent)'}), sv('text',{x:103, y:153, class:'t-small svg-muted', 'text-anchor':'middle', 'font-size':9}, 'step-up'));
    for (let i=0;i<12;i++){ const x = 352 + (i%4)*26, y = 92 + Math.floor(i/4)*28; const lit = i < Math.round(f*12);
      town.append(sv('rect',{x, y, width:20, height:20, fill:'var(--panel)', stroke:'var(--ink)', 'stroke-width':1.2}), sv('path',{d:`M${x-2} ${y} L${x+10} ${y-9} L${x+22} ${y} Z`, fill:'var(--copper)'}), sv('rect',{x:x+6, y:y+6, width:8, height:8, fill: lit ? 'var(--spark)' : 'var(--cellbody)'})); }
    distText.textContent = `${s.d} km of wire`;
    ro.innerHTML=''; ro.append(h('div',{}, h('span',{}, 'Energy reaching the town'), h('b',{}, Math.round(f*100)+'%')), h('div',{}, h('span',{}, 'Wasted as heat in the wires'), h('b',{}, Math.round((1-f)*100)+'%')), h('div',{}, h('span',{}, 'Homes lit'), h('b',{}, `${Math.round(f*12)} of 12`)));
    if (opts.onChange) opts.onChange(Object.assign({f}, s));
  }
  el.append(h('div',{class:'sim-grid'}, svg, h('div',{class:'controls'},
    h('div',{class:'ctrl'}, h('label',{}, 'Type of current'), seg([['dc','Edison’s DC'],['ac','Tesla’s AC with transformers']], s.mode, v=>{ s.mode=v; draw(); }, 'Type of current')),
    slider({label:'Distance to the town', min:1, max:100, value:s.d, unit:' km', onInput:v=>{ s.d=v; draw(); }}), ro)));
  draw();
  return s;
}
