<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sparks Through Time</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
[hidden]{display:none !important}
/* Layout concept: a time machine. A sticky "destination dial" header, a vertical timeline of stops on the home screen,
   and each stop opens into a lab bench with Learn / Explore / Challenge tabs. Cool blueprint paper, indigo ink, copper wire, spark yellow. */
:root{
  --bg:#eceff5; --panel:#ffffff; --panel-2:#f4f6fb; --ink:#1a2140; --muted:#56607e; --line:#d2d7e5;
  --accent:#3a4bd1; --accent-ink:#ffffff; --accent-soft:#e3e6fb;
  --spark:#f2b200; --spark-ink:#3b2a00; --copper:#b4622a; --flow:#1d6be0;
  --ok:#1b7f46; --ok-bg:#e1f4e8; --bad:#b83434; --bad-bg:#fae6e6; --hint-bg:#fff4d6; --hint:#7a5600;
  --board:#f8f9fc; --dot:#c3c9da; --glass:#eef3ff; --metal:#8f98ad; --cellbody:#2a2f3d; --wood:#c89a5c;
  --hue-l:40%; --hue-bg:94%;
  --font-display: Rockwell, "Rockwell Nova", "Roboto Slab", "Zilla Slab", "DejaVu Serif", Georgia, serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1222; --panel:#161b31; --panel-2:#1b2140; --ink:#e7eaf6; --muted:#9ba4c4; --line:#2b3254;
  --accent:#8e9cff; --accent-ink:#0e1222; --accent-soft:#232a52;
  --spark:#ffcf3a; --spark-ink:#2a1e00; --copper:#e48b4c; --flow:#5aa8ff;
  --ok:#53c98a; --ok-bg:#12301f; --bad:#ff8080; --bad-bg:#3a1919; --hint-bg:#352a0c; --hint:#ffd879;
  --board:#11162a; --dot:#323a5c; --glass:#2a3150; --metal:#6c7590; --cellbody:#05070d; --wood:#8a6634;
  --hue-l:74%; --hue-bg:18%; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0e1222; --panel:#161b31; --panel-2:#1b2140; --ink:#e7eaf6; --muted:#9ba4c4; --line:#2b3254;
  --accent:#8e9cff; --accent-ink:#0e1222; --accent-soft:#232a52;
  --spark:#ffcf3a; --spark-ink:#2a1e00; --copper:#e48b4c; --flow:#5aa8ff;
  --ok:#53c98a; --ok-bg:#12301f; --bad:#ff8080; --bad-bg:#3a1919; --hint-bg:#352a0c; --hint:#ffd879;
  --board:#11162a; --dot:#323a5c; --glass:#2a3150; --metal:#6c7590; --cellbody:#05070d; --wood:#8a6634;
  --hue-l:74%; --hue-bg:18%; color-scheme:dark; }

*{box-sizing:border-box}
html,body{background:var(--bg); color:var(--ink)}
body{font-family:var(--font-body); font-size:16px; line-height:1.55; margin:0; background-repeat:repeat}
@media (max-width:620px){ .celebrate{grid-template-columns:minmax(0,1fr)} }
button{font:inherit; color:inherit}
h1,h2,h3{font-family:var(--font-display); line-height:1.15; text-wrap:balance; margin:0}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:6px}

/* ---------- header / time dial ---------- */
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--panel); border-bottom:1px solid var(--line);}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--panel)}
.topbar-in{max-width:1100px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding-block:10px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:10px; background:none; border:0; cursor:pointer; padding:0; text-align:left}
.brand b{font-family:var(--font-display); font-size:1.2rem; letter-spacing:.01em}
.brand small{display:block; color:var(--muted); font-size:.78rem; line-height:1.2}
.dial{display:flex; align-items:center; gap:10px}
.dial-label{font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); text-align:right; line-height:1.25}
.dial-label span{display:block; color:var(--ink); letter-spacing:.02em; text-transform:none; font-size:.82rem}
.dial-face{font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:1.35rem; font-weight:700; letter-spacing:.06em;
  background:var(--ink); color:var(--spark); padding:4px 12px; border-radius:8px; min-width:7.2em; text-align:center; box-shadow:inset 0 0 0 2px var(--copper)}

.wrap{max-width:1100px; margin:0 auto; padding-block:24px 64px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}

/* ---------- Pip ---------- */
.pip-row{display:flex; gap:12px; align-items:flex-start}
.pip-row svg{flex:none}
.bubble{position:relative; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 16px; min-width:0; max-width:72ch}
.bubble::before{content:""; position:absolute; left:-7px; top:18px; width:12px; height:12px; background:var(--panel); border-left:1px solid var(--line); border-bottom:1px solid var(--line); transform:rotate(45deg)}
.bubble p+p{margin-top:.6em}

/* ---------- home ---------- */
.hero{display:grid; gap:18px; margin-bottom:28px}
.hero h1{font-size:clamp(2rem, 6vw, 3.3rem); letter-spacing:-.01em}
.hero h1 em{font-style:normal; color:var(--copper)}
.hero .lede{color:var(--muted); max-width:60ch; font-size:1.05rem}
.passport{display:grid; gap:12px; padding:14px 18px; background:var(--panel); border:2px dashed var(--copper); border-radius:var(--r); max-width:100%}
.passport-head{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.stamp-sheet{display:flex; flex-wrap:wrap; gap:10px 14px}
.stamp-pair{display:grid; justify-items:center; gap:2px; background:none; border:0; padding:4px; cursor:pointer; border-radius:10px}
.stamp-pair:hover{background:var(--panel-2)}
.stamp-pair-imgs{display:flex; gap:0}
.stamp-pair small{font-size:.72rem; color:var(--muted); font-weight:700}
.best-pill{font-family:var(--font-mono); font-size:.75rem; font-weight:700; border:2px dashed var(--line); border-radius:99px; padding:4px 10px; color:var(--muted)}
.stamp-in{animation:stampin .6s cubic-bezier(.2,1.5,.4,1) both}
@keyframes stampin{0%{transform:scale(2.4) rotate(-30deg); opacity:0}55%{opacity:1}100%{transform:scale(1) rotate(0)}}
.stamp-overlay{position:fixed; inset:0; z-index:60; display:grid; place-items:center; background:rgba(10,14,30,.5); padding:16px}
.stamp-modal{background:var(--panel); color:var(--ink); border-radius:18px; padding:26px 24px; display:grid; justify-items:center; gap:10px; max-width:360px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.3)}
.celebrate-stamp{display:grid; place-items:center}
.pip .pip-bolt{animation:crackle 1.7s steps(1) infinite}
.pip .pip-bolt:nth-of-type(2n){animation-delay:-.6s} .pip .pip-bolt:nth-of-type(3n){animation-delay:-1.1s}
@keyframes crackle{0%{opacity:1}25%{opacity:.15}45%{opacity:1}70%{opacity:.5}}
.pip .pip-halo{animation:halo 2.4s ease-in-out infinite; transform-origin:30px 33px}
@keyframes halo{50%{transform:scale(1.12); opacity:.32}}
.hero-top{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:16px; align-items:center}
.hero-text{display:grid; gap:10px; min-width:0}
.hero-art svg{display:block; width:260px; max-width:100%; height:auto}
@media (max-width:620px){ .hero-top{grid-template-columns:minmax(0,1fr)} .hero-art svg{width:220px} }
.opt.chosen{border-color:var(--accent); background:var(--accent-soft)}
.ask.predict{border:2px dashed var(--accent)}
.mission-wrap{display:grid; gap:14px}
.mission-list{display:grid; gap:10px; grid-template-columns:repeat(auto-fit, minmax(min(100%, 240px), 1fr))}
.mission.now{border-color:var(--accent)}
.mission .tick{color:var(--ok)}
.mission-play{display:grid; gap:12px}
.info-card{background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:12px 14px}
.chip-row{display:flex; flex-wrap:wrap; gap:6px}
.chip{font-size:.82rem; padding:3px 10px; border-radius:99px; background:var(--panel-2); border:1px solid var(--line); font-weight:600}
.chip.ok{background:var(--ok-bg); color:var(--ok); border-color:transparent}
.chip.no{background:var(--bad-bg); color:var(--bad); border-color:transparent}
.toolrow{display:flex; flex-wrap:wrap; gap:6px}
.mm-board{max-width:560px}
.ex-svg{flex:none; width:170px; height:170px; background:var(--board); border:1px solid var(--line); border-radius:10px}
.passport .count{font-family:var(--font-mono); font-weight:700; font-size:1.1rem}
.passport .bar{width:160px; max-width:40vw; height:8px; border-radius:99px; background:var(--panel-2); overflow:hidden; border:1px solid var(--line)}
.passport .bar i{display:block; height:100%; background:var(--spark)}

.timeline{position:relative; display:grid; gap:14px; padding-left:34px}
.timeline::before{content:""; position:absolute; left:11px; top:6px; bottom:6px; width:4px; border-radius:4px; background:linear-gradient(var(--copper), var(--spark))}
.stop-card{position:relative; display:grid; grid-template-columns:minmax(0,9.5rem) minmax(0,1fr) auto; gap:4px 18px; align-items:center; text-align:left; cursor:pointer;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:14px 18px; transition:transform .15s, border-color .15s}
.stop-card:hover{transform:translateX(4px); border-color:hsl(var(--hue) 60% var(--hue-l))}
.stop-card::before{content:""; position:absolute; left:-30px; top:50%; width:16px; height:16px; margin-top:-8px; border-radius:50%; background:var(--panel); border:4px solid hsl(var(--hue) 60% var(--hue-l))}
.stop-card .yr{font-family:var(--font-display); font-size:1.7rem; color:hsl(var(--hue) 60% var(--hue-l)); line-height:1}
.stop-card .yr small{display:block; font-family:var(--font-body); font-size:.76rem; color:var(--muted); margin-top:4px; line-height:1.2}
.stop-card h3{font-size:1.15rem}
.stop-card .meta{color:var(--muted); font-size:.9rem; min-width:0}
.stamps{display:flex; gap:6px}
.stamp{width:30px; height:30px; border-radius:50%; border:2px dashed var(--line); display:grid; place-items:center; font-size:.62rem; font-weight:700; color:var(--muted); font-family:var(--font-mono)}
.stamp.on{border:2px solid hsl(var(--hue) 60% var(--hue-l)); background:hsl(var(--hue) 70% var(--hue-bg)); color:hsl(var(--hue) 60% var(--hue-l)); transform:rotate(-8deg)}
.stop-card.test{--hue:262}
@media (max-width:620px){
  .stop-card{grid-template-columns:minmax(0,1fr) auto}
  .stop-card .yr{grid-column:1/-1; font-size:1.4rem}
  .stop-card .yr small{display:inline; margin-left:8px}
}
.home-foot{margin-top:36px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; color:var(--muted); font-size:.88rem}

/* ---------- buttons & controls ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--line); background:var(--panel); padding:9px 16px; border-radius:10px; cursor:pointer; font-weight:600; min-height:42px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.small{min-height:34px; padding:5px 12px; font-size:.9rem}
.btn.ghost{background:transparent}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.end{justify-content:flex-end}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--panel)}
.seg button{border:0; background:transparent; padding:7px 12px; cursor:pointer; font-size:.88rem; font-weight:600; min-height:36px}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.seg button+button{border-left:1px solid var(--line)}
.ctrl{display:grid; gap:4px; min-width:0}
.ctrl label{font-size:.88rem; font-weight:600; display:flex; justify-content:space-between; gap:10px}
.ctrl label output{font-family:var(--font-mono); color:var(--accent)}
input[type=range]{width:100%; accent-color:var(--accent)}
select{font:inherit; padding:7px 10px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--ink)}

/* ---------- stop page ---------- */
.back{margin-bottom:14px}
.stop-hero{display:grid; gap:14px; margin-bottom:18px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; background-image:linear-gradient(135deg, hsl(var(--hue) 70% var(--hue-bg)) 0%, var(--panel) 60%)}
.eyebrow{font-size:.75rem; letter-spacing:.14em; text-transform:uppercase; color:hsl(var(--hue) 60% var(--hue-l)); font-weight:700}
.stop-hero h2{font-size:clamp(1.7rem, 4.6vw, 2.6rem)}
.stop-hero .who{color:var(--muted)}
.tabs{display:flex; gap:6px; border-bottom:2px solid var(--line); margin:22px 0 18px; overflow-x:auto}
.tab{border:0; background:none; padding:10px 16px; font-weight:700; cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-2px; color:var(--muted); display:flex; gap:8px; align-items:center; white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:hsl(var(--hue) 60% var(--hue-l))}
.tab .tag{font-size:.7rem; font-weight:600; padding:2px 7px; border-radius:99px; background:var(--panel-2); border:1px solid var(--line)}
.tab .tag.done{background:var(--ok-bg); color:var(--ok); border-color:transparent}
.panel{display:grid; gap:16px}
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:18px; min-width:0}
.locked{display:grid; gap:12px; justify-items:start}

.learn-top{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
.steps-dots{display:flex; gap:6px}
.steps-dots span{width:12px; height:12px; border-radius:50%; background:var(--panel-2); border:2px solid var(--line)}
.steps-dots span.done{background:var(--ok); border-color:var(--ok)}
.steps-dots span.now{border-color:hsl(var(--hue) 60% var(--hue-l)); box-shadow:0 0 0 3px hsl(var(--hue) 70% var(--hue-bg))}
.step-title{font-size:1.35rem}
.stage{display:grid; gap:14px; min-width:0}
.feedback{border-radius:10px; padding:0; font-size:.98rem}
.feedback:empty{display:none}
.feedback.ok{background:var(--ok-bg); color:var(--ink); padding:12px 14px; border-left:5px solid var(--ok)}
.feedback.bad{background:var(--bad-bg); padding:12px 14px; border-left:5px solid var(--bad)}
.feedback.hint{background:var(--hint-bg); padding:12px 14px; border-left:5px solid var(--spark)}
.celebrate{display:grid; grid-template-columns:auto minmax(0,1fr); align-items:center; gap:18px; background:var(--ok-bg); border-radius:var(--r); padding:18px}
.celebrate h3{font-size:1.3rem}

/* ---------- quiz ---------- */
.quiz-head{display:flex; justify-content:space-between; color:var(--muted); font-size:.9rem; font-weight:600}
.quiz-card{display:grid; gap:14px; background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:18px; min-width:0}
.quiz-q{font-size:1.08rem; font-weight:600}
.quiz-opts{display:grid; gap:8px; grid-template-columns:repeat(auto-fit, minmax(min(100%, 230px), 1fr))}
.opt{text-align:left; border:2px solid var(--line); background:var(--panel-2); border-radius:10px; padding:10px 14px; cursor:pointer; min-height:46px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok); background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad); background:var(--bad-bg)}
.opt:disabled{cursor:default}
.ask{display:grid; gap:10px; background:var(--panel-2); border-radius:var(--r); padding:14px; border:1px solid var(--line)}
.score-big{font-family:var(--font-display); font-size:2.6rem; color:hsl(var(--hue) 60% var(--hue-l))}

/* ---------- circuit board ---------- */
.board{display:grid; gap:10px; min-width:0}
.toolbar{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.tool{display:flex; flex-direction:column; align-items:center; gap:2px; border:2px solid var(--line); background:var(--panel); border-radius:10px; padding:5px 8px 4px; cursor:pointer; font-size:.74rem; font-weight:700; min-width:62px}
.tool svg{width:34px; height:22px}
.tool[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.tool-tip{font-size:.88rem; color:var(--muted)}
.board-frame{background:var(--board); border:1px solid var(--line); border-radius:var(--r); overflow-x:auto}
.board-svg{display:block; width:100%; height:auto; max-height:520px; touch-action:manipulation}
.board-svg.editable{max-height:none}
.board.mini .board-svg{max-height:200px}
.board-opts{display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between}
.board-status:empty{display:none}
.board-status{font-size:.92rem; background:var(--bad-bg); border-left:5px solid var(--bad); padding:8px 12px; border-radius:8px}
.board-status.info{background:var(--hint-bg); border-left-color:var(--spark)}
.gdot{fill:var(--dot)}
.hint{stroke:var(--dot); stroke-width:2; stroke-dasharray:3 7; fill:none}
.hint.slot{stroke:var(--spark); stroke-width:4; stroke-dasharray:6 6; animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.wire{stroke:var(--ink); stroke-width:3; stroke-linecap:round; fill:none}
.wire.pic{stroke:var(--copper); stroke-width:5}
.flow{stroke:var(--flow); stroke-width:6; stroke-linecap:round; stroke-dasharray:.1 18; fill:none}
.hit{stroke:transparent; stroke-width:30; cursor:pointer; fill:none}
.hit:hover{stroke:var(--accent); stroke-opacity:.14}
.sym{stroke:var(--ink); stroke-width:2.5; fill:var(--board)}
.sym-line{stroke:var(--ink); stroke-width:2.5; fill:none; stroke-linecap:round}
.sym-thick{stroke:var(--ink); stroke-width:6; fill:none}
.bgfill{fill:var(--board)}
.lbl{fill:var(--ink); font-family:var(--font-body); font-size:13px; font-weight:700; text-anchor:middle; dominant-baseline:central}
.reading{fill:var(--accent); font-family:var(--font-mono); font-size:13px; font-weight:700; text-anchor:middle; dominant-baseline:central}
.reading-bg{fill:var(--panel); stroke:var(--line)}
.cell-body{fill:var(--cellbody)}
.cell-cap{fill:var(--copper)}
.cell-txt{fill:#fff; font-family:var(--font-body); font-size:11px; font-weight:800; text-anchor:middle; dominant-baseline:central}
.metal{fill:var(--metal)}
.glass{fill:var(--glass); stroke:var(--metal); stroke-width:2}
.filament{stroke:var(--metal); stroke-width:1.6; fill:none}
.filament.lit{stroke:var(--spark)}
.switch-base{fill:var(--wood)}
.lever{stroke:var(--copper); stroke-width:5; stroke-linecap:round}
.meter-box{fill:var(--cellbody)}
.meter-screen{fill:#0d2a1a}
.meter-read{fill:#7dffb0; font-family:var(--font-mono); font-size:10px; font-weight:700; text-anchor:middle; dominant-baseline:central}
.meter-letter{fill:#fff; font-family:var(--font-body); font-size:9px; font-weight:800; text-anchor:middle; dominant-baseline:central}
.part.broken{opacity:.45}
.legend{font-size:.82rem; color:var(--muted)}

/* ---------- generic sim visuals ---------- */
.sim-grid{display:grid; gap:16px; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); align-items:start}
@media (max-width:760px){ .sim-grid{grid-template-columns:minmax(0,1fr)} }
.sim-svg{width:100%; height:auto; display:block; background:var(--board); border:1px solid var(--line); border-radius:var(--r)}
.controls{display:grid; gap:14px; align-content:start}
.readout{display:grid; grid-template-columns:repeat(auto-fit, minmax(120px,1fr)); gap:8px}
.readout div{background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:8px 12px}
.readout b{display:block; font-family:var(--font-mono); font-size:1.25rem; font-variant-numeric:tabular-nums}
.readout span{font-size:.78rem; color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table.data{border-collapse:collapse; width:100%; font-size:.92rem; font-variant-numeric:tabular-nums}
table.data th, table.data td{border:1px solid var(--line); padding:6px 10px; text-align:center}
table.data th{background:var(--panel-2)}
.svg-ink{fill:var(--ink)} .svg-muted{fill:var(--muted)} .svg-line{stroke:var(--line)} .svg-stroke{stroke:var(--ink)}
.t-small{font-family:var(--font-body); font-size:12px} .t-mono{font-family:var(--font-mono)}
.cards-sort{display:grid; gap:10px; grid-template-columns:repeat(auto-fit, minmax(min(100%, 200px), 1fr))}
.sort-card{background:var(--panel-2); border:2px solid var(--line); border-radius:10px; padding:10px 12px; display:grid; gap:8px}
.sort-card.right{border-color:var(--ok); background:var(--ok-bg)}
.sort-card.wrong{border-color:var(--bad)}
.order-list{display:grid; gap:8px; grid-template-columns:repeat(auto-fit, minmax(min(100%, 180px), 1fr))}
.order-btn{border:2px solid var(--line); background:var(--panel-2); border-radius:10px; padding:10px; cursor:pointer; text-align:left; display:grid; gap:2px}
.order-btn .n{font-family:var(--font-mono); font-weight:700; color:var(--accent)}
.order-btn.picked{border-color:var(--ok); background:var(--ok-bg)}
.order-btn.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.mission{display:grid; gap:6px; padding:12px 14px; border:2px solid var(--line); border-radius:10px; background:var(--panel-2)}
.mission.done{border-color:var(--ok); background:var(--ok-bg)}
.mission h4{margin:0; font-size:1rem}
.src-row{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line)}
.src-row:last-child{border-bottom:0}
.src-row small{color:var(--muted); display:block; font-size:.8rem}
.stepper{display:flex; align-items:center; gap:6px}
.stepper button{width:34px; height:34px; border-radius:8px; border:1px solid var(--line); background:var(--panel); cursor:pointer; font-weight:800}
.stepper output{font-family:var(--font-mono); min-width:1.6em; text-align:center; font-weight:700}
.swatch{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:middle}
.parts-grid{display:grid; gap:10px; grid-template-columns:repeat(auto-fit, minmax(min(100%, 190px), 1fr))}
.part-card{background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:10px; display:grid; gap:6px}
.part-card .pair{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.part-card .pair .board-frame{border-radius:8px}
.part-card p{font-size:.88rem}
.spin{transform-origin:160px 160px; animation:spin 20s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }

/* free-form circuit builder */
.board-svg.editable{cursor:default}
.comp-hit{stroke:transparent; stroke-width:24; fill:transparent; cursor:grab; stroke-linecap:round}
.comp-hit.body{stroke:none}
.vert-hit{fill:transparent; cursor:grab}
.loose-end{fill:var(--board); stroke:var(--copper); stroke-width:3}
.junction{fill:var(--ink)}
.sel-halo{stroke:var(--accent); stroke-opacity:.28; stroke-width:30; stroke-linecap:round}
.sel-ring{fill:none; stroke:var(--accent); stroke-width:3}
.snap-ring{fill:none; stroke:var(--spark); stroke-width:4}
.parts-bin{display:flex; flex-wrap:wrap; gap:6px; align-items:center; background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:8px 10px}
.parts-bin .tool{touch-action:none; cursor:grab}
.bin-label{font-size:.85rem; font-weight:700; color:var(--muted); margin-right:4px}
.action-bar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; min-height:40px}
.btn.danger{color:var(--bad); border-color:var(--bad)}

/* time machine */
.tm-slot{display:inline-flex}
.time-machine{overflow:visible}
.tm-gear{transform-box:fill-box; transform-origin:center; animation:spin 9s linear infinite}
.tm-swirl{transform-box:fill-box; transform-origin:center; animation:spin 5s linear infinite reverse}
.tm-spark{transform-box:fill-box; transform-origin:center; animation:halo 1.4s ease-in-out infinite}
.tm-light{animation:crackle 1.3s steps(1) infinite}
.warp .tm-gear{animation-duration:.45s} .warp .tm-swirl{animation-duration:.35s}
.warp .tm-body{animation:shake .18s linear infinite}
.warp .tm-spark{animation-duration:.2s}
.hero-head{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap}
.hero-machine > svg{display:block; width:200px; max-width:40vw; height:auto}
@media (max-width:620px){ .tm-slot{display:none} }

/* ---------- review questions ---------- */
.rv-bar{position:sticky; top:calc(env(safe-area-inset-top,0px) + 64px); z-index:5; background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; display:grid; gap:10px}
.rv-bar-top{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:baseline}
.rv-chip{cursor:pointer; min-width:34px; text-align:center}
.rv-list{display:grid; gap:14px}
.rv-card{background:var(--panel); border:2px solid var(--line); border-left:6px solid var(--spark); border-radius:var(--r); padding:16px 18px; display:grid; gap:12px; min-width:0; scroll-margin-top:180px}
.rv-card.done{border-left-color:var(--ok)}
.rv-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.rv-num{font-family:var(--font-display); font-size:1.3rem; font-weight:800; color:hsl(var(--hue) 60% var(--hue-l))}
.rv-type{font-size:.75rem; text-transform:uppercase; letter-spacing:.1em; font-weight:800; color:var(--muted)}
.rv-pill{margin-left:auto; font-size:.8rem; font-weight:800; padding:3px 10px; border-radius:99px}
.rv-pill.todo{background:var(--hint-bg); color:var(--hint)}
.rv-pill.done{background:var(--ok-bg); color:var(--ok)}
.rv-grid select{width:100%; min-width:120px}
.rv-grid td.right{background:var(--ok-bg)} .rv-grid td.wrong{background:var(--bad-bg)}
.rv-rowlabel{text-align:left!important; font-weight:600}
.rv-rowvis{max-width:160px}
.rv-order{display:grid; gap:8px; padding-left:1.4em; margin:0}
.rv-order li{display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--panel-2); border:2px solid var(--line); border-radius:10px; padding:8px 10px}
.rv-order li.right{border-color:var(--ok); background:var(--ok-bg)} .rv-order li.wrong{border-color:var(--bad); background:var(--bad-bg)}
.rv-obtns{display:flex; gap:4px; flex:none}
.rv-num-in{width:8em; font:inherit; padding:7px 10px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--ink)}
.rv-fill{line-height:2.4}
.rv-blank{width:9em; font:inherit; padding:4px 8px; margin:0 4px; border:none; border-bottom:2px solid var(--accent); background:var(--panel-2); color:var(--ink); border-radius:6px 6px 0 0}
.rv-blank.right{border-bottom-color:var(--ok); background:var(--ok-bg)} .rv-blank.wrong{border-bottom-color:var(--bad); background:var(--bad-bg)}
.rv-write{width:100%; font:inherit; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--ink)}
.rv-reveal{display:grid; gap:8px}
.rv-checklist{display:grid; gap:4px}
.rv-check{display:flex; gap:8px; align-items:flex-start}
.opt.missed{border-style:dashed; border-color:var(--ok)}
.tickbox{display:inline-block; width:16px; height:16px; border:2px solid var(--muted); border-radius:4px; margin-right:8px; vertical-align:-3px}
.opt.chosen .tickbox{background:var(--accent); border-color:var(--accent)}
.pad-wrap{border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff; max-width:680px}
.pad{display:block; width:100%; height:auto; aspect-ratio:640/380; touch-action:none; cursor:crosshair}
.rv-vis svg{max-width:100%}

/* ---------- worksheet (always light, printable) ---------- */
.ws-overlay{position:fixed; inset:0; z-index:80; overflow:auto; background:#d9dde6; padding:16px}
.ws-toolbar{position:sticky; top:0; z-index:2; display:flex; flex-wrap:wrap; gap:10px; align-items:center; background:#fff; color:#1a2140; padding:10px 14px; border-radius:12px; margin:0 auto 14px; max-width:820px; box-shadow:0 4px 16px rgba(0,0,0,.12)}
.ws-toolbar input{font:inherit; padding:6px 10px; border:1px solid #c8cede; border-radius:8px}
.ws{--wsc:hsl(var(--wshue) 60% 40%); --wsbg:hsl(var(--wshue) 70% 95%); background:#fff; color:#1a2140; max-width:820px; margin:0 auto; padding:28px 34px; border-radius:6px; box-shadow:0 8px 30px rgba(0,0,0,.15); font-family:var(--font-body); font-size:14px; line-height:1.45}
.ws-header{display:flex; justify-content:space-between; align-items:center; gap:14px; background:var(--wsbg); border:2px solid var(--wsc); border-radius:14px; padding:12px 16px}
.ws-brand{display:flex; gap:12px; align-items:center}
.ws-kicker{font-size:11px; letter-spacing:.12em; text-transform:uppercase; font-weight:800; color:var(--wsc)}
.ws-title{font-family:var(--font-display); font-size:24px; font-weight:800; line-height:1.1}
.ws-sub{font-size:12px; color:#56607e}
.ws-stamps{display:flex}
.ws-namebar{display:flex; gap:22px; flex-wrap:wrap; margin:12px 2px 4px; font-size:13px}
.ws-line{display:inline-block; min-width:130px; border-bottom:1.5px solid #1a2140; height:1em; vertical-align:-2px}
.ws-line.short{min-width:110px; margin:0 4px}
.ws-part{break-after:avoid; font-family:var(--font-display); font-size:17px; margin:18px 0 8px; color:var(--wsc); border-bottom:2px solid var(--wsc); padding-bottom:3px}
.ws-q{border:1.5px solid #d2d7e5; border-radius:10px; padding:10px 14px; margin:10px 0; break-inside:avoid}
.ws-qhead{display:flex; gap:10px; align-items:center}
.ws-n{display:inline-grid; place-items:center; width:26px; height:26px; border-radius:50%; background:var(--wsc); color:#fff; font-weight:800; font-size:13px}
.ws-type{font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; font-weight:800; color:#56607e}
.ws-qtext{margin:6px 0 8px; font-weight:600}
.ws-opts{display:grid; gap:4px; grid-template-columns:repeat(2, minmax(0,1fr))}
.ws-opt{display:flex; gap:8px; align-items:flex-start}
.ws-box{flex:none; display:inline-grid; place-items:center; width:16px; height:16px; border:1.5px solid #1a2140; border-radius:3px; font-size:13px; font-weight:800; color:#1b7f46; margin-top:1px}
.ws-table{width:100%; border-collapse:collapse; font-size:12.5px}
.ws-table th, .ws-table td{border:1px solid #9aa3c2; padding:6px 8px; text-align:left; vertical-align:top}
.ws-table th{background:var(--wsbg)}
.ws-cell{min-width:90px; height:28px; font-weight:700; color:#1d4fb0}
.ws-bank{font-size:12px; margin:6px 0 0; color:#3a4160}
.ws-blankbox{display:inline-block; width:34px; height:24px; border:1.5px solid #1a2140; border-radius:4px; margin:0 4px; vertical-align:middle}
.ws-ol{margin:4px 0; padding-left:22px; font-weight:600; color:#1d4fb0}
.ws-work{border:1.5px dashed #9aa3c2; border-radius:8px; height:70px; padding:4px 8px; margin-bottom:6px}
.ws-label{font-size:11px; color:#56607e}
.ws-ans b{color:#1d4fb0}
.ws-fill{line-height:2}
.ws-filled{color:#1d4fb0; border-bottom:1.5px solid #1a2140; padding:0 4px}
.ws-drawbox{border:1.5px dashed #9aa3c2; border-radius:8px; height:250px}
.ws-img{display:block; max-width:100%; max-height:300px; border:1px solid #d2d7e5; border-radius:8px}
.ws-model{border:1px solid #d2d7e5; border-radius:8px; padding:6px; max-width:420px}
.ws-model svg{max-width:100%; height:auto}
.ws-note{font-size:12px; color:#3a4160; margin:6px 0 0}
.ws-written{white-space:pre-wrap; border-left:3px solid var(--wsc); padding:4px 10px; min-height:40px; color:#1d4fb0}
.ws-lines{display:grid; gap:0}
.ws-rule{height:26px; border-bottom:1px solid #9aa3c2}
.ws-vis, .ws-rowvis{max-width:360px}
.ws-rowvis{max-width:120px}
.ws-vis svg, .ws-rowvis svg{max-width:100%; height:auto}
.ws-feedback{margin-top:16px}
.ws-teacher{border:1.5px solid #9aa3c2; border-radius:10px; min-height:90px; padding:8px 10px; margin-top:10px}
.ws .board-frame{background:#fff; border-color:#d2d7e5}
@media print {
  @page{size:A4; margin:11mm}
  html, body.printing{background:#fff!important; background-image:none!important}
  .ws-part{break-after:avoid}
  .ws-q{break-inside:avoid}
  body.printing > *:not(#ws-root){display:none!important}
  body.printing::before{display:none}
  .ws-overlay{position:static; overflow:visible; background:#fff; padding:0}
  .no-print{display:none!important}
  .ws{box-shadow:none; max-width:none; padding:0; border-radius:0}
  .ws-feedback{break-before:page}
}

/* teacher page */
.hw-grid{display:grid; gap:16px; grid-template-columns:minmax(0,1fr) minmax(0,1.1fr); align-items:start}
@media (max-width:860px){ .hw-grid{grid-template-columns:minmax(0,1fr)} }
.hw-col{display:grid; gap:10px; min-width:0}
.hw-stops{display:grid; gap:6px}
.hw-stop{display:grid; grid-template-columns:auto 4.6em minmax(0,1fr) auto; gap:10px; align-items:center; padding:8px 10px; border:2px solid var(--line); border-radius:10px; cursor:pointer; background:var(--panel)}
.hw-stop.on{border-color:hsl(var(--hue) 60% var(--hue-l)); background:hsl(var(--hue) 70% var(--hue-bg))}
.hw-stop small, .hw-part small{display:block; color:var(--muted); font-size:.82rem}
.hw-yr{font-family:var(--font-display); font-weight:800; color:hsl(var(--hue) 60% var(--hue-l))}
.hw-part{display:flex; gap:10px; align-items:flex-start; padding:6px 0}
.hw-stop input, .hw-part input{width:18px; height:18px; accent-color:var(--accent); margin-top:3px}
.hw-col label input[type=text], .hw-col textarea{font:inherit; width:100%; padding:7px 10px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--ink)}
.hw-out{width:100%; font-family:var(--font-mono); font-size:.82rem; line-height:1.5; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--panel-2); color:var(--ink); white-space:pre-wrap}
@media (max-width:620px){ .hw-stop{grid-template-columns:auto minmax(0,1fr)} .hw-stop .btn, .hw-yr{grid-column:2} }
.hw-stop > span{min-width:0; overflow-wrap:anywhere} .hw-stops{min-width:0; overflow:hidden}
/* ---------- power grid builder ---------- */
.grid-wrap{display:grid; gap:16px; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); align-items:start}
@media (max-width:900px){ .grid-wrap{grid-template-columns:minmax(0,1fr)} }
.grid-left{display:grid; gap:10px; min-width:0}
.grid-frame{border:2px solid var(--line); border-radius:12px; overflow:hidden; background:#7fb8d8}
.grid-map{display:block; width:100%; height:auto; touch-action:none; cursor:pointer}
.grid-palette{display:flex; flex-wrap:wrap; gap:6px}
.grid-tool{touch-action:none; cursor:grab; min-width:58px}
.grid-tool svg{width:34px; height:34px}
/* ---------- builder's workshop ---------- */
.workshop-sec{margin:26px 0 8px; display:grid; gap:10px}
.workshop-sec h2{margin:0}
.workshop-grid{display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(min(100%, 230px), 1fr))}
.workshop-card{display:grid; gap:6px; text-align:left; cursor:pointer; padding:16px; border-radius:16px; border:1px solid var(--line); color:var(--ink); font:inherit;
  background:linear-gradient(135deg, hsl(var(--hue) 70% var(--hue-bg)) 0%, var(--panel) 70%)}
.workshop-card b{font-size:1.15rem}
.workshop-card small{color:var(--muted); font-weight:600}
.workshop-card:hover{border-color:hsl(var(--hue) 60% 50%)}
.ws-tasks .btn{white-space:normal}
.ws-checks{display:flex; flex-wrap:wrap; gap:6px}
.ws-checks .chip{font-size:.9rem; padding:5px 12px}
.ws-checks .chip.ok{font-weight:800}
.ws-snap{display:block; width:100%; max-height:420px; margin-top:6px; border:1px solid #ccd; border-radius:8px}
.ws-drawbox{height:300px; border:1.5px dashed #99a; border-radius:8px; margin-top:6px}
.ws-note{font-size:.9rem; margin:6px 0 0}
.ws-feedback{break-before:page}
.ws-teacher{min-height:120px; border:1.5px solid #99a; border-radius:8px; padding:8px; margin-top:10px}
/* student-added content prints in blue so Toddle AI (and teachers) can tell it from the template */
.ws-student .ws-name, .ws-student .ws-cell, .ws-student .ws-filled, .ws-student .ws-written, .ws-student .ws-ans b, .ws-student .ws-box, .ws-student .ws-ol li, .ws-student .ws-feedback b{color:#1d4ed8 !important}
.ws-student .ws-img{outline:2px solid #1d4ed8; outline-offset:2px}
.ws-student-note{font-size:.8rem; color:#1d4ed8; margin:0}
.teacher-top{display:flex; justify-content:flex-end; margin:0 0 10px}
.hw-btns{display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end}
.hw-howto ol{margin:6px 0; padding-left:20px} .hw-howto li{margin:3px 0}
.hw-files{display:grid; gap:8px}
.hw-file{display:grid; gap:6px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--panel)}
.hw-file-name{display:flex; flex-wrap:wrap; gap:4px 10px; align-items:baseline} .hw-file-name small{color:var(--muted)}
.hw-file-btns{display:flex; flex-wrap:wrap; gap:6px}
.ws-scheme{white-space:pre-wrap; font:inherit; font-size:.9rem; line-height:1.5; margin:12px 0 0}
/* learn step states */
.pill{font-size:.8rem; font-weight:800; padding:4px 12px; border-radius:99px}
.pill.todo{background:var(--hint-bg); color:var(--hint)}
.pill.ok{background:var(--ok-bg); color:var(--ok)}
.learn-card.step-done{border:2px solid var(--ok); box-shadow:0 0 0 4px var(--ok-bg)}
.feedback.step-fb{border-left:6px solid var(--ok); font-size:1.02rem}
.btn.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(27,127,70,.45)} 50%{box-shadow:0 0 0 8px rgba(27,127,70,0)}}
@media (prefers-reduced-motion: reduce){ .btn.pulse{animation:none} }
.ask-past{display:grid; gap:10px}
.ask-done{display:grid; gap:6px; padding-bottom:10px; border-bottom:1px dashed var(--line)}
.ask-done .opt{cursor:default}
.tab.tab-save{margin-left:auto}
.bal-tabs .btn.done{border-color:var(--ok); color:var(--ok)}
.bal-lab{cursor:default; user-select:none}
.bal-msg{min-height:1.4em; font-size:.95rem}
.compare-2{display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(min(100%, 240px), 1fr))}
.charge-explain ul{margin:6px 0 0; padding-left:20px; display:grid; gap:4px}
.ws-progress .ws-opts{margin:4px 0 8px}
.bal-lab{max-width:620px; margin:0 auto; display:block}
.bal-tabs .btn.primary.done{color:#fff}
.ws-namemsg{color:var(--bad); font-weight:700; font-size:.9rem}
.ws-toolbar input.need{border-color:#b83434; box-shadow:0 0 0 3px #fae6e6}
.btn.is-off{opacity:.5}
.ws-noname-print{display:none}
@media print {
  .ws-overlay.noname .ws-holder{display:none!important}
  .ws-overlay.noname .ws-noname-print{display:block; text-align:center; padding:60px 20px; font-family:sans-serif}
}
.teacher-top{align-items:center; gap:10px; flex-wrap:wrap; justify-content:space-between}
.traveller{display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:.95rem}
.traveller-fields{display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center}
.traveller-fields input{font:inherit; padding:6px 10px; border:1px solid #c8cede; border-radius:8px; max-width:100%}
.traveller-modal{text-align:center}
.traveller-modal .traveller-fields{justify-content:center; text-align:left}

.teacher-skip{display:grid; gap:6px; justify-items:center} .teacher-skip input{font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--ink); width:9rem}

/* ---------- power grid game ---------- */
.gg{display:grid; gap:12px}
.gg-top{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between}
.gg-money{display:flex; flex-wrap:wrap; gap:10px; align-items:center; font-weight:800}
.gg-cash{background:var(--ok-bg); color:var(--ok); padding:6px 12px; border-radius:99px}
.gg-cash.neg{background:var(--bad-bg); color:var(--bad)}
.gg-year{background:var(--panel-2); border:1px solid var(--line); padding:6px 12px; border-radius:99px}
.grid-tool{display:grid; justify-items:center; gap:1px; min-width:66px}
.grid-tool span{font-size:.78rem; font-weight:800}
.grid-tool small{font-size:.7rem; color:var(--muted); font-weight:700}
.grid-tool.on{border-color:var(--accent); background:var(--accent-soft)}
.gg-sep{width:2px; align-self:stretch; background:var(--line); margin:0 4px}
.gg-districts{display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:.9rem}
.gg-log{display:grid; gap:6px; max-height:260px; overflow:auto}
.gg-ev{font-size:.9rem; padding:6px 10px; border-radius:8px; background:var(--panel-2)}
.gg-ev.bad{background:var(--bad-bg); color:var(--bad)}
.gg-ev.warn{background:var(--hint-bg); color:var(--hint)}
.gg-ev.ok{background:var(--ok-bg); color:var(--ok); font-weight:700}
.gg-key{display:inline-block; width:14px; height:4px; border-radius:2px; vertical-align:middle}
.gg-score{display:grid; gap:10px}
.gg-score h4{margin:6px 0 0}
.gg-star{display:grid; grid-template-columns:7rem auto minmax(0,1fr); gap:10px; align-items:center}
.gg-stars{color:#e8a500; font-size:1.25rem; letter-spacing:2px}
.gg-star small{color:var(--muted)}
.gg-totals{display:grid; gap:8px; grid-template-columns:repeat(auto-fit, minmax(130px,1fr))}
.gg-totals > div{background:var(--panel-2); border-radius:10px; padding:8px 10px; display:grid}
.gg-totals b{font-size:1.15rem}
.gg-totals span{font-size:.8rem; color:var(--muted)}
.gg-cards{display:grid; gap:10px; grid-template-columns:repeat(auto-fit, minmax(min(100%, 300px),1fr))}
.gg-card{border:1px solid var(--line); border-radius:12px; padding:10px 12px; display:grid; gap:6px; background:var(--panel)}
.gg-card-head{display:flex; align-items:center; gap:8px}
.gg-card p{margin:0; font-size:.9rem}
.gg-pro p{color:var(--ink)} .gg-con p{color:var(--ink)}
.gg-con{border-top:1px dashed var(--line); padding-top:6px; display:grid; gap:4px}
.gg-pro{display:grid; gap:4px}
.gg-fin{border-collapse:collapse; width:100%; max-width:440px; font-size:.92rem}
.gg-fin td, .gg-fin th{padding:4px 8px; border-bottom:1px solid var(--line); text-align:left}
.gg-fin td:last-child{text-align:right; font-weight:700}
.gg-fin .pos{color:var(--ok)} .gg-fin .neg{color:var(--bad)}
.gg-fin tr.tot td{font-weight:800}
.gg-time{max-width:none}
.gg-time td:last-child{text-align:left}
.story-list{display:grid; gap:10px}
.story-card{display:flex; gap:14px; align-items:center; text-align:left; padding:12px 14px; border-radius:12px; border:2px solid var(--line); background:var(--panel); color:var(--ink); font:inherit; cursor:pointer}
.story-card span{display:grid}
.story-card small{color:var(--muted)}
.story-card.done{border-color:var(--ok); background:var(--ok-bg)}
.story-card.locked{opacity:.55; cursor:not-allowed}
.story-n{width:38px; height:38px; border-radius:50%; display:grid; place-items:center; background:var(--accent); color:#fff; font-weight:800; flex:none}
.story-card.done .story-n{background:var(--ok)}
.ws-sc-item{border-top:1px solid #dde; padding:6px 0; font-size:.85rem} .ws-sc-item p{margin:2px 0} .ws-student .ws-sc-item{color:#1d4ed8}
.gg-charttitle{font-size:.92rem; margin-bottom:-6px} .gg-help{font-size:.9rem; background:var(--panel-2); border-radius:10px; padding:8px 12px} .gg-help summary{cursor:pointer; font-weight:700} .gg-help p{margin:8px 0 0}
/* glossary terms */
.gloss{text-decoration:underline dotted; text-decoration-thickness:2px; text-underline-offset:3px; text-decoration-color:var(--accent); cursor:help; border-radius:3px}
.gloss:hover, .gloss:focus-visible{background:var(--accent-soft); outline:none}
.gloss-tip{position:absolute; z-index:1000; background:#1a2140; color:#fff; font-size:.88rem; line-height:1.4; padding:8px 12px; border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.25); pointer-events:none}
.gloss-tip b{color:#ffd879}
@media print { .gloss{text-decoration:none} .gloss-tip{display:none} }
/* wide layout for the power grid, focus mode for story chapters */
body.wide .wrap, body.wide .topbar-in{max-width:1500px}
body.story-focus .stop-hero, body.story-focus .ws-chooser, body.story-focus .ws-taskhead{display:none}
body.wide .grid-wrap{grid-template-columns:minmax(0,1.85fr) minmax(320px,1fr)}
@media (max-width:900px){ body.wide .grid-wrap{grid-template-columns:minmax(0,1fr)} }
.ch-head{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.ch-head h3{margin:0; flex:1}
.ch-brief{background:var(--panel-2); border-radius:12px; padding:8px 12px}
.ch-brief summary{cursor:pointer; font-weight:800}
.ch-brief[open] summary{margin-bottom:8px}
.gg-panel{border:1px solid var(--line); border-radius:12px; background:var(--panel); overflow:hidden}
.gg-tabs{display:flex; gap:0; border-bottom:1px solid var(--line); background:var(--panel-2)}
.gg-tab{flex:1; padding:8px 6px; border:0; background:none; font:inherit; font-weight:800; font-size:.88rem; color:var(--muted); cursor:pointer; border-bottom:3px solid transparent}
.gg-tab.on{color:var(--ink); border-bottom-color:var(--accent); background:var(--panel)}
.gg-tabbody{max-height:min(55vh, 520px); overflow:auto; padding:10px}
.gg-tabbody .gg-log{max-height:none}
.gg-tabbody .gg-cards{grid-template-columns:minmax(0,1fr)}
.gg-outcome:empty{display:none}
body.wide .grid-wrap .controls{gap:10px}
/* ---------- pop-out calculator ---------- */
.calc-fab{position:fixed; right:16px; bottom:16px; z-index:900; display:flex; align-items:center; gap:6px; padding:10px 14px; border-radius:999px; border:2px solid var(--accent); background:var(--panel); color:var(--ink); font:inherit; font-weight:700; font-size:15px; box-shadow:0 4px 14px rgba(20,30,70,.18); cursor:pointer}
.calc-fab:hover,.calc-fab.on{background:var(--accent); color:var(--accent-ink)}
.calc-pane{position:fixed; right:16px; bottom:76px; z-index:901; width:270px; background:var(--panel); border:2px solid var(--line); border-radius:16px; box-shadow:0 10px 30px rgba(20,30,70,.25); padding:10px}
.calc-pane[hidden]{display:none!important}
.calc-head{display:flex; align-items:center; gap:8px; cursor:grab; user-select:none; touch-action:none; padding:2px 2px 8px}
.calc-hint{font-size:12px; color:var(--muted); flex:1}
.calc-x{border:0; background:none; color:var(--muted); font-size:18px; cursor:pointer; padding:2px 6px; border-radius:8px}
.calc-hist{min-height:18px; font-size:13px; color:var(--muted); text-align:right; padding:0 4px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
.calc-disp{width:100%; box-sizing:border-box; font:inherit; font-size:26px; font-weight:700; text-align:right; padding:8px 10px; border:2px solid var(--line); border-radius:10px; background:var(--panel-2); color:var(--ink)}
.calc-disp.err{border-color:#c0392b}
.calc-keys{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:8px}
.calc-k{font:inherit; font-size:20px; font-weight:700; padding:10px 0; border-radius:10px; border:1.5px solid var(--line); background:var(--panel-2); color:var(--ink); cursor:pointer}
.calc-k:active{transform:translateY(1px)}
.calc-k.op{background:var(--accent-soft); color:var(--accent)}
.calc-k.fn{font-size:17px; color:var(--muted)}
.calc-k.eq{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.calc-tip{margin:8px 2px 0; font-size:12px; color:var(--muted)}
@media (max-width:520px){ .calc-fab span{display:none} .calc-pane{left:8px; right:8px; width:auto; bottom:72px} }
@media print { .calc-fab,.calc-pane{display:none!important} }
.btn.warnbtn{background:#fde8e8; border-color:#c0392b; color:#9b1c1c}
.gg-runrow{flex-wrap:wrap; gap:8px}
/* side-by-side circuit comparison: same size, same scale, tops lined up */
.sbs{display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start}
.sbs-col{display:grid; gap:8px; align-content:start; min-width:0}
.sbs-title{margin:0; font-size:1.15rem; line-height:1.3; min-height:1.5em}
.board.compare .board-svg{max-height:none}
.board.compare .board-frame{overflow:hidden}
@media (max-width:640px){ .sbs{grid-template-columns:1fr} }
.board-svg .flow,.board-svg .sel-halo{pointer-events:none}
.wire{stroke-width:2.5}
.wire.pic{stroke-width:3.5}
.flow{stroke-width:4.5}
.lm-bg{fill:var(--panel); stroke:var(--line); stroke-width:1}
.lm-bg.on{fill:#fff6d6; stroke:#e0b100}
.lm-txt{fill:var(--ink); font-family:var(--font-mono); font-size:9.5px; font-weight:800; text-anchor:middle; dominant-baseline:central}
.meter-read{font-size:8.5px; letter-spacing:-.3px}
/* reading tables: students type what the meter shows */
.rt td{vertical-align:middle}
.rt-row{display:flex; gap:6px; align-items:center; justify-content:center}
.rt-in{width:6.5em; font:inherit; font-size:1rem; padding:6px 8px; border:2px solid var(--line); border-radius:8px; text-align:center; background:var(--panel); color:var(--ink)}
.rt-now{background:#fff8dc}
.rt-now .rt-in{border-color:var(--accent)}
.rt-ok{color:var(--good, #1b7f46); font-weight:800; background:#e6f6ec}
.rt-msg{font-size:.82rem; color:var(--muted); margin-top:4px}
.rt-msg.bad{color:#b83434}
.feedback.info{background:var(--hint-bg); border-left:5px solid var(--spark)}
/* pop-up action menu that appears right where you tap */
.board-stage{position:relative}
.action-pop{position:absolute; z-index:20; display:flex; flex-wrap:wrap; gap:6px; align-items:center; max-width:min(420px, 92%); padding:8px 34px 8px 10px; background:var(--panel); border:2px solid var(--accent); border-radius:14px; box-shadow:0 8px 24px rgba(20,30,70,.22)}
.action-pop[hidden]{display:none!important}
.action-pop > b{width:100%; font-size:.9rem}
.action-pop .legend{width:100%; margin:0}
.pop-x{position:absolute; top:4px; right:6px; border:0; background:none; font-size:16px; color:var(--muted); cursor:pointer; padding:2px 6px; border-radius:6px}
.tap-hint{margin:2px 0 0}
.gg-scorechip{background:#fff3c4; border-color:#e0b100; font-weight:800}
/* Learn-step instructions: the most important text on the screen, so the most eye-catching */
.pip-row.step-say{margin:6px 0 14px}
.step-say .bubble{font-size:1.18rem; line-height:1.55; font-weight:500; color:var(--ink); background:var(--accent-soft); border:2px solid var(--accent); border-left-width:6px; padding:14px 20px; max-width:none; box-shadow:0 3px 10px rgba(58,75,209,.12)}
.step-say .bubble::before{background:var(--accent-soft); border-color:var(--accent); border-width:0 0 2px 2px; left:-8px}
.step-say .bubble b{color:var(--accent); font-weight:800}
:root[data-theme="dark"] .step-say .bubble b{color:#c3cbff}
@media (max-width:520px){ .step-say .bubble{font-size:1.06rem; padding:12px 14px} }
/* key idea checks */
.key-idea{border:3px solid #e0b100; background:#fff8dc; border-radius:16px; padding:16px 18px; display:grid; gap:12px; box-shadow:0 6px 18px rgba(224,177,0,.18); animation:keyIn .35s ease-out}
@keyframes keyIn{from{transform:translateY(8px); opacity:0}}
.key-idea.passed{border-color:#1b7f46; background:#e9f7ef; box-shadow:none}
.key-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.key-head b{font-size:1.2rem; letter-spacing:.02em}
.key-head .pill{margin-left:auto}
.key-icon{font-size:1.6rem}
.key-text{font-size:1.15rem; line-height:1.55; margin:0}
.key-q{font-size:1.08rem; font-weight:700; margin:0}
.key-sents{display:grid; gap:8px}
.key-sent{font:inherit; font-size:1.08rem; text-align:left; padding:12px 14px; border-radius:12px; border:2px solid #e6d28a; background:#fffdf3; color:#1a2140; cursor:pointer}
.key-sent:hover{border-color:var(--accent)}
.key-sent.right{border-color:#1b7f46; background:#d9f2e3; font-weight:700}
.key-sent.wrong{border-color:#b83434; background:#fde8e8}
.key-gapline{line-height:2.2}
.key-gap{font:inherit; font-size:1.05rem; width:9em; padding:4px 8px; margin:0 6px; border:2px solid var(--accent); border-radius:8px; text-align:center; background:#fff; color:#1a2140}
.key-gap.right,.key-gap:disabled{border-color:#1b7f46; background:#d9f2e3; color:#1a2140; font-weight:700}
:root[data-theme="dark"] .key-idea{background:#2a2410; border-color:#c99a00}
:root[data-theme="dark"] .key-idea.passed{background:#12301f; border-color:#2f9e5e}
:root[data-theme="dark"] .key-sent{background:#1b2140; color:#e7eaf6; border-color:#5a5230}
:root[data-theme="dark"] .key-sent.right{background:#173a26}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .key-idea{background:#2a2410; border-color:#c99a00} :root:not([data-theme="light"]) .key-idea.passed{background:#12301f; border-color:#2f9e5e} :root:not([data-theme="light"]) .key-sent{background:#1b2140; color:#e7eaf6; border-color:#5a5230} }
.key-idea > .btn{justify-self:start}
.key-idea.passed > .btn{display:none}
/* things to tap in pictures: glowing "?" beacons and pulsing targets */
.beacon{cursor:pointer}
.beacon-line{stroke:#e0a100; stroke-width:2; stroke-dasharray:3 3}
.beacon-ring{fill:none; stroke:#f2b200; stroke-width:3; transform-box:fill-box; transform-origin:center; animation:beaconPulse 1.4s ease-out infinite}
.beacon-dot{fill:#f2b200; stroke:#fff; stroke-width:2}
.beacon-txt{fill:#1a2140; font-family:var(--font-body); font-size:14px; font-weight:900; text-anchor:middle; dominant-baseline:central; pointer-events:none}
.beacon:hover .beacon-dot,.beacon:focus .beacon-dot{fill:#ffcf33}
.beacon.found .beacon-ring{animation:none; opacity:0}
.beacon.found .beacon-dot{fill:#1b7f46}
.beacon.found .beacon-txt{fill:#fff}
.beacon.found .beacon-line{stroke:#1b7f46; opacity:.5}
@keyframes beaconPulse{0%{transform:scale(.8); opacity:1} 100%{transform:scale(1.7); opacity:0}}
.tap-me{animation:tapGlow 1.4s ease-in-out infinite}
@keyframes tapGlow{50%{filter:drop-shadow(0 0 5px #f2b200) drop-shadow(0 0 2px #f2b200)}}
@media (prefers-reduced-motion: reduce){ .beacon-ring{animation:none} .tap-me{animation:none; filter:drop-shadow(0 0 3px #f2b200)} }
/* electrons view */
.flow.elec{stroke:#1f6fff; stroke-width:7; stroke-dasharray:.1 24}
.fn-dot{display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--flow); vertical-align:middle}
.fn-dot.elec{background:#1f6fff}
.flow-note{margin:4px 0 0}
/* grouped parts bin */
.parts-bin.grouped{display:grid; gap:8px}
.bin-group{display:flex; flex-wrap:wrap; align-items:center; gap:6px}
.bin-glabel{font-size:.78rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); width:17em; flex:none}
@media (max-width:640px){ .bin-glabel{width:100%} }
.bin-tools{display:flex; flex-wrap:wrap; gap:6px}
.buzz-on{animation:buzzBlink .25s steps(2) infinite}
@keyframes buzzBlink{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){ .buzz-on{animation:none} }
.try-list ol{margin:.3em 0 0 1.2em} .try-list li{margin:.2em 0}
/* mechanical pieces */
.mech-hit{cursor:grab}
.flame{transform-box:fill-box; transform-origin:50% 100%; animation:flick .35s ease-in-out infinite alternate}
@keyframes flick{to{transform:scaleY(.86) scaleX(1.04)}}
.steam-rise{animation:steamUp 1.6s ease-in infinite}
@keyframes steamUp{0%{opacity:.95} 100%{opacity:.15}}
@media (prefers-reduced-motion: reduce){ .flame,.steam-rise{animation:none} }
.steam-rise,.flame,.mech .buzz-on{pointer-events:none}
/* one go per question */
.opt.should{outline:3px dashed #1b7f46; outline-offset:2px}
.rv-card.locked .opt{cursor:default}
.rv-fix{display:inline-block; margin-left:6px; padding:1px 8px; border-radius:999px; background:#d9f2e3; color:#14603a; font-weight:800; font-size:.85rem}
.rv-fixorder{margin-top:8px; padding:10px 12px; border-radius:10px; background:#e9f7ef; border:1px solid #9fd6b5}
.rv-fixorder ol{margin:.3em 0 0 1.2em}
.rv-onego{margin:6px 0 0; font-weight:600}
.rv-num-in.right,.rv-blank.right{border-color:#1b7f46}
.rv-num-in.wrong,.rv-blank.wrong{border-color:#b83434}
.pad-locked{pointer-events:none; opacity:.85}
.rv-words{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:2px 0 6px}
.rv-finished{display:flex; gap:18px; align-items:center; padding:20px 22px; margin-top:18px; border-radius:18px; background:#e9f7ef; border:3px solid #1b7f46}
.rv-finished h3{margin:0 0 6px}
.rv-fin-icon{font-size:2.6rem}
.btn.big{font-size:1.15rem; padding:12px 22px}
@media (max-width:520px){ .rv-finished{flex-direction:column; text-align:center} }
.key-sent.should{outline:3px dashed #1b7f46; outline-offset:2px}
.key-idea.passed.missed{border-color:#c99a00; background:#fff8dc}
.ws-steps{margin:8px 0 12px}
.ws-steps-grid{display:grid; grid-template-columns:1fr 1fr; gap:4px 16px; font-size:.86rem}
.ws-step{display:flex; gap:8px; align-items:center}
.ws-tick{width:16px; height:16px; border:1.5px solid #8a92a3; border-radius:3px; display:inline-grid; place-items:center; font-weight:900; flex:none}
.ws-tick.on{color:#1f4fd6; border-color:#1f4fd6}
.who-chip{display:flex; align-items:center; gap:6px; margin-left:12px; margin-right:auto; font-size:.85rem}
.who-chip:empty{display:none}
.who-name{background:var(--panel-2); border:1px solid var(--line); border-radius:999px; padding:4px 10px; white-space:nowrap}
@media (max-width:640px){ .who-chip{display:none} }
.ctrl-row{display:flex; align-items:center; gap:8px}
.ctrl-row input[type=range]{flex:1; min-width:0}
.ctrl-num{width:5.2em; font:inherit; font-size:.92rem; padding:4px 6px; border:1.5px solid var(--line); border-radius:8px; background:var(--panel); color:var(--ink)}
.ctrl-unit{font-size:.85rem; color:var(--muted)}
/* electron ladder */
.ladder-box{border:2px solid var(--line); border-radius:14px; padding:10px 14px; background:var(--panel)}
.ladder-end{font-size:.85rem; font-weight:800; color:var(--muted)}
.ladder{margin:6px 0 6px 1.4em; padding:0}
.ladder li{padding:5px 8px; border-radius:8px; margin:2px 0; font-weight:600}
.ladder li.pos{background:#fde2e2; color:#9b1c1c}
.ladder li.neg{background:#dce8ff; color:#1d4fb0}
.ladder-res{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.chip.ladder-pos{background:#fde2e2; border-color:#e08a8a; color:#9b1c1c}
.chip.ladder-neg{background:#dce8ff; border-color:#8aa8e0; color:#1d4fb0}
.ladder-ref{display:inline-block; margin:8px 0 2px; padding:8px 12px; border:1.5px solid var(--line); border-radius:10px; font-size:.9rem; font-weight:400; background:var(--panel-2)}
.ladder-ref ol{margin:.3em 0 .3em 1.4em}
.ladder-ref small{display:block; color:var(--muted)}
.rod-flow{animation:rodFlow .6s linear infinite}
@keyframes rodFlow{to{stroke-dashoffset:-14}}
.answer-btn.picked{color:#fff}
.answer-btn.picked.right{background:#1b7f46; border-color:#1b7f46}
.answer-btn.picked.wrong{background:#b83434; border-color:#b83434}
.answer-btn.should{outline:3px dashed #1b7f46; outline-offset:2px}
.answer-btn:disabled{opacity:1}
/* ---- electromagnet bench and crane ---- */
.emag-svg{touch-action:none; user-select:none; -webkit-user-select:none}
.pack-box{fill:var(--panel-2); stroke:var(--ink); stroke-opacity:.45; stroke-width:2}
.cell-band{fill:#e0a12f}
.cell-txt.dark{fill:#2a1e00}
.strap{fill:none; stroke:var(--copper); stroke-width:3}
.wire-cu{fill:none; stroke:var(--copper); stroke-width:4; stroke-linejoin:round}
.flow-cu{fill:none; stroke:var(--spark); stroke-width:3; stroke-dasharray:4 16; stroke-linecap:round; pointer-events:none}
.rig-lbl{font-family:var(--font-body); font-size:12.5px; fill:var(--ink); font-weight:600}
.rig-lbl.strong{font-weight:800}
.rig-lbl.soft{fill:var(--muted); font-weight:600; font-size:11.5px}
.rig-lbl.tiny{font-size:10px; fill:#fff; font-weight:800}
.rig-switch{cursor:pointer}
.rig-switch-hit{fill:var(--accent-soft); stroke:var(--accent); stroke-width:2; stroke-dasharray:5 4}
.rig-switch.on .rig-switch-hit{fill:#dff5e6; stroke:#1f9d55; stroke-dasharray:none}
.rig-switch:hover .rig-switch-hit, .rig-switch:focus-visible .rig-switch-hit{stroke-width:3}
.rig-switch .sw-lbl{font-size:13px; font-weight:800; fill:var(--accent)}
.rig-switch.on .sw-lbl{fill:#1f7a45}
.sw-post{fill:var(--ink)}
.rig-switch .lever{transition:all .18s}
.coil-turn{stroke:var(--copper); stroke-width:3.2; stroke-linecap:round}
.field{fill:none; stroke:var(--accent); stroke-width:2; stroke-dasharray:6 6; pointer-events:none}
.pull-zone{fill:var(--accent); fill-opacity:.07; stroke:var(--accent); stroke-opacity:.5; stroke-width:1.5; stroke-dasharray:3 5; pointer-events:none}
.stand{fill:var(--metal)}
.stand.dark{fill:var(--ink); opacity:.6}
.tray{fill:var(--metal); opacity:.55}
.clip path{fill:none; stroke:#5c6478; stroke-width:1.9; stroke-linecap:round}

@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .clip path{stroke:#c5cbe0} }
