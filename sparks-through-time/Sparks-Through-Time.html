function torch(el, opts){
  opts = opts || {};
  const s = Object.assign({battery:true, switchOn:false, bulbTight:true}, opts.state||{});
  const svg = sv('svg',{viewBox:'0 0 440 160', class:'sim-svg', role:'img', 'aria-label':'Torch'});
  const g = sv('g'); svg.append(g);
  const lit = ()=> s.battery && s.switchOn && s.bulbTight;
  function draw(){
    while (g.firstChild) g.firstChild.remove();
    if (lit()) g.append(sv('path',{d:'M330 70 L440 30 L440 130 L330 92 Z', fill:'var(--spark)', opacity:.45}));
    g.append(sv('rect',{x:50, y:52, width:240, height:56, rx:14, fill:'#3a5aa8'}), sv('rect',{x:70, y:62, width:170, height:36, rx:6, fill:'var(--board)', stroke:'var(--line)'}));
    if (s.battery) g.append(sv('rect',{x:80, y:68, width:140, height:24, rx:5, class:'cell-body'}), sv('rect',{x:206, y:68, width:14, height:24, rx:3, class:'cell-cap'}), sv('text',{x:140, y:80, class:'cell-txt'}, 'BATTERY'));
    else g.append(sv('text',{x:155, y:84, class:'t-small svg-muted', 'text-anchor':'middle'}, 'battery missing'));
    g.append(sv('path',{d:'M222 80 H250 V48 M262 48 V80 H300', stroke:'var(--copper)', 'stroke-width':3, fill:'none'}));
    g.append(sv('rect',{x:240, y:40, width:32, height:12, rx:4, fill:'var(--metal)'}), sv('rect',{x:244, y: s.switchOn ? 38 : 30, width:24, height: s.switchOn ? 6 : 12, rx:3, fill: s.switchOn ? 'var(--ok)' : 'var(--bad)'}), sv('text',{x:256, y:24, class:'t-small svg-muted', 'text-anchor':'middle'}, s.switchOn ? 'switch ON' : 'switch OFF'));
    g.append(sv('path',{d:'M290 52 L330 36 V124 L290 108 Z', fill:'#2f4a8c'}));
    const bx = s.bulbTight ? 318 : 334;
    g.append(sv('circle',{cx:bx, cy:80, r:13, class:'glass', fill: lit() ? '#fff3b0' : null}));
    if (!s.bulbTight) g.append(sv('text',{x:350, y:118, class:'t-small svg-muted', 'text-anchor':'middle'}, 'bulb loose'));
  }
  draw();
  const ctr = h('div',{class:'row'});
  const want = opts.controls || ['switch','battery'];
  const btn = {};
  if (want.includes('switch')) ctr.append(btn.sw = h('button',{class:'btn', type:'button', onclick:()=>{ s.switchOn = !s.switchOn; upd(); }}));
  if (want.includes('battery')) ctr.append(btn.bat = h('button',{class:'btn', type:'button', onclick:()=>{ s.battery = !s.battery; upd(); }}));
  if (want.includes('bulb')) ctr.append(btn.bulb = h('button',{class:'btn', type:'button', onclick:()=>{ s.bulbTight = !s.bulbTight; upd(); }}));
  function labels(){ if (btn.sw) btn.sw.textContent = s.switchOn ? 'Switch it off' : 'Switch it on'; if (btn.bat) btn.bat.textContent = s.battery ? 'Take the battery out' : 'Put the battery back'; if (btn.bulb) btn.bulb.textContent = s.bulbTight ? 'Loosen the bulb' : 'Screw the bulb in'; }
  function upd(){ draw(); labels(); if (opts.onChange) opts.onChange(Object.assign({lit:lit()}, s)); }
  labels();
  el.append(svg, ctr);
  return { state:s, set(n){ Object.assign(s, n); draw(); labels(); }, lit };
}

const ELEMENTS = ['Hydrogen','Helium','Lithium','Beryllium','Boron','Carbon','Nitrogen','Oxygen','Fluorine','Neon','Sodium','Magnesium','Aluminium','Silicon','Phosphorus','Sulfur','Chlorine','Argon'];
const SYMBOLS  = ['H','He','Li','Be','B','C','N','O','F','Ne','Na','Mg','Al','Si','P','S','Cl','Ar'];
const NEUTRONS = [0,2,4,5,6,6,7,8,10,10,12,12,14,14,16,16,18,22];

function atomBuilder(el, opts){
  opts = opts || {};
  const st = {p: opts.p||0, n: opts.n||0, e: opts.e||0};
  const svg = sv('svg',{viewBox:'0 0 320 320', class:'sim-svg', role:'img', 'aria-label':'Atom model'});
  const gS = sv('g'), gN = sv('g'); svg.append(gS, gN);
  const info = h('div',{class:'readout'});
  const steppers = [
    stepper({label:'Protons', sub:'positive (+), in the nucleus', value:st.p, min:0, max:18, onChange:v=>{st.p=v; draw();}}),
    stepper({label:'Neutrons', sub:'no charge, in the nucleus', value:st.n, min:0, max:22, onChange:v=>{st.n=v; draw();}}),
    stepper({label:'Electrons', sub:'negative (−), in the shells', value:st.e, min:0, max:18, onChange:v=>{st.e=v; draw();}})
  ];
  el.append(h('div',{class:'sim-grid'}, svg, h('div',{class:'controls'}, h('div',{class:'card', style:{padding:'6px 14px'}}, steppers), info)));
  function draw(){
    while (gS.firstChild) gS.firstChild.remove(); while (gN.firstChild) gN.firstChild.remove();
    const shells = [2,8,8], radii = [62,98,134];
    let left = st.e;
    shells.forEach((cap,i)=>{
      gS.append(sv('circle',{cx:160, cy:160, r:radii[i], fill:'none', stroke:'var(--line)', 'stroke-width':2, 'stroke-dasharray': i===0?'':'4 5'}));
      const cnt = Math.min(cap, left); left -= cnt;
      const g = sv('g',{class: reduceMotion ? '' : 'spin', style:`animation-duration:${18+i*8}s`});
      for (let k=0;k<cnt;k++){ const a = 2*Math.PI*k/cnt - Math.PI/2; const x = 160+radii[i]*Math.cos(a), y = 160+radii[i]*Math.sin(a);
        g.append(sv('circle',{cx:x, cy:y, r:9, fill:'var(--flow)'}), sv('text',{x, y:y+1, class:'cell-txt', 'font-size':14}, '−')); }
      gS.append(g);
    });
    const parts = []; let a=st.p, b=st.n; while (a||b){ if (a){parts.push('p'); a--;} if (b){parts.push('n'); b--;} }
    parts.forEach((t,k)=>{ const r = 7.2*Math.sqrt(k), ang = k*2.39996; const x = 160 + r*Math.cos(ang), y = 160 + r*Math.sin(ang);
      gN.append(sv('circle',{cx:x, cy:y, r:8, fill: t==='p' ? '#d9484a' : '#8f98ad', stroke:'var(--board)', 'stroke-width':1.5}));
      if (t==='p') gN.append(sv('text',{x, y:y+.5, class:'cell-txt', 'font-size':11}, '+')); });
    if (!parts.length) gN.append(sv('text',{x:160, y:160, class:'lbl', fill:'var(--muted)'}, 'Add some protons!'));
    const name = st.p>0 ? `${ELEMENTS[st.p-1]} (${SYMBOLS[st.p-1]})` : 'No element yet';
    const q = st.p - st.e; const chg = q===0 ? '0, neutral' : (q>0 ? `+${q}, an ion` : `${q}, an ion`);
    info.innerHTML = '';
    info.append(h('div',{}, h('span',{}, 'Element'), h('b',{style:{fontSize:'1rem'}}, name)), h('div',{}, h('span',{}, 'Overall charge'), h('b',{style:{fontSize:'1rem'}}, chg)), h('div',{}, h('span',{}, 'Mass number (p + n)'), h('b',{}, st.p+st.n)));
    if (opts.onChange) opts.onChange(Object.assign({}, st));
  }
  draw();
  return { set(p,n,e){ st.p=p; st.n=n; st.e=e; steppers[0].set(p); steppers[1].set(n); steppers[2].set(e); draw(); }, get state(){ return Object.assign({}, st); } };
}

/* ---------- Thomson's beam tube ---------- */
function beamTube(el, onChange){
  let mode = 'off';
  const svg = sv('svg',{viewBox:'0 0 440 190', class:'sim-svg', role:'img', 'aria-label':'Thomson’s glass tube with a beam'});
  svg.append(sv('rect',{x:20, y:40, width:400, height:110, rx:50, fill:'var(--glass)', stroke:'var(--metal)', 'stroke-width':2}));
  svg.append(sv('rect',{x:30, y:80, width:14, height:30, fill:'var(--metal)'}), sv('text',{x:37, y:170, class:'t-small svg-muted', 'text-anchor':'middle'}, 'beam starts here'));
  svg.append(sv('rect',{x:400, y:52, width:8, height:86, fill:'#7dffb0', opacity:.5}), sv('text',{x:404, y:30, class:'t-small svg-muted', 'text-anchor':'middle'}, 'glowing screen'));
  const top = sv('g'), bot = sv('g'), beam = sv('path',{fill:'none', stroke:'#2fd27a', 'stroke-width':4, 'stroke-linecap':'round'}), dot = sv('circle',{r:7, fill:'#7dffb0'});
  svg.append(top, bot, beam, dot);
  const plate = (g, y, sign)=>{ while (g.firstChild) g.firstChild.remove(); const col = sign==='+' ? '#d9484a' : sign==='−' ? '#4a73d9' : 'var(--metal)'; g.append(sv('rect',{x:170, y, width:120, height:10, rx:2, fill:col})); if (sign) g.append(sv('text',{x:300, y:y+8, class:'lbl', 'text-anchor':'start', style:`fill:${col}`, 'font-size':16}, sign)); };
  function draw(){
    const d = mode==='off' ? 0 : mode==='topPos' ? -1 : 1;
    plate(top, 62, d===0 ? '' : d<0 ? '+' : '−'); plate(bot, 118, d===0 ? '' : d<0 ? '−' : '+');
    const endY = 95 + d*38;
    beam.setAttribute('d', `M44 95 L170 95 Q260 95 404 ${endY}`); dot.setAttribute('cx', 404); dot.setAttribute('cy', endY);
    if (onChange) onChange(mode);
  }
  el.append(svg, h('div',{class:'ctrl'}, h('label',{}, 'Metal plates'), seg([['off','Plates off'],['topPos','Top +, bottom −'],['topNeg','Top −, bottom +']], 'off', v=>{ mode=v; draw(); }, 'Metal plates')));
  draw();
}

const PIECES = {
  ball:{name:'Solid ball', r:44}, pudding:{name:'Positive pudding', r:92}, electron:{name:'Electron', r:9},
  proton:{name:'Proton', r:10}, neutron:{name:'Neutron', r:10}, shell1:{name:'Small shell', ring:62}, shell2:{name:'Big shell', ring:104}

function drawPiece(p){

  if (p.t==='pudding'){ g.append(sv('circle',{cx:x, cy:y, r:92, fill:'#f3c3a6', stroke:'#b0703f', 'stroke-width':3, opacity:.95})); [[-50,-30],[40,-50],[55,30],[-30,50],[0,-70],[-70,10]].forEach(([dx,dy])=>g.append(sv('text',{x:x+dx, y:y+dy, class:'lbl', style:'fill:#a33a2a'}, '+'))); }
  if (p.t==='electron') g.append(sv('circle',{cx:x, cy:y, r:9, fill:'var(--flow)'}), sv('text',{x, y:y+1, class:'cell-txt', 'font-size':13}, '−'));
  if (p.t==='proton') g.append(sv('circle',{cx:x, cy:y, r:10, fill:'#d9484a'}), sv('text',{x, y:y+.5, class:'cell-txt', 'font-size':12}, '+'));
  if (p.t==='neutron') g.append(sv('circle',{cx:x, cy:y, r:10, fill:'#8f98ad'}));
  if (p.t==='shell1' || p.t==='shell2') g.append(sv('circle',{cx:x, cy:y, r:PIECES[p.t].ring, fill:'none', stroke:'var(--muted)', 'stroke-width':2.5, 'stroke-dasharray':'6 5'}));

}
const dist = (a,b)=>Math.hypot(a.x-b.x, a.y-b.y);
function nucleusOf(ps){ const nuc = ps.filter(p=>p.t==='proton'||p.t==='neutron'); if (!nuc.length) return null; const c = {x:nuc.reduce((a,p)=>a+p.x,0)/nuc.length, y:nuc.reduce((a,p)=>a+p.y,0)/nuc.length}; return {c, nuc, compact: nuc.every(p=>dist(p,c)<=32), protons: nuc.filter(p=>p.t==='proton').length}; }
const count = (ps,t)=>ps.filter(p=>p.t===t).length;
const MODELS = {
  dalton:{title:'Dalton’s model (1803)', text:'Build Dalton’s model of an atom.', check(ps){ return [
      [count(ps,'ball')===1, 'One solid ball'],
      [ps.every(p=>p.t==='ball'), 'Nothing else: Dalton didn’t know about any smaller particles']]; },
    exemplar(s){ s.append(drawPiece({t:'ball', x:100, y:100})); }, note:'Dalton imagined each atom as a solid, uncuttable ball.'},
  thomson:{title:'Thomson’s model (1897)', text:'Build Thomson’s plum pudding model.', check(ps){ const pud = ps.find(p=>p.t==='pudding'); const inside = pud ? ps.filter(p=>p.t==='electron' && dist(p,pud) < 86).length : 0; return [
      [count(ps,'pudding')===1, 'One ball of positive “pudding”'],
      [inside>=3, 'At least 3 electrons dotted <i>inside</i> the pudding'],
      [!count(ps,'proton') && !count(ps,'neutron'), 'No nucleus yet (Rutherford hadn’t found it)'],
      [!count(ps,'shell1') && !count(ps,'shell2') && !count(ps,'ball'), 'No shells or solid balls']]; },
    exemplar(s){ s.append(drawPiece({t:'pudding', x:100, y:100})); [[70,80],[120,70],[130,120],[80,130],[100,100]].forEach(([x,y])=>s.append(drawPiece({t:'electron', x, y}))); }, note:'Negative electrons spread through a ball of positive charge.'},
  rutherford:{title:'Rutherford’s model (1911)', text:'Build Rutherford’s nuclear model.', check(ps){ const n = nucleusOf(ps); const el = ps.filter(p=>p.t==='electron'); return [
      [n && n.protons>=1, 'A nucleus with at least one proton'],
      [n && n.compact, 'The nucleus is tiny, with its particles packed close together'],
      [n && el.length>=1 && el.every(e=>dist(e,n.c)>=55), 'Electrons outside the nucleus, with lots of empty space between'],
      [!count(ps,'pudding') && !count(ps,'ball'), 'No pudding or solid ball'],
      [!count(ps,'shell1') && !count(ps,'shell2'), 'No shells yet (that was Bohr’s idea)']]; },
    exemplar(s){ s.append(drawPiece({t:'proton', x:96, y:96}), drawPiece({t:'proton', x:106, y:104})); [[40,70],[160,90],[110,170],[60,150]].forEach(([x,y])=>s.append(drawPiece({t:'electron', x, y}))); }, note:'A tiny, heavy, positive nucleus with electrons around it and mostly empty space. Neutrons weren’t discovered until 1932, so adding them is fine but not needed.'},
  bohr:{title:'Bohr’s model (1913)', text:'Build Bohr’s model with electrons in shells.', check(ps){ const n = nucleusOf(ps); const shells = ps.filter(p=>p.t==='shell1'||p.t==='shell2'); const el = ps.filter(p=>p.t==='electron');

};
function modelMaker(area, key, m){
  const spec = MODELS[key]; let pieces = [], strokes = [], tool = 'electron', drag = null, pen = null;
  const svg = sv('svg',{viewBox:'0 0 340 300', class:'sim-svg mm-board', role:'img', 'aria-label':'Model making board'});
  svg.style.touchAction = 'none';
  const gP = sv('g'), gS = sv('g'); svg.append(sv('rect',{x:0, y:0, width:340, height:300, fill:'transparent'}), gP, gS);
  const toPt = ev=>{ const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; const r = pt.matrixTransform(svg.getScreenCTM().inverse()); return {x:clamp(r.x,0,340), y:clamp(r.y,0,300)}; };
  function render(){ while (gP.firstChild) gP.firstChild.remove(); while (gS.firstChild) gS.firstChild.remove();
    const order = ['shell2','shell1','pudding','ball','neutron','proton','electron'];
    pieces.slice().sort((a,b)=>order.indexOf(a.t)-order.indexOf(b.t)).forEach(p=>gP.append(drawPiece(p)));
    strokes.forEach(st=>gS.append(sv('polyline',{points:st.map(p=>`${p.x},${p.y}`).join(' '), fill:'none', stroke:'var(--accent)', 'stroke-width':3, 'stroke-linecap':'round', 'stroke-linejoin':'round'}))); }
  function hitTest(pt){ const order = ['electron','proton','neutron','ball','pudding','shell1','shell2'];
    const cands = pieces.filter(p=> PIECES[p.t].ring ? Math.abs(dist(p,pt)-PIECES[p.t].ring) < 9 : dist(p,pt) < PIECES[p.t].r);
    cands.sort((a,b)=>order.indexOf(a.t)-order.indexOf(b.t)); return cands[0] || null; }
  svg.addEventListener('pointerdown', ev=>{ ev.preventDefault(); const pt = toPt(ev); try{ svg.setPointerCapture(ev.pointerId); }catch(e){}

    const hp = hitTest(pt);

    if (hp){ drag = {p:hp, dx:hp.x-pt.x, dy:hp.y-pt.y}; return; }

  const tools = h('div',{class:'toolrow', role:'toolbar', 'aria-label':'Model pieces'});
  const toolDefs = [...Object.entries(PIECES).map(([k,v])=>[k,v.name]), ['pen','Pen (for labels)'], ['eraser','Eraser']];
  toolDefs.forEach(([k,label])=>{ const b = h('button',{class:'tool', type:'button', 'aria-pressed':String(k===tool), onclick:()=>{ tool = k; [...tools.children].forEach(x=>x.setAttribute('aria-pressed', String(x===b))); }}, label); b.style.minWidth = 'auto'; b.style.padding = '7px 10px'; tools.append(b); });
  const checklist = h('div',{class:'chip-row'});
  const compare = h('div',{class:'info-card', hidden:true});
  const checkBtn = h('button',{class:'btn primary', type:'button', onclick:()=>{
    const res = spec.check(pieces); checklist.innerHTML = '';
    res.forEach(([ok, txt])=>checklist.append(h('span',{class:'chip ' + (ok?'ok':'no'), html:(ok?'✓ ':'✗ ') + txt})));
    compare.hidden = false; compare.innerHTML = '';
    const ex = sv('svg',{viewBox:'0 0 200 200', width:170, height:170, class:'ex-svg', role:'img', 'aria-label':'The real model'}); spec.exemplar(ex);
    compare.append(h('div',{class:'row', style:{alignItems:'flex-start'}}, ex, h('div',{style:{display:'grid', gap:'6px', maxWidth:'34ch'}}, h('b',{}, 'The real model'), h('p',{}, spec.note), h('p',{class:'legend'}, 'Compare it with yours. What’s the same? What’s different?'))));
    if (res.every(r=>r[0])) m.done(`<strong>Mission complete!</strong> Your model matches ${spec.title}.`);
    else m.hint('Nearly there! Look at the red features in the checklist and compare your model with the real one.');
  }}, 'Check my model');
  area.append(h('p',{class:'legend'}, 'Choose a piece, then tap the board to place it. Drag pieces to move them. The pen lets you add your own labels.'), tools, svg,
    h('div',{class:'row'}, checkBtn, h('button',{class:'btn', type:'button', onclick:()=>{ pieces = []; strokes = []; render(); checklist.innerHTML=''; compare.hidden = true; }}, 'Clear the board'), h('button',{class:'btn', type:'button', onclick:()=>{ strokes = []; render(); }}, 'Clear pen marks')), checklist, compare);

function chargeLab(el, opts){
  opts = opts || {};
  const mystery = opts.mystery!=null; const q = [0, mystery ? opts.mystery : 0]; let ang = [0,0], target = [0,0], raf = 0;

  const result = h('div',{class:'feedback', role:'status'});
  function drawBall(i){

    const sym = q[i]<0 ? '−' : q[i]>0 ? '+' : '';
    const col = q[i]<0 ? '#1d4fb0' : '#b02a2a';
    if (q[i]===0){ g.append(sv('text',{x:x-8, y:y-6, class:'lbl', style:'fill:#b02a2a', 'font-size':13}, '+'), sv('text',{x:x+8, y:y-6, class:'lbl', style:'fill:#1d4fb0', 'font-size':15}, '−'), sv('text',{x:x-8, y:y+9, class:'lbl', style:'fill:#1d4fb0', 'font-size':15}, '−'), sv('text',{x:x+8, y:y+9, class:'lbl', style:'fill:#b02a2a', 'font-size':13}, '+')); }
    else { [[-9,-7],[9,-7],[-9,9],[9,9]].forEach(([dx,dy])=>g.append(sv('text',{x:x+dx, y:y+dy, class:'lbl', style:`fill:${col}`, 'font-size':16}, sym))); }

      weak:'<strong>A small pull!</strong> A charged object can attract a neutral one. The charges inside the neutral ball shift a little, so its near side becomes slightly charged. This is how a rubbed balloon sticks to a wall.',

/* ================= Stop 3: Volta and circuits ================= */
const LW = Circuit.loopWith;
const BASIC = {'h,0,2':'bulb','h,2,2':'cell'};
const BYPASS = {'v,0,2':{type:'wire', locked:false}, 'h,1,2':{type:'wire', locked:false}, 'v,0,3':{type:'wire', locked:false}};

function partsGallery(el){
  const parts = [
    ['cell','Cell','Gives the push (voltage) that makes electricity flow. Two or more cells joined together make a <b>battery</b>. The long line on the symbol is the + end.'],
    ['wire','Wire','Metal wires are <b>conductors</b>: they let electricity flow through them easily.'],
    ['bulb','Bulb','Glows when electricity flows through its thin filament.'],
    ['switch','Switch','Opens or closes a gap in the circuit, turning it off or on.'],
    ['ammeter','Ammeter','Measures the <b>current</b> flowing through it, in amps (A).']];
  const grid = h('div',{class:'parts-grid'});
  parts.forEach(([t,name,desc])=>{
    const a = h('div',{}), b = h('div',{});
    const edge = {'h,0,0': t==='switch' ? {type:t, closed:true} : t==='ammeter' ? {type:t, label:' '} : {type:t}};
    grid.append(h('div',{class:'part-card'}, h('b',{}, name), h('div',{class:'pair'}, a, b), h('p',{html:desc})));
    Circuit.board(a, {cols:1, rows:0, edges:edge, readonly:true, mini:true, hideResults:true, view:'picture', label:name+' picture'});
    Circuit.board(b, {cols:1, rows:0, edges:edge, readonly:true, mini:true, hideResults:true, view:'symbols', label:name+' symbol'});
  });
  el.append(grid, h('p',{class:'legend'}, 'Left: what the part looks like. Right: its circuit symbol. Scientists everywhere use the same symbols, so anyone can read a circuit diagram.'));
}
function puzzle(stage, api, cfg){
  return Circuit.board(stage, {cols:4, rows:2, edges:cfg.edges, tools:cfg.tools, slots:cfg.slots, noUnscrew:cfg.noUnscrew, onChange:(s,user)=>{ if (!api.isDone() || cfg.always) cfg.check(s, api, user); }});
}

registerStop({
  id:'circuits', order:3, year:1800, yearLabel:'1800', place:'Como, Italy', who:'Alessandro Volta', title:'The First Battery', topic:'Current electricity and circuits', hue:150,
  intro:`<p>Buongiorno, and welcome to 1800! Static electricity is exciting, but it only gives you one quick spark. <b>Alessandro Volta</b> wanted electricity that kept on flowing. He stacked discs of zinc and copper with cardboard soaked in salty water between them, and it worked! His “voltaic pile” was the world’s first battery. The unit for voltage, the <b>volt (V)</b>, is named after him.</p><p>With a steady flow of electricity, called <b>current</b>, we can finally build circuits. Let’s get building!</p>`,
  learn:[
    { title:'Meet the parts', say:'<p>Here are the parts you’ll use in this lab. Each one has a picture and a <b>circuit symbol</b>. Have a good look, then press Next.</p><p>Here’s the golden rule: electricity can only flow if there is a <b>complete loop</b> from one end of the cell, through the parts, and back to the other end.</p>', auto:true,
      build(stage){ partsGallery(stage); }},
    { title:'Puzzle 1: Light the bulb', say:'<p>This bulb won’t light because there’s a gap in the loop. Drag a <b>wire</b> from the parts bin and connect its two round ends across the glowing gap. The ends snap into place when you get close.</p>',
      build(stage, api){ puzzle(stage, api, {edges:LW(BASIC, ['v,0,4'], {lock:true}), tools:['wire'], slots:['v,0,4'], check:s=>{ if (s.maxB>0.5) api.complete('You did it! The loop is complete, so electricity flows from the cell, through the bulb and back again. Those moving dots show the flow.'); }}); }},
    { title:'Puzzle 2: Add a switch', say:'<p>Every good circuit needs a way to turn it off. Drag a <b>switch</b> from the parts bin into the glowing gap so both ends join up. Then tap the switch to close it.</p>',

        if (s.switches.length && s.maxB>0.5) api.complete('Lights on! Now tap the switch again to turn it off. An <b>open</b> switch makes a gap in the circuit, so the electricity stops. A <b>closed</b> switch completes the loop.');
        else if (s.switches.length) api.hint('Your switch is in, but it’s open. Tap the switch to close it.'); }}); }},
    { title:'Puzzle 3: The sneaky shortcut', say:'<p>Uh-oh! Someone has added extra wires and now the bulb won’t light. First, work out why. Then tap the part that’s causing the problem and press <b>Remove</b> (or just drag it away).</p>',
      build(stage, api){ const show = h('div',{class:'stage'}); const b = Circuit.board(show, {cols:4, rows:2, edges:Object.assign(LW(BASIC, []), BYPASS), readonly:true, mini:true}); stage.append(show);
        askInline(stage, [{tag:'Diagnose it', q:'Look closely at the circuit. Why do you think the bulb isn’t lighting?', options:['The extra wires give the electricity an easier path around the bulb','The bulb is broken','The cell has run out','There aren’t enough wires'], answer:0, hint:'Follow the moving dots with your finger. Do any of them go through the bulb?', explain:'The electricity takes the easy path through the extra wires and skips the bulb. This is called a <b>short circuit</b>, and it can make wires dangerously hot. Now fix it!'}], ()=>{ show.remove(); puzzle(stage, api, {edges:Object.assign(LW(BASIC, [], {lock:true}), BYPASS), tools:['eraser'], check:s=>{ if (s.maxB>0.5) api.complete('The bulb is back! You removed the shortcut, so the electricity has to go through the bulb again.'); }}); }); }},
    { title:'Puzzle 4: Measure the current', say:'<p>Scientists measure the current with an <b>ammeter</b>. Drag one from the parts bin into the glowing gap so it becomes part of the loop.</p>',
      build(stage, api){ puzzle(stage, api, {edges:LW(BASIC, ['h,0,0'], {lock:true}), tools:['ammeter'], slots:['h,0,0'], check:s=>{ if (s.ammeters.length && s.ammeters[0].reading>0.1) api.complete(`Your ammeter reads <b>${fmt(s.ammeters[0].reading)} A</b>. That’s the current: how much electricity flows past each second. Ammeters always go <b>in the loop</b>, in line with the other parts.`); }}); }},
    { title:'Puzzle 5: Double the push', say:'<p>What happens if we use two cells? Make a prediction, then drag the short wire on the left of the cell out of the way. Drag a second cell from the parts bin into the gap.</p>',

        const ed = LW(BASIC, [], {lock:true}); ed['h,2,1'] = {type:'wire', locked:false}; let asked = false;

          else if (s.cells.length===2 && s.maxB<0.05) api.hint('Two cells but no light? Check the new cell is joined at <b>both</b> ends, and that both cells face the same way, + to −. Tap a cell and press <b>Turn it around</b> to flip it.'); }}); }); }}
  ],
  explore(el){
    el.append(pipSay('<p>Welcome to Volta’s workshop! This is your free building space. Try making a circuit with two switches, or one with three bulbs, or switch to <b>Symbols</b> to see your circuit drawn as a proper circuit diagram. The dots show which way the current flows.</p>'));
    const ed = LW({'h,0,2':'bulb','h,2,2':'cell','h,0,0':{type:'switch', closed:true}});
    Circuit.board(el, {cols:6, rows:4, edges:ed, tools:['hand','wire','cell','bulb','switch','ammeter','eraser'], clearable:true});
  },
  challenge: makeChallenge('<p>Volta has three jobs for you! Build each circuit on the board from scratch. I’ll check it automatically as you build. Then try the practice questions to predict which circuits will light.</p>', ()=>[
    {id:'doorbell', title:'The night light', text:'Build a circuit with <b>one bulb</b> and a <b>switch</b> that turns it on and off.',
      build(area, m){ Circuit.board(area, {cols:6, rows:4, edges:{}, tools:['wire','cell','bulb','switch','hand','eraser'], clearable:true, onChange:(s)=>{

        const allClosed = T(e=>{ for (const k in e) if (e[k].type==='switch') e[k].closed = true; });

        else if (s.short) m.hint('Careful, that’s a short circuit!'); }}); }},
    {id:'bright', title:'Super bright', text:'Build a circuit with <b>one bulb</b> that glows at least <b>three times brighter</b> than a normal one-cell circuit.',
      build(area, m){ Circuit.board(area, {cols:6, rows:4, edges:{}, tools:['wire','cell','bulb','switch','hand','eraser'], clearable:true, onChange:(s)=>{

        else if (s.bulbs.length===1 && s.cells.length>=2 && s.maxB<0.05) m.hint('Your cells seem to be cancelling each other out. Are they facing the same way?'); }}); }},
    {id:'twoswitch', title:'Safety lock', text:'Build a circuit with <b>two switches</b> where the bulb only lights when <b>both</b> switches are closed.',

/* ================= Stop 4: Ørsted, Sturgeon and electromagnets ================= */
const CORES = {iron:{name:'Iron nail', f:1, col:'#7d8494'}, steel:{name:'Steel rod', f:.7, col:'#aeb6c4'}, aluminium:{name:'Aluminium rod', f:.04, col:'#d9dde5'}, wood:{name:'Wooden dowel', f:.03, col:'#b98a52'}, none:{name:'No core (air)', f:.1, col:null}};
function clipsFor(s, noise){ if (!s.on) return 0; let v = (s.coils/10)*s.cells*2*CORES[s.core].f; if (noise) v += (Math.random()*2-1)*Math.max(.6, v*.07); return clamp(Math.round(v), 0, 40); }

function electroRig(el, opts){
  opts = opts || {};
  const s = Object.assign({coils:20, cells:1, core:'iron', on:false}, opts.start||{});
  let shown = clipsFor(s, false);
  const svg = sv('svg',{viewBox:'0 0 440 270', class:'sim-svg', role:'img', 'aria-label':'Electromagnet'});
  const g = sv('g'); svg.append(g);
  const ro = h('div',{class:'readout'});
  function draw(){
    while (g.firstChild) g.firstChild.remove();
    const core = CORES[s.core];
    // cells
    for (let i=0;i<s.cells;i++){ g.append(sv('rect',{x:30, y:60+i*30, width:60, height:22, rx:4, class:'cell-body'}), sv('rect',{x:80, y:60+i*30, width:10, height:22, rx:2, class:'cell-cap'}), sv('text',{x:56, y:71+i*30, class:'cell-txt'}, '1.5V')); }
    const wireCol = 'var(--copper)';
    g.append(sv('path',{d:`M90 71 H140 V60 H252`, stroke:wireCol, 'stroke-width':4, fill:'none'}), sv('path',{d:`M30 ${60+(s.cells-1)*30+11} H18 V230 H140 V196 H252`, stroke:wireCol, 'stroke-width':4, fill:'none'}));
    // switch on the left lower wire
    g.append(sv('rect',{x:110, y:222, width:44, height:16, rx:4, class:'switch-base'}), sv('line',{x1:118, y1:230, x2: s.on?146:142, y2: s.on?230:212, class:'lever'}));
    // core
    if (core.col) g.append(sv('rect',{x:252, y:44, width:22, height:168, rx:3, fill:core.col, stroke:'var(--ink)', 'stroke-opacity':.3}));

    const w = s.speed/100*2*Math.PI*1.2; theta += w*dt;
    const deg = theta*180/Math.PI;
    magG.setAttribute('transform', `translate(230 115) rotate(${deg})`);
    blades.setAttribute('transform', `translate(70 115) rotate(${deg})`);
    const v = peak()*Math.sin(theta);
    samples.push(v); samples.shift();
    trace.setAttribute('points', samples.map((y,i)=>`${i*2},${(65 - y/32*58).toFixed(1)}`).join(' '));
    if (++cnt % 6 === 0){ const b = Math.pow(peak()/12, 2); glow.setAttribute('opacity', Math.min(1, b)); glow.setAttribute('r', 22 + 18*Math.min(Math.sqrt(b),2)); }
    requestAnimationFrame(frame);
  }
  function upd(){ ro.innerHTML=''; ro.append(h('div',{}, h('span',{}, 'Peak voltage'), h('b',{}, fmt(peak(),1)+' V')), h('div',{}, h('span',{}, 'Turns per second'), h('b',{}, fmt(s.speed/100*1.2,1)))); srcLabel.textContent = SOURCES[s.source].name; if (opts.onChange) opts.onChange(Object.assign({peak:peak()}, s)); }
  const ctr = h('div',{class:'controls'});
  const want = opts.controls || ['speed'];
  let spd;
  if (want.includes('source')) ctr.append(h('div',{class:'ctrl'}, h('label',{}, 'What spins the generator?'), seg(Object.entries(SOURCES).map(([k,v])=>[k,v.name]), s.source, v=>{ s.source=v; spd.querySelector('label span').textContent = SOURCES[v].speed; drawBlades(); upd(); }, 'Energy source')));
  if (want.includes('speed')){ spd = slider({label:SOURCES[s.source].speed, min:0, max:100, value:s.speed, unit:'%', onInput:v=>{ s.speed=v; upd(); }}); ctr.append(spd); }
  if (want.includes('coils')) ctr.append(slider({label:'Turns of wire in the coil', min:100, max:500, step:100, value:s.coils, onInput:v=>{ s.coils=v; drawCoils(); upd(); }}));

  ctr.append(ro);
  el.append(h('div',{class:'sim-grid'}, h('div',{style:{display:'grid', gap:'8px'}}, svg, scope, h('p',{class:'legend'}, 'The green screen is an oscilloscope. It draws the voltage over time.')), ctr));
  drawCoils(); drawBlades(); upd(); requestAnimationFrame(frame);
  return s;
}

const PAR = Circuit.parallel;

function sideBySide(stage, a, b){
  const A = h('div',{style:{display:'grid', gap:'6px'}}, h('b',{}, a.title)), B = h('div',{style:{display:'grid', gap:'6px'}}, h('b',{}, b.title));
  stage.append(h('div',{style:{display:'grid', gap:'14px', gridTemplateColumns:'repeat(auto-fit, minmax(min(100%, 280px), 1fr))'}}, A, B));
  const ba = Circuit.board(A, Object.assign({cols:4, rows:2, readonly:true, mini:true}, a));
  const bb = Circuit.board(B, Object.assign({cols:4, rows:2}, b));
  return [ba, bb];
}

function scopeView(el, opts){
  opts = opts || {};
  let mode = opts.mode || 'dc';
  const svg = sv('svg',{viewBox:'0 0 360 130', class:'sim-svg', role:'img', 'aria-label':'Oscilloscope'});
  svg.append(sv('rect',{x:0,y:0,width:360,height:130,fill:'#0c1f16'}));
  for (let x=0;x<=360;x+=40) svg.append(sv('line',{x1:x,y1:0,x2:x,y2:130,stroke:'#1e4a33'}));
  svg.append(sv('line',{x1:0,y1:65,x2:360,y2:65,stroke:'#3d8a62','stroke-width':1.5}));

  let t0 = performance.now();

    distText.textContent = `${s.d} km of wire`;
    ro.innerHTML=''; ro.append(h('div',{}, h('span',{}, 'Energy reaching the town'), h('b',{}, Math.round(f*100)+'%')), h('div',{}, h('span',{}, 'Wasted as heat in the wires'), h('b',{}, Math.round((1-f)*100)+'%')), h('div',{}, h('span',{}, 'Homes lit'), h('b',{}, `${Math.round(f*12)} of 12`)));

}

/* ================= Stop 8: today, LEDs and renewables ================= */
const DEMAND = [30,28,27,27,28,32,45,62,70,60,55,55,58,55,52,55,62,78,90,88,80,65,48,36];
const WEATHER = {
  sunny:{name:'Sunny and still', cloud:1, wind:h=>0.12+0.05*Math.sin(h/3)},
  windy:{name:'Grey and windy', cloud:0.3, wind:h=>0.75+0.2*Math.sin(h*0.7)},
  mixed:{name:'A bit of everything', cloud:0.65, wind:h=>0.35+0.25*Math.sin(2*Math.PI*(h-9)/24)}
};
const SRC = {
  solar:{name:'Solar farm', cost:3, max:8, col:'#f2b200', sub:'Up to 25 MW in full sun. Nothing at night!'},
  wind:{name:'Wind farm', cost:4, max:8, col:'#5aa8ff', sub:'Up to 15 MW, depending on the wind.'},
  tidal:{name:'Tidal turbines', cost:5, max:2, col:'#3a6fd9', sub:'Up to 30 MW, rising and falling with the tides twice a day.'},
  hydro:{name:'Hydro dam', cost:6, max:1, col:'#2fb5a3', sub:'A steady 30 MW. There’s only one river!'},
  geo:{name:'Geothermal plant', cost:6, max:1, col:'#d9643a', sub:'A steady 25 MW from hot rocks. Only one good site.'},
  biomass:{name:'Biomass plant', cost:4, max:3, col:'#6a9a3a', sub:'A steady 20 MW from burning plant waste. Some CO₂.'},
  nuclear:{name:'Nuclear power station', cost:10, max:1, col:'#9b7bff', sub:'A steady 60 MW with almost no CO₂, but very expensive.'},
  battery:{name:'Battery store', cost:5, max:4, col:'#c27bd6', sub:'Stores 120 MWh of spare energy for later.'},
  gas:{name:'Gas power station', cost:3, max:3, col:'#8aa0b8', sub:'Up to 40 MW, only switched on when needed. Fossil fuel.'},
  coal:{name:'Coal power station', cost:3, max:3, col:'#555b66', sub:'A steady 50 MW, but it releases lots of CO₂.'}
};
const FOSSIL = ['coal','gas'];
const sunAt = h => (h>=6 && h<=18) ? Math.sin(Math.PI*(h-6)/12) : 0;
function simDay(c, wk){
  const w = WEATHER[wk]; let batt = c.battery*60; const cap = c.battery*120, rate = c.battery*40;
  const hours = []; let blackouts = 0, co2 = 0, wasted = 0;
  for (let hr=0; hr<24; hr++){
    const o = {hr, d:DEMAND[hr], solar:c.solar*25*sunAt(hr)*w.cloud, wind:c.wind*15*w.wind(hr), tidal:c.tidal*30*Math.abs(Math.sin(2*Math.PI*hr/12.4)), hydro:c.hydro*30, geo:c.geo*25, biomass:c.biomass*20, nuclear:c.nuclear*60, coal:c.coal*50, gas:0, fromBatt:0, short:0};
    const supply = o.solar+o.wind+o.tidal+o.hydro+o.geo+o.biomass+o.nuclear+o.coal;
    if (supply >= o.d){ const toBatt = Math.min(supply-o.d, rate, cap-batt); batt += toBatt; wasted += supply-o.d-toBatt; }
    else { let need = o.d-supply; o.fromBatt = Math.min(need, rate, batt); batt -= o.fromBatt; need -= o.fromBatt; o.gas = Math.min(need, c.gas*40); need -= o.gas; o.short = need; if (need>0.5) blackouts++; }
    co2 += o.coal*0.82 + o.gas*0.49 + o.biomass*0.23;
    o.batt = batt; o.cap = cap; hours.push(o);
  }
  const cost = Object.keys(SRC).reduce((a,k)=>a + (c[k]||0)*SRC[k].cost, 0);
  return {hours, blackouts, co2: Math.round(co2), wasted: Math.round(wasted), cost};
}

function townGame(el, opts){
  opts = opts || {};
  const c = Object.assign({solar:0, wind:0, tidal:0, hydro:0, geo:0, biomass:0, nuclear:0, battery:0, gas:0, coal:0}, opts.start||{});
  let wk = opts.weather || 'sunny';
  const budget = opts.budget || 40;
  const costEl = h('b',{});
  const rows = Object.entries(SRC).filter(([k])=>!(opts.noCoal && FOSSIL.includes(k))).map(([k,v])=>stepper({label:v.name, sub:`${v.sub} Cost: ${v.cost}`, value:c[k], min:0, max:v.max, onChange:n=>{ c[k]=n; updCost(); }}));
  function cost(){ return Object.keys(SRC).reduce((a,k)=>a + c[k]*SRC[k].cost, 0); }
  function updCost(){ const x = cost(); costEl.textContent = `${x} / ${budget}`; costEl.style.color = x>budget ? 'var(--bad)' : ''; }
  const chart = sv('svg',{viewBox:'0 0 480 230', class:'sim-svg', role:'img', 'aria-label':'Supply and demand over 24 hours'});
  const strip = sv('svg',{viewBox:'0 0 480 90', class:'sim-svg', role:'img', 'aria-label':'The town'});
  const result = h('div',{class:'feedback', role:'status'});
  const runBtn = h('button',{class:'btn primary', type:'button', onclick:run}, 'Run the day');
  const ctr = h('div',{class:'controls'});
  if (!opts.lockWeather) ctr.append(h('div',{class:'ctrl'}, h('label',{}, 'Weather'), seg(Object.entries(WEATHER).map(([k,v])=>[k,v.name]), wk, v=>{ wk=v; drawChart(null, 24); drawStrip(12, null); }, 'Weather')));
  else ctr.append(h('p',{}, h('b',{}, 'Weather: '), WEATHER[wk].name));
  ctr.append(h('div',{class:'card', style:{padding:'4px 14px'}}, rows), h('div',{class:'row between'}, h('span',{}, 'Budget used: ', costEl), runBtn), result);
  el.append(h('div',{class:'sim-grid'}, h('div',{style:{display:'grid', gap:'8px'}}, strip, chart, h('p',{class:'legend', html: Object.values(SRC).map(s=>`<span class="swatch" style="background:${s.col}"></span>${s.name.replace(' power station','').replace(' store','').replace(' farm','').replace(' plant','').replace(' turbines','')}`).join(' &nbsp; ') + ' &nbsp; <span class="swatch" style="background:var(--bad)"></span>Blackout &nbsp; — line: demand'})), ctr));
  const X = hr => 40 + hr*18.4, Y = v => 200 - v*1.6;
  function drawChart(sim, upto){
    while (chart.firstChild) chart.firstChild.remove();
    for (let v=0; v<=110; v+=25){ chart.append(sv('line',{x1:40, y1:Y(v), x2:476, y2:Y(v), class:'svg-line'}), sv('text',{x:34, y:Y(v)+4, class:'t-small svg-muted', 'text-anchor':'end'}, v)); }
    [0,6,12,18,23].forEach(hr=>chart.append(sv('text',{x: hr===23 ? X(hr)+18 : X(hr)+9, y:216, class:'t-small svg-muted', 'text-anchor': hr===23 ? 'end' : 'middle'}, `${String(hr).padStart(2,'0')}:00`)));
    chart.append(sv('text',{x:6, y:12, class:'t-small svg-muted'}, 'MW'));
    if (sim) sim.hours.slice(0, upto).forEach(o=>{
      let y = 200; const parts = [['nuclear',o.nuclear],['geo',o.geo],['biomass',o.biomass],['hydro',o.hydro],['coal',o.coal],['tidal',o.tidal],['wind',o.wind],['solar',o.solar],['battery',o.fromBatt],['gas',o.gas]];
      let used = 0;
      parts.forEach(([k,v])=>{ const take = Math.max(0, Math.min(v, o.d-used)); if (take<=0) return; used += take; const hgt = take*1.6; chart.append(sv('rect',{x:X(o.hr)+1, y:y-hgt, width:16.4, height:hgt, fill:SRC[k].col})); y -= hgt; });
      if (o.short>0.5) chart.append(sv('rect',{x:X(o.hr)+1, y:y-o.short*1.6, width:16.4, height:o.short*1.6, fill:'var(--bad)', opacity:.75}));
    });
    chart.append(sv('polyline',{points: DEMAND.map((d,hr)=>`${X(hr)+9},${Y(d)}`).join(' '), fill:'none', stroke:'var(--ink)', 'stroke-width':2.5}));
  }
  function drawStrip(hr, o){
    while (strip.firstChild) strip.firstChild.remove();
    const day = sunAt(hr) > 0;
    strip.append(sv('rect',{x:0, y:0, width:480, height:90, fill: day ? (WEATHER[wk].cloud<0.5 ? '#9fb3c8' : '#bfe0ff') : '#1b2140'}));
    if (day) strip.append(sv('circle',{cx:40 + hr/24*400, cy:40 - sunAt(hr)*20, r:12, fill:'#ffd23f'})); else strip.append(sv('circle',{cx:420, cy:22, r:9, fill:'#e8e6d8'}));
    strip.append(sv('rect',{x:0, y:74, width:480, height:16, fill:'#4f7a43'}));
    const dark = o && o.short>0.5;
    for (let i=0;i<14;i++){ const x = 20 + i*33; strip.append(sv('rect',{x, y:48, width:24, height:26, fill:'#d9d2c3'}), sv('path',{d:`M${x-3} 48 L${x+12} 36 L${x+27} 48 Z`, fill:'#a2533a'}), sv('rect',{x:x+8, y:56, width:8, height:8, fill: dark ? '#22262f' : (day ? '#8aa0b8' : '#ffd23f')})); }
    strip.append(sv('text',{x:470, y:16, 'text-anchor':'end', class:'t-mono', 'font-size':13, 'font-weight':700, fill: day ? '#1a2140' : '#ffffff'}, `${String(hr).padStart(2,'0')}:00`));
  }
  function run(){
    if (cost()>budget){ result.className='feedback bad'; result.innerHTML = `That costs ${cost()}, which is over your budget of ${budget}. Remove something before you run the day.`; return; }
    const sim = simDay(c, wk); runBtn.disabled = true; result.className='feedback'; result.innerHTML='';
    let hr = 0;
    const stepFn = ()=>{ if (!chart.isConnected) return; hr++; drawChart(sim, hr); drawStrip(Math.min(hr,23), sim.hours[Math.min(hr,23)]); if (hr<24) setTimeout(stepFn, reduceMotion?0:180); else finish(sim); };
    stepFn();
  }
  function finish(sim){
    runBtn.disabled = false;
    const ok = sim.blackouts===0;
    const lines = [`<strong>${ok ? 'The lights stayed on all day!' : `${sim.blackouts} hour${sim.blackouts===1?'':'s'} of blackout.`}</strong>`];
    lines.push(`CO₂ released: <b>${sim.co2} tonnes</b>. Budget used: <b>${sim.cost} of ${budget}</b>. Spare energy wasted: <b>${sim.wasted} MWh</b>.`);
    if (!ok){ const night = sim.hours.filter(o=>o.short>0.5 && sunAt(o.hr)===0).length; lines.push(night ? 'Most of your blackouts happened when the Sun wasn’t shining. Batteries can store spare daytime energy for the evening.' : 'Your town needed more power during the busy hours. Look at where the red blackout bars are.'); }
    result.className = 'feedback ' + (ok ? 'ok' : 'hint'); result.innerHTML = lines.join('<br>');
    if (opts.onResult) opts.onResult(sim, Object.assign({}, c), wk);
  }
  updCost(); drawChart(null, 24); drawStrip(12, null);
}

function ledCompare(stage, onMove){
  let hrs = 5;
  const svg = sv('svg',{viewBox:'0 0 440 200', class:'sim-svg', role:'img', 'aria-label':'Old bulb and LED compared'});
  const gid = uid('lg');
  svg.append(sv('defs',{}, sv('radialGradient',{id:gid}, sv('stop',{offset:'0%','stop-color':'var(--spark)','stop-opacity':.9}), sv('stop',{offset:'100%','stop-color':'var(--spark)','stop-opacity':0}))));
  [[110,'Old filament bulb','60 W'],[330,'LED bulb','9 W']].forEach(([x,name,w],i)=>{
    svg.append(sv('circle',{cx:x, cy:70, r:58, fill:`url(#${gid})`}), sv('circle',{cx:x, cy:70, r:26, class:'glass'}), sv('rect',{x:x-11, y:94, width:22, height:18, rx:3, class:'metal'}));
    if (!i) svg.append(sv('polyline',{points:`${x-8},92 ${x-8},68 ${x-3},58 ${x},66 ${x+3},58 ${x+8},68 ${x+8},92`, class:'filament lit'}));
    else svg.append(sv('rect',{x:x-9, y:64, width:18, height:10, rx:2, fill:'var(--spark)'}));
    svg.append(sv('text',{x, y:132, class:'lbl'}, name), sv('text',{x, y:150, class:'reading'}, w));
    // heat
    const heat = i ? 0.15 : 0.9;
    svg.append(sv('rect',{x:x+40, y:40, width:10, height:70, rx:5, fill:'var(--panel)', stroke:'var(--ink)'}), sv('rect',{x:x+42, y:40+70*(1-heat), width:6, height:70*heat-2, rx:3, fill:'#d9484a'}), sv('text',{x:x+45, y:122, class:'t-small svg-muted', 'text-anchor':'middle'}, 'heat'));
  });
  const ro = h('div',{class:'readout'});
  function upd(){ const old = 60*hrs*365/1000, led = 9*hrs*365/1000; ro.innerHTML=''; ro.append(h('div',{}, h('span',{}, 'Old bulb, per year'), h('b',{}, Math.round(old)+' kWh')), h('div',{}, h('span',{}, 'LED, per year'), h('b',{}, Math.round(led)+' kWh')), h('div',{}, h('span',{}, 'Energy saved'), h('b',{}, Math.round(old-led)+' kWh'))); }
  stage.append(h('div',{class:'sim-grid'}, svg, h('div',{class:'controls'}, h('p',{}, 'Both bulbs give out the same amount of light.'), slider({label:'Hours switched on each day', min:1, max:12, value:hrs, onInput:v=>{ hrs=v; upd(); if (onMove) onMove(); }}), ro)));
  upd();
}

function materialTester(el, onTest){
  const ed = Circuit.loopWith({'h,0,2':'bulb','h,2,2':'cell','h,0,0':'ammeter','v,0,4':{type:'sample', mat:'copper'}});
  const b = Circuit.board(el, {cols:4, rows:2, edges:ed, readonly:true, label:'Material tester circuit'});
  const results = {}; const tbl = h('div',{class:'tbl-wrap'});
  const litBtn = h('button',{class:'btn small', type:'button', hidden:true, onclick:()=>{ b.mutate(c=>{ for (const k in c) if (c[k].type==='sample') c[k].lit = !c[k].lit; }); record(); litBtn.textContent = cur().lit ? 'Switch off the lamp' : 'Shine a lamp on the silicon'; }}, 'Shine a lamp on the silicon');
  const cur = ()=>Object.values(b.edges).find(c=>c.type==='sample');
  function record(){
    const s = b.stats, smp = s.samples[0]; const key = smp.mat + (smp.lit ? '-lit' : '');
    results[key] = {name: Circuit.MATERIALS[smp.mat].name + (smp.lit ? ' with a lamp on it' : ''), I: s.ammeters[0].reading, lit: s.lit>0};
    tbl.innerHTML = '';
    tbl.append(h('table',{class:'data'}, h('thead',{}, h('tr',{}, h('th',{}, 'Material'), h('th',{}, 'Current (A)'), h('th',{}, 'Bulb lit?'))),
      h('tbody',{}, Object.values(results).map(r=>h('tr',{}, h('td',{style:{textAlign:'left'}}, r.name), h('td',{}, fmt(r.I)), h('td',{}, r.lit ? 'Yes' : 'No'))))));
    if (onTest) onTest(results, smp);
  }
  const grid = h('div',{class:'row'});
  Object.entries(Circuit.MATERIALS).forEach(([k,m])=>grid.append(h('button',{class:'btn small', type:'button', onclick:()=>{ b.mutate(c=>{ for (const id in c) if (c[id].type==='sample'){ c[id].mat = k; c[id].lit = false; } }); litBtn.hidden = k!=='silicon'; litBtn.textContent = 'Shine a lamp on the silicon'; record(); }}, h('span',{class:'swatch', style:{background:m.col}}), m.name)));
  el.append(h('b',{}, 'Clip a material into the tester:'), grid, litBtn, tbl);
  record();
  return b;
}

function freeElectrons(el){
  const mk = (title)=>{ const s = sv('svg',{viewBox:'0 0 300 140', class:'sim-svg', role:'img', 'aria-label':title}); return s; };
  const metal = mk('Electrons in a metal'), plastic = mk('Electrons in plastic');
  const ions = []; for (let r=0;r<4;r++) for (let c=0;c<9;c++) ions.push([24+c*32, 24+r*30]);
  [metal, plastic].forEach((s,i)=>{ s.append(sv('rect',{x:4, y:4, width:292, height:132, rx:10, fill: i ? '#f6d9a8' : '#e8d3b6', opacity:.5})); ions.forEach(([x,y])=>{ s.append(sv('circle',{cx:x, cy:y, r:9, fill: i ? '#e9a23b' : '#c4793a', opacity:.85}), sv('text',{x, y:y+.5, class:'cell-txt', 'font-size':10}, '+')); }); });
  const freeE = Array.from({length:22}, ()=>({x:Math.random()*300, y:10+Math.random()*120, vx:(Math.random()-.5)*60, vy:(Math.random()-.5)*60}));
  const fE = freeE.map(()=>{ const c = sv('circle',{r:4, fill:'var(--flow)'}); metal.append(c); return c; });
  const bound = ions.map(([x,y])=>{ const c = sv('circle',{r:3.5, fill:'var(--flow)'}); plastic.append(c); return {c, x, y, p:Math.random()*6}; });
  let on = false, lt = 0;
  function frame(t){
    if (!metal.isConnected) return;
    const dt = lt ? Math.min(.05, (t-lt)/1000) : 0; lt = t;
    freeE.forEach((e,i)=>{ e.x += (e.vx + (on ? 70 : 0))*dt*(reduceMotion?0:1); e.y += e.vy*dt*(reduceMotion?0:1); if (e.y<8||e.y>132) e.vy *= -1; if (e.x>300) e.x -= 300; if (e.x<0) e.x += 300; if (Math.random()<.02) e.vx = (Math.random()-.5)*60; fE[i].setAttribute('cx', e.x.toFixed(1)); fE[i].setAttribute('cy', e.y.toFixed(1)); });
    bound.forEach(b=>{ b.p += dt*6; const ox = Math.cos(b.p)*12, oy = Math.sin(b.p)*12; b.c.setAttribute('cx', (b.x+ox).toFixed(1)); b.c.setAttribute('cy', (b.y+oy).toFixed(1)); });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  const btn = h('button',{class:'btn primary', type:'button', onclick:()=>{ on = !on; btn.textContent = on ? 'Disconnect the cell' : 'Connect a cell to both'; }}, 'Connect a cell to both');
  el.append(h('div',{style:{display:'grid', gap:'14px', gridTemplateColumns:'repeat(auto-fit, minmax(min(100%, 260px), 1fr))'}}, h('div',{}, h('b',{}, 'Copper (a metal)'), metal), h('div',{}, h('b',{}, 'Plastic'), plastic)), btn);
}

function vir(el, onCover){
  const svg = sv('svg',{viewBox:'0 0 260 220', class:'sim-svg', role:'img', 'aria-label':'The V = I × R triangle', style:'max-width:300px'});
  svg.append(sv('path',{d:'M130 14 L246 204 L14 204 Z', fill:'hsl(var(--hue) 70% var(--hue-bg))', stroke:'var(--ink)', 'stroke-width':3, 'stroke-linejoin':'round'}), sv('line',{x1:66, y1:120, x2:194, y2:120, stroke:'var(--ink)', 'stroke-width':3}), sv('line',{x1:130, y1:120, x2:130, y2:204, stroke:'var(--ink)', 'stroke-width':3}), sv('text',{x:130, y:174, 'text-anchor':'middle', 'font-size':22, 'font-weight':800, fill:'var(--muted)'}, '×'));
  const out = h('div',{class:'info-card', html:'Tap a letter to cover it up. The triangle shows you how to work it out!'});
  const letters = {V:[130,92,'Voltage (V) = Current × Resistance', 'V = I × R'], I:[92,172,'Current (A) = Voltage ÷ Resistance', 'I = V ÷ R'], R:[168,172,'Resistance (Ω) = Voltage ÷ Current', 'R = V ÷ I']};
  const covers = {};
  Object.entries(letters).forEach(([L,[x,y,words,f]])=>{
    const g = sv('g',{style:'cursor:pointer', tabindex:0, role:'button', 'aria-label':`Cover ${L}`});
    const txt = sv('text',{x, y, 'text-anchor':'middle', 'font-size':42, 'font-weight':800, fill:'var(--accent)', 'font-family':'var(--font-display)'}, L);
    const cov = sv('circle',{cx:x, cy:y-14, r:26, fill:'var(--copper)', opacity:0});
    g.append(txt, cov); svg.append(g); covers[L] = cov;
    const act = ()=>{ Object.values(covers).forEach(c=>c.setAttribute('opacity',0)); cov.setAttribute('opacity',.9); out.innerHTML = `<b>${f}</b><br>${words}`; if (onCover) onCover(L); };
    g.addEventListener('click', act); g.addEventListener('keydown', ev=>{ if (ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); act(); } });
  });
  el.append(h('div',{class:'row', style:{alignItems:'center'}}, svg, out));
}

registerStop({
  id:'ohm', order:4.5, year:1827, yearLabel:'1827', place:'Cologne, Germany', who:'Georg Ohm', title:'The Secret of Resistance', topic:'Conductors, insulators, resistance and semiconductors', hue:300,
  intro:`<p>Welcome to 1827! <b>Georg Ohm</b> is a maths teacher who spends his evenings testing wires. He has noticed that some materials let electricity flow through easily, while others fight back. He calls this fighting back <b>resistance</b>, and today we measure it in units named after him: <b>ohms (Ω)</b>.</p><p>On this stop you’ll test materials, find out why metals conduct, discover the famous <b>V = I × R</b> triangle, and fast-forward to the amazing materials inside every phone.</p>`,
  learn:[
    { title:'Conductor or insulator?', say:'<p>Ohm’s first question: which materials let electricity through? A material that lets electricity flow is a <b>conductor</b>. One that stops it is an <b>insulator</b>.</p>',

    { title:'Why do metals conduct?', say:'<p>Zoom right in! In a metal, some electrons aren’t tied to any one atom. These <b>free electrons</b> can wander through the metal. In an insulator like plastic, every electron is held tightly by its own atom. Connect a cell to both and watch.</p>',

    { title:'Resistors', say:'<p>Sometimes we want to control the current, so engineers use parts called <b>resistors</b>. A bigger resistance means it fights the current harder. Tap the resistor and press <b>change</b> to try different resistances.</p>',

        const rec = {}; const tbl = h('div',{class:'tbl-wrap'});

          if (Object.keys(rec).length>=4) api.complete(`You predicted: <i>${pr.txt.toLowerCase()}</i>. Your table shows that the <b>bigger the resistance, the smaller the current</b>. Resistors are inside almost every electronic device, controlling how much current flows to each part.`); }});

    { title:'The V = I × R triangle', say:'<p>Ohm discovered a rule that links voltage, current and resistance: <b>voltage = current × resistance</b>. Scientists remember it with a triangle. Cover the thing you want to find, and the triangle shows you the calculation.</p>',

        stage.append(h('p',{class:'legend'}, 'Cover all three letters to unlock the questions.')); }},
    { title:'Fast-forward: semiconductors', say:'<p>Let’s zoom forward to the 1900s. Some materials, like <b>silicon</b>, are <b>semiconductors</b>: they’re somewhere between a conductor and an insulator. Shine light on silicon or warm it up, and it conducts much better! LEDs are made from semiconductors too, and they have a superpower: current can only flow through them <b>one way</b>.</p>',

  ],

function filamentHeat(el, onChange){
  const svg = sv('svg',{viewBox:'0 0 360 200', class:'sim-svg', role:'img', 'aria-label':'Filament heating up'});
  const gid = uid('fh');
  svg.append(sv('defs',{}, sv('radialGradient',{id:gid}, sv('stop',{offset:'0%','stop-color':'#fff6c8','stop-opacity':.95}), sv('stop',{offset:'100%','stop-color':'#ffb300','stop-opacity':0}))));
  const glow = sv('circle',{cx:150, cy:100, r:80, fill:`url(#${gid})`, opacity:0}); svg.append(glow);
  const fil = sv('path',{d:'M80 100 q10 -24 20 0 q10 -24 20 0 q10 -24 20 0 q10 -24 20 0 q10 -24 20 0 q10 -24 20 0 q10 -24 20 0', fill:'none', 'stroke-width':6, 'stroke-linecap':'round'}); svg.append(fil);

  const tTxt = sv('text',{x:308, y:190, class:'reading', 'text-anchor':'middle'}, ''); svg.append(tTxt);
  const ro = h('div',{class:'readout'});
  const lerp = (a,b,k)=>Math.round(a+(b-a)*k);
  function upd(p){
    const T = Math.round(20 + p/100*2480);
    const k = p/100; let col;
    if (k<0.35) col = `rgb(${lerp(80,170,k/0.35)},${lerp(80,40,k/0.35)},${lerp(90,30,k/0.35)})`; else if (k<0.7) col = `rgb(${lerp(170,255,(k-.35)/.35)},${lerp(40,140,(k-.35)/.35)},30)`; else col = `rgb(255,${lerp(140,240,(k-.7)/.3)},${lerp(30,200,(k-.7)/.3)})`;
    fil.setAttribute('stroke', p<5 ? 'var(--metal)' : col); glow.setAttribute('opacity', Math.max(0, (k-0.4)/0.6).toFixed(2));
    const hgt = 136*k; merc.setAttribute('y', 168-hgt); merc.setAttribute('height', Math.max(4,hgt));

    ro.innerHTML = ''; ro.append(h('div',{}, h('span',{}, 'Filament temperature'), h('b',{}, `${T} °C`)), h('div',{}, h('span',{}, 'Of every 100 J of energy...'), h('b',{style:{fontSize:'1rem'}}, `${light} J light, ${100-light} J heat`)));
    if (onChange) onChange(p);
  }
  el.append(h('div',{class:'sim-grid'}, svg, h('div',{class:'controls'}, slider({label:'Current through the filament', min:0, max:100, value:0, unit:'%', onInput:upd}), ro)));
  upd(0);
}
function sankey(el, kind){

function energyVans(el){
  const svg = sv('svg',{viewBox:'0 0 360 200', class:'sim-svg', role:'img', 'aria-label':'Energy carried round a circuit'});
  svg.append(sv('rect',{x:40, y:30, width:280, height:140, rx:20, fill:'none', stroke:'var(--copper)', 'stroke-width':6}));
  svg.append(sv('rect',{x:150, y:156, width:60, height:28, rx:5, class:'cell-body'}), sv('text',{x:180, y:171, class:'cell-txt'}, 'CELL'));
  svg.append(sv('circle',{cx:180, cy:30, r:18, class:'glass'}), sv('circle',{cx:180, cy:30, r:30, fill:'var(--spark)', opacity:.35}));
  const per = 2*(280+140); const vans = Array.from({length:10}, (_,i)=>({d:i*per/10}));
  const els = vans.map(()=>{ const g = sv('g'); g.append(sv('circle',{r:7, fill:'var(--flow)'}), sv('rect',{x:-5, y:-17, width:10, height:8, rx:2, fill:'var(--spark)', class:'parcel'})); svg.append(g); return g; });
  function pos(d){ d = ((d%per)+per)%per; if (d<280) return [40+d, 170]; d-=280; if (d<140) return [320, 170-d]; d-=140; if (d<280) return [320-d, 30]; d-=280; return [40, 30+d]; }
  let lt = 0;
  const f = (function f(t){ if (!svg.isConnected) return; const dt = lt ? Math.min(.05,(t-lt)/1000) : 0; lt = t;
    vans.forEach((v,i)=>{ v.d += dt*60*(reduceMotion?0:1); const [x,y] = pos(v.d); els[i].setAttribute('transform', `translate(${x} ${y})`);
      const dd = ((v.d%per)+per)%per; const loaded = dd > 175 && dd < 280+140+140; els[i].querySelector('.parcel').setAttribute('opacity', loaded ? 1 : 0); });
    requestAnimationFrame(f); }); requestAnimationFrame(f);
  el.append(svg, h('p',{class:'legend'}, 'Each blue dot is a bit of charge. It picks up an energy parcel at the cell, drops it off at the bulb, and carries on round. The charge keeps going; only the energy is used.'));
}

function sourceIcon(id){
  const s = sv('svg',{viewBox:'0 0 60 44', width:60, height:44, 'aria-hidden':'true'}); const p = POWER.find(x=>x.id===id);
  s.append(sv('rect',{x:0, y:0, width:60, height:44, rx:8, fill:p.col, opacity:.18}));
  const ink = 'var(--ink)';
  if (['coal','gas','biomass','nuclear','geo'].includes(id)){ s.append(sv('rect',{x:8, y:20, width:28, height:18, fill:p.col}), sv('rect',{x:40, y:8, width:8, height:30, fill:ink, opacity:.6})); if (id==='nuclear') s.append(sv('path',{d:'M40 38 Q44 18 52 8 L52 38 Z', fill:p.col})); else s.append(sv('circle',{cx:46, cy:5, r:4, fill:'var(--muted)', opacity:.6})); }
  if (id==='hydro') s.append(sv('path',{d:'M8 8 L30 8 L36 38 L8 38 Z', fill:'var(--metal)'}), sv('path',{d:'M36 20 q8 8 16 18', stroke:p.col, 'stroke-width':4, fill:'none'}));
  if (id==='tidal') s.append(sv('path',{d:'M2 26 q7 -8 14 0 t14 0 t14 0 t14 0', stroke:p.col, 'stroke-width':3, fill:'none'}), sv('circle',{cx:44, cy:10, r:6, fill:'#e8e6d8'}));
  if (id==='wind'){ s.append(sv('line',{x1:30, y1:40, x2:30, y2:20, stroke:ink, 'stroke-width':2})); [0,120,240].forEach(a=>s.append(sv('path',{d:'M30 20 Q33 11 30 4 Q27 11 30 20', fill:p.col, transform:`rotate(${a} 30 20)`}))); }
  if (id==='solar') s.append(sv('circle',{cx:46, cy:10, r:6, fill:p.col}), sv('path',{d:'M6 38 l8 -16 h24 l-8 16 z', fill:'#3a5aa8'}));
  return s;
}
function powerTour(el, onAll){
  const seen = new Set(); const detail = h('div',{class:'info-card', html:'Tap a power source to visit it.'});
  const grid = h('div',{class:'cards-sort'});
  POWER.forEach(p=>{ const b = h('button',{class:'order-btn', type:'button', onclick:()=>{ seen.add(p.id); b.classList.add('picked');
      detail.innerHTML = ''; detail.append(h('div',{class:'row', style:{alignItems:'flex-start'}}, sourceIcon(p.id), h('div',{style:{display:'grid', gap:'6px', minWidth:0, flex:'1'}}, h('b',{}, p.name), h('p',{}, p.how),
        h('div',{class:'chip-row'}, h('span',{class:'chip'}, p.ren), h('span',{class:'chip'}, `About ${p.co2} g of CO₂ per kWh`), h('span',{class:'chip ' + (p.demand?'ok':'no')}, p.demand ? 'Can make power whenever needed' : 'Depends on the weather or tides')),
        h('p',{class:'legend'}, 'Energy chain: ' + p.chain.join(' → ')))));
      if (seen.size===POWER.length && onAll){ const f = onAll; onAll = null; f(); } }}, sourceIcon(p.id), h('b',{}, p.name)); grid.append(b); });
  el.append(grid, detail);
}
function co2Chart(el){
  const data = POWER.slice().sort((a,b)=>b.co2-a.co2);
  const W = 520, rowH = 30, L = 120, Rm = 60, H = data.length*rowH + 40;
  const X = v=>L + v/900*(W-L-Rm);
  const s = sv('svg',{viewBox:`0 0 ${W} ${H}`, class:'sim-svg', role:'img', 'aria-label':'CO2 released per kWh of electricity'});
  [0,200,400,600,800].forEach(v=>s.append(sv('line',{x1:X(v), y1:8, x2:X(v), y2:H-28, class:'svg-line'}), sv('text',{x:X(v), y:H-12, class:'t-small svg-muted', 'text-anchor':'middle'}, v)));
  data.forEach((p,i)=>{ const y = 10 + i*rowH; s.append(sv('text',{x:L-8, y:y+15, class:'t-small svg-ink', 'text-anchor':'end'}, p.name), sv('rect',{x:L, y:y+3, width:Math.max(2, X(p.co2)-L), height:rowH-10, rx:3, fill:p.col}), sv('text',{x:X(p.co2)+6, y:y+15, class:'t-small svg-ink t-mono'}, p.co2)); });
  el.append(s, h('p',{class:'legend'}, 'Grams of CO₂ released for every kWh of electricity, counting building and running the power station (typical values from the IPCC, 2014).'));
}

    {id:'sort3', title:'Three groups', text:'Sort each source: <b>renewable</b>, <b>fossil fuel</b> or <b>non-renewable but low carbon</b>.',
      build(area, m){ sortCards(area, POWER.map(p=>[p.name, p.ren==='Renewable' ? 'r' : p.ren==='Fossil fuel' ? 'f' : 'n']), [['Renewable','r'],['Fossil fuel','f'],['Low carbon, not renewable','n']], ()=>m.done('<strong>Mission complete!</strong> Nuclear is the tricky one: uranium will run out one day, but it releases almost no CO₂.')); }},
    {id:'place', title:'Right source, right place', text:'Engineers choose sources that suit each place. Pick the best match.',
      build(area, m){ askInline(area, [
        {q:'Iceland has volcanoes and hot rocks just under the ground.', options:['Geothermal','Solar','Tidal','Coal'], answer:0, explain:'Iceland gets around 30% of its electricity from geothermal power, and most of the rest from hydro.'},
        {q:'A sunny desert with almost no clouds.', options:['Solar','Hydroelectric','Tidal','Geothermal'], answer:0, explain:'Deserts get loads of strong sunshine.'},
        {q:'A deep river valley in the mountains with heavy rain.', options:['Hydroelectric','Solar','Tidal','Biomass'], answer:0, explain:'A dam can store the river’s water and release it through turbines.'},
        {q:'A windy, flat coastline with shallow sea.', options:['Wind farms offshore','Geothermal','Hydroelectric','Nuclear only'], answer:0, explain:'Steady sea winds are perfect for offshore wind turbines.'}], ()=>m.done('<strong>Mission complete!</strong> The best mix depends on where you are.')); }}
  ]),

    {q:'What heats the water in a nuclear power station?', options:['Splitting uranium atoms','Burning coal','Sunlight','Volcanoes'], answer:0, explain:'Nuclear fission releases huge amounts of heat.'},
    {q:'Which source releases the most CO₂ per kWh?', options:['Coal','Wind','Nuclear','Hydroelectric'], answer:0, explain:'Coal releases roughly 820 g of CO₂ for every kWh.'},
