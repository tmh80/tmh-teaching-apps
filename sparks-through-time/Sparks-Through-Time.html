/* ================= Stop 8: today, LEDs and renewables ================= */
const DEMAND = [30,28,27,27,28,32,45,62,70,60,55,55,58,55,52,55,62,78,90,88,80,65,48,36];
const WEATHER = {
  sunny:{name:'Sunny and still', cloud:1, wind:h=>0.12+0.05*Math.sin(h/3)},
  windy:{name:'Grey and windy', cloud:0.3, wind:h=>0.75+0.2*Math.sin(h*0.7)},
  mixed:{name:'A bit of everything', cloud:0.65, wind:h=>0.35+0.25*Math.sin(2*Math.PI*(h-9)/24)}
};
const SRC = {
  solar:{name:'Solar farm', cost:3, max:8, col:'#f2b200', sub:'Up to 25 MW in full sun. Nothing at night!'},
  wind:{name:'Wind farm', cost:4, max:8, col:'#5aa8ff', sub:'Up to 15 MW, depending on the wind.'},
  tidal:{name:'Tidal turbines', cost:5, max:2, col:'#3a6fd9', sub:'Up to 30 MW, rising and falling with the tides twice a day.'},
  hydro:{name:'Hydro dam', cost:6, max:1, col:'#2fb5a3', sub:'A steady 30 MW. There’s only one river!'},
  geo:{name:'Geothermal plant', cost:6, max:1, col:'#d9643a', sub:'A steady 25 MW from hot rocks. Only one good site.'},
  biomass:{name:'Biomass plant', cost:4, max:3, col:'#6a9a3a', sub:'A steady 20 MW from burning plant waste. Some CO₂.'},
  nuclear:{name:'Nuclear power station', cost:10, max:1, col:'#9b7bff', sub:'A steady 60 MW with almost no CO₂, but very expensive.'},
  battery:{name:'Battery store', cost:5, max:4, col:'#c27bd6', sub:'Stores 120 MWh of spare energy for later.'},
  gas:{name:'Gas power station', cost:3, max:3, col:'#8aa0b8', sub:'Up to 40 MW, only switched on when needed. Fossil fuel.'},
  coal:{name:'Coal power station', cost:3, max:3, col:'#555b66', sub:'A steady 50 MW, but it releases lots of CO₂.'}
};
const FOSSIL = ['coal','gas'];
const sunAt = h => (h>=6 && h<=18) ? Math.sin(Math.PI*(h-6)/12) : 0;
function simDay(c, wk){
  const w = WEATHER[wk]; let batt = c.battery*60; const cap = c.battery*120, rate = c.battery*40;
  const hours = []; let blackouts = 0, co2 = 0, wasted = 0;
  for (let hr=0; hr<24; hr++){
    const o = {hr, d:DEMAND[hr], solar:c.solar*25*sunAt(hr)*w.cloud, wind:c.wind*15*w.wind(hr), tidal:c.tidal*30*Math.abs(Math.sin(2*Math.PI*hr/12.4)), hydro:c.hydro*30, geo:c.geo*25, biomass:c.biomass*20, nuclear:c.nuclear*60, coal:c.coal*50, gas:0, fromBatt:0, short:0};
    const supply = o.solar+o.wind+o.tidal+o.hydro+o.geo+o.biomass+o.nuclear+o.coal;
    if (supply >= o.d){ const toBatt = Math.min(supply-o.d, rate, cap-batt); batt += toBatt; wasted += supply-o.d-toBatt; }
    else { let need = o.d-supply; o.fromBatt = Math.min(need, rate, batt); batt -= o.fromBatt; need -= o.fromBatt; o.gas = Math.min(need, c.gas*40); need -= o.gas; o.short = need; if (need>0.5) blackouts++; }
    co2 += o.coal*0.82 + o.gas*0.49 + o.biomass*0.23;
    o.batt = batt; o.cap = cap; hours.push(o);
  }
  const cost = Object.keys(SRC).reduce((a,k)=>a + (c[k]||0)*SRC[k].cost, 0);
  return {hours, blackouts, co2: Math.round(co2), wasted: Math.round(wasted), cost};
}

function townGame(el, opts){
  opts = opts || {};
  const c = Object.assign({solar:0, wind:0, tidal:0, hydro:0, geo:0, biomass:0, nuclear:0, battery:0, gas:0, coal:0}, opts.start||{});
  let wk = opts.weather || 'sunny';
  const budget = opts.budget || 40;
  const costEl = h('b',{});
  const rows = Object.entries(SRC).filter(([k])=>!(opts.noCoal && FOSSIL.includes(k))).map(([k,v])=>stepper({label:v.name, sub:`${v.sub} Cost: ${v.cost}`, value:c[k], min:0, max:v.max, onChange:n=>{ c[k]=n; updCost(); }}));
  function cost(){ return Object.keys(SRC).reduce((a,k)=>a + c[k]*SRC[k].cost, 0); }
  function updCost(){ const x = cost(); costEl.textContent = `${x} / ${budget}`; costEl.style.color = x>budget ? 'var(--bad)' : ''; }

  ctr.append(h('div',{class:'card', style:{padding:'4px 14px'}}, rows), h('div',{class:'row between'}, h('span',{}, 'Budget used: ', costEl), runBtn), result);

  const X = hr => 40 + hr*18.4, Y = v => 200 - v*1.6;
  function drawChart(sim, upto){
    while (chart.firstChild) chart.firstChild.remove();
    for (let v=0; v<=110; v+=25){ chart.append(sv('line',{x1:40, y1:Y(v), x2:476, y2:Y(v), class:'svg-line'}), sv('text',{x:34, y:Y(v)+4, class:'t-small svg-muted', 'text-anchor':'end'}, v)); }

    if (sim) sim.hours.slice(0, upto).forEach(o=>{
      let y = 200; const parts = [['nuclear',o.nuclear],['geo',o.geo],['biomass',o.biomass],['hydro',o.hydro],['coal',o.coal],['tidal',o.tidal],['wind',o.wind],['solar',o.solar],['battery',o.fromBatt],['gas',o.gas]];
      let used = 0;
      parts.forEach(([k,v])=>{ const take = Math.max(0, Math.min(v, o.d-used)); if (take<=0) return; used += take; const hgt = take*1.6; chart.append(sv('rect',{x:X(o.hr)+1, y:y-hgt, width:16.4, height:hgt, fill:SRC[k].col})); y -= hgt; });
      if (o.short>0.5) chart.append(sv('rect',{x:X(o.hr)+1, y:y-o.short*1.6, width:16.4, height:o.short*1.6, fill:'var(--bad)', opacity:.75}));

  }
  function drawStrip(hr, o){
    while (strip.firstChild) strip.firstChild.remove();
    const day = sunAt(hr) > 0;
    strip.append(sv('rect',{x:0, y:0, width:480, height:90, fill: day ? (WEATHER[wk].cloud<0.5 ? '#9fb3c8' : '#bfe0ff') : '#1b2140'}));

    strip.append(sv('rect',{x:0, y:74, width:480, height:16, fill:'#4f7a43'}));

    let hr = 0;

  }

    lines.push(`CO₂ released: <b>${sim.co2} tonnes</b>. Budget used: <b>${sim.cost} of ${budget}</b>. Spare energy wasted: <b>${sim.wasted} MWh</b>.`);

    if (opts.onResult) opts.onResult(sim, Object.assign({}, c), wk);
  }

}

function materialTester(el, onTest){
  const ed = Circuit.loopWith({'h,0,2':'bulb','h,2,2':'cell','h,0,0':'ammeter','v,0,4':{type:'sample', mat:'copper'}});
  const b = Circuit.board(el, {cols:4, rows:2, edges:ed, readonly:true, label:'Material tester circuit'});
  const results = {}; const tbl = h('div',{class:'tbl-wrap'});
  const litBtn = h('button',{class:'btn small', type:'button', hidden:true, onclick:()=>{ b.mutate(c=>{ for (const k in c) if (c[k].type==='sample') c[k].lit = !c[k].lit; }); record(); litBtn.textContent = cur().lit ? 'Switch off the lamp' : 'Shine a lamp on the silicon'; }}, 'Shine a lamp on the silicon');
  const cur = ()=>Object.values(b.edges).find(c=>c.type==='sample');
  function record(){
    const s = b.stats, smp = s.samples[0]; const key = smp.mat + (smp.lit ? '-lit' : '');
    results[key] = {name: Circuit.MATERIALS[smp.mat].name + (smp.lit ? ' with a lamp on it' : ''), I: s.ammeters[0].reading, lit: s.lit>0};
    tbl.innerHTML = '';
    tbl.append(h('table',{class:'data'}, h('thead',{}, h('tr',{}, h('th',{}, 'Material'), h('th',{}, 'Current (A)'), h('th',{}, 'Bulb lit?'))),
      h('tbody',{}, Object.values(results).map(r=>h('tr',{}, h('td',{style:{textAlign:'left'}}, r.name), h('td',{}, fmt(r.I)), h('td',{}, r.lit ? 'Yes' : 'No'))))));
    if (onTest) onTest(results, smp);
  }
  const grid = h('div',{class:'row'});
  Object.entries(Circuit.MATERIALS).forEach(([k,m])=>grid.append(h('button',{class:'btn small', type:'button', onclick:()=>{ b.mutate(c=>{ for (const id in c) if (c[id].type==='sample'){ c[id].mat = k; c[id].lit = false; } }); litBtn.hidden = k!=='silicon'; litBtn.textContent = 'Shine a lamp on the silicon'; record(); }}, h('span',{class:'swatch', style:{background:m.col}}), m.name)));
  el.append(h('b',{}, 'Clip a material into the tester:'), grid, litBtn, tbl);
  record();
  return b;
}

function freeElectrons(el){
  const mk = (title)=>{ const s = sv('svg',{viewBox:'0 0 300 140', class:'sim-svg', role:'img', 'aria-label':title}); return s; };
  const metal = mk('Electrons in a metal'), plastic = mk('Electrons in plastic');
  const ions = []; for (let r=0;r<4;r++) for (let c=0;c<9;c++) ions.push([24+c*32, 24+r*30]);
  [metal, plastic].forEach((s,i)=>{ s.append(sv('rect',{x:4, y:4, width:292, height:132, rx:10, fill: i ? '#f6d9a8' : '#e8d3b6', opacity:.5})); ions.forEach(([x,y])=>{ s.append(sv('circle',{cx:x, cy:y, r:9, fill: i ? '#e9a23b' : '#c4793a', opacity:.85}), sv('text',{x, y:y+.5, class:'cell-txt', 'font-size':10}, '+')); }); });
  const freeE = Array.from({length:22}, ()=>({x:Math.random()*300, y:10+Math.random()*120, vx:(Math.random()-.5)*60, vy:(Math.random()-.5)*60}));
  const fE = freeE.map(()=>{ const c = sv('circle',{r:4, fill:'var(--flow)'}); metal.append(c); return c; });
  const bound = ions.map(([x,y])=>{ const c = sv('circle',{r:3.5, fill:'var(--flow)'}); plastic.append(c); return {c, x, y, p:Math.random()*6}; });
  let on = false, lt = 0;

    freeE.forEach((e,i)=>{ e.x += (e.vx + (on ? 70 : 0))*dt*(reduceMotion?0:1); e.y += e.vy*dt*(reduceMotion?0:1); if (e.y<8||e.y>132) e.vy *= -1; if (e.x>300) e.x -= 300; if (e.x<0) e.x += 300; if (Math.random()<.02) e.vx = (Math.random()-.5)*60; fE[i].setAttribute('cx', e.x.toFixed(1)); fE[i].setAttribute('cy', e.y.toFixed(1)); });

function bulbAnatomy(el, onAll){
  const parts = {
    glass:['Glass bulb','A glass bubble that lets the light out and keeps air away from the filament.'],
    filament:['Filament','A very thin coil of wire with a high resistance. When current flows, it gets so hot that it glows! Edison used carbon; later bulbs used tungsten.'],
    gas:['Inside the bulb','There is no oxygen inside. Either the air is pumped out, or it is filled with a gas like argon. With oxygen, the hot filament would burn up in seconds.'],
    supports:['Support wires','Stiff wires that hold the delicate filament in place and carry current to it.'],
    base:['Metal base','The metal contacts connect the bulb to the circuit when you screw it in.']};
  const seen = new Set(); const info = h('div',{class:'info-card', html:'Tap each part of the bulb to find out what it does.'});
  const svg = sv('svg',{viewBox:'0 0 260 300', class:'sim-svg', role:'img', 'aria-label':'A filament light bulb', style:'max-width:320px'});
  const B = {};
  const show = k=>{ info.innerHTML = `<b>${parts[k][0]}.</b> ${parts[k][1]}`; seen.add(k); if (B[k]) B[k].found(); cnt.textContent = `${seen.size} of 5 parts found`; if (seen.size===5){ svg.classList.remove('tap-hunt'); if (onAll){ const f = onAll; onAll = null; f(); } } };
  const hot = (k, el2)=>{ el2.style.cursor = 'pointer'; el2.addEventListener('click', e=>{ e.stopPropagation(); show(k); }); return el2; };
  svg.append(hot('gas', sv('path',{d:'M130 20 C 60 20 40 80 60 130 C 75 165 95 175 98 205 L 162 205 C 165 175 185 165 200 130 C 220 80 200 20 130 20 Z', fill:'var(--glass)', stroke:'none'})));
  svg.append(hot('glass', sv('path',{d:'M130 20 C 60 20 40 80 60 130 C 75 165 95 175 98 205 L 162 205 C 165 175 185 165 200 130 C 220 80 200 20 130 20 Z', fill:'none', stroke:'var(--metal)', 'stroke-width':10, 'stroke-opacity':.6})));
  svg.append(hot('supports', sv('g',{}, sv('path',{d:'M112 205 L112 110 M148 205 L148 110', stroke:'var(--ink)', 'stroke-width':4}))));
  svg.append(hot('filament', sv('path',{d:'M112 110 q6 -14 12 0 q6 -14 12 0 q6 -14 12 0', fill:'none', stroke:'#f2a000', 'stroke-width':4})));
  svg.append(hot('base', sv('g',{}, sv('rect',{x:96, y:205, width:68, height:50, rx:6, fill:'var(--metal)'}), sv('path',{d:'M96 218 h68 M96 231 h68 M96 244 h68', stroke:'var(--ink)', 'stroke-opacity':.3, 'stroke-width':3}), sv('rect',{x:116, y:255, width:28, height:14, rx:4, fill:'var(--cellbody)'}))));
  const cnt = h('b',{}, '0 of 5 parts found');
  const spots = {glass:[226,96,203,108], filament:[130,72,130,104], gas:[80,60,98,78], supports:[78,170,110,170], base:[200,236,166,232]};
  Object.entries(spots).forEach(([k,[x,y,tx,ty]])=>{ const b = beacon(svg, x, y, tx, ty, ()=>{ show(k); b.found(); }, 'Find out about this part'); B[k] = b; });
  svg.classList.add('tap-hunt');
  info.innerHTML = 'Tap each glowing <b>?</b> to find out about that part of the bulb.';
  el.append(h('div',{class:'sim-grid'}, svg, h('div',{class:'controls'}, info, cnt)));
}
function filamentHeat(el, onChange){
  const svg = sv('svg',{viewBox:'0 0 360 200', class:'sim-svg', role:'img', 'aria-label':'Filament heating up'});
  const gid = uid('fh');
  svg.append(sv('defs',{}, sv('radialGradient',{id:gid}, sv('stop',{offset:'0%','stop-color':'#fff6c8','stop-opacity':.95}), sv('stop',{offset:'100%','stop-color':'#ffb300','stop-opacity':0}))));
  const glow = sv('circle',{cx:150, cy:100, r:80, fill:`url(#${gid})`, opacity:0}); svg.append(glow);
  const fil = sv('path',{d:'M80 100 q10 -24 20 0 q10 -24 20 0 q10 -24 20 0 q10 -24 20 0 q10 -24 20 0 q10 -24 20 0 q10 -24 20 0', fill:'none', 'stroke-width':6, 'stroke-linecap':'round'}); svg.append(fil);
  svg.append(sv('rect',{x:300, y:30, width:16, height:140, rx:8, fill:'var(--panel)', stroke:'var(--ink)'}));
  const merc = sv('rect',{x:303, width:10, rx:5, fill:'#d9484a'}); svg.append(merc);
  const tTxt = sv('text',{x:308, y:190, class:'reading', 'text-anchor':'middle'}, ''); svg.append(tTxt);
  const ro = h('div',{class:'readout'});
  const lerp = (a,b,k)=>Math.round(a+(b-a)*k);
  function upd(p){
    const T = Math.round(20 + p/100*2480);
    const k = p/100; let col;
    if (k<0.35) col = `rgb(${lerp(80,170,k/0.35)},${lerp(80,40,k/0.35)},${lerp(90,30,k/0.35)})`; else if (k<0.7) col = `rgb(${lerp(170,255,(k-.35)/.35)},${lerp(40,140,(k-.35)/.35)},30)`; else col = `rgb(255,${lerp(140,240,(k-.7)/.3)},${lerp(30,200,(k-.7)/.3)})`;
    fil.setAttribute('stroke', p<5 ? 'var(--metal)' : col); glow.setAttribute('opacity', Math.max(0, (k-0.4)/0.6).toFixed(2));
    const hgt = 136*k; merc.setAttribute('y', 168-hgt); merc.setAttribute('height', Math.max(4,hgt));
    tTxt.textContent = `${T} °C`;
    const light = k<0.5 ? 0 : Math.round((k-0.5)/0.5*10);
    ro.innerHTML = ''; ro.append(h('div',{}, h('span',{}, 'Filament temperature'), h('b',{}, `${T} °C`)), h('div',{}, h('span',{}, 'Of every 100 J of energy...'), h('b',{style:{fontSize:'1rem'}}, `${light} J light, ${100-light} J heat`)));
    if (onChange) onChange(p);
  }
  el.append(h('div',{class:'sim-grid'}, svg, h('div',{class:'controls'}, slider({label:'Current through the filament', min:0, max:100, value:0, unit:'%', onInput:upd}), ro)));
  upd(0);
}
function sankey(el, kind){
  const s = sv('svg',{viewBox:'0 0 420 170', class:'sim-svg', role:'img', 'aria-label':'Energy flow diagram'});
  const light = kind==='filament' ? 10 : 40;
  const w = v=>v*1.1;
  s.append(sv('rect',{x:10, y:30, width:120, height:w(100), fill:'var(--accent)', opacity:.75}), sv('text',{x:70, y:30+w(100)/2+4, 'text-anchor':'middle', fill:'#fff', 'font-weight':800, 'font-size':13}, '100 J electrical'));
  s.append(sv('path',{d:`M130 30 H250 Q270 30 270 10 V10 H400 V${10+w(light)} H290 Q290 ${30+w(light)} 270 ${30+w(light)} H130 Z`, fill:'var(--spark)'}), sv('text',{x:345, y:10+w(light)/2+5, 'text-anchor':'middle', 'font-size':12, 'font-weight':800, fill:'var(--spark-ink)'}, `${light} J light`));
  s.append(sv('path',{d:`M130 ${30+w(light)} H250 Q300 ${30+w(light)} 300 ${80+w(light)} V160 H${300+w(100-light)} V${80+w(light)} Q${300+w(100-light)} ${30+w(100)} 250 ${30+w(100)} H130 Z`, fill:'#d9484a', opacity:.8}));
  s.append(sv('text',{x:300+w(100-light)/2, y:150, 'text-anchor':'middle', fill:'#fff', 'font-size':12, 'font-weight':800}, `${100-light} J heat`));
  el.append(s);
}
function energyVans(el){
  const svg = sv('svg',{viewBox:'0 0 360 200', class:'sim-svg', role:'img', 'aria-label':'Energy carried round a circuit'});
  svg.append(sv('rect',{x:40, y:30, width:280, height:140, rx:20, fill:'none', stroke:'var(--copper)', 'stroke-width':6}));
  svg.append(sv('rect',{x:150, y:156, width:60, height:28, rx:5, class:'cell-body'}), sv('text',{x:180, y:171, class:'cell-txt'}, 'CELL'));
  svg.append(sv('circle',{cx:180, cy:30, r:18, class:'glass'}), sv('circle',{cx:180, cy:30, r:30, fill:'var(--spark)', opacity:.35}));
  const per = 2*(280+140); const vans = Array.from({length:10}, (_,i)=>({d:i*per/10}));
  const els = vans.map(()=>{ const g = sv('g'); g.append(sv('circle',{r:7, fill:'var(--flow)'}), sv('rect',{x:-5, y:-17, width:10, height:8, rx:2, fill:'var(--spark)', class:'parcel'})); svg.append(g); return g; });
  function pos(d){ d = ((d%per)+per)%per; if (d<280) return [40+d, 170]; d-=280; if (d<140) return [320, 170-d]; d-=140; if (d<280) return [320-d, 30]; d-=280; return [40, 30+d]; }
  let lt = 0;
  const f = (function f(t){ if (!svg.isConnected) return; const dt = lt ? Math.min(.05,(t-lt)/1000) : 0; lt = t;
    vans.forEach((v,i)=>{ v.d += dt*60*(reduceMotion?0:1); const [x,y] = pos(v.d); els[i].setAttribute('transform', `translate(${x} ${y})`);
      const dd = ((v.d%per)+per)%per; const loaded = dd > 175 && dd < 280+140+140; els[i].querySelector('.parcel').setAttribute('opacity', loaded ? 1 : 0); });
    requestAnimationFrame(f); }); requestAnimationFrame(f);
  el.append(svg, h('p',{class:'legend'}, 'Each blue dot is a bit of charge. It picks up an energy parcel at the cell, drops it off at the bulb, and carries on round. The charge keeps going; only the energy is used.'));
}

const RTYPES = {

const SELF = t => t==='draw' || t==='write';
/* each stop has two reviews: 'f' (Foundation, after Learn) and 'c' (Challenge, after the missions) */
function rvItems(stop, part){ return (part==='c' ? stop.creview : stop.review) || []; }
function rvKey(stop, part){ return part==='c' ? stop.id + '~c' : stop.id; }
const PART_NAME = {f:'Foundation', c:'Challenge'};
function rvStore(stopId){ Store.data.rv = Store.data.rv || {}; Store.data.rv[stopId] = Store.data.rv[stopId] || {}; return Store.data.rv[stopId]; }
function normTxt(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9.\-]+/g,' ').trim(); }
/* typed answers accept sensible synonyms: every word in a group counts when one of them is accepted */
const SYN_GROUPS = [['bigger','more','larger','greater','higher','stronger','increases','increase','goes up','go up'],['smaller','less','lower','weaker','decreases','decrease','goes down','go down'],['centre','center','middle'],['against','opposite','opposing'],['attract','attracts','pull together','pulls together'],['repel','repels','push apart','pushes apart'],['electron','electrons'],['proton','protons'],['neutron','neutrons'],['loop','circuit','complete path','path'],['amps','amp','a','amperes'],['volts','volt','v'],['ohms','ohm'],['current','electric current'],['generator','dynamo'],['direction','directions','way'],['non-renewable','nonrenewable','non renewable','not renewable']];
function canonWord(s){ return normTxt(s).replace(/^(a|an|the) /,''); }
function gapOK(accepted, v){ const x = canonWord(v); if (!x) return false; return accepted.some(a=>{ const y = canonWord(a); if (y===x) return true; return SYN_GROUPS.some(g=>g.includes(y) && g.includes(x)); }); }
/* sort items are match grids with one column */
function asGrid(it){
  if (it.t==='sort') return {cols:[{name:it.colName||'Group', options:it.groups}], rows:it.items.map(([label,g])=>({label, ans:[it.groups[g]]}))};
  return {cols:it.cols.map(c=>typeof c==='string' ? {name:c} : c), rows:it.rows};
}
function gridOptions(grid, j){ const c = grid.cols[j]; if (c.options) return c.options; const set = []; grid.rows.forEach(r=>{ if (!set.includes(r.ans[j])) set.push(r.ans[j]); }); (c.extra||[]).forEach(x=>{ if (!set.includes(x)) set.push(x); }); return set.slice().sort(); }

function drawPad(el, saved, onChange){
  const W = 640, H = 380;
  const cv = h('canvas',{width:W*2, height:H*2, class:'pad', 'aria-label':'Drawing area'});
  const ctx = cv.getContext('2d'); ctx.scale(2,2);
  let strokes = (saved && saved.strokes) ? JSON.parse(JSON.stringify(saved.strokes)) : [], cur = null, col = '#1a2140', size = 3;
  function redraw(){ ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,W,H); ctx.lineCap = 'round'; ctx.lineJoin = 'round';

launch:[
  {t:'sort', q:'Sort each example into static or current electricity.', groups:['Static electricity','Current electricity'], colName:'Type', items:[['A small shock from a car door handle',0],['A phone charging',1],['Dust clinging to a TV screen',0],['A calculator running on a battery',1],['Hair standing up after you pull off a jumper',0],['An electric train moving along the track',1],['Lightning',0]], explain:'Static charge builds up in one place and may jump as a spark. Current electricity flows round a complete loop.'},
  {t:'table', q:'Flashlight detective: what fixes each flashlight?', rowHead:'What you see', cols:[{name:'The fix', options:['Put a battery in','Turn the switch on','Screw the bulb in']}], rows:[{label:'An empty space where the battery should be', ans:['Put a battery in']},{label:'The switch is in the OFF position', ans:['Turn the switch on']},{label:'A small gap between the bulb and its holder', ans:['Screw the bulb in']}], explain:'Every flashlight needs a source of energy, a closed switch and every part touching, so the loop has no gaps.'},
  {t:'mcq', q:'A flashlight has a new battery, the switch is on and the bulb is screwed in tightly, but it still won’t shine. What is the most likely problem?', options:['The thin wire inside the bulb has broken, making a gap','The battery is too new to push any current yet','The switch has been turned on too tightly','The light is shining but is too fast for you to see'], answer:0, explain:'The thin filament wire inside a bulb can snap. That makes a gap in the loop, so no current flows.'},
  {t:'multi', q:'Which of these must a flashlight have for its bulb to light? Tick all that apply.', options:['A source of energy, such as a battery','A complete loop with no gaps','A closed switch','A magnet inside the flashlight','Plastic wires instead of metal ones'], answers:[0,1,2], explain:'A circuit needs energy, a closed switch and a complete loop of conductors. Plastic is an insulator, so it would stop the current.'},
  {t:'mcq', q:'What is the main difference between static and current electricity?', options:['Static charge stays in one place; current charge flows round a loop','Static charge flows round a loop; current charge stays in one place','Static is made by batteries; current is made by rubbing things','Static only happens outdoors; current only happens indoors'], answer:0, explain:'Static charge builds up and stays put until it jumps. Current is charge flowing round a complete circuit.'},
  {t:'write', words:['static','charge','build up','jump','loop'], q:'You walk across a carpet, touch a metal door handle and feel a small shock. Is this static or current electricity? Explain how you know.', model:'This is static electricity. Walking on the carpet rubs charge onto my body, and it builds up there. It stays put until I touch the metal handle, then it jumps across as a tiny spark. It doesn’t flow round a complete loop like current electricity in a circuit.', checklist:['Says it is static electricity','Charge builds up on the body from rubbing on the carpet','The charge jumps (sparks) to the handle','Compares with current: no complete loop']}

atom:[
  {t:'table', q:'In the Model Maker you could only use the pieces each scientist knew about. Complete the table.', rowHead:'Model', cols:[{name:'Electrons', options:['Yes','No']},{name:'Nucleus', options:['Yes','No']},{name:'Shells', options:['Yes','No']}], rows:[{label:'Dalton (1803)', ans:['No','No','No']},{label:'Thomson (1897)', ans:['Yes','No','No']},{label:'Rutherford (1911)', ans:['Yes','Yes','No']},{label:'Bohr (1913)', ans:['Yes','Yes','Yes']}], explain:'Each model added a new idea when new evidence came along: electrons (Thomson), the nucleus (Rutherford), then shells (Bohr).'},
  {t:'mcq', q:'A student builds Thomson’s model and adds a nucleus in the middle. Why is that wrong?', options:['Nobody knew about the nucleus until Rutherford’s experiment in 1911','Thomson’s model had a nucleus but no electrons at all','A nucleus is only ever found in Bohr’s model of the atom','Thomson didn’t believe that atoms existed at all'], answer:0, explain:'Thomson knew about electrons, but the nucleus wasn’t discovered until Rutherford’s gold foil experiment.'},
  {t:'order', q:'Put these pieces of evidence in the order they happened, earliest first.', items:['Democritus reasons that cutting something must stop somewhere','Dalton explains how elements join in fixed amounts','Thomson’s beam bends towards a positive plate','Rutherford’s gold foil makes a few particles bounce back','Bohr places electrons in shells'], explain:''},
  {t:'mcq', q:'In Rutherford’s experiment, <b>most</b> particles went straight through the gold foil. What did this tell him?', options:['Most of the atom is empty space','The atom is a solid ball with no gaps','Gold atoms have no electrons in them','The particles were too small to hit anything'], answer:0, explain:'Only a few particles bounced back off the tiny nucleus. The rest passed through the empty space around it.'},
  {t:'num', q:'In Bohr’s model, the first shell holds up to 2 electrons and the second holds up to 8. A sodium atom has 11 electrons. How many electrons are in its <b>third</b> shell?', answer:1, unit:'electron', tol:0, explain:'2 in the first shell + 8 in the second = 10, so 11 − 10 = 1 electron goes in the third shell.'},
  {t:'multi', q:'Which statements about how the model of the atom changed are true? Tick all that apply.', options:['A new model was made when new evidence didn’t fit the old one','Each new model kept some ideas from the one before','Bohr’s model still had Rutherford’s nucleus','The old models were useless and never helped anyone','Scientists are sure the model will never change again'], answers:[0,1,2], explain:'Models improve step by step. Each one was useful in its time, and today’s model could change again if new evidence turns up.'},
  {t:'write', words:['evidence','experiment','nucleus','electron','model'], q:'Choose one model of the atom. Explain what new evidence made scientists move on to the next model.', model:'Thomson’s plum pudding model said the positive charge was spread through the whole atom. Rutherford fired positive particles at thin gold foil. Most went straight through, but a few bounced back. This evidence showed that the positive charge is packed into a tiny nucleus with lots of empty space around it, so scientists moved on to Rutherford’s nuclear model.', checklist:['Names the old model and what it said','Names the experiment or evidence','Says what the evidence showed','Names the new model that replaced it']}

  {t:'mcq', q:'Why should you test mystery ball B with <b>two</b> different charges before deciding?', options:['A charged ball attracts both a neutral ball and an opposite charge, so one test could fool you','Ball B changes its charge every time you test it, so you need an average','The first test never works because ball A starts off neutral every time','Two tests give ball B more charge so it moves further the second time'], answer:0, explain:'Being attracted could mean ball B is neutral or has the opposite charge. A second test with the other charge tells them apart.'},
  {t:'table', q:'Use each set of results to name the charge on ball B.', rowHead:'Results', cols:[{name:'Ball B is', options:['Positive','Negative','Neutral']}], rows:[{label:'Repelled by a negative ball A, attracted by a positive ball A', ans:['Negative']},{label:'Attracted by a negative ball A, repelled by a positive ball A', ans:['Positive']},{label:'Attracted by a negative ball A and by a positive ball A', ans:['Neutral']}], explain:'Look for the repel: it shows ball B has the same charge as ball A. Attracted by both means neutral.'},
  {t:'multi', q:'A rubber balloon is rubbed with wool. Use the electron ladder. Which statements are true? Tick all that apply.' + LADDER_HTML, options:['The balloon gains electrons','The wool loses electrons','The balloon becomes negative','The wool becomes negative','Protons move from the wool to the balloon'], answers:[0,1,2], explain:'The rubber balloon is lower on the ladder, so it grabs electrons and becomes negative. The wool is left positive. Protons never move.'},

  {t:'table', q:'Safety lock: two switches are in the same loop as one bulb. Complete the table.', rowHead:'Switches', cols:[{name:'Bulb', options:['On','Off']}], rows:[{label:'Switch 1 closed, switch 2 closed', ans:['On']},{label:'Switch 1 closed, switch 2 open', ans:['Off']},{label:'Switch 1 open, switch 2 closed', ans:['Off']},{label:'Both switches open', ans:['Off']}], explain:'Both switches are in series, so an open switch anywhere breaks the only loop.'},
  {t:'num', q:'Three 1.5 V cells are joined + to − in a row. Then a fourth 1.5 V cell is added facing the <b>wrong</b> way. What is the total voltage now?', answer:3, unit:'V', tol:0, explain:'1.5 + 1.5 + 1.5 = 4.5 V, but the backwards cell pushes against them: 4.5 − 1.5 = 3 V.'},
  {t:'mcq', q:'Super bright: why does a bulb glow brighter with two cells than with one?', options:['Two cells give a bigger push, so a bigger current flows','Two cells give a smaller push, so the current slows down','Two cells make the wire inside the bulb thicker','Two cells let the current flow both ways at once'], answer:0, explain:'Two cells joined + to − double the voltage, so more current flows through the bulb.'},
  {t:'multi', q:'Night light: there is one cell, one bulb and one switch in a single loop. Where could the switch go so it turns the bulb on and off? Tick all that apply.', options:['Next to the cell','Just after the bulb','Anywhere in the single loop','Only exactly halfway round the loop','Only touching the + end of the cell'], answers:[0,1,2], explain:'In a single loop, a gap anywhere stops the current everywhere, so the switch works in any position.'},
  {t:'fill', q:'Fill the gaps.', text:'An open switch makes a ___ in the circuit, so no current flows. Two switches in the same single loop are joined in ___. Cells must face the ___ way to add their voltages together.', blanks:[['gap','break'],['series'],['same']], explain:''},
  {t:'write', words:['series','loop','switch','closed','gap'], q:'A factory machine should only start when the worker presses two buttons at once, one with each hand. Explain how to wire the two switches, and why this keeps the worker’s hands safe.', model:'Put both switches in series, in the same single loop as the machine. Current can only flow when both switches are closed. If either hand lets go, that switch opens and makes a gap, so the machine stops. Both hands must be on the buttons, so neither hand can be near the moving parts.', checklist:['Both switches in series (in the same loop)','The machine only runs when both are closed','Letting go of either button makes a gap and stops it','Explains the safety: both hands are busy on the buttons']}
],
electromagnets:[
  {t:'mcq', q:'At the recycling plant, the electromagnet lifted the steel cans but not the aluminium cans. Why?', options:['Steel is a magnetic metal, but aluminium is not','Aluminium cans are much heavier than steel cans','The magnet was always switched off over the aluminium','Aluminium is a magnetic metal, but steel is not'], answer:0, explain:'Magnets only attract magnetic materials such as iron and steel. That is how recycling plants sort steel from aluminium.'},
  {t:'num', q:'A crane’s electromagnet can lift <b>1,200 kg</b>. Each bale of steel cans weighs <b>400 kg</b>. How many bales can it lift at once?', answer:3, unit:'bales', tol:0, explain:'1,200 ÷ 400 = 3 bales.'},
  {t:'num', q:'With 50 coils, each cell adds <b>500 kg</b> of lifting power. What is the fewest number of cells needed to lift a <b>1,800 kg</b> van?', answer:4, unit:'cells', tol:0, explain:'3 cells lift 1,500 kg, which isn’t enough. 4 cells lift 2,000 kg, so you need 4.'},
  {t:'table', q:'How good is each material as the core of an electromagnet?', rowHead:'Core', cols:[{name:'How good is it?', options:['The strongest','Works, but weaker than iron','Hardly helps at all']}], rows:[{label:'Iron', ans:['The strongest']},{label:'Steel', ans:['Works, but weaker than iron']},{label:'Aluminium', ans:['Hardly helps at all']},{label:'Wood', ans:['Hardly helps at all']}], explain:'Iron and steel are magnetic materials. Aluminium and wood are not, so they don’t make the magnet stronger.'},
  {t:'mcq', q:'The car was hanging from the crane over the <b>ground</b>, not the crusher, when the operator switched off. What happened?', options:['It fell straight down onto the ground below','It floated across to the crusher on its own','It stayed stuck because the coil was still a magnet','It slid sideways towards the control cabin'], answer:0, explain:'Switching off stops the current, so the coil stops being a magnet. The load falls straight down from wherever it is.'},
  {t:'order', q:'Put the steps of a door bell ringing in order.', items:['You press the button','The circuit is complete and current flows','The coil becomes an electromagnet','It pulls the iron hammer onto the gong','You let go, the magnet switches off and the hammer springs back'], explain:''},
  {t:'write', words:['steel','magnetic','core','coils','cells','stronger'], q:'The steel works had no iron. Explain how you still lifted the steel beam, and why the aluminium and wood cores didn’t work.', model:'Steel is a magnetic material, so a steel core still makes the electromagnet stronger, just not as strong as iron. To make up for it, I used lots of coils and more cells. Aluminium and wood are not magnetic, so they hardly make the electromagnet any stronger, and it couldn’t lift the beam.', checklist:['Steel is magnetic, so it works as a core','A steel core is weaker than iron','Used more coils and/or more cells to make up for it','Aluminium and wood are not magnetic']}
],
ohm:[
  {t:'num', q:'You have 2 cells (3 V). What resistance gives a current of exactly <b>0.3 A</b>? (R = V ÷ I)', answer:10, unit:'Ω', tol:0, explain:'R = 3 ÷ 0.3 = 10 Ω.'},
  {t:'num', q:'A 1.5 V circuit needs a current of only <b>0.03 A</b> to keep an LED safe. What resistance is needed? (R = V ÷ I)', answer:50, unit:'Ω', tol:0, explain:'R = 1.5 ÷ 0.03 = 50 Ω.'},
  {t:'num', q:'A flashlight bulb has a resistance of 15 Ω and 0.2 A flows through it. What is the voltage of the battery? (V = I × R)', answer:3, unit:'V', tol:0, explain:'V = 0.2 × 15 = 3 V.'},
  {t:'table', q:'Insulator inspector: what happens to the bulb in the tester with each material?', rowHead:'Material', cols:[{name:'Bulb', options:['Lights','Stays dark']}], rows:[{label:'Copper wire', ans:['Lights']},{label:'Aluminium foil', ans:['Lights']},{label:'Iron nail', ans:['Lights']},{label:'Plastic', ans:['Stays dark']},{label:'Rubber', ans:['Stays dark']},{label:'Glass', ans:['Stays dark']}], explain:'Metals are conductors, so they complete the circuit. Plastic, rubber and glass are insulators, so they leave a gap.'},
  {t:'mcq', q:'Why does every LED circuit need a resistor?', options:['To keep the current low enough that the LED doesn’t burn out','To make the current bigger so the LED shines brighter','To change the AC from the cell into DC for the LED','To stop the LED from glowing in the wrong colour'], answer:0, explain:'Without a resistor, too much current could flow and burn out the LED.'},
  {t:'mcq', q:'You double the voltage <b>and</b> double the resistance. What happens to the current?', options:['It stays the same','It doubles','It halves','It becomes four times bigger'], answer:0, explain:'I = V ÷ R. Doubling both the top and the bottom of the division leaves the answer the same.'},
  {t:'write', words:['conductor','insulator','electrons','complete','gap'], q:'Explain how your material tester sorts materials into conductors and insulators, and why each kind behaves the way it does.', model:'The material sits in the gap of a circuit with a cell and a bulb. If the bulb lights, the material is a conductor: it completes the circuit, because it has electrons that are free to move through it. If the bulb stays dark, it is an insulator: its electrons are held tightly, so it leaves a gap and no current flows.', checklist:['The material goes in the gap of a circuit with a bulb','Bulb lights means conductor (it completes the circuit)','Conductors have free electrons that can move','Insulators hold their electrons tightly, so the bulb stays dark']}
],
generators:[
  {t:'multi', q:'Weak magnets only: you can’t use a stronger magnet. Which changes could still raise the voltage? Tick all that apply.', options:['Spin the magnet faster','Add more turns of wire to the coil','Spin the magnet more slowly','Take turns of wire off the coil','Use a bigger light bulb'], answers:[0,1], explain:'Faster spinning and more turns of wire both give a bigger voltage.'},
  {t:'mcq', q:'Slow and steady: the water wheel can only turn slowly. How can it still make a big voltage?', options:['Use more turns of wire and a stronger magnet','Use fewer turns of wire and a weaker magnet','Turn the water wheel backwards instead','Stop the wheel so the magnet stays still'], answer:0, explain:'When you can’t spin faster, more turns and a stronger magnet make up for it.'},
  {t:'num', q:'A generator makes a peak of <b>6 V</b>. You double the speed and keep everything else the same. What is the new peak voltage?', answer:12, unit:'V', tol:0, explain:'The voltage goes up in step with the speed, so double the speed gives double the voltage: 12 V.'},
  {t:'num', q:'A generator makes a peak of <b>4 V</b>. You double the number of turns <b>and</b> double the speed. What is the new peak voltage?', answer:16, unit:'V', tol:0, explain:'Doubling the turns doubles it to 8 V. Doubling the speed doubles it again to 16 V.'},
  {t:'table', q:'What does each change do to the peak voltage of a generator?', rowHead:'Change', cols:[{name:'Peak voltage', options:['Goes up','Goes down','Drops to zero']}], rows:[{label:'Spinning the magnet faster', ans:['Goes up']},{label:'Using a weaker magnet', ans:['Goes down']},{label:'Taking turns of wire off the coil', ans:['Goes down']},{label:'Stopping the magnet completely', ans:['Drops to zero']},{label:'Using a stronger magnet', ans:['Goes up']}], explain:'A still magnet makes no electricity at all. The field through the coil has to keep changing.'},
  {t:'write', words:['magnet','coil','turns','faster','stronger'], q:'The factory needed a big 24 V peak. Explain how you made a big voltage, and why each change helps.', model:'I used a strong magnet, lots of turns of wire in the coil, and spun it fast. A stronger magnet, more turns and a faster spin all make the magnetic field through the coil change more, or more quickly, and that pushes a bigger voltage. Using all three together gave the factory its big voltage.', checklist:['Strong magnet','More turns of wire in the coil','Spinning faster','Explains these make the field through the coil change more or faster']}
],
bulb:[
  {t:'sort', q:'Energy detective: what is the main <b>useful</b> energy each device gives out?', groups:['Light','Heat','Movement','Sound'], colName:'Useful energy', items:[['Electric drill',2],['Toaster',1],['Television screen',0],['Alarm clock buzzer',3],['Electric heater',1],['Ceiling fan',2],['Headlamp',0]], explain:'Each device transfers electrical energy into one main useful form, plus some wasted energy, usually heat.'},
  {t:'num', q:'A café swaps 20 old <b>100 W</b> bulbs for <b>12 W</b> LEDs. How many watts does it save in total when they are all on?', answer:1760, unit:'W', tol:0, explain:'100 − 12 = 88 W saved per bulb. 88 × 20 = 1,760 W.'},
  {t:'num', q:'The café lights are on for <b>10 hours</b> a day. 1,760 W is 1.76 kW. How many kWh does the swap save each day? (Energy in kWh = power in kW × hours)', answer:17.6, unit:'kWh', tol:0.05, explain:'1.76 kW × 10 hours = 17.6 kWh every day.'},
  {t:'mcq', q:'Light two LEDs: one LED lights but the other stays dark. What is the most likely reason?', options:['The dark LED is facing the wrong way round','LEDs can only ever light one at a time','The lit LED has used up all the current','The dark LED needs a filament to work'], answer:0, explain:'An LED only lets current through one way. Turn the dark one round.'},
  {t:'multi', q:'Why does a school save money when it swaps filament bulbs for LEDs? Tick all that apply.', options:['LEDs need less power for the same light','LEDs waste much less energy as heat','LEDs last much longer before they need replacing','LEDs make the school’s electricity completely free','LEDs work without any electricity at all'], answers:[0,1,2], explain:'Less power for the same light means less energy to pay for, and fewer replacements.'},
  {t:'write', words:['useful','wasted','heat','light','energy'], q:'A filament bulb and an LED give out the same amount of light. Explain why the LED needs less electrical energy.', model:'Both give out the same amount of useful light energy. The filament bulb also wastes lots of energy as heat, so it needs much more electrical energy going in. The LED wastes very little energy as heat, so most of its energy becomes light and it needs less energy in total.', checklist:['Both give the same useful light energy','The filament bulb wastes lots of energy as heat','The LED wastes much less as heat','So the LED needs less energy going in']}
],
series:[
  {t:'mcq', q:'A shop window has a row of lights. What is the best way to wire them so one broken bulb doesn’t spoil the display?', options:['In parallel, each bulb on its own branch','In series, all the bulbs in one loop','In series, with an extra cell added','With no switch anywhere in the circuit'], answer:0, explain:'In parallel, each bulb has its own path, so the others stay on if one breaks.'},
  {t:'num', q:'One bulb with one cell gives <b>0.36 A</b>. You add a second identical bulb in parallel. What does the ammeter on the main wire read?', answer:0.72, unit:'A', tol:0.005, explain:'Each branch takes 0.36 A, and the branch currents add up: 0.36 + 0.36 = 0.72 A.'},
  {t:'num', q:'Three identical bulbs are in parallel. Each branch carries 0.36 A. What current flows from the cell?', answer:1.08, unit:'A', tol:0.005, explain:'0.36 × 3 = 1.08 A.'},
  {t:'mcq', q:'Fairy lights: three bulbs in series are very dim. What will make all three brighter?', options:['Add another cell facing the same way','Add a fourth bulb into the same loop','Turn one of the cells the other way round','Add a resistor into the same loop'], answer:0, explain:'A second cell gives a bigger push, so more current flows through all three bulbs.'},
  {t:'table', q:'Compare bulbs in series and in parallel (with one cell).', rowHead:'', cols:[{name:'If one bulb breaks…', options:['The others go off','The others stay on']},{name:'Adding more bulbs makes each one…', options:['Dimmer','Stay as bright']}], rows:[{label:'Bulbs in series', ans:['The others go off','Dimmer']},{label:'Bulbs in parallel', ans:['The others stay on','Stay as bright']}], explain:'Each parallel branch gets the full push of the cell, so the bulbs stay as bright.'},
  {t:'fill', q:'Fill the gaps.', text:'In the Independent lights mission, each bulb had its own ___. The current from the cell ___ at a junction. The branch currents add up to the current in the ___ wire.', blanks:[['branch','path'],['splits','divides','splits up'],['main']], explain:''},
  {t:'write', words:['parallel','branch','switch','independent','current'], q:'Design the wiring for a bedroom with a ceiling light and a desk lamp that can each be switched on and off by themselves. Explain where the switches go.', model:'I would put the ceiling light and the desk lamp in parallel, each on its own branch. Each branch gets its own switch. Opening one switch only breaks that branch, so current still flows through the other one. That way the two lights work independently.', checklist:['Lights in parallel','Each light on its own branch','Each branch has its own switch','Explains that current still flows in the other branch']}
],
acdc:[
  {t:'mcq', q:'In the missions, why couldn’t Edison’s DC reach homes far away?', options:['Lots of energy was wasted as heat in the long wires','DC travels too slowly to reach far-away homes','The far-away homes only had AC light bulbs','DC can only travel along perfectly straight wires'], answer:0, explain:'Low-voltage DC needs a big current, and a big current wastes lots of energy heating the wires.'},
  {t:'mcq', q:'How did Edison deal with his DC not reaching very far?', options:['He built lots of small power stations close to homes','He built one giant power station far outside the city','He switched the power lines off every night','He used thinner wires to save copper'], answer:0, explain:'Edison needed a power station every couple of kilometres.'},
  {t:'num', q:'A transformer steps the voltage up from <b>11,000 V</b> to <b>400,000 V</b> for the power lines. About how many times bigger is the voltage? Round to the nearest whole number.', answer:36, unit:'times', tol:0.5, explain:'400,000 ÷ 11,000 = 36.4, so about 36 times bigger.'},
  {t:'table', q:'Which kind of current fits each job?', rowHead:'Job', cols:[{name:'Current', options:['AC','DC']}], rows:[{label:'Sending electricity 100 km to a city', ans:['AC']},{label:'A phone battery', ans:['DC']},{label:'Lighting the 1893 World’s Fair', ans:['AC']},{label:'A solar panel’s output', ans:['DC']},{label:'The socket in your wall', ans:['AC']}], explain:'Batteries and solar panels give DC. Power stations, power lines and sockets use AC.'},
  {t:'multi', q:'Why does a high voltage help send electricity a long way? Tick all that apply.', options:['The same energy can be carried with a smaller current','A smaller current wastes less energy as heat in the wires','Transformers can change the voltage of AC, but not DC','A higher voltage means you need more power stations','A higher voltage makes electricity travel faster than light'], answers:[0,1,2], explain:'Transformers raise AC to a high voltage and a small current, so very little energy is wasted on the journey.'},
  {t:'num', q:'Sockets in Beijing are 50 Hz. Sockets in the USA are 60 Hz. How many <b>more</b> cycles does a US socket make in one minute?', answer:600, unit:'cycles', tol:0, explain:'(60 − 50) × 60 seconds = 600 more cycles every minute.'},
  {t:'write', words:['AC','DC','transformer','voltage','distance','energy'], q:'Edison said AC was dangerous. Tesla said AC was the only way to power whole cities. Using what you found in the missions, explain who was right about powering cities.', model:'Tesla was right about powering cities. In the missions, DC wasted so much energy that it only lit half the homes up to about 4 km, so Edison needed a power station every few kilometres. AC can use transformers to raise the voltage, so much less energy is wasted, and it lit every home up to 25 km away. Edison was right that high-voltage AC is dangerous, which is why it is stepped down before it reaches our homes.', checklist:['DC wasted lots of energy over a long distance','AC reached much further','Transformers raise the voltage of AC to cut the waste','Mentions safety: the voltage is stepped down for homes']}
],
power:[
  {t:'table', q:'Three groups: sort each energy source.', rowHead:'Source', cols:[{name:'Group', options:['Renewable','Fossil fuel','Low carbon, not renewable']}], rows:[{label:'Nuclear', ans:['Low carbon, not renewable']},{label:'Coal', ans:['Fossil fuel']},{label:'Tidal and wave', ans:['Renewable']},{label:'Natural gas', ans:['Fossil fuel']},{label:'Geothermal', ans:['Renewable']},{label:'Biomass', ans:['Renewable']}], explain:'Nuclear is the tricky one: uranium will run out one day, but it releases almost no CO₂.'},
  {t:'mcq', q:'The energy chains for a nuclear and a coal power station are almost the same. Which step is different?', options:['What heats the water','Steam spinning the turbine','The generator making electricity','Electricity going into the power lines'], answer:0, explain:'Coal is burned, but in a nuclear station splitting uranium atoms makes the heat. After that, both boil water to spin a turbine.'},
  {t:'mcq', q:'A small island has strong ocean tides twice a day, but no rivers or volcanoes. Which low-carbon source suits it best?', options:['Tidal','Geothermal','Hydroelectric','Coal'], answer:0, explain:'Tides are reliable and predictable. Geothermal needs hot rocks, and hydro needs rivers.'},
  {t:'mcq', q:'Neither wind nor nuclear power releases much CO₂. Why is wind called renewable but nuclear is not?', options:['Wind will never run out, but uranium will one day','Wind releases more CO₂ than nuclear while running','Nuclear power stations must be built near the sea','Uranium grows back every year, just like plants'], answer:0, explain:'Renewable means it won’t run out. Uranium is dug out of the ground, so it will run out eventually.'},
  {t:'multi', q:'Iceland makes almost all of its electricity from geothermal and hydro power. Which features of Iceland make this possible? Tick all that apply.', options:['Volcanoes and hot rocks under the ground','Lots of rivers fed by rain and melting ice','Mountains and valleys for building dams','Strong sunshine all year round','Large coal mines'], answers:[0,1,2], explain:'Iceland’s hot rocks heat water for geothermal power, and its rivers and mountains are perfect for hydro.'},
  {t:'write', words:['renewable','fossil fuel','CO₂','reliable','wind'], q:'Your country must choose between building a coal power station and a wind farm. Give one advantage of each, then say which you would choose and why.', model:'A coal power station is reliable because it can make electricity whenever it’s needed, even when it’s calm. A wind farm is renewable and releases almost no CO₂ while it runs. I would choose the wind farm, with batteries or hydro to cover calm days, because burning coal releases lots of CO₂, which warms the planet, and coal will run out one day.', checklist:['An advantage of coal (reliable, works any time)','An advantage of wind (renewable, very little CO₂)','A clear choice','A reason for the choice, such as CO₂ or running out']}
],
future:[
  {t:'mcq', q:'Sunny and still: which mix would keep the lights on all through the night?', options:['Solar panels plus batteries charged in the afternoon','Solar panels on their own','Wind turbines on their own','Solar panels plus even more solar panels'], answer:0, explain:'Solar makes nothing at night and there’s hardly any wind, so batteries must store the afternoon’s spare energy.'},
  {t:'mcq', q:'Grey and windy: which part of the mix makes the most electricity on this day?', options:['Wind turbines','Solar panels','Batteries on their own','None of them work'], answer:0, explain:'Strong winds are perfect for turbines. Batteries only store electricity; they don’t make it.'},
  {t:'num', q:'At 6 pm the town needs <b>90 MW</b>. Wind gives 35 MW and hydro gives 30 MW. The Sun has set. How much must the batteries supply to avoid a blackout?', answer:25, unit:'MW', tol:0, explain:'90 − 35 − 30 = 25 MW.'},
  {t:'multi', q:'Which statements about batteries in the town game are true? Tick all that apply.', options:['They store spare electricity when supply is bigger than demand','They give electricity back when supply is too low','They help solar power cover the evening peak','They make new electricity from nothing','They release lots of CO₂ while they are running'], answers:[0,1,2], explain:'Batteries move energy from times with spare electricity to times when there isn’t enough.'},
  {t:'table', q:'When can each source make electricity?', rowHead:'Source', cols:[{name:'Works…', options:['Only when it’s sunny','Only when it’s windy','At any time, in any weather']}], rows:[{label:'Solar panels', ans:['Only when it’s sunny']},{label:'Wind turbines', ans:['Only when it’s windy']},{label:'Hydroelectric dam', ans:['At any time, in any weather']},{label:'Geothermal', ans:['At any time, in any weather']}], explain:'Hydro and geothermal are reliable renewables, so they are great for filling the gaps.'},
  {t:'write', words:['demand','supply','battery','evening peak','budget'], q:'“A bit of everything” had a tight budget. Explain how you chose your mix, and how you avoided a blackout in the evening.', model:'The day had some sun and some wind, so I used a mix of solar and wind because they suit the weather and are cheap. Demand is highest in the evening, after the Sun has set, so I added batteries to store spare solar energy from the afternoon, and some hydro to fill any gaps. I checked the cost as I went so I stayed within the budget.', checklist:['Names the sources chosen and why they suit the weather','Mentions the evening peak or the Sun setting','Explains storage or a reliable source to cover the evening','Mentions keeping within the budget']}
]
};
Object.entries(CREVIEWS).forEach(([id, items])=>{ const s = STOPS.find(x=>x.id===id); if (s) s.creview = items; });

/* ================= End-of-mission questions: students explain how and why their solution worked ================= */
const MQ = (q, options, explain)=>({tag:'How did you do it?', q, options, answer:0, explain});
const MISSION_QS = {
  'launch:sort':[MQ('How can you tell an example is <b>current</b> electricity?', ['Charge flows round a complete loop, like in a plugged-in device','Charge builds up in one place and then jumps as a spark','It only ever happens when two materials are rubbed','It always makes a crackling sound and a tiny flash'], 'Current electricity flows round a circuit. Static builds up, stays put and may jump.'),
    MQ('Why is a shock from a door handle <b>static</b>, not current?', ['Charge built up on you and jumped across all in one go','Charge flowed steadily round a loop of wire','The door handle has a battery hidden inside it','Metal door handles always make current electricity'], 'The charge built up on your body, then jumped in a single spark.')],
  'launch:torch':[MQ('Each flashlight had a different fault. What did every fault do to the circuit?', ['It stopped the circuit working: no energy source or a gap in the loop','It made the current flow the wrong way round','It made far too much current flow through the bulb','It turned the current into static electricity'], 'A circuit needs an energy source and a complete loop with no gaps.'),
    MQ('A flashlight only shines while you squeeze it. What is most likely wrong?', ['A loose part only touches when you squeeze, closing the gap','The battery only works when it is warm from your hand','Squeezing the flashlight makes brand new electrons','The bulb needs to be pressed hard to make light'], 'Squeezing pushes a loose part into place, so the loop is complete only while you squeeze.')],
  'atom:order':[MQ('What made scientists change the model of the atom each time?', ['New experiments gave evidence the old model couldn’t explain','Each scientist simply liked a different shape better','The atoms themselves changed shape over the years','Older models were banned by governments'], 'Models change when new evidence doesn’t fit them.'),
    MQ('Which model came straight after Thomson’s plum pudding?', ['Rutherford’s nuclear model','Bohr’s shell model','Dalton’s solid spheres','Democritus’s atomos'], 'Rutherford’s gold foil experiment in 1911 replaced the plum pudding.')],
  'atom:model-dalton':[MQ('Why could you only use one solid ball for Dalton’s model?', ['Nobody had discovered any particles inside atoms yet','Dalton knew about electrons but chose to leave them out','Dalton’s atoms were made only of protons','Dalton thought atoms were mostly empty space'], 'In 1803 atoms were thought to be solid and impossible to split.'),
    MQ('What did Dalton say was different between elements?', ['Each element has its own kind of atom','All elements are made of the same atom','Atoms can be cut into smaller atoms','Elements are made of electrons only'], 'Dalton said each element has its own atoms, with their own mass.')],
  'atom:model-thomson':[MQ('In Thomson’s model, where are the electrons?', ['Dotted through a ball of positive charge','In shells around a tiny nucleus','Packed together in a central nucleus','Orbiting far away outside the atom'], 'Like plums in a pudding.'),
    MQ('Why does the plum pudding atom have no overall charge?', ['The positive charge balances the negative electrons','It has no electrons in it at all','Its electrons are positive, not negative','The pudding is made entirely of neutrons'], 'Equal positive and negative charge cancel out.')],
  'atom:model-rutherford':[MQ('What new piece did Rutherford add?', ['A tiny, dense, positive nucleus','Electrons spread through positive pudding','Shells that hold set numbers of electrons','Solid balls with nothing inside them'], 'The nucleus explained why a few particles bounced back.'),
    MQ('Why is most of Rutherford’s atom empty space?', ['Most particles went straight through the gold foil','All of the particles bounced straight back','The gold foil melted during the experiment','Electrons fill every bit of the atom'], 'If most particles pass straight through, most of the atom must be empty.')],
  'atom:model-bohr':[MQ('What did Bohr add to Rutherford’s model?', ['Electrons travel in fixed shells','A nucleus in the middle of the atom','Positive pudding around the electrons','Neutrons orbiting outside the electrons'], 'Bohr kept the nucleus and put the electrons in shells.'),
    MQ('How many electrons can the first shell hold?', ['2','8','1','18'], 'The first shell holds up to 2, and the next holds up to 8.')],
  'static:mystery1':[MQ('How did you find out the charge of ball B?', ['Tested it with different charges on ball A and watched for a push or pull','Looked closely at the colour of ball B','Tested it just once with a positive ball A','Compared how heavy ball A and ball B were'], 'Pushes and pulls with different charges reveal the mystery charge.'),
    MQ('Ball B was <b>pushed away</b> by ball A. What does that tell you?', ['Ball B has the same charge as ball A','Ball B is neutral','Ball B has the opposite charge to ball A','Ball B has lost every one of its electrons'], 'Only like charges repel.')],
  'static:mystery2':[MQ('Why isn’t one test enough to name the charge?', ['Being attracted could mean neutral or the opposite charge','Ball B changes its charge after the first test','The first test always gives the wrong result','Ball A runs out of charge after one test'], 'A second test with the other charge tells them apart.'),

/* ================= Power Grid builder: randomised map, drag-and-drop power sources ================= */
function rng(seed){ let a = seed >>> 0; return ()=>{ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const GCOLS = 12, GROWS = 8, TILE = 56;
const TERRAIN = {
  sea:{name:'Sea', col:'#4f8fd1'}, coast:{name:'Coast', col:'#e8d59a'}, plains:{name:'Plains', col:'#a9d18e'}, farm:{name:'Farmland', col:'#d9c66a'},
  forest:{name:'Forest', col:'#5f9a52'}, hills:{name:'Windy hills', col:'#8fbf6a'}, mountain:{name:'Mountains', col:'#9a8f86'}, volcano:{name:'Volcano', col:'#7a4a3a'}, city:{name:'City', col:'#b9bcc8'}
};
const GSRC = {
  solar:{name:'Solar farm', short:'Solar', cost:3, ren:true, col:'#f2b200', where:'Any land. Best in open, sunny places.'},
  wind:{name:'Wind farm', short:'Wind', cost:4, ren:true, col:'#5aa8ff', where:'Land or sea. Best on hills, the coast or at sea.'},
  hydro:{name:'Hydro dam', short:'Hydro', cost:7, ren:true, col:'#2fb5a3', where:'Only on a river. Best in hills or mountains.'},
  tidal:{name:'Tidal turbines', short:'Tidal', cost:5, ren:true, col:'#3a6fd9', where:'In the sea, next to the land.'},
  geo:{name:'Geothermal plant', short:'Geo', cost:7, ren:true, col:'#d9643a', where:'Right next to the volcano.'},
  biomass:{name:'Biomass plant', short:'Biomass', cost:4, ren:true, col:'#6a9a3a', where:'On farmland or forest.'},
  battery:{name:'Battery store', short:'Battery', cost:5, ren:true, col:'#c27bd6', where:'Any land. It stores spare power for later.'},
  gas:{name:'Gas power station', short:'Gas', cost:3, ren:false, col:'#8aa0b8', where:'Any land. Fossil fuel. Quick to switch on.'},
  coal:{name:'Coal power station', short:'Coal', cost:3, ren:false, col:'#555b66', where:'Any land. Fossil fuel. Lots of CO\u2082.'},
  nuclear:{name:'Nuclear power station', short:'Nuclear', cost:12, ren:false, col:'#9b7bff', where:'Near water (coast or river). Very expensive.'}
};
function makeMap(seed, force){
  force = force || {};
  const R = rng(seed); const T = []; for (let r=0;r<GROWS;r++){ T.push([]); for (let c=0;c<GCOLS;c++) T[r].push({t:'plains', river:false}); }
  const side = force.side || ['left','right','bottom'][Math.floor(R()*3)];
  const inSea = (r,c,depth)=> side==='left' ? c<depth : side==='right' ? c>=GCOLS-depth : r>=GROWS-depth;
  for (let r=0;r<GROWS;r++) for (let c=0;c<GCOLS;c++){ const d = 2 + (R()<0.35 ? 1 : 0); if (inSea(r,c,d)) T[r][c].t = 'sea'; }
  const mside = side==='left' ? 'right' : side==='right' ? 'left' : 'top';
  for (let r=0;r<GROWS;r++) for (let c=0;c<GCOLS;c++){ if (T[r][c].t==='sea') continue; const m = mside==='right' ? GCOLS-1-c : mside==='left' ? c : r; if (m<2 && R()<0.85) T[r][c].t = 'mountain'; else if (m<4 && R()<0.6) T[r][c].t = 'hills'; }
  const N = (r,c)=>[[r-1,c],[r+1,c],[r,c-1],[r,c+1]].filter(([a,b])=>a>=0&&b>=0&&a<GROWS&&b<GCOLS);
  for (let r=0;r<GROWS;r++) for (let c=0;c<GCOLS;c++){ const t = T[r][c]; if (t.t==='plains'){ const x = R(); t.t = x<0.25 ? 'farm' : x<0.45 ? 'forest' : 'plains'; } }
  for (let r=0;r<GROWS;r++) for (let c=0;c<GCOLS;c++){ if (T[r][c].t!=='sea' && N(r,c).some(([a,b])=>T[a][b].t==='sea')) T[r][c].t = T[r][c].t==='mountain' ? 'mountain' : 'coast'; }
  const hasVolcano = force.volcano!=null ? force.volcano : R()<0.6;
  if (hasVolcano){ const ms = []; for (let r=0;r<GROWS;r++) for (let c=0;c<GCOLS;c++) if (T[r][c].t==='mountain') ms.push([r,c]); if (ms.length){ const [r,c] = ms[Math.floor(R()*ms.length)]; T[r][c].t = 'volcano'; } }
  // river from mountains to the sea
  const riverPath = [];
  let start = null; for (let k=0;k<50 && !start;k++){ const r = Math.floor(R()*GROWS), c = Math.floor(R()*GCOLS); if (T[r][c].t==='mountain') start = [r,c]; }
  if (start && force.river!==false){ let [r,c] = start; const dir = side==='left' ? [0,-1] : side==='right' ? [0,1] : [1,0]; let guard = 0;
    while (guard++ < 40){ riverPath.push([r,c]); if (T[r][c].t==='sea') break; if (T[r][c].t!=='volcano') T[r][c].river = true; const wob = R(); let nr = r + dir[0], nc = c + dir[1]; if (wob<0.3){ if (dir[0]===0) nr += (R()<.5?-1:1); else nc += (R()<.5?-1:1); } nr = clamp(nr,0,GROWS-1); nc = clamp(nc,0,GCOLS-1); if (nr===r && nc===c) break; r = nr; c = nc; } }
  // city: 2x2 block of land, away from the sea edge and mountains
  let city = null; for (let k=0;k<200 && !city;k++){ const r = 1+Math.floor(R()*(GROWS-3)), c = 1+Math.floor(R()*(GCOLS-3)); const cells = [[r,c],[r+1,c],[r,c+1],[r+1,c+1]]; if (cells.every(([a,b])=>['plains','farm','forest','coast','hills'].includes(T[a][b].t) && !T[a][b].river)) city = cells; }
  if (!city) city = [[3,5],[4,5],[3,6],[4,6]];
  city.forEach(([a,b])=>{ T[a][b].t = 'city'; T[a][b].river = false; });
  const W = {sun: force.sun || 2+Math.floor(R()*4), wind: force.wind || 1+Math.floor(R()*5), rain: force.rain || 1+Math.floor(R()*5), tide: force.tide || 2+Math.floor(R()*4)};
  const gust = Array.from({length:24}, (_,hh)=>clamp(0.75 + 0.35*Math.sin(hh/24*2*Math.PI + R()*6) + (R()-.5)*0.3, 0.2, 1.3));
  return {seed, tiles:T, side, city, riverPath, weather:W, gust, scale: force.scale || +(0.8 + R()*0.25).toFixed(2), hasVolcano};
}
function tileFactor(map, r, c, type){
  const t = map.tiles[r][c]; const W = map.weather;
  const N = [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].filter(([a,b])=>a>=0&&b>=0&&a<GROWS&&b<GCOLS);
  if (t.t==='city') return {ok:false, why:'You can’t build power stations in the middle of the city!'};
  if (t.t==='volcano') return {ok:false, why:'Not on the volcano! Try right next to it.'};
  if (type==='solar'){ if (t.t==='sea') return {ok:false, why:'Solar farms need to go on land.'}; return {ok:true, f: W.sun/5 * (t.t==='forest' ? 0.55 : t.t==='mountain' ? 0.85 : 1)}; }
  if (type==='wind'){ const m = {sea:1.3, coast:1.2, hills:1.15, mountain:1.2, plains:0.9, farm:0.9, forest:0.55}[t.t] || 0.8; return {ok:true, f: W.wind/5 * m}; }
  if (type==='hydro'){ if (!t.river) return {ok:false, why:'Hydro dams need a river.'}; return {ok:true, f: W.rain/5 * ({mountain:1, hills:0.85}[t.t] || 0.45)}; }
  if (type==='tidal'){ if (t.t!=='sea' || !N.some(([a,b])=>map.tiles[a][b].t!=='sea')) return {ok:false, why:'Tidal turbines go in the sea, right next to the land.'}; return {ok:true, f: W.tide/5}; }
  if (type==='geo'){ if (t.t==='sea' || !N.some(([a,b])=>map.tiles[a][b].t==='volcano')) return {ok:false, why: map.hasVolcano ? 'It must be right next to the volcano.' : 'There\u2019s no volcano on this map.'}; return {ok:true, f:1}; }
  if (type==='biomass'){ if (!['farm','forest'].includes(t.t)) return {ok:false, why:'Biomass needs farmland or forest.'}; return {ok:true, f:1}; }
  if (type==='nuclear'){ if (t.t==='sea') return {ok:false, why:'Build it on land.'}; if (!(t.river || t.t==='coast')) return {ok:false, why:'Nuclear needs cooling water: build on the coast or by a river.'}; return {ok:true, f:1}; }
  if (t.t==='sea') return {ok:false, why:'Build this one on land.'};
  return {ok:true, f:1};
}
function distToCity(map, r, c){ return Math.min(...map.city.map(([a,b])=>Math.abs(a-r)+Math.abs(b-c))); }
function simGrid(map, placed){
  const hours = []; let blackouts = 0, co2 = 0; const cap = placed.filter(p=>p.type==='battery').length*80, rate = placed.filter(p=>p.type==='battery').length*30; let batt = cap*0.5;
  let renewMWh = 0, totalMWh = 0;
  for (let hr=0; hr<24; hr++){
    const d = DEMAND[hr]*map.scale; const by = {}; let supply = 0, gasCap = 0;
    placed.forEach(p=>{ const f = p.f; const loss = 1 - 0.01*distToCity(map, p.r, p.c); let v = 0;
      if (p.type==='solar') v = 20*f*sunAt(hr); else if (p.type==='wind') v = 12*f*map.gust[hr]; else if (p.type==='hydro') v = 30*f; else if (p.type==='tidal') v = 22*f*Math.abs(Math.sin(2*Math.PI*hr/12.4)); else if (p.type==='geo') v = 25; else if (p.type==='biomass') v = 15; else if (p.type==='coal') v = 50; else if (p.type==='nuclear') v = 60; else if (p.type==='gas') { gasCap += 40*loss; return; }
      v *= loss; by[p.type] = (by[p.type]||0) + v; supply += v; });
    let fromBatt = 0, gas = 0, short = 0;
    if (supply >= d){ batt = Math.min(cap, batt + Math.min(rate, supply-d)); }
    else { let need = d - supply; fromBatt = Math.min(need, rate, batt); batt -= fromBatt; need -= fromBatt; gas = Math.min(need, gasCap); need -= gas; short = need; if (need>0.5) blackouts++; }
    const used = Math.min(d, supply) + fromBatt + gas; totalMWh += used;
    const fossilUsed = Math.min(d, supply) * (((by.coal||0) + (by.nuclear||0)) / (supply||1)) + gas;
    renewMWh += used - fossilUsed;
    co2 += (Math.min(d,supply) * ((by.coal||0)*0.82 + (by.biomass||0)*0.23)/(supply||1)) + gas*0.49;
    hours.push({hr, d, by, fromBatt, gas, short, supply});
  }
  const cost = placed.reduce((a,p)=>a + GSRC[p.type].cost, 0);
  return {hours, blackouts, co2:Math.round(co2), cost, renewPct: totalMWh ? Math.round(100*renewMWh/totalMWh) : 0, allRenewable: placed.every(p=>GSRC[p.type].ren)};
}
/* ---------- map art: one illustrated layer per feature, so overlapping features stay readable ---------- */
const MAPCOL = {sea:'#3f86cf', seaDeep:'#2f6fb5', coast:'#ecd9a0', plains:'#a8d27f', farm:'#c9d77a', forest:'#86bb67', hills:'#93c26c', mountain:'#a79d93', volcano:'#8e6a5a', city:'#c9ccd6'};
function drawTerrain(map, g){
  const T = map.tiles, isLand = (r,c)=> r>=0 && c>=0 && r<GROWS && c<GCOLS && T[r][c].t!=='sea';
  const gBase = sv('g'), gDeco = sv('g'), gRiver = sv('g'), gTop = sv('g'); g.append(gBase, gRiver, gDeco, gTop);
  const defs = sv('defs');
  defs.append(sv('pattern',{id:'pg-grass', width:14, height:14, patternUnits:'userSpaceOnUse'}, sv('path',{d:'M3 10 l1 -3 M9 5 l1 -3', stroke:'#7fb25a', 'stroke-width':1.2, 'stroke-linecap':'round'})));
  g.prepend(defs);
  for (let r=0;r<GROWS;r++) for (let c=0;c<GCOLS;c++){
    const t = T[r][c], x = c*TILE, y = r*TILE, R = rng(map.seed*7 + r*131 + c*17);
    let col = MAPCOL[t.t] || MAPCOL.plains;
    if (t.t==='sea'){ const near = [[r-1,c],[r+1,c],[r,c-1],[r,c+1],[r-1,c-1],[r+1,c+1],[r-1,c+1],[r+1,c-1]].some(([a,b])=>isLand(a,b)); col = near ? MAPCOL.sea : MAPCOL.seaDeep; }
    gBase.append(sv('rect',{x, y, width:TILE+0.5, height:TILE+0.5, fill:col}));
    if (['plains','hills','farm','coast','forest'].includes(t.t)) gBase.append(sv('rect',{x, y, width:TILE, height:TILE, fill:'url(#pg-grass)', opacity: t.t==='coast' ? 0 : .5}));

/* ---------- a whole year: one typical day for each month, with the seasons ---------- */
const MONTH_DAYS = [31,28,31,30,31,30,31,31,30,31,30,31];

/* ================= Marking schemes for Toddle AI marking ================= */
const TEACHER_CODE = 'SPARKS';
const plain = s=>String(s==null ? '' : s).replace(/<br\s*\/?>/gi,' ').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();
function markItem(it){
  const t = it.t; const L = [];
  let marks = 1;
  if (t==='mcq'){ marks = 1; L.push(`Correct answer: ${plain(it.options[it.answer])} (1 mark).`); }
  else if (t==='multi'){ marks = 2; L.push(`Correct answers (all must be ticked): ${it.answers.map(k=>plain(it.options[k])).join('; ')}.`); L.push('2 marks if exactly these are ticked; 1 mark if one is missing or one extra is ticked; otherwise 0.'); }
  else if (t==='match' || t==='table' || t==='sort'){
    const g = asGrid(it); marks = g.rows.length*g.cols.length;
    g.rows.forEach((r,ri)=>L.push(`- ${plain(r.label) || `Row ${ri+1} (picture)`} → ${r.ans.map((a,j)=>g.cols.length>1 ? `${g.cols[j].name}: ${plain(a)}` : plain(a)).join('; ')}`));
    L.unshift(`1 mark for each correct cell (${marks} marks):`);
  }
  else if (t==='order'){ marks = 2; L.push(`Correct order: ${it.items.map((x,i)=>`${i+1}) ${plain(x)}`).join('  ')}.`); L.push('2 marks if fully correct; 1 mark if only one pair of neighbouring items is swapped; otherwise 0.'); }
  else if (t==='num'){ marks = 2; L.push(`Answer: ${it.answer}${it.unit ? ' ' + it.unit : ''}${it.tol ? ` (accept ${+(it.answer-it.tol).toFixed(3)} to ${+(it.answer+it.tol).toFixed(3)})` : ''} (1 mark).`); L.push(`Working shown or method clear (1 mark)${it.explain ? ': ' + plain(it.explain).replace(/\.$/,'') : ''}.`); L.push('If the student completed this in the sim, the working box may be empty: give the working mark if the answer is correct.'); }
  else if (t==='fill'){ marks = it.blanks.length; it.blanks.forEach((b,i)=>{ const all = [...new Set(b.map(plain).concat(...SYN_GROUPS.filter(g=>b.some(x=>g.includes(canonWord(x))))))]; L.push(`Gap ${i+1}: ${all.join(' / ')} (1 mark)`); }); L.push('Accept small spelling mistakes if the meaning is clear.'); }
  else if (t==='draw' || t==='write'){
    const ck = it.checklist || []; marks = Math.max(1, ck.length);
    L.push(`1 mark for each of these (${marks} marks):`); ck.forEach(c=>L.push(`- ${plain(c)}`));
    if (t==='write' && typeof it.model==='string') L.push(`Model answer: ${plain(it.model)}`);
    if (t==='draw') L.push('A model drawing is shown in the answer key. Judge the science, not the artistic quality; neat hand-drawn or on-screen drawings are both fine.');
    if (t==='write' && it.words && it.words.length) L.push(`Words to use (shown to students): ${it.words.join(', ')}. The marking points are about using these words correctly.`);
    if (t==='write') L.push('Accept any correct scientific wording; the student does not need to match the model answer word for word.');
  }
  if (it.explain && t!=='num' && t!=='mcq') {}
  return {marks, lines:L};
}
function schemeForStop(stop, part){
  part = part || 'f'; const items = rvItems(stop, part); const L = []; let total = 0; const PN = PART_NAME[part];
  const parts = [['Part A: Show what you know', items.map((it,i)=>[it,i]).filter(([it])=>!SELF(it.t))], ['Part B: Draw and explain', items.map((it,i)=>[it,i]).filter(([it])=>SELF(it.t))]];
  parts.forEach(([title, list])=>{ if (!list.length) return; L.push(title);
    list.forEach(([it,i])=>{ const m = markItem(it); total += m.marks; L.push(`Q${i+1} (${RTYPES[it.t]}, ${m.marks} mark${m.marks===1?'':'s'}): ${plain(it.q)}`); m.lines.forEach(x=>L.push('   ' + x)); }); L.push(''); });
  return {title:`${stop.title}: ${PN} worksheet`, total, text:[`=== ${stop.title}: ${PN} worksheet (${stop.yearLabel}) - ${total} marks ===`, ''].concat(L).join('\n')};
}
function schemeForTask(ws, task){
  const L = []; let total = 0;
  L.push('Part A: My build');
  (task.marking||[]).forEach(([d,m])=>{ total += m; L.push(`   - ${d} (${m} mark${m===1?'':'s'})`); });
  L.push('   Evidence: the picture of the build (a snapshot from the sim), the ticked build checklist, the results table and the feedback page. The sim ticks each checklist point only when the build really does it, so a ticked box is reliable evidence.');
  L.push('');
  L.push('Part B: Questions about my build');
  task.questions.forEach((it,i)=>{ const m = markItem(it); total += m.marks; L.push(`Q${i+1} (${RTYPES[it.t]}, ${m.marks} mark${m.marks===1?'':'s'}): ${plain(it.q)}`); m.lines.forEach(x=>L.push('   ' + x)); });
  L.push('   Answers about the build should match the student’s own build in Part A (for example, the sources they say they used should appear in their picture and table).');
  return {title:`${task.title} build sheet`, total, text:[`=== ${ws.title}: ${task.title} build sheet - ${total} marks ===`, ''].concat(L).join('\n')};
}
function allTasks(){ return WORKSHOPS.flatMap(ws=>ws.tasks.map(t=>({ws, t}))); }
/* sheets: [{stop, part}] (a bare stop means its Foundation sheet) */
function asSheets(list){ return (list||[]).map(x=>x && x.stop ? x : {stop:x, part:'f'}); }
function markingInstructions(stops, tasks){
  stops = asSheets(stops); const L = [];
  L.push('AI MARKING INSTRUCTIONS');
  L.push('');
  L.push('How to read the submissions:');
  L.push('- Each student uploads PDF(s) made in the Sparks Through Time sim. The blank template for each sheet is attached to this task, so you can see exactly what the empty sheet looks like.');
  L.push('- The answer key for each sheet is also attached (teacher-only). It is the same sheet completed with a model answer for every question. Use it as the standard to mark against; students do not need to match it word for word.');
  L.push('- Compare the student’s PDF with the blank template. Only mark what the student ADDED: ticks, filled-in table cells, typed answers, drawings, ordered lists and numbers. Student answers are printed in blue. Anything printed in the template (questions, choices, word banks, labels) is not the student’s work.');
  L.push('- The last page of each sheet is a feedback page made by the sim. It shows which questions the sim auto-marked as correct and which build checks passed. Use it to confirm your marking; if your marking and the feedback page disagree, trust the student’s visible answer and mention it in your feedback.');
  L.push('- Each stop has two worksheets. The Foundation worksheet covers the Learn steps. The Challenge worksheet is an extension that covers the Challenge missions; only some students may be set it.');
  L.push('- Each worksheet starts with "Steps completed in the sim": the Learn steps (Foundation) or the Challenge missions (Challenge) the student should do before answering. A blue tick means the sim recorded that step as done. These are not marked, but mention any skipped steps in your feedback.');
  L.push('- Every auto-marked question in the sim gets one go. A wrong answer is shown with the right answer, so check the student’s first answer as printed.');
  L.push('- If a sheet is missing, a question is blank, or the upload is the empty template, give 0 for those questions and say kindly what is missing.');
  L.push('');
  L.push('How to give feedback (Grade 6, friendly and specific):');
  L.push('- Give the score for each sheet as marks out of the total, plus a short breakdown by question.');
  L.push('- Name one or two things the student did well, using their own answers as evidence.');
  L.push('- Give one clear next step, linked to a question they lost marks on, with a hint rather than the full answer.');
  L.push('- Accept any scientifically correct wording. Do not take marks off for spelling or grammar unless the meaning is unclear.');
  L.push('');
  L.push('MARKING SCHEME');
  L.push('');
  let total = 0;
  stops.forEach(({stop, part})=>{ const sc = schemeForStop(stop, part); total += sc.total; L.push(sc.text); L.push(''); });
  tasks.forEach(({ws, t})=>{ const sc = schemeForTask(ws, t); total += sc.total; L.push(sc.text); L.push(''); });
  L.push(`TOTAL FOR THE TASK: ${total} marks.`);
  return L.join('\n');
}

const GL = (()=>{ const map = new Map(); const pats = [];

  const esc = s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const ci = s=>esc(s).replace(/[a-z]/gi, ch=>`[${ch.toLowerCase()}${ch.toUpperCase()}]`);
  const re = new RegExp(pats.map(p=>p.caseSens ? esc(p.f) : ci(p.f)).join('|'), 'g');

})();
const glossRe = GL.re;

const glossDone = new WeakSet(); const glossMarked = new WeakMap();
function glossaryScan(root){

      seen.add(entry.term); changed = true;
      if (m.index > last){ const t = document.createTextNode(text.slice(last, m.index)); glossDone.add(t); frag.append(t); }
      const sp = document.createElement('span'); sp.className = 'gloss'; sp.tabIndex = 0; sp.dataset.term = entry.term; sp.dataset.def = entry.def; sp.setAttribute('role','button'); sp.setAttribute('aria-label', `${word}: ${entry.def}`); sp.textContent = word; const inner = sp.firstChild; glossDone.add(inner); frag.append(sp); last = m.index + word.length; }

    const b = document.createElement('b'); b.textContent = el.dataset.term.charAt(0).toUpperCase() + el.dataset.term.slice(1); tip.append(b, document.createTextNode(': ' + el.dataset.def)); document.body.append(tip);

/* ================= Pop-out calculator (no eval: small safe parser) ================= */
function calcEval(src){
  const t = src.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\s+/g,'');
  let i = 0;
  const peek = ()=>t[i];
  function num(){ let s = ''; while (i<t.length && /[0-9.]/.test(t[i])) s += t[i++]; if (!s || (s.match(/\./g)||[]).length>1) throw 0; return parseFloat(s); }
  function atom(){ if (peek()==='-'){ i++; return -atom(); } if (peek()==='('){ i++; const v = expr(); if (peek()===')') i++; return v; } return num(); }
  function term(){ let v = atom(); while (peek()==='*' || peek()==='/'){ const op = t[i++]; const b = atom(); v = op==='*' ? v*b : v/b; } return v; }
  function expr(){ let v = term(); while (peek()==='+' || peek()==='-'){ const op = t[i++]; const b = term(); v = op==='+' ? v+b : v-b; } return v; }
  const v = expr(); if (i < t.length) throw 0; if (!isFinite(v)) throw 1; return v;
}
