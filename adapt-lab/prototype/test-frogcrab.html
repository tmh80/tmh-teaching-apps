<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adapt Lab art test: frogs and crabs</title>
<style>
body{margin:0;background:#eef2ef;color:#16241e;font-family:"Avenir Next","Segoe UI",system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:14px 0 4px}p{margin:0 0 8px;color:#55665e}
canvas{display:block;width:100%;border-radius:14px;background:#fbfdfb}
</style>
</head>
<body>
<main>
  <h1>Art test: frogs and crabs</h1>
  <p>Test page for <code>plan-frog.js</code> and <code>plan-crab.js</code>. The first strip shows only these two plans in fixed poses; the gallery below shows the whole zoo moving.</p>
  <h2>Pose strip: standing still, then eight moments of one movement cycle</h2>
  <canvas id="poses"></canvas>
  <h2>Gallery (every animal in Rig.zoo)</h2>
  <canvas id="gal"></canvas>
</main>
<script src="../src/js/20-rig.js"></script>
<script src="../src/js/21-plan-frog.js"></script>
<script src="../src/js/21-plan-crab.js"></script>
<script src="util.js"></script>
<script src="gallery.js"></script>
<script>
// Pose strip: one row per frog or crab. Column 1 is standing still; the others are phase 0, 1/8, 2/8 ... of one cycle.
(function(){
  const R=window.Rig,cv=document.getElementById('poses');
  const names=Object.keys(R.zoo).filter(n=>['frog','crab'].includes(R.planOf(R.zoo[n])));
  function draw(time){
    const cols=9,rows=names.length,{c,w,h}=window.PU.fit(cv,rows/cols*.92);c.clearRect(0,0,w,h);const cw=w/cols,ch=h/rows;
    names.forEach((nm,r)=>{const s=R.specOf(R.zoo[nm],r+1),zs=R.sizeOf(s);const sc=Math.min(cw*.86/zs.len,ch*.52/zs.height);
      for(let k=0;k<cols;k++){const x=cw*(k+.5),gy=ch*(r+.84);
        c.fillStyle=k===0?'#e3ece7':(r%2?'#f3ecdc':'#e6eef4');c.fillRect(cw*k+2,ch*r+2,cw-4,ch-4);
        c.fillStyle='rgba(60,80,70,.10)';c.fillRect(cw*k+2,gy,cw-4,ch*(r+1)-gy-2);
        c.save();c.translate(x+(zs.dx||0)*sc,gy);R.shadow(c,sc*zs.len*.5);c.scale(sc,sc);
        R.draw(c,s,k===0?{t:time,phase:0,move:0,blink:((time+r)%4)<.15}:{t:time,phase:(k-1)/8,move:1});c.restore()}
      window.PU.label(c,nm,cw*.5,ch*r+15,Math.max(9,Math.min(12,cw*.1)))});
  }
  let T=0,last=0;function frame(ts){T+=Math.min(.05,(ts-last)/1000||0);last=ts;draw(T);requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script>
</body>
</html>
