<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adapt Lab · Species designer (prototype)</title>
<style>
/* Adapt Lab designer prototype. One screen on a laptop: traits · animal · survival, with a dark dock for points and actions. */
:root{
  --bg:#e7ede9; --panel:#fbfdfb; --ink:#16241e; --muted:#55665e; --line:#cddad2; --chip:#edf3ef;
  --accent:#2b6d57; --accent-soft:#d5eae0; --sig:#bf7d14; --sig-soft:#f5e6c6;
  --good:#2e7d4f; --ok:#a8730f; --bad:#b4412d; --beh:#7a4fa8; --beh-soft:#ece2f6;
  --deep:#12251e; --deep2:#1b3329; --on-deep:#e6efe9; --on-deep-muted:#9db3a8;
  --f:"Avenir Next","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --f-num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.35;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sig);outline-offset:2px}
.app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--deep);color:var(--on-deep)}
.brand{display:flex;flex-direction:column;line-height:1.05;flex:none}
.brand b{font-size:21px;font-weight:800;letter-spacing:-.01em}.brand b span{color:#6fd0a8}
.brand small{font-size:11.5px;color:var(--on-deep-muted);letter-spacing:.06em;text-transform:uppercase}
.biomes{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;padding:2px}
.biomes::-webkit-scrollbar{display:none}
.biomes button{flex:none;display:flex;align-items:center;gap:7px;border:1.5px solid #2f4c40;background:var(--deep2);color:var(--on-deep);border-radius:999px;padding:6px 13px 6px 8px;font-weight:600;font-size:13.5px;white-space:nowrap}
.biomes button i{width:16px;height:16px;border-radius:50%;flex:none;border:2px solid rgba(255,255,255,.55)}
.biomes button[aria-pressed="true"]{background:#f3f8f5;color:var(--ink);border-color:#f3f8f5}
.era{flex:none;font-weight:700;font-size:13px;background:var(--deep2);border:1.5px solid #2f4c40;border-radius:10px;padding:6px 11px;color:#bfe3d2}

/* ---------- main grid ---------- */
.grid{display:grid;grid-template-columns:minmax(330px,392px) minmax(0,1fr) minmax(300px,352px);grid-template-areas:"traits stage vitals";gap:12px;padding:12px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;min-height:0;box-shadow:0 1px 0 rgba(22,36,30,.04)}
.traits{grid-area:traits;display:grid;grid-template-columns:86px minmax(0,1fr);overflow:hidden}
.stage{grid-area:stage;position:relative;border-radius:20px;overflow:hidden;min-height:0;background:#cfe0ea;box-shadow:inset 0 0 0 1px rgba(22,36,30,.12),0 6px 18px rgba(22,36,30,.12)}
.vitals{grid-area:vitals;display:flex;flex-direction:column;gap:10px;padding:12px;overflow:hidden}
.mini{display:none}

/* ---------- trait tabs ---------- */
.tabs{display:flex;flex-direction:column;gap:6px;padding:8px 6px;background:#eef4f0;border-right:1px solid var(--line)}
.tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;border-radius:13px;padding:9px 2px 7px;color:var(--muted);font-weight:700;font-size:12px;line-height:1.1;text-align:center}
.tabs button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff;box-shadow:0 3px 0 #1d4d3d}
.tabs button.beh[aria-selected="true"]{background:var(--beh);box-shadow:0 3px 0 #563477}
.tabs button .dot{position:absolute;top:5px;right:9px;min-width:17px;height:17px;border-radius:9px;background:var(--sig);color:#fff;font:700 10.5px/17px var(--f-num);padding:0 4px}
.tabs .kind{margin-top:auto;font-size:10.5px;line-height:1.25;color:var(--muted);text-align:center;padding:4px 2px}
.tabs .kind b{display:inline-block;width:15px;height:15px;border-radius:5px;color:#fff;font-size:10px;line-height:15px;margin-right:2px}
.opts{padding:10px 12px 12px;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:9px}
.opts h2{margin:0;font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.opts h2 em{font-style:normal;font-size:11.5px;font-weight:700;color:#fff;background:var(--accent);border-radius:6px;padding:2px 7px}
.opts h2 em.beh{background:var(--beh)}
.row{display:flex;flex-direction:column;gap:5px}
.row>.lbl{font-size:13px;font-weight:700;color:var(--ink);display:flex;flex-wrap:wrap;gap:2px 5px;align-items:baseline}
.row>.lbl small{font-weight:600;color:var(--muted)}
.vterm{border:0;background:none;padding:0;font-weight:600;color:var(--accent);border-bottom:2px dotted var(--sig);cursor:help}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{flex:1 1 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:38px;border:1.5px solid var(--line);border-bottom-width:3px;background:var(--chip);border-radius:12px;padding:5px 9px 5px 11px;font-weight:600;font-size:14px;text-align:left;transition:transform .08s,background .15s}
.chip:active{transform:translateY(2px);border-bottom-width:1.5px;margin-bottom:1.5px}
.chip .price{flex:none;font:700 12px/1 var(--f-num);border-radius:8px;padding:4px 6px;background:var(--sig-soft);color:#7a4f08;white-space:nowrap}
.chip .price.free{background:transparent;color:var(--muted);font-family:var(--f);font-weight:600}
.chip .price.back{background:var(--accent-soft);color:var(--good)}
.chip .price.over{background:#f6d9d2;color:var(--bad)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:#1d4d3d;color:#fff}
.chip[aria-pressed="true"] .price{background:rgba(255,255,255,.2);color:#fff;font-family:var(--f)}
.beh .chip[aria-pressed="true"]{background:var(--beh);border-color:#563477}
.chip .start{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-left:auto}
.chip.sw{flex:0 0 auto;min-height:34px;padding:4px 8px 4px 5px;gap:6px;font-size:13px}
.chip.sw i{width:20px;height:20px;border-radius:50%;border:2px solid rgba(22,36,30,.25);flex:none}
.slide{display:grid;grid-template-columns:minmax(0,1fr) 54px auto;gap:8px;align-items:center}
.slide input[type=range]{width:100%;accent-color:var(--accent);height:26px;margin:0}
.slide input[type=number]{width:54px;border:1.5px solid var(--line);border-radius:9px;background:#fff;padding:5px 4px;text-align:center;font:600 14px var(--f-num)}
.slide .price{font:700 12px/1 var(--f-num);border-radius:8px;padding:5px 6px;background:var(--sig-soft);color:#7a4f08;min-width:34px;text-align:center}
.slide .price.free{background:transparent;color:var(--muted)}
.slide .ends{grid-column:1/2;display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:-6px}

/* ---------- stage ---------- */
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
.tag{position:absolute;display:flex;align-items:center;gap:6px;border:0;background:rgba(18,37,30,.82);color:#fff;border-radius:12px;padding:6px 11px;font-weight:700;font-size:13.5px;backdrop-filter:blur(4px)}
.nameTag{left:12px;top:12px;padding:5px 6px 5px 11px}
.nameTag span{font-size:11px;font-weight:700;color:#a9cdbd;text-transform:uppercase;letter-spacing:.05em}
.nameTag input{width:170px;border:0;border-radius:8px;background:rgba(255,255,255,.14);color:#fff;font-weight:700;padding:4px 8px}
.sizeTag{right:12px;top:12px}
.likeTag{left:12px;bottom:12px}
.likeTag b{color:#8fe0bc}
.checkTag{right:12px;bottom:12px;background:rgba(191,125,20,.94)}
.hint{position:absolute;left:50%;top:58px;transform:translateX(-50%);background:rgba(255,255,255,.9);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:600;font-size:13.5px;white-space:nowrap;box-shadow:0 2px 8px rgba(22,36,30,.15);transition:opacity .4s}
.hint.gone{opacity:0;pointer-events:none}

/* ---------- vitals ---------- */
.headline{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;background:var(--deep);color:var(--on-deep);border-radius:14px;padding:10px 12px}
.headline .pct{grid-row:1/3;font:800 46px/1 var(--f);letter-spacing:-.02em;min-width:108px;font-variant-numeric:tabular-nums}
.headline .pct small{font-size:22px;font-weight:700;margin-left:1px}
.headline .pct.good{color:#7fe0b4}.headline .pct.ok{color:#f0c66a}.headline .pct.bad{color:#ff9d87}
.headline .cap{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--on-deep-muted);align-self:end}
.headline .cmp{font-size:13px;font-weight:600;align-self:start}
.headline .cmp b.up{color:#7fe0b4}.headline .cmp b.down{color:#ff9d87}
.headline .threat{grid-column:1/3;font-size:14px;font-weight:600;border-top:1px solid #2f4c40;padding-top:7px;margin-top:3px}
.headline .threat span{color:#f0c66a;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-right:6px}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:22px minmax(0,1fr) 34px;gap:2px 8px;align-items:center;border:0;background:none;padding:0;text-align:left;width:100%}
.bar svg{width:20px;height:20px;grid-row:1/3;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bar .nm{font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:6px}
.bar .nm em{font-style:normal;font:700 12px/1.2 var(--f-num);border-radius:7px;padding:1px 6px;opacity:0;transform:translateY(3px);transition:opacity .25s,transform .25s}
.bar .nm em.show{opacity:1;transform:none}
.bar .nm em.up{background:var(--accent-soft);color:var(--good)}.bar .nm em.down{background:#f6d9d2;color:var(--bad)}
.bar .num{grid-row:1/3;font:700 15px var(--f-num);text-align:right;font-variant-numeric:tabular-nums}
.bar .track{position:relative;height:13px;border-radius:7px;background:#e3ebe6;overflow:hidden}
.bar .fill{position:absolute;inset:0 auto 0 0;border-radius:7px;background:var(--good);transition:width .55s cubic-bezier(.2,.8,.2,1),background .3s}
.bar .ghost{position:absolute;top:-2px;bottom:-2px;width:2.5px;background:rgba(22,36,30,.55);border-radius:2px;transition:left .3s}
.bar.ok .fill{background:#d09a2a}.bar.bad .fill{background:var(--bad)}
.bar.worst .nm{color:var(--bad)}
.legend{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:-2px}
.legend i{width:2.5px;height:12px;background:rgba(22,36,30,.55);border-radius:2px}
.combos{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:9px}
.combos h3{margin:0;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.combo{border-radius:11px;padding:6px 10px;font-size:13px;line-height:1.3;border:1.5px solid}
.combo b{display:block;font-size:13px}
.combo.good{background:#e4f3ea;border-color:#a9d6bb;color:#17472f}
.combo.bad{background:#fbe6e1;border-color:#eab3a6;color:#6e2416}
.combo.none{background:var(--chip);border-color:var(--line);color:var(--muted)}

/* ---------- dock ---------- */
.dock{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:9px 14px;background:var(--deep);color:var(--on-deep)}
.meter{display:flex;flex-direction:column;gap:5px;min-width:212px}
.meter .txt{font-size:14px;font-weight:700}
.meter .txt b{font:800 17px var(--f-num)}
.meter.over .txt{color:#ff9d87}
.pips{display:flex;gap:4px}
.pips i{width:16px;height:16px;border-radius:5px;background:#2b4338;border:1.5px solid #3b5a4c;transition:background .25s,transform .25s}
.pips i.on{background:#f0c66a;border-color:#f0c66a;transform:scale(1.06)}
.pips i.over{background:#ff8d75;border-color:#ff8d75}
.changes{display:flex;gap:6px;overflow-x:auto;padding:3px 2px;scrollbar-width:thin;align-items:center;min-height:42px}
.changes .none{color:var(--on-deep-muted);font-size:13.5px}
.chg{flex:none;display:flex;align-items:center;gap:7px;border:1.5px solid #3b5a4c;background:var(--deep2);color:var(--on-deep);border-radius:11px;padding:5px 6px 5px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.chg small{color:var(--on-deep-muted);font-weight:600}
.chg b{font:700 12px var(--f-num);background:#f0c66a;color:#3b2a05;border-radius:7px;padding:2px 6px}
.chg u{text-decoration:none;font-weight:800;background:#2f4c40;border-radius:7px;padding:2px 8px;font-size:12px}
.actions{display:flex;gap:8px;align-items:center}
.btn{border:0;border-radius:13px;font-weight:800;padding:11px 16px;font-size:15px}
.btn.ghost{background:var(--deep2);color:var(--on-deep);border:1.5px solid #3b5a4c}
.btn.go{background:#f0c66a;color:#2a1e03;box-shadow:0 4px 0 #b88b22;padding:12px 20px}
.btn.go:active{transform:translateY(3px);box-shadow:0 1px 0 #b88b22}
.btn.go[aria-disabled="true"]{background:#4a5f55;color:#a9bdb2;box-shadow:0 4px 0 #34463e}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ---------- pop-ups ---------- */
.pop{position:fixed;z-index:30;max-width:300px;background:var(--deep);color:#fff;border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.pop b{display:block;margin-bottom:2px;color:#8fe0bc}
.pop ul{margin:4px 0 0;padding-left:18px}
.modal{position:fixed;inset:0;z-index:40;background:rgba(12,22,18,.55);display:grid;place-items:center;padding:16px}
.mwin{background:var(--panel);border-radius:20px;max-width:440px;width:100%;padding:20px 22px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.mwin h2{margin:0 0 6px;font-size:22px}
.mwin p{margin:0 0 10px;color:var(--ink)}
.mwin .sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 16px}
.mwin .sum div{background:var(--chip);border-radius:12px;padding:9px 11px;font-size:13px;color:var(--muted)}
.mwin .sum b{display:block;font:800 22px var(--f-num);color:var(--ink)}
.mwin .btn{background:var(--accent);color:#fff;width:100%}

/* ---------- tablet ---------- */
@media (max-width:1180px){
  .grid{grid-template-columns:minmax(290px,330px) minmax(0,1fr) minmax(262px,292px);gap:9px;padding:9px}
  .traits{grid-template-columns:72px minmax(0,1fr)}
  .tabs button{font-size:11px}
  .headline .pct{font-size:38px;min-width:88px}
  .nameTag input{width:120px}
  .meter{min-width:176px}.pips i{width:13px;height:13px}
  .btn.go{padding:12px 14px;font-size:14px}
  .hint{display:none}
}
/* ---------- phone: stacked, animal first, bars stick to the top ---------- */
@media (max-width:760px){
  .app{height:auto;min-height:100dvh;display:block;padding-bottom:128px}
  .top{flex-wrap:wrap;gap:8px;padding:8px 10px}
  .biomes{order:3;flex-basis:100%}
  .era{margin-left:auto}
  .grid{display:block;padding:8px}
  .stage{height:62vw;min-height:216px;margin-bottom:8px}
  .hint,.sizeTag{display:none}
  .nameTag input{width:132px}
  .mini{display:grid;grid-template-columns:auto repeat(5,minmax(0,1fr));gap:7px;align-items:center;position:sticky;top:0;z-index:20;background:var(--deep);color:#fff;border-radius:14px;padding:8px 10px;margin-bottom:8px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
  .mini .p{font:800 22px/1 var(--f);font-variant-numeric:tabular-nums;padding-right:4px}
  .mini .p.good{color:#7fe0b4}.mini .p.ok{color:#f0c66a}.mini .p.bad{color:#ff9d87}
  .mini .m{display:flex;flex-direction:column;gap:3px;font-size:9.5px;font-weight:700;color:#b6cbc0;line-height:1;white-space:nowrap;overflow:hidden}
  .mini .m i{display:block;height:7px;border-radius:4px;background:#2f4c40;overflow:hidden}
  .mini .m i u{display:block;height:100%;border-radius:4px;background:#7fe0b4;transition:width .5s}
  .mini .m.ok i u{background:#f0c66a}.mini .m.bad i u{background:#ff9d87}
  .traits{display:block;margin-bottom:8px;overflow:visible}
  .tabs{flex-direction:row;border-right:0;border-bottom:1px solid var(--line);border-radius:18px 18px 0 0;overflow-x:auto;padding:6px}
  .tabs button{flex:1 0 62px;padding:7px 2px 6px}
  .tabs .kind{display:none}
  .opts{overflow:visible}
  .vitals{overflow:visible}
  .combos{overflow:visible}
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:25;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:8px 10px}
  .meter{min-width:0}
  .changes{grid-column:1/3;grid-row:2;min-height:34px}
  .actions .ghost{padding:10px 11px;font-size:13px}
  .btn.go{padding:10px 12px;font-size:13.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><b>Adapt<span>Lab</span></b><small>Species designer</small></div>
    <div class="biomes" id="biomes" role="group" aria-label="Choose a biome"></div>
    <div class="era" id="era">Era 1</div>
  </header>

  <main class="grid">
    <section class="stage" aria-label="Your species in its biome">
      <canvas id="stage"></canvas>
      <label class="tag nameTag"><span>Name</span><input id="spName" maxlength="24" autocomplete="off" aria-label="Name your species"></label>
      <button class="tag sizeTag" id="sizeTag" type="button"></button>
      <button class="tag likeTag" id="likeTag" type="button"></button>
      <button class="tag checkTag" id="checkTag" type="button" hidden></button>
      <div class="hint" id="stageHint">Tap a trait to change your species. Watch the bars.</div>
    </section>

    <div class="mini" id="mini" aria-hidden="true"></div>

    <section class="traits panel" aria-label="Traits">
      <nav class="tabs" id="tabs" role="tablist" aria-label="Trait groups"></nav>
      <div class="opts" id="opts" role="tabpanel"></div>
    </section>

    <section class="vitals panel" aria-label="Survival">
      <div class="headline" id="headline"></div>
      <div class="bars" id="bars"></div>
      <div class="combos" id="combos"></div>
    </section>
  </main>

  <footer class="dock">
    <div class="meter" id="meter"></div>
    <div class="changes" id="changes" aria-label="Changes this era"></div>
    <div class="actions">
      <button class="btn ghost" id="reset" type="button">Reset</button>
      <button class="btn go" id="release" type="button">Release into the biome ▶</button>
    </div>
  </footer>
</div>
<div class="pop" id="pop" hidden role="tooltip"></div>
<div class="modal" id="modal" hidden><div class="mwin" role="dialog" aria-modal="true" id="mwin"></div></div>

<script>

function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

/* ================= vocabulary ================= */
const VOCAB={
 physical:["Physical adaptation","A body feature, such as thick fur, gills, big ears, spines or waxy leaves."],
 behavioural:["Behavioural adaptation","Something an animal does, such as being active at night or hibernating."],
 responses:["Plant responses","Plants do not behave like animals, but they respond to their environment: dropping leaves, dying back or opening their pores at night."],
 camouflage:["Camouflage","Colouring that helps an organism blend in with its surroundings so predators struggle to see it."],

  else{const tl=s.tail,droop=s.tailType==='bushy'?.55:1.05;const pts=[];for(let i=0;i<=4;i++){const u=i/4;const a=Math.PI-droop*u*.9+sw*u*.6+(s.tailType==='bushy'?-.25:0);pts.push([tx+Math.cos(a)*tl*u+2,ty-Math.sin(a)*tl*u*.2+tl*u*u*droop*.75])}
    const w=s.tailType==='bushy'?[D*.16,D*.3,D*.36,D*.3,D*.1]:[D*.11,D*.085,D*.07,D*.06,D*.05];
    fill(c,col.base,p=>tube(p,pts,w));

  if(s.spiny){c.fillStyle=col.dark;for(let i=0;i<9;i++){const u=i/8,x=lerp(hipX-L*.16,shX+L*.1,u),y=top+D*.1+Math.abs(u-.5)*D*.12;c.beginPath();c.moveTo(x-L*.045,y+D*.1);c.lineTo(x-L*.05-D*.05,y-D*(.3+.1*Math.sin(u*9)));c.lineTo(x+L*.035,y+D*.1);c.closePath();c.fill()}}
  if(s.wingQ){c.save();c.translate(shX-L*.05,top+D*.2);c.rotate(-.35+Math.sin(t*2)*.03);fill(c,col.shade,p=>smooth(p,[[0,0],[-L*.1,-D*(.5+.5*s.wingQ)],[-L*(.45+.25*s.wingQ),-D*(.35+.3*s.wingQ)],[-L*(.5+.3*s.wingQ),D*.05],[-L*.25,D*.1]],true));c.restore()}
  // body silhouette
  const fat=s.fat||0,fl=s.fluff||0;
  const body=new Path2D();
  smooth(body,[[hipX-L*.2,cy-D*.05],[hipX-L*.08,top+D*.04],[0,top+D*(.06-.03*fat)],[shX-L*.02,top+D*.02],[shX+L*.16,cy-D*.12],[shX+L*.12,bot-D*.12],[0,bot+D*(.02+.12*fat)],[hipX-L*.08,bot-D*.04]],true,1);
  if(s.hump)ell(body,-L*.04,top+D*.02,L*.2,D*(.2+.3*s.hump));
  if(fl>.5){const r=D*(.07+.1*fl);[[shX+L*.15,cy+D*.06],[shX+L*.12,cy+D*.3],[shX+L*.02,bot-D*.02],[hipX-L*.19,cy+D*.12],[hipX-L*.14,cy+D*.32],[hipX-L*.2,cy-D*.14]].forEach(q=>ell(body,q[0],q[1],r,r))}

  const neck=new Path2D();tube(neck,[[wx-L*.06,wy+D*.12],[(wx+hx)/2-L*.01,(wy+hy)/2+D*.04],[hx-hr*.2,hy+hr*.1]],[D*.62,lerp(D*.5,hr*1.5,.55),hr*1.45]);
  const sl=hr*(.55+s.snout*.9),sx=hx+Math.cos(ha)*(hr*.35+sl*.6),sy=hy+Math.sin(ha)*(hr*.35+sl*.6);
  const head=new Path2D();ell(head,hx,hy,hr,hr*.94);ell(head,sx,sy,sl,hr*(.62-.08*s.snout),ha);
  const ex=hx-hr*.5,ey=hy-hr*.75,ea=-Math.PI/2-.35+(s.earLop||0)+Math.sin(t*3+(s.seed||0)*2)*.04;
  const tw=po.twitch?Math.sin(t*30)*.12:0;

  fill(c,col.earIn,p=>leaf(p,ex+Math.cos(ea)*s.ear*.14,ey+Math.sin(ea)*s.ear*.14,s.ear*.72,s.earW*.5,ea-tw));
  fill(c,col.base,p=>ell(p,ex+hr*.1,ey+hr*.25,hr*.3,hr*.26));

  const nx=sx+Math.cos(ha)*sl*.86,ny=sy+Math.sin(ha)*sl*.86-hr*.1;

  if(s.cheek)fill(c,col.cheek,p=>ell(p,hx+hr*.2,hy+hr*.3,hr*.2,hr*.13));
}

/* ================= BIRD: owl, hawk, songbird, ostrich, heron, gannet ================= */
function drawBird(c,s,po){
  po=po||{};const col=s.col,t=po.t||0,mv=po.move||0,ph=po.phase||0,fly=po.fly||0;
  const B=s.B,leg=s.leg*(1-fly*.75);
  const bob=mv*(1-fly)*Math.abs(Math.sin(ph*TAU))*B*.05+fly*Math.sin(po.flap||0)*B*.06+(1-mv)*Math.sin(t*1.8)*B*.01;
  const cx=0,cy=-(leg+B*.36)+bob,tilt=lerp(s.tilt,.08,fly);
  const flap=Math.sin(po.flap||t*9);
  const wing=(far)=>{const sxw=cx+B*.1,syw=cy-B*.1;c.save();c.translate(sxw,syw);
    const v=fly>.5?clamp(flap,-1,1):0;const ys=fly>.5?(Math.abs(v)<.18?(v<0?-.18:.18):v):0;
    if(fly>.5){c.scale(1,ys);c.rotate(-.3);const W=s.wing*1.15;fill(c,far?col.shade:col.wing,p=>smooth(p,[[W*.14,0],[W*.2,-W*.42],[W*.06,-W*.86],[-W*.2,-W*1.2],[-W*.25,-W*.92],[-W*.36,-W*.86],[-W*.34,-W*.62],[-W*.46,-W*.52],[-W*.4,-W*.3],[-W*.5,-W*.16],[-W*.4,0]],true,1));
      c.strokeStyle=col.shade;c.lineWidth=B*.012;c.globalAlpha=.5;for(let i=1;i<4;i++){c.beginPath();c.moveTo(-W*.07*i,-W*.08);c.lineTo(-W*.09*i+W*.02,-W*(.9-.16*i));c.stroke()}}
    c.restore()};
  if(fly>.5)wing(true);
  // legs
  const legCol=col.leg;c.strokeStyle=legCol;c.lineCap='round';c.lineJoin='round';
  [[.5,1],[0,0]].forEach(([off,far])=>{const hxl=cx-B*.04+(far?B*.07:-B*.03),hyl=cy+B*.2;
    if(fly>.5){c.lineWidth=s.legW;c.beginPath();c.moveTo(hxl,hyl);c.lineTo(hxl-B*.22,hyl+B*.1);c.stroke();return}
    const[dx,dy]=step(ph,off,s.leg*.5*mv,s.leg*.25*mv);const fx=hxl+dx+B*.02,fy=dy;const k=ik(hxl,hyl,fx,fy,(-hyl)*.55,(-hyl)*.52,1);
    c.globalAlpha=far?.75:1;c.lineWidth=s.legW;c.beginPath();c.moveTo(hxl,hyl);c.lineTo(k[0],k[1]);c.lineTo(fx,fy-s.legW*.3);c.stroke();
    c.lineWidth=s.legW*.8;c.beginPath();c.moveTo(fx-B*.07,fy-s.legW*.3);c.lineTo(fx+B*.12,fy-s.legW*.3);c.moveTo(fx,fy-s.legW*.3);c.lineTo(fx+B*.09,fy-s.legW*1.3);c.stroke();c.globalAlpha=1;
    if(s.thigh)fill(c,far?col.shade:col.base,p=>ell(p,hxl,hyl-B*.02,B*.13,B*.2,.2))});
  // body + tail
  c.save();c.translate(cx,cy);c.rotate(-tilt);
  fill(c,col.shade,p=>{p.moveTo(-B*.3,-B*.1);p.lineTo(-B*.52-s.tail,-B*.02);p.quadraticCurveTo(-B*.56-s.tail,B*.1,-B*.5-s.tail,B*.2);p.lineTo(-B*.28,B*.16);p.closePath()});
  const body=new Path2D();smooth(body,[[-B*.5,B*.02],[-B*.22,-B*.27],[B*.2,-B*.31],[B*.48,-B*.08],[B*.4,B*.2],[B*.05,B*.34],[-B*.3,B*.24]],true,1);
  c.fillStyle=col.base;c.fill(body);
  c.save();c.clip(body);fill(c,col.belly,p=>ell(p,B*.16,B*.3,B*.46,B*.3,-.15));
  if(s.pattern==='spots'){const R=rng(s.seed||5);c.fillStyle=col.mark;for(let i=0;i<22;i++){c.beginPath();c.ellipse(lerp(-B*.4,B*.4,R()),lerp(-B*.25,B*.3,R()),B*.035,B*.022,.5,0,TAU);c.fill()}}
  c.restore();
  if(fly<=.5){fill(c,col.wing,p=>smooth(p,[[B*.22,-B*.16],[B*.02,-B*.26],[-B*.36,-B*.14],[-B*.62-s.tail*.4,B*.08],[-B*.3,B*.14],[B*.02,B*.1]],true,1));
    c.strokeStyle=col.shade;c.lineWidth=B*.014;c.lineCap='round';for(let i=0;i<3;i++){c.beginPath();c.moveTo(-B*(.1+.12*i),-B*.04);c.quadraticCurveTo(-B*(.25+.12*i),B*.04,-B*(.36+.1*i),B*.07);c.stroke()}}
  c.restore();
  // neck + head
  const nA=lerp(s.neckUp,.3,fly),N=s.neck;const bx=cx+Math.cos(tilt)*B*.36,by=cy-Math.sin(tilt)*B*.36-B*.04;
  const hx=bx+Math.cos(nA)*N+B*.02,hy=by-Math.sin(nA)*N-B*.04+(1-fly)*mv*Math.sin(ph*TAU*2)*B*.02,hr=s.head;
  if(N>B*.12)fill(c,col.neck||col.base,p=>tube(p,[[bx-B*.06,by+B*.1],[(bx+hx)/2,(by+hy)/2],[hx-hr*.1,hy+hr*.3]],s.thinNeck?[B*.17,hr*1.05,hr*.95]:[B*.3,lerp(B*.22,hr,.6),hr*1.1]));

    else{p.moveTo(hx+hr*.78,hy-hr*.22);p.lineTo(hx+hr*.9+bl,hy+hr*.08);p.lineTo(hx+hr*.74,hy+hr*.34)}p.closePath()});
  eye(c,hx+hr*.34,hy-hr*.12,hr*(s.bigEye?.3:.2),{blink:po.blink,ring:s.bigEye?col.eyeRing:null});

/* ================= FISH: mackerel, trout, pike, shark ================= */
function drawFish(c,s,po){
  po=po||{};const col=s.col,t=po.t||0,ph=po.phase!=null?po.phase:t*1.2;
  const L=s.L,D=s.D;const wag=Math.sin(ph*TAU);
  c.save();c.rotate(wag*.035);
  const sp=[],w=[];const prof=[.1,.2,.42,.74,.95,1,.9,.7,.34];
  for(let i=0;i<9;i++){const u=i/8;const x=lerp(-L*.42,L*.46,u);sp.push([x,Math.sin(ph*TAU-u*2.4)*D*.07*(1-u)*(1-u)]);w.push(D*prof[i])}
  // tail fin
  const tx=sp[0][0],ty=sp[0][1];c.save();c.translate(tx+L*.03,ty);c.rotate(wag*.3);c.scale(.72+.28*Math.cos(ph*TAU*1),1);
  fill(c,col.fin,p=>{p.moveTo(0,0);p.quadraticCurveTo(-L*.1,-D*.2,-L*.2,-D*.52*s.tailFin);p.quadraticCurveTo(-L*.12,0,-L*.2,D*.52*s.tailFin);p.quadraticCurveTo(-L*.1,D*.2,0,0);p.closePath()});c.restore();
  // dorsal + anal fins
  fill(c,col.fin,p=>{p.moveTo(L*.12,-D*.42);p.quadraticCurveTo(L*.0,-D*(.5+.5*s.fin),-L*.12,-D*(.42+.42*s.fin));p.quadraticCurveTo(-L*.1,-D*.5,-L*.2,-D*.3);p.closePath();
    p.moveTo(-L*.08,D*.38);p.quadraticCurveTo(-L*.16,D*(.45+.3*s.fin),-L*.24,D*(.36+.2*s.fin));p.lineTo(-L*.24,D*.22);p.closePath()});
  const body=new Path2D();tube(body,sp,w);c.fillStyle=col.base;c.fill(body);
  c.save();c.clip(body);fill(c,col.belly,p=>ell(p,L*.04,D*.42,L*.6,D*.4));
  if(s.pattern==='counter')fill(c,col.shade,p=>ell(p,0,-D*.5,L*.6,D*.3));
  if(s.pattern==='stripes'){c.strokeStyle=col.mark;c.lineWidth=L*.022;c.lineCap='round';for(let i=0;i<9;i++){const x=lerp(-L*.3,L*.22,i/8);c.beginPath();c.moveTo(x,-D*.48);c.quadraticCurveTo(x+L*.03,-D*.25,x-L*.01,-D*.04);c.stroke()}}
  if(s.pattern==='spots'){const R=rng(s.seed||3);c.fillStyle=col.mark;for(let i=0;i<24;i++){c.beginPath();c.arc(lerp(-L*.34,L*.26,R()),lerp(-D*.4,D*.1,R()),D*.04,0,TAU);c.fill()}}
  c.restore();
  // gill, pectoral fin, eye
  c.strokeStyle=col.shade;c.lineWidth=L*.012;c.lineCap='round';c.beginPath();c.arc(L*.18,0,D*.36,-.9,.9);c.stroke();
  c.save();c.translate(L*.14,D*.14);c.rotate(.5+Math.sin(t*4)*.25);fill(c,col.fin,p=>leaf(p,0,0,L*.16*(.6+.6*s.fin),D*.14,2.6));c.restore();
  eye(c,L*.33,-D*.1,D*.1,{ring:'#f4f1e6'});
  c.restore();
}

/* ================= LIZARD: thorny devil, gecko, newt ================= */
function drawLizard(c,s,po){
  po=po||{};const col=s.col,t=po.t||0,mv=po.move||0,ph=po.phase||0;
  const L=s.L,D=s.D,h=s.leg*.55+D*.5;
  const sp=[],w=[];const prof=[.08,.2,.34,.52,.86,1,.98,.84,.66,.7,.5];
  for(let i=0;i<11;i++){const u=i/10;const x=lerp(-L*.78,L*.52,u);const wave=Math.sin(ph*TAU+u*5)*D*.1*mv*(u<.45?1.4:.6)+(u<.3?Math.sin(t*1.5+u*4)*D*.12*(.3-u)*3:0);
    sp.push([x,-h+wave+(u<.35?(.35-u)*D*1.1:0)+(u>.85?-(u-.85)*D*.8:0)]);w.push(D*prof[i])}
  const hipI=4,shI=8;const stride=s.leg*.9*mv,lift=s.leg*.3*mv;
  const legs=[{i:hipI,off:.5,far:1,hind:1},{i:shI,off:0,far:1,hind:0},{i:hipI,off:0,far:0,hind:1},{i:shI,off:.5,far:0,hind:0}];
  const drawLeg=g=>{const hxl=sp[g.i][0],hyl=sp[g.i][1]+D*.1;const[dx,dy]=step(ph,g.off,stride,lift);const fx=hxl+dx+(g.hind?-s.leg*.35:s.leg*.5),fy=dy;
    const k=ik(hxl,hyl,fx,fy,s.leg*.62,s.leg*.62,g.hind?-1:1);const tone=g.far?col.shade:col.base;
    fill(c,tone,p=>{seg(p,hxl,hyl,k[0],k[1],s.legW*1.5,s.legW);seg(p,k[0],k[1],fx,fy-s.legW*.3,s.legW,s.legW*.7)});
    c.strokeStyle=tone;c.lineWidth=s.legW*.45;c.lineCap='round';c.beginPath();for(let j=-1;j<=1;j++){c.moveTo(fx,fy-s.legW*.3);c.lineTo(fx+s.legW*1.5,fy-s.legW*(.3+.5*j+.5))}c.stroke()};
  legs.filter(g=>g.far).forEach(drawLeg);
  if(s.spiny){c.fillStyle=col.shade;for(let i=1;i<10;i++){const q=sp[i],r=w[i]*.5;c.beginPath();c.moveTo(q[0]-D*.14,q[1]-r*.8);c.lineTo(q[0]-D*.02,q[1]-r-D*.26);c.lineTo(q[0]+D*.12,q[1]-r*.8);c.closePath();c.fill()}}
  const body=new Path2D();tube(body,sp,w);c.fillStyle=col.base;c.fill(body);
  c.save();c.clip(body);c.fillStyle=col.belly;c.beginPath();const bl=sp.map((q,i)=>[q[0],q[1]+w[i]*.34]);c.moveTo(bl[0][0],bl[0][1]);bl.forEach(q=>c.lineTo(q[0],q[1]));c.lineTo(L,10);c.lineTo(-L,10);c.closePath();c.fill();
  if(s.pattern==='spots'){const R=rng(s.seed||9);c.fillStyle=col.mark;for(let i=0;i<30;i++){const k=1+Math.floor(R()*9),q=sp[k];c.beginPath();c.arc(q[0]+(R()-.5)*L*.12,q[1]-w[k]*.3*R(),D*.07,0,TAU);c.fill()}}
  if(s.pattern==='stripes'){c.strokeStyle=col.mark;c.lineWidth=D*.14;for(let i=1;i<10;i++){const q=sp[i];c.beginPath();c.moveTo(q[0],q[1]-w[i]);c.lineTo(q[0]-D*.1,q[1]+w[i]*.2);c.stroke()}}
  c.restore();
  if(s.shell){const a=sp[3],b=sp[8],mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,rx=(b[0]-a[0])*.6,ry=D*1.15;fill(c,col.shade,p=>{p.moveTo(mx-rx,my+D*.2);p.bezierCurveTo(mx-rx,my-ry*1.25,mx+rx,my-ry*1.25,mx+rx,my+D*.2);p.closePath()});
    c.save();c.strokeStyle=col.mark;c.globalAlpha=.5;c.lineWidth=D*.06;for(let i=-2;i<=2;i++){c.beginPath();c.moveTo(mx+i*rx*.3,my+D*.15);c.quadraticCurveTo(mx+i*rx*.36,my-ry*.4,mx+i*rx*.22,my-ry*.82);c.stroke()}c.beginPath();c.moveTo(mx-rx*.8,my-ry*.35);c.quadraticCurveTo(mx,my-ry*.62,mx+rx*.8,my-ry*.35);c.stroke();c.restore()}
  legs.filter(g=>!g.far).forEach(drawLeg);
  const hq=sp[10],hp=sp[9];
  eye(c,hp[0]+D*.12,hp[1]-D*.16,D*.11,{blink:po.blink,ring:col.eyeRing});
  c.strokeStyle=col.shade;c.lineWidth=D*.035;c.lineCap='round';c.beginPath();c.moveTo(hq[0]+D*.22,hq[1]+D*.04);c.quadraticCurveTo(hq[0],hq[1]+D*.12,hp[0]+D*.05,hp[1]+D*.1);c.stroke();
  if(po.tongue){const tx=hq[0]+D*.25,ty=hq[1]+D*.05;c.strokeStyle='#d6455b';c.lineWidth=D*.04;c.beginPath();c.moveTo(tx,ty);c.lineTo(tx+D*.5,ty+D*.02);c.lineTo(tx+D*.7,ty-D*.1);c.moveTo(tx+D*.5,ty+D*.02);c.lineTo(tx+D*.7,ty+D*.13);c.stroke()}
}

/* ================= INSECT: locust, beetle, ant ================= */
function drawInsect(c,s,po){
  po=po||{};const col=s.col,t=po.t||0,mv=po.move||0,ph=po.phase||0;
  const L=s.L,D=s.D,h=s.leg*.5+D*.5;const bob=mv*Math.sin(ph*TAU*2)*D*.04;
  const thx=L*.12,thy=-h+bob;
  const legs=[];for(let i=0;i<3;i++)for(let far=1;far>=0;far--)legs.push({i,far,off:((i+far)%2)*.5});
  const drawLeg=g=>{const hxl=thx+(1-g.i)*L*.09,hyl=thy+D*.25;const big=g.i===2&&s.jump;const reach=[L*.22,L*.03,-L*.3][g.i]+(g.far?L*.04:0);

<script>

<script>
/* Adapt Lab art prototype: SNAKE body plan (legless reptile or amphibian).
   Chosen when: scales or moist skin, no legs, no fins.
   Silhouette notes: one long tapering tube, S-curves on the ground, raised head on a curved neck,
   wedge head a little wider than the neck, forked tongue. Rattlesnakes add a segmented rattle on a raised tail tip.
   Local units: faces right, belly on y = 0, about 170 long. The sideways slither is drawn as seen from slightly above,
   so the body weaves a little toward and away from the viewer on the ground. */
(function(){
"use strict";
const R=window.Rig,{lerp,clamp,TAU,fill,ell,tube,mix}=R;
const sst=x=>{x=clamp(x,0,1);return x*x*(3-2*x)};

  let k;

  else if(u<.9)k=lerp(1,.7,sst((u-.74)/.16));
  else if(u<.965)k=lerp(.7,1.02,sst((u-.9)/.065));
  else k=lerp(1.02,.62,sst((u-.965)/.035));

  const raise=s.raise*lerp(1,.5,mv)*(po.strike?.35:1);

<script>
/* Adapt Lab art prototype: SEA MAMMAL body plan (seal, sea lion, otter).
   Chosen when: fur and fins or flippers.
   Silhouette notes: one smooth torpedo with no neck, round head with a short whiskered muzzle and big dark eyes,
   paddle fore flipper low on the chest, two hind flippers fanned at the tail. Thick with blubber when fat is high.
   Otters (long tail trait) are thinner, with a thick tapering tail and small paws.
   Two poses. Swimming (default): origin at the body centre, body undulates, flippers paddle.
   Hauled out (pose.land = true): belly on y = 0, chest and head raised. */
(function(){

    for(let i=0;i<n;i++){const x=Rf()*w,hh=h*(.05+.1*Rf())*(1-.4*S.snow)*(1-.4*S.fire),sw=Math.sin(t*1.1+i)*h*.006;c.beginPath();c.moveTo(x-h*.006,h);c.quadraticCurveTo(x+sw,h-hh*.6,x+sw*2+h*.01,h-hh);c.quadraticCurveTo(x+sw+h*.004,h-hh*.5,x+h*.008,h);c.closePath();c.fill()}
    if(S.trees){const la=clamp(S.leafAmt,0,1),lc=mix(mix(S.leaf,'#1f3a22',.4),'#10183a',S.night*.6),Rt=rng(12);
      c.strokeStyle=mix('#4a3626','#10183a',S.night*.6);c.lineCap='round';for(let i=0;i<7;i++){const x=(i+.5)/7*w+Rt()*40*k;c.lineWidth=(5+Rt()*4)*k;c.beginPath();c.moveTo(x,-10);c.quadraticCurveTo(x+30*k,20*k,x+(Rt()-.5)*120*k,(40+Rt()*30)*k);c.stroke()}

  else{const col=mix(mix(S.floor[1],'#22323a',.6),'#0a1230',S.night*.5);fill(c,col,p=>{smooth(p,[[-20,h+10],[-10,h*.9],[w*.06,h*.86],[w*.13,h*.93],[w*.16,h+10]],true);smooth(p,[[w*.84,h+10],[w*.88,h*.92],[w*.95,h*.87],[w+10,h*.9],[w+20,h+10]],true)})}
  if(S.ash>0){c.globalAlpha=S.ash*.22;c.fillStyle='#55504c';c.fillRect(0,0,w,h);c.globalAlpha=1}

}
const info=id=>({id,name:B[id].name,seasons:B[id].seasons,harsh:B[id].harsh,water:!!B[id].water,surface:B[id].surface||0});
window.Biomes={ids,info,state,draw,deco,front,yOf,scOf,horizon:hzOf};
})();

<script>
/* Adapt Lab designer prototype: one screen where a student changes their species.

(function(){
"use strict";

const strip=h=>String(h).replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();

/* ---------- fallbacks with the agreed interface ---------- */
const PLAN_KEYS=['cov','blood','breathe','legs','wings'];
const FB_CAT={shape:3,fins:3,defence:3,fatWhere:2,posture:2,pattern:1,color:1,diet:1,activity:1,season:1,social:1,escape:1,store:1,care:1,senses:1};
const FB_NUM=['size','insul','fat','ears','legLen','tail','wingSize','finSize','eyes','waterSave','salt'];
const WORD={cov:'Body covering',blood:'Body heat',breathe:'Breathing',legs:'Legs',wings:'Wings',shape:'Body shape',fins:'Fins',defence:'Defence',fatWhere:'Fat store',posture:'Leg posture',pattern:'Pattern',color:'Colour',diet:'Diet',activity:'Active at',season:'Harsh season',social:'Lives',escape:'When hunted',store:'Food storing',care:'Parental care',senses:'Finds food by',
  size:'Body size',insul:'Coat thickness',fat:'Amount of fat',ears:'Ear size',legLen:'Leg length',tail:'Tail length',wingSize:'Wing size',finSize:'Fin size',eyes:'Eye size',waterSave:'Saving water',salt:'Coping with salt'};
const CostFB={BUDGET_PER_ERA:10,
  cost(a,b){const items=[];let total=0;const add=(key,points,why)=>{if(points>0){items.push({key,label:WORD[key]||key,from:a[key],to:b[key],points,why});total+=points}};
    PLAN_KEYS.forEach(k=>{if(a[k]!==b[k])add(k,8,'a new body design')});

  optionCost(t,k,v){return this.cost(t,{...t,[k]:v}).total}};
const CombosFB={
  find(t,bk){const B=M.BIOMES[bk]||{},out=[];const add=(id,good,a,b,text,pressure)=>out.push({id,good,a,b,text,pressure,inModel:true});

    if(t.escape==='hide'&&t.size<=30)add('hide-small',true,'Hides away','Small body','Small animals fit into burrows and cracks.','pred');
    if(t.escape==='hide'&&t.size>=75)add('hide-huge',false,'Hides away','Huge body','Nowhere is big enough to hide.','pred');
    if(t.season==='hibernate'&&t.fatWhere!=='none'&&t.fat>=50)add('hib-fat',true,'Hibernates','Fat store','Fat is the fuel for a long sleep.','food');
    if(t.defence==='poison'&&(t.color==='orange'||t.pattern==='stripes'||t.pattern==='spots'))add('poison-warn',true,'Poison','Bold colours','Predators learn the warning.','pred');
    if((t.cov==='fur'||t.cov==='feathers')&&t.insul>=70&&t.ears<=30&&B.cold)add('coat-ears',true,'Thick coat','Small ears','Less surface for heat to escape.','temp');
    if(t.shape==='stream'&&t.fins==='fins')add('stream-fins',true,'Streamlined','Fins','A smooth shape and paddles work together.','food');
    return out},
  apply(sc){return sc}};
const Cost=(window.AdaptCost&&typeof window.AdaptCost.cost==='function')?window.AdaptCost:CostFB;
const Combos=(window.AdaptCombos&&typeof window.AdaptCombos.find==='function')?window.AdaptCombos:CombosFB;

const safe=(fn,fb)=>{try{return fn()}catch(e){if(!safe.warned){safe.warned=1;console.warn('designer fallback:',e.message)}return fb()}};
const costOf=(a,b)=>safe(()=>{const r=Cost.cost(a,b);if(!r||!isFinite(r.total))throw new Error('no price');return r},()=>CostFB.cost(a,b));
const combosOf=(t,bk)=>safe(()=>Combos.find(t,bk)||[],()=>CombosFB.find(t,bk));

/* ---------- ancestors: small plain designs that only just survive (50–65% a year), found by a search over the model ---------- */

  forest:{name:'Forest ancestor',t:{diet:'both',size:25,insul:45,legLen:40,tail:45}},
  grassland:{name:'Grassland ancestor',t:{season:'hibernate',insul:20,legLen:55,tail:40}},
  ocean:{name:'Ocean ancestor',t:{cov:'scales',blood:'cold',breathe:'gills',shape:'stream',legs:'0',fins:'fins',color:'grey',diet:'both',care:'none',size:20,tail:0,finSize:45,salt:80}},
  freshwater:{name:'River ancestor',t:{cov:'scales',blood:'cold',breathe:'gills',shape:'stream',legs:'0',fins:'fins',color:'sandy',diet:'both',escape:'freeze',care:'none',size:20,insul:50,tail:0,finSize:45}}
};
const BIOME_IDS=['tundra','desert','forest','grassland','ocean','freshwater'];

/* ---------- trait groups: the sim's own sections, plus the fine-tune sliders the old app hid under Advanced ---------- */
const EXTRA_NUM={Moving:[{k:'tail',label:'Tail length',show:()=>true},{k:'wingSize',label:'Wing size',show:t=>t.wings!=='none'},{k:'finSize',label:'Fin size',show:t=>t.fins==='fins'}],
  'Keeping warm, cool and wet':[{k:'fat',label:'Amount of fat',show:t=>t.fatWhere!=='none'}],'Looks & defence':[{k:'eyes',label:'Eye size',show:()=>true}]};
const ENDS={};M.A_SLIDERS.forEach(s=>ENDS[s.k]=s.ends);
const ICON={
  Body:'<ellipse cx="11" cy="14" rx="8" ry="5.5"/><circle cx="18.5" cy="8" r="3"/>',
  Moving:'<path d="M6 20l3-7 4 2 2-6 4 1"/><circle cx="16" cy="5" r="2"/>',
  'Keeping warm, cool and wet':'<path d="M12 3v10"/><circle cx="12" cy="17" r="4"/>',
  'Looks & defence':'<path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/>',
  Behaviour:'<path d="M12 3a7 7 0 0 0-4 12.7V18h8v-2.3A7 7 0 0 0 12 3z"/><path d="M9 21.5h6"/>'};
const SHORT={Body:'Body',Moving:'Moving','Keeping warm, cool and wet':'Warm, cool, wet','Looks & defence':'Looks, defence',Behaviour:'Behaviour'};
const GROUPS=M.A_SECTIONS.map(sec=>({title:sec.title,beh:!!sec.beh,rows:sec.rows.map(r=>({k:r.k,num:!!r.num,opts:r.opts,label:r.label,show:r.show||(()=>true)}))
  .concat((EXTRA_NUM[sec.title]||[]).map(x=>({k:x.k,num:true,label:x.label,show:x.show})))}));
const PRESS=[
  {k:'temp',name:'Body temperature',icon:'<path d="M12 3v10"/><circle cx="12" cy="17" r="4"/>',about:'Too hot or too cold for too long and it cannot live.'},
  {k:'breath',name:'Breathing',icon:'<path d="M3 9h10a3 3 0 1 0-3-3"/><path d="M3 14h14a3 3 0 1 1-3 3"/>',about:'It must get oxygen from the air or the water around it.'},
  {k:'pred',name:'Predators',icon:'<path d="M3 7l3 6 3-5 3 5 3-5 3 5 3-6"/><path d="M4 18h16"/>',about:'Hunters catch the animals that are easiest to find and catch.'},
  {k:'food',name:'Food & energy',icon:'<path d="M5 19c0-9 5-14 14-14 0 9-5 14-14 14z"/><path d="M5 19l8-8"/>',about:'It must find more energy than its body uses. Every adaptation costs energy.'},
  {k:'water',name:'Water & salt',icon:'<path d="M12 3c4 5 6 8 6 11a6 6 0 0 1-12 0c0-3 2-6 6-11z"/>',about:'It must not dry out, and its body must cope with the salt around it.'}];

/* ---------- state ---------- */
const S={biome:'forest',anc:null,t:null,name:'',tab:0,prev:null,moveUntil:0,rowsSig:''};
function loadBiome(bk){S.biome=bk;S.anc={...M.DEF_A,...ANC[bk].t};S.t={...S.anc};S.name=ANC[bk].name;$('spName').value=S.name;S.prev=null;S.rowsSig='';render(true)}

/* ---------- the model: five yearly survival chances and the overall chance ---------- */
function assess(t,bk){
  const o={kind:'animal',t};let sc=M.scoresFor(o,bk);
  sc=safe(()=>Combos.apply(sc,t,M.BIOMES[bk])||sc,()=>sc);
  const D={temp:1,breath:1,pred:1,food:1,water:1};
  for(let s=0;s<4;s++){const hz=M.seasonHaz(sc,bk,o,s,false);for(const hk in hz){const k=(hk==='cold'||hk==='heat')?'temp':hk;if(k in D)D[k]*=hz[hk]>=1?0:1-Math.min(.95,hz[hk])}}
  const lethal=M.lethalOf(sc,bk,o);const year=lethal?0:M.yearSurvival(sc,bk,o);
  const bars={};for(const k in D)bars[k]=Math.round(D[k]*100);
  return{sc,bars,year:Math.round(year*100),lethal};
}
function threatText(a,bk){const B=M.BIOMES[bk];
  if(a.lethal)return'It cannot live here: '+a.lethal.why+'.';
  const worst=PRESS.reduce((m,p)=>a.bars[p.k]<a.bars[m.k]?p:m,PRESS[0]);const harsh=B.seasons[B.hs].toLowerCase();
  const cold=(a.sc.ts||[]).some(x=>x.dir<0&&x.s<90);
  return{temp:cold?`It gets too cold in the ${harsh}.`:`It gets too hot in the ${harsh}.`,breath:'It struggles to get enough oxygen.',pred:`Predators catch it too easily: ${B.preds.toLowerCase()}.`,
    food:`It cannot find enough food, most of all in the ${harsh}.`,water:B.aquatic?'The salt in the water is wrong for its body.':'It loses water faster than it can drink.'}[worst.k];
}

/* ---------- rendering ---------- */
function sizeWord(v){return v<12?'tiny, like a beetle':v<30?'small, like a mouse':v<50?'like a rabbit':v<65?'like a fox':v<80?'like a deer':'huge, like an elephant'}
function renderBiomes(){$('biomes').innerHTML=BIOME_IDS.map(b=>`<button type="button" data-b="${b}" aria-pressed="${b===S.biome}"><i style="background:${M.BIOMES[b].dot}"></i>${esc(M.BIOMES[b].name)}</button>`).join('')}
function renderTabs(cost){
  const per=GROUPS.map(g=>cost.items.filter(it=>g.rows.some(r=>r.k===it.key)).length);
  $('tabs').innerHTML=GROUPS.map((g,i)=>`<button type="button" role="tab" class="${g.beh?'beh':''}" data-tab="${i}" aria-selected="${i===S.tab}"><svg viewBox="0 0 24 24">${ICON[g.title]||ICON.Body}</svg>${esc(SHORT[g.title]||g.title)}${per[i]?`<span class="dot">${per[i]}</span>`:''}</button>`).join('')
    +'<div class="kind"><b style="background:var(--accent)">P</b>body<br><b style="background:var(--beh)">B</b>behaviour</div>';
}
function priceFor(k,v,total){const d=costOf(S.anc,{...S.t,[k]:v}).total-total;return d}
function priceHtml(d,total,isCur,isStart){
  if(isCur)return`<span class="price">${isStart?'start':'chosen'}</span>`;
  if(d===0)return'<span class="price free">free</span>';
  if(d<0)return`<span class="price back">${d} back</span>`;
  return`<span class="price${total+d>BUDGET?' over':''}">+${d}</span>`}
function renderOpts(cost,force){
  const g=GROUPS[S.tab],B=M.BIOMES[S.biome],rows=g.rows.filter(r=>r.show(S.t,B));
  const sig=S.tab+'|'+S.biome+'|'+rows.map(r=>r.k).join(',');
  const host=$('opts');
  if(force||sig!==S.rowsSig){S.rowsSig=sig;const st=host.scrollTop;
    host.className='opts'+(g.beh?' beh':'');
    host.innerHTML=`<h2>${esc(g.title)} <em class="${g.beh?'beh':''}">${g.beh?'Behaviours':'Body features'}</em></h2>`+rows.map(r=>{
      const lab=typeof r.label==='function'?r.label():esc(r.label);
      if(r.num){const e=ENDS[r.k]||['Less','More'];
        return`<div class="row" data-row="${r.k}"><div class="lbl">${lab}</div><div class="slide"><input type="range" min="0" max="100" step="5" data-k="${r.k}" aria-label="${esc(strip(lab))}"><input type="number" min="0" max="100" step="5" data-k="${r.k}" aria-label="${esc(strip(lab))} as a number"><span class="price" data-p="${r.k}"></span><div class="ends"><span>${esc(e[0])}</span><span>${esc(e[1])}</span></div></div></div>`}
      const sw=r.k==='color';
      return`<div class="row" data-row="${r.k}"><div class="lbl">${lab}</div><div class="chips">${r.opts.map(([v,l])=>`<button type="button" class="chip${sw?' sw':''}" data-k="${r.k}" data-v="${esc(v)}">${sw?`<i style="background:${(R.PAL[v]||{}).b||'#888'}"></i>`:''}<span>${esc(l)}</span><span class="pw"></span></button>`).join('')}</div></div>`}).join('');
    host.scrollTop=st}
  // refresh pressed states and prices in place (no rebuild, so nothing jumps while a slider is dragged)
  host.querySelectorAll('.chip').forEach(b=>{const k=b.dataset.k,v=b.dataset.v,cur=String(S.t[k])===v;b.setAttribute('aria-pressed',cur);
    b.querySelector('.pw').innerHTML=priceHtml(cur?0:priceFor(k,v,cost.total),cost.total,cur,String(S.anc[k])===v)});
  host.querySelectorAll('input[data-k]').forEach(inp=>{if(document.activeElement!==inp||inp.type==='range')inp.value=S.t[inp.dataset.k]});
  host.querySelectorAll('[data-p]').forEach(p=>{const it=cost.items.find(x=>x.key===p.dataset.p);p.textContent=it?'+'+it.points:'free';p.className='price'+(it?'':' free')});
}
function renderVitals(a,anc){
  const cls=v=>v>=70?'good':v>=45?'ok':'bad';const d=a.year-anc.year;
  $('headline').innerHTML=`<div class="pct ${cls(a.year)}">${a.year}<small>%</small></div><div class="cap">Chance of surviving a year</div>`+
    `<div class="cmp">Your ancestor: ${anc.year}% ${d?`· <b class="${d>0?'up':'down'}">${d>0?'up':'down'} ${Math.abs(d)}</b>`:''}</div><div class="threat"><span>Biggest threat</span>${esc(threatText(a,S.biome))}</div>`;
  const worst=PRESS.reduce((m,p)=>a.bars[p.k]<a.bars[m.k]?p:m,PRESS[0]).k;
  if(!$('bars').children.length){$('bars').innerHTML=PRESS.map(p=>`<button type="button" class="bar" data-bar="${p.k}"><svg viewBox="0 0 24 24">${p.icon}</svg><span class="nm"><span>${p.name}</span><em></em></span><span class="num"></span><span class="track"><span class="fill"></span><span class="ghost"></span></span></button>`).join('')+'<div class="legend"><i></i>The line shows your ancestor</div>'}
  PRESS.forEach(p=>{const el=$('bars').querySelector(`[data-bar="${p.k}"]`),v=a.bars[p.k];el.className='bar '+cls(v)+(p.k===worst&&v<70?' worst':'');
    el.querySelector('.fill').style.width=v+'%';el.querySelector('.ghost').style.left=`calc(${anc.bars[p.k]}% - 1px)`;el.querySelector('.num').textContent=v;
    if(S.prev&&S.prev.bars[p.k]!==v){const dd=v-S.prev.bars[p.k],em=el.querySelector('em');em.textContent=(dd>0?'+':'−')+Math.abs(dd);em.className='show '+(dd>0?'up':'down');clearTimeout(em._t);em._t=setTimeout(()=>em.classList.remove('show'),1900)}});
  $('mini').innerHTML=`<div class="p ${cls(a.year)}">${a.year}%</div>`+PRESS.map(p=>`<div class="m ${cls(a.bars[p.k])}">${p.name.split(' ')[0]}<i><u style="width:${a.bars[p.k]}%"></u></i></div>`).join('');
}
function renderCombos(list){
  const good=list.filter(c=>c.good),bad=list.filter(c=>!c.good);
  const card=c=>`<div class="combo ${c.good?'good':'bad'}"><b>${esc(c.a)} + ${esc(c.b)}</b>${esc(c.text)}</div>`;
  $('combos').innerHTML=(good.length?`<h3>Works well together</h3>${good.map(card).join('')}`:'')+(bad.length?`<h3>Clashes</h3>${bad.map(card).join('')}`:'')+
    (!list.length?'<h3>Traits that work together</h3><div class="combo none">None yet. Try pairing a behaviour with a body feature that helps it, like night activity and big eyes.</div>':'');
}
function valWord(k,v){for(const g of GROUPS)for(const r of g.rows)if(r.k===k&&r.opts&&!r.num){const o=r.opts.find(x=>String(x[0])===String(v));if(o)return o[1]}return String(v)}
function renderDock(cost){
  const over=cost.total>BUDGET;$('meter').className='meter'+(over?' over':'');
  $('meter').innerHTML=`<div class="txt">This era: <b>${cost.total}</b> of ${BUDGET} points${over?' · too many':''}</div><div class="pips">${Array.from({length:BUDGET},(_,i)=>`<i class="${i<cost.total?(over?'over':'on'):''}"></i>`).join('')}</div>`;
  $('changes').innerHTML=cost.items.length?cost.items.map(it=>`<button type="button" class="chg" data-undo="${it.key}">${esc(it.label||WORD[it.key]||it.key)} <small>${esc(valWord(it.key,it.from))} → ${esc(valWord(it.key,it.to))}</small><b>${it.points}</b><u>Undo</u></button>`).join(''):'<span class="none">No changes yet. Each change costs evolution points: small steps are cheap, new body designs cost a lot.</span>';
  $('release').setAttribute('aria-disabled',over);$('era').textContent=`Era 1 · ${Math.max(0,BUDGET-cost.total)} points left`;
}
function renderTags(){
  $('sizeTag').textContent='Size: '+sizeWord(S.t.size);
  const cl=M.classify(S.t);$('likeTag').innerHTML=cl?`Most like a <b>${esc(cl.g.n)}</b>`:'';
  const ch=M.realChecks(S.t);$('checkTag').hidden=!ch.length;$('checkTag').textContent=ch.length?`⚠ ${ch.length} real-world check${ch.length>1?'s':''}`:'';
}
let ANC_A=null,CUR=null;
function render(full){
  const cost=costOf(S.anc,S.t);const a=assess(S.t,S.biome);if(full||!ANC_A)ANC_A=assess(S.anc,S.biome);CUR=a;
  if(full)renderBiomes();
  renderTabs(cost);renderOpts(cost,full);renderVitals(a,ANC_A);renderCombos(combosOf(S.t,S.biome));renderDock(cost);renderTags();
  S.prev=a;SPEC=null;
}
function setTrait(k,v){if(S.t[k]===v)return;S.t={...S.t,[k]:v};S.moveUntil=performance.now()+1500;$('stageHint').classList.add('gone');render(false)}

/* ---------- events ---------- */
$('biomes').addEventListener('click',e=>{const b=e.target.closest('[data-b]');if(b&&b.dataset.b!==S.biome)loadBiome(b.dataset.b)});

  const c=e.target.closest('.chip');if(!c)return;const k=c.dataset.k;const cur=S.anc[k];setTrait(k,typeof cur==='number'?+c.dataset.v:c.dataset.v)});
$('opts').addEventListener('input',e=>{const inp=e.target.closest('input[data-k]');if(!inp||inp.type!=='range')return;setTrait(inp.dataset.k,+inp.value)});
$('opts').addEventListener('change',e=>{const inp=e.target.closest('input[data-k]');if(!inp||inp.type!=='number')return;const v=clamp(Math.round(+inp.value||0),0,100);inp.value=v;setTrait(inp.dataset.k,v)});
$('opts').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input[type=number]'))e.target.blur()});
$('changes').addEventListener('click',e=>{const b=e.target.closest('[data-undo]');if(b)setTrait(b.dataset.undo,S.anc[b.dataset.undo])});
$('reset').addEventListener('click',()=>{S.t={...S.anc};S.moveUntil=performance.now()+900;render(false)});
$('bars').addEventListener('click',e=>{const b=e.target.closest('[data-bar]');if(!b)return;const p=PRESS.find(x=>x.k===b.dataset.bar);
  pop(b,`<b>${p.name}: ${CUR.bars[p.k]} out of 100</b>${p.about} The number is its chance of getting through a whole year of this one pressure. Your ancestor scored ${ANC_A.bars[p.k]}.`)});
$('checkTag').addEventListener('click',e=>{pop(e.currentTarget,'<b>Real-world check</b><ul>'+M.realChecks(S.t).map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>')});
$('likeTag').addEventListener('click',e=>{const cl=M.classify(S.t);if(cl)pop(e.currentTarget,`<b>Most like a ${esc(cl.g.n)}</b>`+cl.r.map(([l,ok])=>`${ok?'✓':'✗'} ${esc(l)}`).join(' · '))});
$('sizeTag').addEventListener('click',e=>pop(e.currentTarget,'<b>Body size</b>Big bodies keep heat in and scare off small hunters, but they need more food.'));
$('spName').addEventListener('input',e=>{S.name=e.target.value});
$('release').addEventListener('click',()=>{const cost=costOf(S.anc,S.t);
  if(cost.total>BUDGET){$('meter').classList.remove('shake');void $('meter').offsetWidth;$('meter').classList.add('shake');pop($('meter'),`<b>Too many changes</b>You have ${BUDGET} points this era. Undo ${cost.total-BUDGET} point${cost.total-BUDGET>1?'s':''} of changes.`);return}
  $('mwin').innerHTML=`<h2>${esc(S.name||'Your species')} is ready</h2><p>Over thousands of years, these changes spread through the population. Next, the living scene shows what happens.</p>`+
    `<div class="sum"><div><b>${CUR.year}%</b>chance of surviving a year</div><div><b>${ANC_A.year}%</b>your ancestor</div><div><b>${cost.total} of ${BUDGET}</b>points spent</div><div><b>${combosOf(S.t,S.biome).filter(c=>c.good).length}</b>traits working together</div></div>`+
    `<button type="button" class="btn" id="mBack">Back to the designer</button>`;$('modal').hidden=false;$('mBack').focus();$('mBack').onclick=()=>{$('modal').hidden=true}});
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').hidden=true});
function pop(anchor,html){const p=$('pop');p.innerHTML=html;p.hidden=false;const r=anchor.getBoundingClientRect(),w=Math.min(300,innerWidth-16);p.style.maxWidth=w+'px';
  const ph=p.offsetHeight,pw=p.offsetWidth;let x=clamp(r.left+r.width/2-pw/2,8,innerWidth-pw-8),y=r.bottom+8;if(y+ph>innerHeight-8)y=Math.max(8,r.top-ph-8);p.style.left=x+'px';p.style.top=y+'px';pop.at=performance.now()}
document.addEventListener('click',()=>{if(performance.now()-(pop.at||0)>60)$('pop').hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('pop').hidden=true;$('modal').hidden=true}});

/* ---------- the stage: the animal, alive, in its biome ---------- */
const cv=$('stage'),cx=cv.getContext('2d');let SPEC=null,W=0,H=0,phase=0,mv=0,last=0,biomeOK=!!(window.Biomes&&typeof window.Biomes.draw==='function');
const SKY={tundra:['#8fb6d8','#dcebf2','#f1f5f7','#e2ebf1'],desert:['#f0b46a','#f9dfae','#e8c583','#d8a95e'],forest:['#9fc7d6','#dcebdd','#7fa35b','#56793f'],grassland:['#f2b56a','#fbeccb','#e6c877','#d2a955'],ocean:['#1f6f9c','#57b3c9','#d9c9a0','#cbb88a'],freshwater:['#3f8f8a','#8ec9b6','#b9a779','#a08f62']};
function ownBackdrop(c,w,h,bk,t){const K=SKY[bk],aq=!!M.BIOMES[bk].aquatic,hz=aq?h*.86:h*.6;
  let g=c.createLinearGradient(0,0,0,hz);g.addColorStop(0,K[0]);g.addColorStop(1,K[1]);c.fillStyle=g;c.fillRect(0,0,w,h);
  if(aq){c.save();c.globalAlpha=.08;c.fillStyle='#fff';for(let i=0;i<5;i++){const x=w*(.1+i*.2)+Math.sin(t*.3+i)*w*.02;c.beginPath();c.moveTo(x,0);c.lineTo(x+w*.08,0);c.lineTo(x-w*.06,h);c.lineTo(x-w*.18,h);c.closePath();c.fill()}c.restore()}
  else{const sx=w*.78,sy=hz*.34,sg=c.createRadialGradient(sx,sy,0,sx,sy,h*.4);sg.addColorStop(0,'rgba(255,250,225,.8)');sg.addColorStop(1,'rgba(255,250,225,0)');c.fillStyle=sg;c.fillRect(0,0,w,hz);c.fillStyle='#fff6dc';c.beginPath();c.arc(sx,sy,h*.045,0,7);c.fill();
    [[.11,1.3,.55],[.07,4.1,.3],[.035,7.7,.12]].forEach(([amp,seed,mixT],i)=>{c.fillStyle=R.mix(K[1],K[2],.25+i*.3);c.beginPath();c.moveTo(0,h);for(let x=0;x<=w;x+=10){const u=x/w*6+seed;c.lineTo(x,hz-h*amp*(.5+.3*Math.sin(u)+.25*Math.sin(u*2.3+1))+i*h*.02)}c.lineTo(w,h);c.closePath();c.fill()})}
  g=c.createLinearGradient(0,hz,0,h);g.addColorStop(0,K[2]);g.addColorStop(1,K[3]);c.fillStyle=g;c.fillRect(0,hz+(aq?0:h*.03),w,h)}
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;const t=ts/1000;
  const dpr=Math.min(2,window.devicePixelRatio||1),w=cv.clientWidth,h=cv.clientHeight;
  if(w&&h){if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}cx.setTransform(dpr,0,0,dpr,0,0);W=w;H=h;
    const B=M.BIOMES[S.biome],aq=!!B.aquatic;
    let drawn=false;if(biomeOK){try{cx.save();window.Biomes.draw(cx,w,h,{biome:S.biome,season:1,night:0,t});cx.restore();drawn=true}catch(e){cx.restore();biomeOK=false;console.warn('Biomes.draw failed, using the simple backdrop:',e.message)}}
    if(!drawn)ownBackdrop(cx,w,h,S.biome,t);
    if(!SPEC)SPEC=safe(()=>R.specOf(S.t,7),()=>R.specOf({...M.DEF_A},7));
    const z=safe(()=>R.sizeOf(SPEC),()=>({len:120,height:100}));const swims=!!z.swims;
    const want=ts<S.moveUntil?1:0;mv=lerp(mv,want,.08);phase+=dt*(.5+.9*mv)*(swims?1:mv>0.02?1:0);
    const grow=lerp(.62,1.12,S.t.size/100);const sc=Math.min(w*.5/z.len,h*.5/z.height)*grow;
    const gx=w*.5+(z.dx||0)*sc,gy=swims&&aq?h*.52+Math.sin(t*.9)*h*.012:h*(aq?.84:.8);
    cx.save();cx.translate(gx,gy);if(!(swims&&aq))R.shadow(cx,sc*z.len*.5,.26);cx.scale(sc,sc);
    try{R.draw(cx,SPEC,{t,phase,move:swims?1:mv,blink:(t%4.3)<.12,tongue:SPEC.tongue&&(t%3)<.3,swim:aq})}catch(e){if(!frame.warned){frame.warned=1;console.warn('draw failed:',e.message)}}
    cx.restore()}
  requestAnimationFrame(frame);
}
window.__designer={S,assess,costOf,combosOf,setTrait,loadBiome,GROUPS,usingCost:Cost!==CostFB,usingCombos:Combos!==CombosFB};
loadBiome('forest');requestAnimationFrame(frame);
})();

</script>
