<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acceleration Lab</title>
<style>
:root{
  --bg:#e9edf2;--panel:#fbfcfd;--ink:#14202e;--muted:#566475;--line:#d2d9e1;--chip:#eef2f6;
  --accent:#c2700c;--good:#2e7d4f;--good-soft:#dcf0e3;--bad:#b3301e;--bad-soft:#f8e0dc;--warn:#9a6a00;--warn-soft:#fbf0cc;
  --ct:#2563eb;--ct-s:#dbeafe;--cl:#7c3aed;--cl-s:#ede9fe;--cv:#15803d;--cv-s:#dcfce7;--cd:#c2410c;--cd-s:#ffedd5;--ca:#be123c;--ca-s:#ffe4e6;
  --ramp:#f3e3c3;--flat:#e2e8f0;
  --font-ui:"Avenir Next","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-num:ui-monospace,"SF Mono","Menlo","Consolas",monospace;
}
[hidden]{display:none !important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:17px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1240px;margin:0 auto;padding:12px 14px 90px;display:flex;flex-direction:column;gap:12px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;background:#14202e;color:#fff;border-radius:12px;padding:10px 16px}
.brand h1{margin:0;font-size:22px;font-weight:800}.brand h1 span{color:#fb7185}
.brand p{margin:0;font-size:12.5px;color:#aebccd}
.who{display:inline-flex;align-items:center;gap:8px;background:#26364a;border-radius:999px;padding:4px 6px 4px 14px;font-size:14px}
.who b{font-weight:700}
.tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:15.5px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ca);border-color:var(--ca);color:#fff;font-weight:700}
.btn.go{background:var(--good);border-color:var(--good);color:#fff;font-weight:700}
.btn.sm{padding:3px 10px;font-size:14px}
.btn.dark{background:#26364a;border-color:#3a4c63;color:#fff}
.btn.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(46,125,79,.5)}50%{box-shadow:0 0 0 8px rgba(46,125,79,0)}}
@media (prefers-reduced-motion:reduce){.btn.pulse{animation:none}}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{flex:1 1 120px;border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 10px;cursor:pointer;text-align:left;font-size:14.5px;line-height:1.25}
.steps button b{display:block;font-size:12px;color:var(--muted);font-weight:700}
.steps button.on{border-color:var(--ink);box-shadow:0 2px 0 var(--ink)}
.steps button.done{border-color:var(--good);background:var(--good-soft)}
.steps button.part{border-color:#e0b44c;background:var(--warn-soft)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.panel h2{margin:0 0 6px;font-size:22px}.panel h3{margin:14px 0 6px;font-size:18px}
.intro{background:#14202e;color:#e9eef5;border-radius:12px;padding:12px 16px;font-size:15.5px}
.intro b{color:#fda4af}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;vertical-align:middle;margin-left:6px}
.pill.ok{background:var(--good-soft);color:var(--good)}.pill.todo{background:var(--warn-soft);color:var(--warn)}
.note{color:var(--muted);font-size:14.5px}
.tip{background:#f1f5f9;border-left:4px solid #94a3b8;border-radius:6px;padding:8px 12px;font-size:15px;margin:8px 0}
.fb{border-radius:8px;padding:8px 12px;margin-top:8px;font-size:15px}
.fb.ok{background:var(--good-soft);color:#1d5a37}.fb.no{background:var(--bad-soft);color:#7c2214}.fb.mid{background:var(--warn-soft);color:#6b4a00}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:15.5px}
.chip.sel{border-color:var(--ink);background:#14202e;color:#fff}
.chip.right{border-color:var(--good);background:var(--good-soft);color:#1d5a37}
.chip.wrong{border-color:var(--bad);background:var(--bad-soft);color:#7c2214}
input[type=text],input.n,textarea,select{border:1.5px solid #b8c3cf;border-radius:7px;padding:6px 9px;background:#fff;font-size:16px}
textarea{width:100%;min-height:70px;resize:vertical}
input.n{width:88px;font-family:var(--font-num);text-align:center}
.wtu{font-size:14px;margin:6px 0}.wtu span{display:inline-block;background:#fff;border:1px dashed #94a3b8;border-radius:6px;padding:1px 8px;margin:2px 3px}
/* colour key + tables */
.key{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.k{border-radius:6px;padding:3px 10px;font-size:14px;font-weight:700;border:2px solid}
.k.t,.c-t{color:var(--ct);border-color:var(--ct);background:var(--ct-s)}
.k.l,.c-l{color:var(--cl);border-color:var(--cl);background:var(--cl-s)}
.k.v,.c-v{color:var(--cv);border-color:var(--cv);background:var(--cv-s)}
.k.d,.c-d{color:var(--cd);border-color:var(--cd);background:var(--cd-s)}
.k.a,.c-a{color:var(--ca);border-color:var(--ca);background:var(--ca-s)}
.tscroll{overflow-x:auto}
table.tb{border-collapse:separate;border-spacing:0;width:100%;font-size:15px}
table.tb th,table.tb td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:center;vertical-align:middle}
table.tb th{font-size:14px;background:#f1f5f9;line-height:1.25}
table.tb th.c-t,table.tb th.c-l,table.tb th.c-v,table.tb th.c-d,table.tb th.c-a{border-width:0 0 3px;border-style:solid}
table.tb td.l{text-align:left;font-weight:700;white-space:nowrap}
tr.ramp td.l{background:var(--ramp)}tr.flat td.l{background:var(--flat)}
td.zone{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#7a5b23;writing-mode:vertical-rl;transform:rotate(180deg);padding:4px}
tr.flat td.zone{color:#475569}
td input.n.c-t{border-color:var(--ct);color:var(--ct);background:#fff}
td input.n.c-l{border-color:var(--cl);color:var(--cl);background:#fff}
td input.n.c-v{border-color:var(--cv);color:var(--cv);background:#fff}
td input.n.c-d{border-color:var(--cd);color:var(--cd);background:#fff}
.val{font-family:var(--font-num);font-weight:700;border-radius:6px;padding:3px 8px;display:inline-block;border:2px solid;min-width:64px}
.val.empty{opacity:.45;font-weight:400}
.form{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;font-family:var(--font-num);white-space:nowrap}
.form i{font-style:normal;font-weight:700}
.qm{border:none;background:#14202e;color:#fff;border-radius:50%;width:22px;height:22px;font-weight:800;font-size:13px;cursor:pointer;margin-left:4px;vertical-align:middle;padding:0}
.glow{box-shadow:0 0 0 4px rgba(250,204,21,.85)!important}
td .mk{display:inline-block;width:20px;font-weight:800}
.mk.ok{color:var(--good)}.mk.no{color:var(--bad)}
.tag{font-size:12.5px;font-weight:700;border-radius:999px;padding:1px 8px;display:inline-block;margin-top:3px}
.tag.up{background:var(--good-soft);color:var(--good)}.tag.down{background:var(--bad-soft);color:var(--bad)}.tag.mix{background:var(--warn-soft);color:var(--warn)}
/* graph */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}.cmp h3{margin-top:4px}
.gctl{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:18px;align-items:start;margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
@media (max-width:760px){.cmp,.gctl{grid-template-columns:1fr}}
canvas.cv{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff;touch-action:none;display:block}
.axrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.axrow label{font-size:14px;display:flex;flex-direction:column}
.axrow input{width:80px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid2 input{width:100%}
/* FBD */
.fbdb{display:grid;grid-template-columns:minmax(280px,1.2fr) 1fr;gap:14px;align-items:start}
@media (max-width:860px){.fbdb{grid-template-columns:1fr}}
.board{position:relative;touch-action:none;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fffaf2;user-select:none}
.board svg{display:block;width:100%;height:auto}
.amenu{position:absolute;z-index:5;background:#fff;border:2px solid #14202e;border-radius:10px;padding:10px;width:230px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:8px;font-size:15px}
.amenu .x{position:absolute;right:6px;top:4px;border:none;background:none;font-size:16px;cursor:pointer}
.ck{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;background:#eef2f6;margin:2px;color:var(--muted)}
.ck.on{background:var(--good-soft);color:var(--good);font-weight:700}
.fq{margin:10px 0}.fq p{margin:4px 0;font-weight:700}
.scen{display:grid;gap:14px}
/* popups */
.pop{position:fixed;z-index:50;background:#fff;border:2px solid #14202e;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.25);width:min(440px,94vw);max-height:80vh;display:flex;flex-direction:column}
.pop .hd{display:flex;align-items:center;gap:8px;background:#14202e;color:#fff;padding:8px 10px;border-radius:9px 9px 0 0;cursor:grab;touch-action:none;font-weight:700}
.pop .hd .grip{opacity:.7}.pop .hd .x{margin-left:auto;background:none;border:none;color:#fff;font-size:18px;cursor:pointer}
.pop .bd{padding:12px 14px;overflow:auto;font-size:15.5px}
.pop .bd p{margin:6px 0}
.formula{font-family:var(--font-num);background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-weight:700;margin:6px 0}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc button{padding:10px 0;font-size:18px;border-radius:8px;border:1px solid var(--line);background:var(--chip);cursor:pointer}
.calc button.op{background:#e2e8f0;font-weight:700}.calc button.eq{background:var(--ca);color:#fff;border-color:var(--ca)}
.calcd{font-family:var(--font-num);font-size:22px;text-align:right;background:#14202e;color:#e4f7e9;border-radius:8px;padding:8px 12px;margin-bottom:8px;min-height:44px;overflow:auto;white-space:nowrap}
.calcfab{position:fixed;right:16px;bottom:16px;z-index:40;border-radius:999px;padding:12px 18px;font-size:17px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
/* modal (name gate, teacher) */
.modal{position:fixed;inset:0;background:rgba(10,16,25,.72);z-index:80;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px}
.modal .box{background:#fff;border-radius:14px;max-width:760px;width:100%;padding:22px 24px}
.modal h2{margin-top:0}
.gate label{display:block;margin:10px 0 4px;font-weight:700}.gate input{width:100%}
.gate .chips .chip{font-size:17px;padding:10px 18px}
.err{color:var(--bad);font-weight:700;min-height:1.4em}
.tnotes h3{margin:16px 0 4px}.tnotes ul{margin:4px 0 4px 20px;padding:0}.tnotes td,.tnotes th{border:1px solid var(--line);padding:4px 8px;font-size:14.5px}.tnotes table{border-collapse:collapse}
.frame{line-height:2.3}.frame input{width:150px;margin:0 3px}
/* worksheet (PDF / print) */
#sheet{position:absolute;left:-10000px;top:0}
.preview{display:flex;flex-direction:column;align-items:center;gap:14px;background:#cbd5e1;border-radius:8px;padding:14px 6px}
.pv{overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.2);background:#fff}
.pv .pg{position:relative}
.pg{width:794px;min-height:1123px;background:#fff;padding:34px 40px;font-size:12.5px;color:#14202e;font-family:var(--font-ui);position:relative;line-height:1.4}
.pg h1{font-size:20px;margin:0}.pg h2{font-size:14.5px;margin:12px 0 5px;border-bottom:2px solid #14202e;padding-bottom:2px}
.pg .hdr{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #be123c;padding-bottom:6px;margin-bottom:6px}
.pg table{border-collapse:collapse;width:100%}.pg th,.pg td{border:1px solid #94a3b8;padding:4px 5px;text-align:center;font-size:12px}
.pg th{font-size:11px}
.pg .ans{border:1px solid #94a3b8;border-radius:4px;padding:5px 8px;min-height:34px;white-space:pre-wrap;color:#1e3a8a}
.pg .blank .ans{min-height:52px}
.pg img{max-width:100%}
.pg .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pg .foot{position:absolute;bottom:14px;left:40px;right:40px;text-align:center;color:#64748b;font-size:11px}
.pg td.cell{height:24px;min-width:52px}
@media print{
  body>*:not(#sheet){display:none!important}
  #sheet{position:static}
  .pg{page-break-after:always;break-after:page;min-height:0;height:296mm;overflow:hidden;padding:8mm 11mm;width:auto}
  .pg .foot{bottom:5mm}
  @page{size:A4;margin:0}
}
@media (max-width:600px){input.n{width:70px}.panel{padding:12px}table.tb{font-size:14px}}

const MS=[1,2,3,4],AK=[2,3,4],RAMP_END=2; /* AK: the three changes we can measure (metre 1 has no metre before it) */ /* metres 1-2 are on the ramp, 3-4 on the flat */
const COLS={t:'#2563eb',l:'#7c3aed',v:'#15803d',d:'#c2410c',a:'#be123c'};
const SOFT={t:'#dbeafe',l:'#ede9fe',v:'#dcfce7',d:'#ffedd5',a:'#ffe4e6'};
let S=blank();
function blank(){const tr=()=>['','','','',''];return{name:'',cls:'',grade:'',teacher:false,step:0,trials:3,
  T:{1:tr(),2:tr(),3:tr(),4:tr()},leg:{1:'',2:'',3:'',4:''},spd:{1:'',2:'',3:'',4:''},chg:{1:'',2:'',3:'',4:''},
  pred:{ramp:'',flat:''},g:{title:'',xl:'',yl:'',ymin:'',ymax:'',ystep:'',bars:{}},
  fbd:{ramp:{arrows:[]},flat:{arrows:[]}},fq:{},con:{},chk:{}}}
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function num(v){if(v==null)return NaN;const s=String(v).trim().replace(/[−–]/g,'-').replace(/,/g,'');if(s===''||!/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s))return NaN;return parseFloat(s)}
const r2=v=>Math.round(v*100)/100;
function fmt(v,dp=2){if(v==null||isNaN(v))return '';const s=(Math.abs(v)<5e-9?0:v).toFixed(dp);return s.replace('-','−')}
const isG6=()=>S.grade==='6';
function save(){try{localStorage.setItem(LAB.key,JSON.stringify(S))}catch(e){}}
function load(){try{const t=localStorage.getItem(LAB.key);if(t){const o=JSON.parse(t),b=blank();S=Object.assign(b,o);['T','leg','spd','chg','pred','g','fbd'].forEach(k=>S[k]=Object.assign(b[k],o[k]||{}))}}catch(e){}}
function getPath(p){return p.split('.').reduce((o,k)=>o==null?o:o[k],S)}
function setPath(p,v){const ks=p.split('.'),last=ks.pop();let o=S;ks.forEach(k=>{if(o[k]==null)o[k]={};o=o[k]});o[last]=v}

/* ---- the maths ---- */
function avgT(k){const v=S.T[k].slice(0,S.trials).map(num).filter(x=>!isNaN(x));return v.length?r2(v.reduce((a,b)=>a+b,0)/v.length):null}
function legCalc(k){const a=avgT(k);if(a==null)return null;if(k===1)return a;const b=avgT(k-1);return b==null?null:r2(a-b)}
function spdCalc(k){const l=num(S.leg[k]);return l>0?1/l:null}
function chgCalc(k){if(k===1)return null;const v=num(S.spd[k]);if(isNaN(v))return null;const p=num(S.spd[k-1]);return isNaN(p)?null:v-p}
/* acceleration (done for the student): change in speed ÷ time between the middles of the two metres */
function gapT(k){const l=num(S.leg[k]);if(!(l>0)||k===1)return null;const p=num(S.leg[k-1]);return p>0?(p+l)/2:null}
function accel(k){const d=num(S.chg[k]),g=gapT(k);return isNaN(d)||g==null?null:d/g}
const near=(a,b)=>a!=null&&!isNaN(a)&&b!=null&&Math.abs(a-b)<=Math.max(0.011,Math.abs(b)*0.01);
function cellOK(kind,k){const v=num(S[kind][k]);if(isNaN(v))return null;const want=kind==='leg'?legCalc(k):kind==='spd'?spdCalc(k):chgCalc(k);return want==null?null:near(v,want)}
function zoneOf(k){return k<=RAMP_END?'ramp':'flat'}
function aTag(k){const a=accel(k);if(a==null)return'';if(k===RAMP_END+1)return'<span class="tag mix">⇄ crosses the bottom of the ramp</span>';return a>0.005?'<span class="tag up">⬆ speeding up</span>':a<-0.005?'<span class="tag down">⬇ slowing down</span>':'<span class="tag mix">steady</span>'}
const aLabel=k=>k===1?'Start → metre 1':`Metre ${k-1} → metre ${k}`;
const aShort=k=>k===1?'Start→M1':`M${k-1}→M${k}`;

/* ---- draggable pop-ups ---- */
function makeDraggable(box,handle){
  let d=null;handle.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const r=box.getBoundingClientRect();d={dx:e.clientX-r.left,dy:e.clientY-r.top};handle.setPointerCapture(e.pointerId);handle.style.cursor='grabbing'});
  handle.addEventListener('pointermove',e=>{if(!d)return;place(box,e.clientX-d.dx,e.clientY-d.dy)});
  const up=()=>{d=null;handle.style.cursor=''};handle.addEventListener('pointerup',up);handle.addEventListener('pointercancel',up);
}
function place(box,x,y){const w=box.offsetWidth,h=40;box.style.left=clamp(x,4,Math.max(4,innerWidth-w-4))+'px';box.style.top=clamp(y,4,innerHeight-h)+'px'}
function popup(id,title,html,opts={}){
  let box=document.getElementById(id);
  if(!box){box=document.createElement('div');box.id=id;box.className='pop';document.body.appendChild(box);
    box.innerHTML=`<div class="hd"><span class="grip" aria-hidden="true">⠿</span><span class="ttl"></span><button class="x" aria-label="Close">✕</button></div><div class="bd"></div>`;
    $('.x',box).onclick=()=>{box.remove();if(opts.onClose)opts.onClose()};makeDraggable(box,$('.hd',box));
    const w=Math.min(440,innerWidth*.94);place(box,opts.x!=null?opts.x:innerWidth-w-24,opts.y!=null?opts.y:90)}
  $('.ttl',box).textContent=title;$('.bd',box).innerHTML=html;return box;
}
addEventListener('resize',()=>$$('.pop').forEach(b=>place(b,b.offsetLeft,b.offsetTop)));

/* ---- "?" explanations: simple words, the formula, and the student's own numbers ---- */
const HELP={
  avg:{t:'Average time',c:'t',f:'average = (trial 1 + trial 2 + trial 3) ÷ 3',
    p:['Every person times a little differently, so we do more than one trial.','The app works out the average for you. It is the number you use in the next table.']},
  leg:{t:'Time for one metre on its own',c:'l',f:'time for this metre = time at this mark − time at the last mark',
    p:['The stopwatch kept running from the start, so the time at 3 m includes metres 1, 2 <b>and</b> 3.','To find the time for just one metre, take away the time the cart had already used.','<b>Metre 1 is easy:</b> the cart started at 0 s, so it is just the time at 1 m.']},
  spd:{t:'Speed in each metre',c:'v',f:'speed = distance ÷ time = 1 ÷ time for that metre',
    p:['Speed tells you how many metres the cart moves every second (m/s).','Each piece of track is exactly 1 metre long, so you just do <b>1 ÷ the time</b>.','A <b>smaller</b> time means a <b>bigger</b> speed: the cart was faster.']},
  chg:{t:'Change in speed',c:'d',f:'change in speed = this speed − the speed before',
    p:['This tells you if the cart got faster or slower from one metre to the next.','<b>Plus number (+):</b> it got faster. <b>Minus number (−):</b> it got slower.','<b>Metre 1</b> has no metre before it, so there is nothing to compare. Start at metre 2.']},
  acc:{t:'Acceleration (we do this for you)',c:'a',f:'acceleration = change in speed ÷ time it took to change',
    p:['Acceleration is how much the speed changes <b>every second</b>. Its unit is m/s² ("metres per second, every second").','Your speed for a metre is the cart\'s speed in the <b>middle</b> of that metre\'s time.','So the time between two speeds is <b>half</b> of one metre\'s time + <b>half</b> of the next metre\'s time.','<b>+</b> means speeding up. <b>−</b> means slowing down.']}
};
function helpEx(kind,k){
  const f=v=>fmt(v);k=k||3;
  if(kind==='leg'){const a=avgT(k),b=avgT(k-1);return a!=null&&b!=null?`Your metre ${k}: ${f(a)} − ${f(b)} = <b>${f(a-b)} s</b>`:''}
  if(kind==='spd'){const l=num(S.leg[k]);return l>0?`Your metre ${k}: 1 ÷ ${f(l)} = <b>${f(1/l)} m/s</b>`:''}
  if(kind==='chg'){const a=num(S.spd[k]),b=num(S.spd[k-1]);return !isNaN(a)&&!isNaN(b)?`Your metre ${k}: ${f(a)} − ${f(b)} = <b>${f(a-b)} m/s</b>`:''}
  if(kind==='acc'){const d=num(S.chg[k]),l1=num(S.leg[k-1]),l2=num(S.leg[k]);return !isNaN(d)&&l1>0&&l2>0?`${aLabel(k)}:<br>time between the middles = ${f(l1)} ÷ 2 + ${f(l2)} ÷ 2 = ${f((l1+l2)/2)} s<br>acceleration = ${f(d)} ÷ ${f((l1+l2)/2)} = <b>${f(d/((l1+l2)/2))} m/s²</b>`:''}
  return '';
}
function showHelp(kind){const h=HELP[kind],ex=helpEx(kind);
  popup('pophelp','? '+h.t,`<div class="key"><span class="k ${h.c}">${esc(h.t)}</span></div><div class="formula">${esc(h.f)}</div>${h.p.map(x=>`<p>${x}</p>`).join('')}${ex?`<div class="tip">${ex}</div>`:''}`)}

/* ---- calculator (floating, draggable; can put its answer in the last box you used) ---- */
let CALC='',lastBox=null;
document.addEventListener('focusin',e=>{if(e.target.matches('input.n'))lastBox=e.target});
function calcOpen(){
  const keys=['C','(',')','⌫','7','8','9','÷','4','5','6','×','1','2','3','−','0','.','=','+'];
  const box=popup('popcalc','🧮 Calculator',`<div class="calcd" id="calcd">${esc(CALC||'0')}</div><div class="calc">${keys.map(k=>`<button data-ck="${k}" class="${/[÷×−+()]/.test(k)?'op':k==='='?'eq':''}">${k}</button>`).join('')}</div>
    <button class="btn" id="calcput" style="margin-top:8px;width:100%">↓ Put the answer in the box I was using</button><p class="note" style="margin:6px 0 0">You can also type: x or * for ×, / for ÷.</p>`,{x:innerWidth-330,y:innerHeight-520});
  box.style.width='300px';
  $$('[data-ck]',box).forEach(b=>b.onclick=()=>calcKey(b.dataset.ck));
  $('#calcput',box).onclick=()=>{const v=calcVal();if(lastBox&&v!=null&&document.body.contains(lastBox)){lastBox.value=fmt(v).replace('−','-');lastBox.dispatchEvent(new Event('input',{bubbles:true}));lastBox.dispatchEvent(new Event('change',{bubbles:true}))}};
  box.tabIndex=-1;box.onkeydown=e=>{if(e.target.tagName==='INPUT')return;const m={'*':'×','x':'×','/':'÷','-':'−','Enter':'=','Backspace':'⌫','Escape':'C'};const k=m[e.key]||e.key;if(/^[0-9.+()]$/.test(k)||'×÷−=⌫C'.includes(k)){e.preventDefault();calcKey(k)}};
}
function calcVal(){try{const s=CALC.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');if(!/^[0-9.+\-*/() ]+$/.test(s))return null;const v=Function('return ('+s+')')();return isFinite(v)?v:null}catch(e){return null}}
function calcKey(k){
  if(k==='C')CALC='';else if(k==='⌫')CALC=CALC.slice(0,-1);
  else if(k==='='){const v=calcVal();CALC=v==null?'Error':String(Math.round(v*10000)/10000).replace('-','−')}
  else{if(CALC==='Error')CALC='';CALC+=k}
  const d=$('#calcd');if(d)d.textContent=CALC||'0';
}

/* ===== the steps: predict, my times, each metre, acceleration table ===== */
const STEPS=[
  {n:'Predict',i:'🤔'},{n:'My times',i:'⏱'},{n:'Each metre',i:'🧮'},{n:'Acceleration',i:'📈'},{n:'Forces',i:'➡'},{n:'Conclusion',i:'✍'},{n:'Worksheet',i:'📄'}];
function stepStatus(i){
  const all=(a)=>a.every(Boolean),any=(a)=>a.some(Boolean);let p=[];
  if(i===0)p=[S.pred.ramp,S.pred.flat];
  if(i===1)p=MS.map(k=>avgT(k)!=null);
  if(i===2)p=MS.flatMap(k=>['leg','spd','chg'].filter(c=>!(c==='chg'&&k===1)).map(c=>!isNaN(num(S[c][k]))));
  if(i===3){const e=graphEval();p=[!!S.g.title,!!S.g.xl,!!S.g.yl,e.valid,e.placed===3]}
  if(i===4)p=FQ_KEYS().map(k=>!!S.fq[k]).concat(isG6()?[]:['ramp','flat'].map(s=>(S.fbd[s].arrows||[]).length>=2));
  if(i===6)return S.saved?'done':'';
  if(i===5)p=conKeys().map(k=>String(S.con[k]||'').trim()!=='');
  return all(p)?'done':any(p)?'part':'';
}
function todoPill(i){return stepStatus(i)==='done'?'<span class="pill ok">✓ Done</span>':'<span class="pill todo">To do</span>'}
function stepTodo(i){return`<span data-live="todo:${i}">${todoPill(i)}</span>`}

/* a picture of the track: ramp (0-2 m) then flat (2-4 m) */
function trackSVG(w=760){
  const x=m=>40+m*170,y=m=>m<=2?40+(2-m)*0+m*55:150;
  const pts=[[0,40],[2,150],[4,150]].map(([m,yy])=>`${x(m)},${yy}`).join(' ');
  let marks='';for(let m=0;m<=4;m++){const yy=m<=2?40+m*55:150;marks+=`<line x1="${x(m)}" y1="${yy-14}" x2="${x(m)}" y2="${yy+14}" stroke="#14202e" stroke-width="3"/><text x="${x(m)}" y="${yy+34}" text-anchor="middle" font-size="16" font-weight="700" fill="#14202e">${m} m</text>`}
  return`<svg viewBox="0 0 ${x(4)+50} 200" style="width:100%;max-width:${w}px;display:block" role="img" aria-label="The track: a 2 metre ramp, then 2 metres of flat floor, with marks every metre">
   <polygon points="${x(0)},40 ${x(2)},150 ${x(0)},150" fill="#f3e3c3" stroke="#c9a96b"/><rect x="${x(2)}" y="150" width="${x(4)-x(2)}" height="8" fill="#cbd5e1"/>
   <polyline points="${pts}" fill="none" stroke="#14202e" stroke-width="4"/>
   <text x="${x(0)+14}" y="142" font-size="15" font-weight="800" fill="#7a5b23">RAMP</text><text x="${(x(3)+x(4))/2}" y="140" text-anchor="middle" font-size="15" font-weight="800" fill="#475569">FLAT</text>
   <g transform="translate(${x(0)+6},${28}) rotate(18)"><rect x="0" y="-22" width="44" height="20" rx="4" fill="#be123c"/><circle cx="9" cy="0" r="6" fill="#14202e"/><circle cx="35" cy="0" r="6" fill="#14202e"/></g>${marks}</svg>`;
}

/* ---------- Step 0: predict ---------- */
const PRED_OPTS=[['up','Speed up'],['same','Stay the same speed'],['down','Slow down']];
function stepPredict(){
  const q=(k,txt)=>`<h3>${txt}</h3><div class="chips">${PRED_OPTS.map(([v,l])=>`<button class="chip ${S.pred[k]===v?'sel':''}" data-act="pred" data-k="${k}" data-v="${v}">${l}</button>`).join('')}</div>`;
  return`<div class="intro">On this page you will <b>predict</b> what the cart does on the ramp and on the flat floor. There are no wrong predictions. You will check yours at the end.</div>
  <div class="panel"><h2>What will the cart do? ${stepTodo(0)}</h2>${trackSVG()}
   ${q('ramp','1. Going down the ramp (0 m to 2 m), the cart will…')}${q('flat','2. On the flat floor (2 m to 4 m), the cart will…')}
   <h3>Why do you think that? <span class="note">(optional)</span></h3><textarea data-bind="pred.why" placeholder="I think this because…">${esc(S.pred.why||'')}</textarea></div>`;
}

/* ---------- Step 1: my times ---------- */
function stepTimes(){
  const n=S.trials;
  const rows=MS.map(k=>`<tr class="${zoneOf(k)}">${k===1||k===3?`<td class="zone" rowspan="2">${k===1?'Ramp':'Flat'}</td>`:''}<td class="l">${k} m mark</td>
    ${[...Array(n)].map((_,i)=>`<td><input class="n c-t" inputmode="decimal" data-bind="T.${k}.${i}" value="${esc(S.T[k][i])}" aria-label="Time to ${k} m, trial ${i+1}"></td>`).join('')}
    <td><span class="val c-t" id="av${k}" data-live="avg:${k}"></span></td></tr>`).join('');
  return`<div class="intro">On this page you will <b>record your stopwatch times</b>. Start timing when the cart is let go. Stop when the front of the cart passes the mark.</div>
  <div class="panel"><h2>How we collect the data</h2>${trackSVG(620)}
   <div class="tip"><b>Way 1:</b> one timer. Do a new run for each mark (1 m, 2 m, 3 m, 4 m).<br><b>Way 2:</b> one timer at each mark. Everyone starts on "GO!" and stops when the cart passes <i>their</i> mark.<br>Either way, every time is measured <b>from the start</b>. Your teacher will tell you which way to use.</div>
   <p class="note">Jobs: 🙌 releaser (lets go, never pushes) · ⏱ timer(s) · 📝 recorder · 👀 checker (watches that the cart starts at 0 m every time).</p></div>
  <div class="panel"><h2>Table 1: Time from the start <button class="qm" data-help="avg" aria-label="Explain">?</button> ${stepTodo(1)}</h2>
   <div class="axrow" style="margin-bottom:8px">How many trials? ${[1,2,3,4,5].map(t=>`<button class="chip ${t===n?'sel':''}" data-act="trials" data-v="${t}">${t}</button>`).join('')}</div>
   <div class="tscroll"><table class="tb"><thead><tr><th></th><th>Distance</th>${[...Array(n)].map((_,i)=>`<th class="c-t">Trial ${i+1}<br>(s)</th>`).join('')}<th class="c-t">Average time<br>(s)</th></tr></thead><tbody>${rows}</tbody></table></div>
   <p class="note">The average is worked out for you. Type times like <b>1.42</b>.</p></div>`;
}

/* ---------- Step 2: each metre on its own (the student's maths) ---------- */
function formHint(kind,k){
  const f=v=>v==null||isNaN(v)?'?':fmt(v),c=(col,t)=>`<i style="color:${COLS[col]}">${t}</i>`;
  if(kind==='leg'){if(k===1)return isG6()?`= ${c('t',f(avgT(1)))}`:`= ${c('t','time at 1 m')}`;
    return isG6()?`= ${c('t',f(avgT(k)))} − ${c('t',f(avgT(k-1)))}`:`= ${c('t',`time at ${k} m`)} − ${c('t',`time at ${k-1} m`)}`}
  if(kind==='spd')return isG6()?`= 1 ÷ ${c('l',f(num(S.leg[k])))}`:`= 1 m ÷ ${c('l','time for metre '+k)}`;
  if(kind==='chg'){if(k===1)return'';
    return isG6()?`= ${c('v',f(num(S.spd[k])))} − ${c('v',f(num(S.spd[k-1])))}`:`= ${c('v','speed '+k)} − ${c('v','speed '+(k-1))}`}
}
function mark(kind,k){if(!S.chk.t2)return'';const ok=cellOK(kind,k);return ok==null?'<span class="mk"></span>':ok?'<span class="mk ok">✓</span>':'<span class="mk no">✗</span>'}
function stepMetres(){
  const inp=(kind,k,col,unit)=>kind==='chg'&&k===1?`<td><span class="note">— no metre before it</span></td>`:`<td><input class="n c-${col}" id="${kind}${k}" inputmode="decimal" data-bind="${kind}.${k}" data-src="${kind}:${k}" value="${esc(S[kind][k])}" aria-label="${kind} metre ${k}"> <span data-live="mk:${kind}:${k}">${mark(kind,k)}</span><span class="form" data-live="form:${kind}:${k}">${formHint(kind,k)}</span></td>`;
  const rows=MS.map(k=>`<tr class="${zoneOf(k)}">${k===1||k===3?`<td class="zone" rowspan="2">${k===1?'Ramp':'Flat'}</td>`:''}<td class="l">Metre ${k}<br><span class="note">${k-1} m → ${k} m</span></td>
    <td><span class="val c-t" id="av${k}" data-live="avg:${k}"></span></td>${inp('leg',k,'l')}${inp('spd',k,'v')}${inp('chg',k,'d')}</tr>`).join('');
  return`<div class="intro">On this page <b>you do the maths</b>. Each column uses numbers from the column before it, and the colours show you which ones. Tap a box to light up the numbers it needs. Press <b>?</b> for help and 🧮 for the calculator. Round to <b>2 decimal places</b>.</div>
  <div class="panel"><h2>Table 2: Each metre on its own ${stepTodo(2)}</h2>
   <div class="key"><span class="k t">Time from the start</span><span class="k l">Time for one metre</span><span class="k v">Speed</span><span class="k d">Change in speed</span></div>
   <div class="tscroll"><table class="tb"><thead><tr><th></th><th>Piece of track</th>
    <th class="c-t">Average time from the start (s)</th>
    <th class="c-l">① Time for this metre (s) <button class="qm" data-help="leg" aria-label="Explain">?</button></th>
    <th class="c-v">② Speed in this metre (m/s) <button class="qm" data-help="spd" aria-label="Explain">?</button></th>
    <th class="c-d">③ Change in speed (m/s) <button class="qm" data-help="chg" aria-label="Explain">?</button></th></tr>
    <tr><th></th><th class="note">Formula</th><th class="note">from Table 1</th><th class="note">this mark − last mark</th><th class="note">1 ÷ time</th><th class="note">this speed − speed before</th></tr></thead><tbody>${rows}</tbody></table></div>
   <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btn" data-act="chk2">${S.chk.t2?'✓ Checking is on':'Check my maths'}</button><span class="note" data-live="chk2sum">${chk2Sum()}</span></div></div>`;
}
function chk2Sum(){if(!S.chk.t2)return'Green ✓ = right. Red ✗ = try that one again (press ? for help).';let r=0,w=0;MS.forEach(k=>['leg','spd','chg'].forEach(c=>{const o=cellOK(c,k);if(o===true)r++;if(o===false)w++}));return`${r} right${w?`, ${w} to fix (red ✗)`:''}. Each box is checked with <b>your own</b> numbers from the box before.`}

/* ---------- Step 3: acceleration (worked out by the app from the student's numbers) ---------- */
function accTable(){
  const rows=AK.map(k=>{const a=accel(k),g=gapT(k);return`<tr class="${zoneOf(k)}"><td class="l">${aLabel(k)}</td>
    <td><span class="val c-d ${isNaN(num(S.chg[k]))?'empty':''}">${isNaN(num(S.chg[k]))?'—':fmt(num(S.chg[k]))}</span></td>
    <td><span class="val c-l ${g==null?'empty':''}">${g==null?'—':fmt(g)}</span><span class="form">half of metre ${k-1} + half of metre ${k}</span></td>
    <td><span class="val c-a ${a==null?'empty':''}" id="acc${k}">${a==null?'—':fmt(a)}</span><br>${aTag(k)}</td></tr>`}).join('');

/* ===== For teachers: lesson plan, notes, Toddle prompt, example data, paper worksheet ===== */
const TODDLE_PROMPT=`Create a workshop task for Grade 6–8 science called "Acceleration Lab" (Day 9, about 45 minutes).
Students roll a cart down a 2 m ramp and on along 2 m of flat floor, time it at the 1, 2, 3 and 4 m marks, and use the attached offline HTML file (Acceleration-Lab-offline.html) to work out the time for each metre, the speed in each metre (1 ÷ time) and the change in speed. The app then works out the acceleration, and students plot it on a graph with negative numbers, explain it with free body diagrams and write a conclusion.
Students hand in: the PDF worksheet the app saves (file upload).
Grade 6 focus: speeding up = positive acceleration, slowing down = negative acceleration; on the flat, gravity can no longer pull the cart forwards and friction slows it down.
Grade 7/8 focus: balanced and unbalanced forces, resultant force, and why the acceleration on the flat is negative.
Feedback format:
Good job!

Keep it up
- (2 to 4 simple positives)

Try this
- (2 to 4 actions, starting with a verb and naming the part of the worksheet)`;
function exampleData(){
  const rnd=(()=>{let s=7;return()=>(s=(s*16807)%2147483647)/2147483647})(),ar=1.0,df=0.6;
  const tR=d=>Math.sqrt(2*d/ar),vb=ar*tR(2),tF=(d)=>{const u=vb;return(u-Math.sqrt(u*u-2*df*d))/df};
  const T={1:tR(1),2:tR(2),3:tR(2)+tF(1),4:tR(2)+tF(2)};
  MS.forEach(k=>{for(let i=0;i<5;i++)S.T[k][i]=(T[k]+(rnd()-.5)*0.08).toFixed(2)});
  MS.forEach(k=>{S.leg[k]=fmt(legCalc(k));S.spd[k]=fmt(r2(spdCalc(k)));S.chg[k]=fmt(r2(chgCalc(k))).replace('−','-')});
  MS.forEach(k=>S.leg[k]=S.leg[k].replace('−','-'));
  Object.assign(S.pred,{ramp:'up',flat:'same'});save();
}
function teacherNotes(){
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="box tnotes" role="dialog" aria-modal="true"><div class="navrow" style="margin:0"><h2 style="margin:0">For teachers</h2><button class="btn" id="tclose">Close ✕</button></div>
  <h3>Purpose</h3><p>Students measure how a cart speeds up on a ramp and slows down on the flat. They do the basic maths themselves (time for each metre, speed = 1 ÷ time, change in speed). The app does the harder step (acceleration) and they plot it on a graph that goes below zero. Free body diagrams link the sign of the acceleration to the forces.</p>
  <h3>45-minute plan</h3><table><tr><th>Min</th><th>What happens</th></tr><tr><td>0–5</td><td>Hook: release the cart. Students make their prediction in the app (step 1).</td></tr><tr><td>5–12</td><td>The 3 theory slides: speed, acceleration (+ and −), forces.</td></tr>
  <tr><td>12–22</td><td>Groups collect data (step 2). Way 1: one timer, a new run per mark. Way 2: a timer at every mark, all starting on "GO!" (faster). 1–5 trials can be chosen.</td></tr>
  <tr><td>22–38</td><td>Steps 3–5: tables, graph, forces.</td></tr><tr><td>38–45</td><td>Conclusion, save the PDF, exit question.</td></tr></table>
  <h3>Grades</h3><ul><li><b>Grade 6:</b> formulas show their own numbers (e.g. "= 2.54 − 2.00"), "Suggest numbers" on the graph, model free body diagrams to read, a sentence-frame conclusion.</li><li><b>Grade 7/8:</b> formulas in words, they choose the axis numbers, build both free body diagrams (checked), and write a claim, evidence and reasoning, plus why the metre 2 → 3 value is mixed.</li></ul>
  <h3>Expect this in the results</h3><ul><li>M1 → M2: positive (speeding up on the ramp). There is no "start → metre 1" value on purpose: metre 1 is the only time that depends on the stopwatch starting exactly as the cart is let go, and any start error gets magnified, so it gave silly-big accelerations.</li><li><b>M2 → M3 crosses the bottom of the ramp.</b> It compares the average speed in metre 2 (still on the ramp) with metre 3 (the flat, starting at top speed). It mixes speeding up and slowing down, so it can come out positive <i>or</i> negative. The app tags it "⇄ crosses the bottom of the ramp". It's a good discussion point.</li><li>M3 → M4: negative (friction slows the cart). If it is tiny or positive, the flat may be too smooth. Try carpet or a towel, or a lower ramp.</li><li>Hand timing has about 0.2 s reaction time, and a flat metre takes about 0.4–0.6 s. Averaging trials helps. Phone slow-motion video is an option.</li></ul>
  <h3>The science wording</h3><p>On the flat, gravity still pulls down, but the floor pushes up just as hard, so gravity can no longer pull the cart <i>forwards</i>. Friction (and air resistance) is the only force along the floor, so it is unbalanced and the acceleration is negative.</p>
  <h3>Set it up on Toddle</h3><ol><li>Create a task with Toddle's AI task helper and paste the prompt below.</li><li>Attach <b>${LAB.file}</b>.</li><li>Set the hand-in to <b>file upload</b> (the PDF worksheet), then assign.</li></ol>
  <textarea readonly id="tprompt" style="min-height:150px;font-size:13px">${esc(TODDLE_PROMPT)}</textarea><button class="btn" id="tcopy">📋 Copy the prompt</button>
  <h3>Tools</h3><div class="chips"><button class="btn" id="tblank">🖨 Blank paper worksheet</button><button class="btn" id="tex">Fill in example data (for a demo)</button>
   <button class="btn" id="tg6">View as Grade 6</button><button class="btn" id="tg78">View as Grade 7/8</button><button class="btn" id="treset">Clear all answers</button></div><p class="note" id="tmsg"></p>
  <h3>Standards (for planning)</h3><p class="note">MYP Sciences Criterion A (knowing and understanding) and C (processing and evaluating data). ACARA v9 Year 7: balanced and unbalanced forces and how they change an object's motion (AC9S7U04).</p></div>`;
  document.body.appendChild(m);const close=()=>{m.remove();render()};
  $('#tclose',m).onclick=close;m.onclick=e=>{if(e.target===m)close()};
  $('#tcopy',m).onclick=()=>{const t=$('#tprompt',m);t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand('copy')}$('#tmsg',m).textContent='Prompt copied.'};
  $('#tblank',m).onclick=()=>{m.remove();printSheet(true)};
  $('#tex',m).onclick=()=>{exampleData();$('#tmsg',m).textContent='Example data added to Tables 1 and 2.'};
  $('#tg6',m).onclick=()=>{S.grade='6';save();$('#tmsg',m).textContent='Now showing the Grade 6 version.'};
  $('#tg78',m).onclick=()=>{S.grade='78';save();$('#tmsg',m).textContent='Now showing the Grade 7/8 version.'};
  let arm=false;$('#treset',m).onclick=e=>{if(!arm){arm=true;e.target.textContent='Tap again to clear everything';return}const keep={name:S.name,cls:S.cls,grade:S.grade,gnum:S.gnum,teacher:S.teacher};S=Object.assign(blank(),keep);save();$('#tmsg',m).textContent='All answers cleared.'};
}

</script></body></html>
